<!-- Version: V2.00 | Date: 2026-09-02 | LAST CHANGE: retired; forwards to /ikigai/ -->
<!--
  THE OLD PROFILE PAGE IS RETIRED, NOT DELETED.

  It made seven calls to a backend that runs them one at a time, took forty seconds on a bad day,
  and drew answers that were not the person's: it showed Jessie a need she had removed and never
  showed one she had added. /ikigai/ does the same job with two calls, both served from cache.

  The whole page, 4,500 lines of it, is in git. To bring it back:

      git log --oneline -- profile/index.html
      git show <the commit before this one>:profile/index.html > profile/index.html

  Every parameter is carried across, so ?show= and ?me= links keep working.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Without this a phone lays the page out at 980 pixels and scales the whole thing down,
     which is why the profile was unreadable on an iPhone while being fine on a desktop.
     Jessie, 2026-09-02: "mobile is not readable for any of this page." 2026-09-03. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<title>My profile</title>
<link rel="canonical" href="https://2gather.network/ikigai/">
<script>
  try {
    location.replace('https://2gather.network/ikigai/' + (location.search || '') + (location.hash || ''));
  } catch (e) {
    location.href = 'https://2gather.network/ikigai/';
  }
</script>
<meta http-equiv="refresh" content="0;url=https://2gather.network/ikigai/">
</head>
<body style="margin:0;background:#1F699E;color:#fff;font-family:'DM Sans',system-ui,sans-serif;">
  <p style="padding:48px 20px;text-align:center;font-size:16px;">
    Taking you to your profile.
    <a href="https://2gather.network/ikigai/" style="color:#fff;font-weight:700;">Go there now</a>
  </p>
</body>
</html>
