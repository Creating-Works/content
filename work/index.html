<script>
  var GS_URL = 'https://cw-api-gate.jessieupp.workers.dev';
  // Was a mockup that sent nothing. It saves since V1.0 (Jessie, 2026-09-13: "Yes go and deploy"); the flag
  // stays so the page can be turned back into a look-only copy by setting it to true.
  var CW_MOCKUP = false;
  // WORK, ON EVERY OFFER AND NEED MADE HERE. Jessie, 2026-09-13: "Append the answeres here to work:skill and so
  // forth", then "2 yes". A space or anything else offered on screen 5 joins ikigai.haves as "An extra room:work:space"
  // or "Plants:work:thing", and a pick under What outcomes would you like work to give you? joins ikigai.needs as
  // "Money:work". Skills are asked on screen 3 only. See cwPaintOffers and cwBuildQs.

// Your own record is never served from cache. Added 2026-08-31, after a profile showed the
// answers from before a save for up to six hours. The gate caches getIntake, getProfile,
// lookupProfile, getAccount, getMyGroups, getBookmarks and getRegistrations, and a write clears
// none of them: its purge only ever touches the events feed. `nocache` is a switch the gate
// already has, so this asks for a fresh answer rather than changing how the cache works.
//
// Somebody else's record stays cached and stays fast. Only a read about YOU skips it, which is
// the only case where a stale answer is ever wrong.
(function () {
  var _base = GS_URL;
  var _f = window.fetch;
  window.fetch = function (input, init) {
    try {
      var u = (typeof input === 'string') ? input : (input && input.url) || '';
      // 2026-09-15 (queue row 191): the gate now clears your kept profile and groups the moment you save, so these four are
      // trusted from the kept copy; skipping it made the intro wait 20 to 45 seconds on every visit.
      var _trusted = /[?&]action=(getIntake|getProfile|lookupProfile|getMyGroups)(&|$)/.test(u);
      if (u.indexOf(_base) === 0 && u.indexOf('nocache=') === -1 && !_trusted) {
        var me = (window.CW && CW.me && CW.me().key) || '';
        if (me) {
          var norm = function (s) { return String(s || '').split('.').join('').toLowerCase(); };
          var carries = false;
          (u.split('?')[1] || '').split('&').forEach(function (pair) {
            var bits = pair.split('=');
            var k = bits[0];
            if (k !== 'appearId' && k !== 'id' && k !== 'me' && k !== 'CWid' && k !== 'from' && k !== 'memberCard') return;
            if (norm(decodeURIComponent(bits[1] || '')) === norm(me)) carries = true;
          });
          if (carries) { input = (typeof input === 'string') ? (u + '&nocache=1') : new Request(u + '&nocache=1', input); }
        }
      }
    } catch (e) {}
    return _f.call(this, input, init);
  };
})();

  var params = new URLSearchParams(window.location.search);
  var meId = CW.me().id;
  // Where to send somebody once they are through. Only our own two hosts are accepted, so a
  // crafted link cannot use this page to bounce anybody somewhere else.
  var _next = (function(){
    var raw = params.get('next') || '';
    try {
      var u = new URL(raw, 'https://2gather.network');
      if (u.host === '2gather.network' || u.host === 'gather.2gather.network'
          || u.host === 'creating.works') return u.toString();
    } catch(err){}
    return 'https://2gather.network/mygroups' + (meId ? '?CWid=' + encodeURIComponent(meId) : '');
  })();
  // Somebody arriving on their way into a group is told about the group, and somebody on
  // their way to an event is told about the event. The link can say which with ?for=event,
  // and when it does not, where it is sending them says it instead.
  var GP_FOR = (function(){
    var said = String(params.get('for') || '').trim().toLowerCase();
    if (said === 'event' || said === 'group') return said;
    return /\/(events?|e)\//.test(_next) ? 'event' : 'group';
  })();
  // Nothing here can be saved by somebody the site does not know, so nobody is left filling in
  // a form that will quietly throw their answers away. They are sent to sign in and brought
  // straight back to this exact address. Jessie's rule, 2026-08-30: any page that writes sends a
  // signed-out person to sign in first.
  if (!meId) {
    var _here = encodeURIComponent(location.pathname + location.search);
    window.location.replace('https://creating.works/intro/?path=work');   // the intro page signs them in and brings them back here
  }
  window._gpAlreadyIn = (params.get('already') || '') === '1';
  window._gpFirstTime = (params.get('first') || '') === '1';
  // The group bundle is cached for a minute, and the answer just changed. Without this the
  // page somebody lands on could still believe they had not answered and ask again.
  function _introDone(){
    var u = _next + (_next.indexOf('?') > -1 ? '&' : '?') + 'nocache=1';
    window.location.href = u;
  }

  var GP_INTRO_Q = [
    { key:'introNeed',   need:false, q:'What do you need?',
      ph:'A cat sitter for the last week of September, a massage therapist local to Seattle, and someone who can help me get a PT nursing job where I can travel anywhere.' },
    { key:'introEnjoy',  need:true,  q:'What do you enjoy?',
      hint:'What you love doing.',
      ph:'Pickleball, kayaking, singing badly in a group, anything on the water.' },
    { key:'introSkills', need:true,  q:'What skills do you have?',
      hint:'Name whatever you’re good at. You are multi-dimensional so please shine your light! ✨',
      ph:'Facilitating a room full of people who disagree. Experience design. Cutting short hair, helping people move (I’m great at finding ways to make small spaces very functional!)' },
    { key:'introValues', need:false, q:'What do you care about?',
      hint:'What matters to you, and what you want more of in the world. Leave it blank if you would rather not say.',
      ph:'Housing, food security, keeping the lake swimmable…' },
    { key:'introOffer',  need:false, q:'For work, income, or trade what do you have to offer right now?',
      ph:'A spare room for the month of September, a truck for moving stuff, a meeting space to meet each week, and gardening tools.' }
  ];
  // Shown to a person, stored as the category that already exists on the giving page.
  var GP_THANKS = [
    { label:'\u{1F48E} Money',                        value:'Money' },
    { label:'\u{1F49B} Say thank you',                value:'Say thank you' },
    { label:'✨ Acts of service',                 value:'Acts of service' },
    { label:'\u{1F4E6} Something from my gift list',  value:'Physical goods' },
    { label:'\u{1F331} Pass it on to somebody else',  value:'Pass it on' }
  ];
  var _gpThanksPicked = {};

  // Chips under every question. Somebody in a hurry taps and moves on, somebody with something
  // specific to say still types it. The words come from the reference sheet, so a tap produces
  // something matching already knows.
  //
  //   need + offer  three pills, a person, a place, a thing
  //   enjoy         the five kinds of recreation, which is all of them
  //   skills        five categories, More opens the other thirteen
  //   care about    social or ecological first, then that side's values, and you can flip
  // Published 2026-08-26. Everybody gets the chips. ?chips=0 turns them off, which is only
  // there so the two versions can be put side by side.
  var GP_CHIPS_ON = (params.get('chips') || '') !== '0';
  // Browse by category, behind ?browse=1 while Jessie looks at it. Off by default, so the live
  // page is untouched for everybody else.
  // Was the mockup, is now the intro. Jessie, 2026-08-30: go live on it. Turned around rather
  // than deleted, so ?browse=0 still reaches the older one if anything here turns out wrong.
  // The twenty-three forks below come out in one pass later; a deletion tonight is a deletion
  // nobody could check.
  var GP_BROWSE = (params.get('browse') || '') !== '0';
  var GP_BROWSE_KEYS = { introEnjoy:1, introSkills:1, introValues:1 };
  var GP_CHIPS = {
    introEnjoy:  { words: ['Sports', 'Outdoor & Nature', 'Making & Collecting', 'Movement & Performance', 'Games & Strategy'] },
    introSkills: { lead: 'And/or tap any category below...',
                   words: ['Home & Construction', 'Business & Finance', 'Physical Wellbeing', 'Arts & Culture', 'Technology & Communications'],
                   more:  ['Community & Civic', 'Mechanical & Manufacturing', 'Food & Drink', 'Transportation', 'Family Wellbeing',
                           'Self-Expression & Beauty', 'Mental Wellbeing', 'Nature & Outdoors', 'Pets & Animal Care',
                           'Events & Gatherings', 'Making & Collecting', 'Recreation & Hobbies', 'Basic needs and security'] },
    introValues: { lenses: [
                     { label:'Social',
                       words:['Housing and Shelter', 'Food Security', 'Safety and Peace', 'Community Health', 'Economic Opportunity'],
                       more: ['Physical Wellbeing', 'Mental Wellbeing', 'Urgent Medical Care', 'Clothing and Supplies',
                              'Empowerment and Resilience', 'Freedom and Autonomy', 'Personal Expression', 'Local Economic Vitality',
                              'Wealth Equity', 'Quality Goods and Services', 'Information Access', 'Social and Civic Engagement',
                              'Cultural Vitality', 'Shared Community Resources', 'Transportation Access', 'Reliable Utilities',
                              'Digital Connectivity'] },
                     { label:'Ecological',
                       words:['Clean Water', 'Clean Air', 'Climate Stability', 'Biodiversity', 'Clean Energy'],
                       more: ['Clean Soil', 'Clean Food', 'Animal Welfare', 'Water Security', 'Land Security', 'Eco Values'] }
                   ] },
  };
  var _gpChipsPicked = {};
  var _gpLangPicked = {}, _gpMethodPicked = {};
  var GP_LANGS = ['English','Mandarin','Cantonese','Hindi','Spanish','Arabic','Bengali','Portuguese','French','Urdu',
    'Russian','Indonesian','German','Japanese','Swahili','Marathi','Telugu','Turkish','Tamil','Vietnamese','Korean',
    'Italian','Thai','Persian (Farsi)','Polish','Pashto','Punjabi','Ukrainian','Malayalam','Kannada','Romanian','Dutch',
    'Greek','Czech','Hungarian','Gujarati','Somali','Swedish','Norwegian','Hebrew','Danish','Finnish','Albanian',
    'Croatian','Lithuanian','Nepali','Khmer (Cambodian)','Hmong','Estonian','Laotian','Sign Language'];
  // The short form, spelled exactly as the profile stores it, so the two pages never disagree
  // about what somebody said.
  var GP_METHODS = ['\u{1F5C2} Organizing and planning','\u{1F527} Repairing and fixing',
    '\u{1F4DA} Demonstrating what I know','\u{1F9ED} Consulting and advising',
    '\u{1F300} Facilitating and coaching','\u{1F3A8} Making and designing','\u{1F33F} Caring and healing'];

  function gpPickRow(all, picked, firstN){
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
    function btn(word){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = word;
      var paint = function(){
        b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
          + (picked[word]
              ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
              : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
      };
      paint();
      b.addEventListener('click', function(){
        picked[word] = !picked[word]; paint();
        // A language chosen here is what unlocks step 0, so the footer is told.
        if (typeof gpStepPaint === 'function') gpStepPaint();
      });
      return b;
    }
    var shown = all.filter(function(w, i){ return !firstN || i < firstN || picked[w]; });
    var rest  = all.filter(function(w){ return shown.indexOf(w) === -1; });
    shown.forEach(function(w){ row.appendChild(btn(w)); });
    if (rest.length) {
      row.appendChild(gpMoreBtn('More', function(){
        rest.forEach(function(w){ row.appendChild(btn(w)); });
      }));
    }
    return { row: row, add: function(w){ picked[w] = true; row.appendChild(btn(w)); } };
  }

  function gpBlock(title, hint, body){
    var w = document.createElement('div');
    w.style.cssText = 'padding:18px 0;';   // space separates, never a line
    var t = document.createElement('div');
    t.style.cssText = 'font-size:17px;font-weight:800;color:#1A2E42;margin-bottom:2px;';
    t.textContent = title;
    var h = document.createElement('div');

  // One flat list of {word, cat} per question, which is all the search needs.
  function gpCorpus(source, rd){
    var out = [], seen = {};
    // The reference sheet carries an `associations` column of everyday words, so searching
    // "doctor" finds Physician. Without it the search only matches the formal name, which is
    // the one thing somebody looking for help does not know.
    var push = function(w, c, a){
      w = String(w || '').trim(); if (!w) return;
      var k = w.toLowerCase(); if (seen[k]) return;
      seen[k] = 1; out.push({ word: w, cat: String(c || '').trim(), assoc: String(a || '').toLowerCase() });
    };
    if (source === 'recreation') {
      (rd.recreation || []).forEach(function(r){ push(r.item, r.recType, r.associations); });
    } else if (source === 'skills') {
      (rd.skills || []).forEach(function(s){ push(s.item, s.category, s.associations); });
    } else if (source === 'values') {
      // The category comes from the sheet now, so Housing and Shelter arrives knowing it is
      // Social. It used to be filed as the flat word "Values", which told nobody anything.
      (rd.values || []).forEach(function(v){
        push((v && v.item !== undefined) ? v.item : v, (v && v.category) || 'Values', v && v.associations);
      });
      (rd.domains || []).forEach(function(v){
        push((v && v.item !== undefined) ? v.item : v, (v && v.category) || 'Domains', v && v.associations);
      });
      // The values list on the reference sheet is empty today, so the two lenses that have been
      // on this page since August are the corpus. Without this the search finds nothing at all.
      var lens = (GP_CHIPS.introValues && GP_CHIPS.introValues.lenses) || [];
      lens.forEach(function(l){
        (l.words || []).forEach(function(w){ push(w, l.label, ''); });
        (l.more  || []).forEach(function(w){ push(w, l.label, ''); });
      });
    } else if (source === 'resources') {
      // Things and spaces people can share. Without this branch the offer question had no words
      // at all, so its search found nothing and every answer went in untagged.
      (rd.resources || []).forEach(function(r){ push(r.item, r.category, r.associations); });
    } else if (source === 'need') {
      (rd.skills || []).forEach(function(s){ push(s.item, s.category, s.associations); });
      (rd.recreation || []).forEach(function(r){ push(r.item, r.recType, r.associations); });
    }
    return out;
  }

  // ── Browse by category ─────────────────────────────────────────────────
  // The walk-down list the profile editor has, built here from getReferenceData rather than
  // typed into the page, and drawn in the intro's own colours. One level on screen at a time:
  // tapping a category replaces what is showing instead of expanding underneath it.
  function gpBuildTree(source, rd){
    var tree = {}, seen = {};
    var add = function(top, sub, item){
      top = String(top || '').trim(); sub = String(sub || '').trim(); item = String(item || '').trim();
      if (!top || !item) return;
      var k = (top + '|' + sub + '|' + item).toLowerCase();
      if (seen[k]) return; seen[k] = 1;
      if (!tree[top]) tree[top] = { subs:{}, items:[] };
      if (sub) { if (!tree[top].subs[sub]) tree[top].subs[sub] = []; tree[top].subs[sub].push(item); }
      else tree[top].items.push(item);
    };
    if (source === 'recreation') {
      (rd.recreation || []).forEach(function(r){ add(r.recType, r.category, r.item); });
    } else if (source === 'skills') {
      (rd.skills || []).forEach(function(s){ add(s.category, '', s.item); });
    } else if (source === 'values') {
      var vs = (rd.values || []).filter(function(v){ return v && v.item; });
      if (vs.length) {
        // The sheet carries the category once the backend reads Eco Social Value beside
        // Eco Social Category. Then this is the whole list and the page holds none of it.
        vs.forEach(function(v){ add(v.category || 'Values', '', v.item); });
      } else {
        // Until that one line ships, the two lenses already on this page are the list.
        ((GP_CHIPS.introValues && GP_CHIPS.introValues.lenses) || []).forEach(function(l){
          (l.words || []).forEach(function(w){ add(l.label, '', w); });
          (l.more  || []).forEach(function(w){ add(l.label, '', w); });
        });
      }
    }
    return tree;
  }
  function gpLevel(tree, path){
    var alpha = function(x){ return x.slice().sort(function(a,b){ return a.localeCompare(b); }); };
    if (!path.length) return alpha(Object.keys(tree)).map(function(k){ return { name:k, drill:true }; });
    var node = tree[path[0]] || { subs:{}, items:[] };
    if (path.length === 1) {
      var out = alpha(Object.keys(node.subs)).map(function(k){ return { name:k, drill:true }; });
      alpha(node.items).forEach(function(i){ out.push({ name:i, drill:false }); });
      return out;
    }
    return alpha(node.subs[path[1]] || []).map(function(i){ return { name:i, drill:false }; });
  }

          var t2 = document.createElement('span');
          // Stored as "massage therapy:skill". Somebody reads the thing, not the colon.
          var _bits = String(w).split(':');
          var _kind = (_bits.length > 1) ? _bits[_bits.length - 1].toLowerCase() : '';
          if (_kind === 'skill' || _kind === 'thing' || _kind === 'space') {
            t2.textContent = _bits.slice(0, -1).filter(function(b){ return b.toLowerCase() !== 'work'; }).join(':');
            var _k = document.createElement('span');
            _k.textContent = '· ' + _kind;
            _k.style.cssText = 'font-weight:600;opacity:.7;font-size:11.5px;margin-left:5px;';
            c.appendChild(t2); c.appendChild(_k);
            t2 = null;
          } else {
            t2.textContent = w;
          }
          var x = document.createElement('button');
          x.type = 'button';
          x.setAttribute('aria-label', 'Remove ' + w);
          x.textContent = '\u00D7';
          x.style.cssText = 'font:inherit;font-size:15px;line-height:1;border:0;background:transparent;'
            + 'color:#fff;cursor:pointer;padding:0 2px;';
          x.addEventListener('click', function(){ gpDropWord(key, w, ta); repaint(); });
          if (t2) c.appendChild(t2);
          c.appendChild(x);
          chosen.appendChild(c);
        });
    }

    if (!_bare) {
      var lead = document.createElement('div');
      lead.style.cssText = 'font-size:13px;color:#6B7A8D;margin-bottom:8px;';
      lead.textContent = 'Search for something, or tap one below.';
      box.appendChild(lead);
    }

    var search = document.createElement('input');
    search.type = 'text';
    search.placeholder = 'Search';
    search.style.cssText = 'width:100%;border:1.5px solid #DDE3EA;background:#F7FBFF;border-radius:10px;'
      + 'padding:10px 12px;font:inherit;font-size:14px;color:#1A2E42;outline:none;';
    var searchWrap = document.createElement('div');
    if (_bare) searchWrap.style.cssText = 'display:none;margin-bottom:10px;';
    searchWrap.appendChild(search);
    var results = document.createElement('div');
    results.style.cssText = 'margin-top:6px;';
    searchWrap.appendChild(results);
    box.appendChild(searchWrap);

    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;';
    box.appendChild(row);

    var corpus = [];
    var _browseOn = GP_BROWSE && !!GP_BROWSE_KEYS[key] && !_bare;
    var browseWrap = document.createElement('div');
    browseWrap.style.cssText = 'margin-top:14px;';
    if (_browseOn) {
      box.appendChild(browseWrap);
      // The list has not arrived yet, so say that rather than draw an empty row somebody
      // will read as "there is nothing here".
      var _wait = document.createElement('div');
      _wait.style.cssText = 'font-size:13px;color:#6B7A8D;';
      _wait.textContent = 'Looking up the list\u2026';
      browseWrap.appendChild(_wait);
    }
    gpRefOnce().then(function(rd){
      corpus = gpCorpus(cfg.source, rd);
      if (_browseOn) gpRenderBrowse(gpBuildTree(cfg.source, rd), []);
    });

    // The examples show at the top level and step aside once somebody is inside a category,
    // so there is one list on the screen rather than two.
    function gpRenderBrowse(tree, path){
      browseWrap.innerHTML = '';
      var atTop = !path.length;
      row.style.display = atTop ? 'flex' : 'none';
      if (atTop) {
        var lead2 = document.createElement('div');
        lead2.style.cssText = 'font-size:13px;color:#6B7A8D;margin-bottom:8px;';
        lead2.textContent = 'Or browse by category.';
        browseWrap.appendChild(lead2);
      } else {
        var trail = document.createElement('div');
        trail.style.cssText = 'font-size:13.5px;font-weight:700;color:#1A2E42;margin-bottom:10px;';
        var mkLink = function(text, to){
          var a = document.createElement('a');
          a.href = '#'; a.textContent = text;
          a.style.cssText = 'color:#1F699E;text-decoration:underline;cursor:pointer;';
          a.addEventListener('click', function(e){ e.preventDefault(); gpRenderBrowse(tree, to); });
          return a;
        };
        trail.appendChild(mkLink('All categories', []));
        path.forEach(function(seg, idx){
          var sep = document.createElement('span');
          sep.style.cssText = 'color:#6B7A8D;margin:0 6px;font-weight:400;';
          sep.textContent = '\u203A';
          trail.appendChild(sep);
          if (idx === path.length - 1) {
            var cur = document.createElement('span');
            cur.textContent = seg;
            trail.appendChild(cur);
          } else {
            trail.appendChild(mkLink(seg, path.slice(0, idx + 1)));
          }
        });
        browseWrap.appendChild(trail);
      }
      var lrow = document.createElement('div');
      lrow.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
      gpLevel(tree, path).forEach(function(it){
        if (it.drill) {
          // A category opens, a word gets added, and the two are told apart by how they look
          // rather than by a glyph on the label.
          var d = document.createElement('button');
          d.type = 'button';
          d.textContent = it.name;
          d.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
            + 'background:#EDF4FA;border:1px solid #BBD4E8;color:#1A2E42;font-weight:700;';
          d.addEventListener('click', function(){ gpRenderBrowse(tree, path.concat(it.name)); });
          lrow.appendChild(d);
          return;
        }
        // The top of the path IS the tag, because the tree already knows where the word lives.
        var b = gpPill(it.name, gpHasWord(key, it.name));
        b.addEventListener('click', function(){
          if (gpHasWord(key, it.name)) gpDropWord(key, it.name, ta);
          else gpAddWord(key, it.name, path[0] || '', ta);
          gpRenderBrowse(tree, path);
          repaint();
        });
        lrow.appendChild(b);
      });
      browseWrap.appendChild(lrow);
    }

    function repaint(){
      gpPaintChosen();
      gpRevealThanks();
      // Every answer in the list above, by name, whether chosen this visit or saved before.
      var _inList = {};
      String(ta.value || '').split(',').forEach(function(x){
        var n = String(x).split(':')[0].replace(/^[^\p{L}\p{N}]+/u, '').trim().toLowerCase(); if (n) _inList[n] = 1;
      });
      Array.prototype.forEach.call(row.querySelectorAll('button[data-word]'), function(b){
        var on = gpHasWord(key, b.getAttribute('data-word'));
        b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
          + (on ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
                : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
        // NO SECOND COPY OF A CHOSEN ANSWER. Jessie, 2026-09-13, on James Marohn's joy screen: "Duplicates showing". An
        // example already chosen is in the list above with its x, so it steps out of this row and comes back if removed.
        if (on || _inList[String(b.getAttribute('data-word') || '').toLowerCase()]) b.style.display = 'none';
      });
    }

    // The five examples. Emoji stay on screen and come off the stored word, so a tag matches
    // what the reference sheet holds rather than a decorated version of it.
    // When a question asks for a kind rather than a thing, tapping a kind opens a box for the
    // thing itself. "A skill" on its own tells nobody anything, and it is what was being stored.
    var kindBox = null;
    if (cfg.kinds) {
      kindBox = document.createElement('div');
      kindBox.style.cssText = 'display:none;margin-top:10px;gap:8px;align-items:center;';
      var kindInput = document.createElement('input');
      kindInput.type = 'text';
      kindInput.style.cssText = 'flex:1;min-width:0;border:1.5px solid #DDE3EA;background:#fff;'
        + 'border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;color:#1A2E42;outline:none;';
      var kindAdd = document.createElement('button');
      kindAdd.type = 'button';
      kindAdd.textContent = 'Add';
      kindAdd.style.cssText = 'font:inherit;font-size:14px;font-weight:700;padding:10px 18px;'
        + 'border-radius:20px;border:0;background:#1F699E;color:#fff;cursor:pointer;';
      kindBox.appendChild(kindInput); kindBox.appendChild(kindAdd);
      box.appendChild(kindBox);
      var kindNow = '';
      var kindCommit = function(){
        var v = String(kindInput.value || '').trim();
        if (!v || !kindNow) return;
        gpAddWord(key, v + ':' + kindNow, '', ta);
        kindInput.value = '';
        kindBox.style.display = 'none';
        kindNow = '';
        repaint();
      };
      kindAdd.addEventListener('click', kindCommit);
      kindInput.addEventListener('keydown', function(e){
        if (e.key === 'Enter') { e.preventDefault(); kindCommit(); }
      });
      cfg._openKind = function(kind, prompt){
        kindNow = kind;
        kindInput.placeholder = prompt;
        kindBox.style.display = 'flex';
        kindInput.focus();
      };
    }

    cfg.examples.forEach(function(label){
      var word = label.replace(/^[^A-Za-z0-9]+/, '').trim();
      var b = gpPill(label, gpHasWord(key, word));
      b.setAttribute('data-word', word);
      b.addEventListener('click', function(){
        if (cfg.kinds && cfg._openKind) {
          // "A skill" -> skill, and ask what kind of skill.
          var kind = word.toLowerCase().replace(/^a\s+/, '').trim();
          var asks = { skill: 'What skill?', thing: 'What thing?', space: 'What space?' };
          cfg._openKind(kind, asks[kind] || ('What ' + kind + '?'));
          return;
        }
        if (gpHasWord(key, word)) { gpDropWord(key, word, ta); }
        else {
          // An example is usually in the reference sheet too, so it takes that sheet's category
          // rather than arriving untagged. Pickleball files as Sports, not as nothing.
          var cat = '';
          for (var ci = 0; ci < corpus.length; ci++) {
            if (corpus[ci].word.toLowerCase() === word.toLowerCase()) { cat = corpus[ci].cat; break; }
          }
          gpAddWord(key, word, cat, ta);
        }
        repaint();
      });
      row.appendChild(b);
    });

    // Other, and the one question a genuinely new word has to answer.
    var other = document.createElement('button');
    other.type = 'button';
    other.textContent = '+ Other';
    other.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
      + 'background:#6B7A8D;border:1px solid #6B7A8D;color:#fff;font-weight:700;';
    if (_browseOn) {
      // Its own row, below the browse, so it is still there when the examples have stepped aside.
      var otherRow = document.createElement('div');
      otherRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;';
      otherRow.appendChild(other);
      box.appendChild(otherRow);
    } else {
      row.appendChild(other);
    }

    var otherBox = document.createElement('div');
    otherBox.style.cssText = 'display:none;margin-top:10px;';
    box.appendChild(otherBox);

    other.addEventListener('click', function(){
      // Other opens the search and nothing else. The search now offers "Add this to my list"
      // when it finds nothing, so a second box asking for the same words was the same question
      // twice on one screen.
      if (_bare) {
        searchWrap.style.display = 'block';
        try { search.focus(); } catch (e) {}
        return;
      }
      otherBox.style.display = otherBox.style.display === 'none' ? 'block' : 'none';
      if (otherBox.style.display === 'none') { otherBox.innerHTML = ''; return; }
      otherBox.innerHTML = '';
      var inp = document.createElement('input');
      inp.type = 'text';
      inp.placeholder = 'In your own words';
      inp.style.cssText = 'width:100%;border:1.5px solid #DDE3EA;background:#fff;border-radius:10px;'
        + 'padding:10px 12px;font:inherit;font-size:14px;color:#1A2E42;outline:none;';
      otherBox.appendChild(inp);
      var ask = document.createElement('div');
      ask.style.cssText = 'margin-top:8px;';
      otherBox.appendChild(ask);
      inp.focus();

      var commit = function(){
        var word = String(inp.value || '').trim();
        if (!word) return;
        // Already in the reference sheet? Then it is not new and it keeps that sheet's category.
        var hit = null;
        for (var i = 0; i < corpus.length; i++) {
          if (corpus[i].word.toLowerCase() === word.toLowerCase()) { hit = corpus[i]; break; }
        }
        if (hit) {
          gpAddWord(key, hit.word, hit.cat, ta);
          otherBox.style.display = 'none'; otherBox.innerHTML = '';
          return;
        }
        if (!cfg.tagQ) {
          gpAddWord(key, word, '', ta);
          otherBox.style.display = 'none'; otherBox.innerHTML = '';
          return;
        }
        ask.innerHTML = '';
        var q = document.createElement('div');
        q.style.cssText = 'font-size:13px;color:#6B7A8D;margin-bottom:8px;';
        q.textContent = cfg.tagQ;
        ask.appendChild(q);
        var opts = cfg.tagOpts;
        if (!opts) {
          // Skills and values take their categories from the reference sheet itself.
          var seen = {}; opts = [];
          corpus.forEach(function(c){ if (c.cat && !seen[c.cat]) { seen[c.cat] = 1; opts.push(c.cat); } });
        }
        var orow = document.createElement('div');
        orow.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
        opts.forEach(function(o){
          var ob = gpPill(o, false);
          ob.addEventListener('click', function(){
            gpAddWord(key, word, o.replace(/^[^A-Za-z0-9]+/, '').trim(), ta);
            otherBox.style.display = 'none'; otherBox.innerHTML = '';
          });
          orow.appendChild(ob);
        });
        ask.appendChild(orow);
      };
      inp.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') { ev.preventDefault(); commit(); } });
      var add = document.createElement('button');
      add.type = 'button';
      add.textContent = 'Add';
      add.style.cssText = 'margin-top:8px;font:inherit;font-size:13.5px;font-weight:700;padding:8px 16px;'
        + 'border-radius:20px;border:1.5px solid #1F699E;background:#fff;color:#1F699E;cursor:pointer;';
      add.addEventListener('click', commit);
      otherBox.insertBefore(add, ask);
    });

    // Nothing matched, so the search becomes the way in rather than a dead end pointing at
    // another button. A word nobody has used before still has to be filed, which is the one
    // question Other asks, and it is asked right here instead.
    function gpAddNew(word, mount, done){
      word = String(word || '').trim(); if (!word) return;
      // Typed something the sheet already knows? Then it is not new and it keeps that category.
      for (var i = 0; i < corpus.length; i++) {
        if (corpus[i].word.toLowerCase() === word.toLowerCase()) {
          gpAddWord(key, corpus[i].word, corpus[i].cat, ta); repaint(); if (done) done(); return;
        }
      }
      // 2026-08-30. The tag question is gone. It asked somebody to do taxonomy work that was
      // unwanted and modelled the wrong thing, and it only ever fired on a word nobody had used
      // before, which is exactly where a person's guess is worst. A word the sheet already knows
      // still arrives with its category, because the sheet knows it. A new word is saved as it
      // was typed. See design/data-direction-edges-not-categories.md.
      gpAddWord(key, word, '', ta);
      repaint();
      if (done) done();
      if (typeof gpStepPaint === 'function') gpStepPaint();
    }

    // Search. Filters as you type, because pressing a button to search reads as broken.
    search.addEventListener('input', function(){
      var t = String(search.value || '').trim().toLowerCase();
      results.innerHTML = '';
      if (t.length < 2) return;
      var hits = corpus.filter(function(c){
        return c.word.toLowerCase().indexOf(t) > -1 || (c.assoc && c.assoc.indexOf(t) > -1);
      }).slice(0, 6);
      hits.forEach(function(h){
        var r = document.createElement('div');
        r.setAttribute('role', 'button');
        r.tabIndex = 0;
        r.style.cssText = 'border:1px solid #DDE3EA;border-radius:10px;padding:10px 12px;margin-top:6px;cursor:pointer;background:#fff;';
        r.innerHTML = '<div style="font-size:14.5px;font-weight:700;color:#1A2E42;">' + h.word + '</div>'
          + (h.cat ? '<div style="font-size:13px;color:#6B7A8D;">' + h.cat + '</div>' : '');
        r.addEventListener('click', function(){
          gpAddWord(key, h.word, h.cat, ta);
          search.value = ''; results.innerHTML = ''; repaint();
        });
        results.appendChild(r);
      });
      if (!hits.length) {
        var typed = String(search.value || '').trim();
        var r = document.createElement('div');
        r.setAttribute('role', 'button');
        r.tabIndex = 0;
        r.style.cssText = 'border:1px solid #C9DFF3;border-radius:10px;padding:10px 12px;margin-top:6px;'
          + 'cursor:pointer;background:#F7FBFF;';
        var rt = document.createElement('div');
        rt.style.cssText = 'font-size:14.5px;font-weight:700;color:#1F699E;';
        rt.textContent = 'Add this to my list';
        var rw = document.createElement('div');
        rw.style.cssText = 'font-size:13px;color:#6B7A8D;';
        rw.textContent = typed;
        r.appendChild(rt); r.appendChild(rw);
        var ask = document.createElement('div');
        r.addEventListener('click', function(){
          gpAddNew(typed, ask, function(){ search.value = ''; results.innerHTML = ''; });
        });
        results.appendChild(r);
        results.appendChild(ask);
      }
    });

    // Anything already answered shows the moment the screen is built, not on the first tap.
    repaint();
    (window._gpRepaints = window._gpRepaints || {})[key] = repaint;   // screen 5 adds skills to screen 3's list
    return box;
  }

  function gpChipRow(key, ta){
    var cfg = GP_CHIPS[key];
    if (!GP_CHIPS_ON || !cfg) return null;
    var box = document.createElement('div');
    box.style.cssText = 'margin-top:10px;';
    var lead = document.createElement('div');
    lead.style.cssText = 'font-size:13px;color:#6B7A8D;margin-bottom:8px;';
    lead.textContent = cfg.lead || 'And/or tap any below...';
    box.appendChild(lead);

    // Social or ecological is asked first, and the other side stays on screen so somebody can
    // flip without going back. Anything already tapped stays tapped when the list changes.
    if (cfg.lenses) {
      var lensRow = document.createElement('div');
      lensRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
      var wordRow = document.createElement('div');
      wordRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;';
      var current = null;
      var lensBtns = [];
      var paintLenses = function(){
        lensBtns.forEach(function(pair){
          pair.btn.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 16px;border-radius:20px;cursor:pointer;'
            + (current === pair.lens
                ? 'background:#1A2E42;border:1px solid #1A2E42;color:#fff;font-weight:700;'
                : 'background:#F7FBFF;border:1px solid #C9DFF3;color:#1A2E42;font-weight:700;');
        });
      };
      var showLens = function(lens){
        current = lens;
        paintLenses();
        wordRow.innerHTML = '';
        lens.words.forEach(function(w){ wordRow.appendChild(gpChipBtn(key, w, ta)); });
        if (lens.more && lens.more.length) {
          wordRow.appendChild(gpMoreBtn('More', function(){
            lens.more.forEach(function(w){ wordRow.appendChild(gpChipBtn(key, w, ta)); });
          }));
        }
      };
      cfg.lenses.forEach(function(lens){
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = lens.label;
        b.addEventListener('click', function(){ showLens(lens); });
        lensBtns.push({ btn:b, lens:lens });
        lensRow.appendChild(b);
      });
      paintLenses();
      box.appendChild(lensRow);
      box.appendChild(wordRow);
      return box;
    }

    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
    cfg.words.forEach(function(w){ row.appendChild(gpChipBtn(key, w, ta)); });
    if (cfg.more && cfg.more.length) {
      row.appendChild(gpMoreBtn('More', function(){
        cfg.more.forEach(function(w){ row.appendChild(gpChipBtn(key, w, ta)); });
      }));
    }
    box.appendChild(row);
    return box;
  }


  // ---- A face, before the words -------------------------------------------
  // This lives here rather than on the sign-up page on purpose. Somebody who gives up on
  // sign-up was never here; somebody who gives up on this page is already in and can come back
  // to it whenever they like. So the optional things belong on this side of the door.
  var PHOTO_URL = 'https://cw-photos.jessieupp.workers.dev';
  var _gpPhotoToken = '';

  // The same session the profile editor asks for. Signing up wrote it under both names, so
  // either will do and neither means asking somebody for a second code.
  function gpToken(){
    if (_gpPhotoToken) return _gpPhotoToken;
    try {
      var norm = String(meId || '').split('.').join('').toLowerCase();
      var raw = localStorage.getItem('cw-edit-' + norm);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && o.t && (!o.exp || o.exp > Date.now())) { _gpPhotoToken = o.t; return _gpPhotoToken; }
      }
      var t2 = localStorage.getItem('cw-token') || '';
      var who = String(localStorage.getItem('cw-id') || '').split('.').join('').toLowerCase();
      if (t2 && who && who === norm) {
        var exp = parseInt(String(t2).split('.')[1], 10);
        if (exp && Date.now() <= exp - 60000) { _gpPhotoToken = t2; return _gpPhotoToken; }
      }
    } catch (e) {}
    return '';
  }

  function gpPhotoStat(msg){ var el = document.getElementById('gp-photo-stat'); if (el) el.textContent = msg || ''; }
  function gpPhotoShow(url){
    var f = document.getElementById('gp-photo-face'); if (!f) return;
    f.innerHTML = '<img src="' + url + '" alt="" style="width:100%;height:100%;object-fit:cover;">';
    var b = document.getElementById('gp-photo-btn'); if (b) b.textContent = 'Change photo';
    var need = document.getElementById('gp-photo-need'); if (need) need.style.display = 'none';   // only for somebody without one
    // Step 0 will not let anybody past without one, so the moment a face lands the door opens.
    window._gpPhotoUp = true;
    if (typeof gpStepPaint === 'function') gpStepPaint();
  }

  // ── Location, 2026-08-30 ──────────────────────────────────────────────────
  // Ported from My account rather than invented again, so somebody meets the same picker in both
  // places and a stored value reads the same way. Held as one plain string, "Washington, United
  // States", so anything showing a profile can print it without knowing the three levels.
  var GP_REGIONS = ['North America','South America','Europe','Asia','Africa','Oceania','Antarctica'];
  var GP_NA = ['United States','Canada','Mexico'];
  var GP_US = ["Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming","Washington D.C."];
  var _gpLoc = { region:'', country:'', state:'' };
  // The place is held as one plain string, so it has to be read back into the three levels the
  // picker draws. Without this it was saved on every visit and asked for on every visit.
  function gpLocFrom(str){
    var v = String(str || '').trim();
    if (!v) return;
    var parts = v.split(',').map(function(x){ return x.trim(); });
    if (parts.length > 1 && parts[parts.length - 1] === 'United States') {
      var st = parts[0];
      if (GP_US.indexOf(st) > -1) { _gpLoc = { region:'North America', country:'United States', state:st }; return; }
    }

  function gpPhotoBlock(){

  function gpChoosePhoto(){

    var inp = document.createElement('input');

  // Shrunk here, in the browser, so a photo straight off a phone camera never crosses the wire
  // at full size. An 8.4MB source came out at 6KB in testing.
  function gpShrinkPhoto(file){
    gpPhotoStat('Getting it ready\u2026');
    var img = new Image();
    img.onload = function(){
      try {
        var side = Math.min(img.width, img.height);
        var c = document.createElement('canvas'); c.width = 600; c.height = 600;
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 600, 600);
        c.toBlob(function(blob){
          if (!blob) { gpPhotoStat('That picture could not be read.'); return; }
          gpSendPhoto(blob);
        }, 'image/jpeg', 0.85);
      } catch (e) { gpPhotoStat('That picture could not be read.'); }
      finally { try { URL.revokeObjectURL(img.src); } catch (e) {} }
    };
    img.onerror = function(){ gpPhotoStat('That picture could not be read.'); };
    img.src = URL.createObjectURL(file);
  }

  function gpSendPhoto(blob){
    if (CW_MOCKUP) { gpPhotoStat('This is a mockup, so the photo is not sent.'); return; }
    gpPhotoStat('Sending\u2026');
    fetch(PHOTO_URL + '/upload?id=' + encodeURIComponent(meId), {
      method: 'POST',
      headers: { 'Content-Type': 'image/jpeg', 'x-cw-token': gpToken() },
      body: blob

      if (!d || d.status !== 'ok' || !d.url) { gpPhotoStat((d && d.message) || 'That did not go through.'); return; }
      gpPhotoShow(d.url + '?v=' + Date.now());
      gpPhotoStat('');
      // Only photoURL is sent, and saveIntake leaves alone anything it was not given, so this
      // cannot touch an answer somebody has already written.
      fetch(GS_URL + '?action=saveIntake&appearId=' + encodeURIComponent(meId)
            + '&secure=1&editToken=' + encodeURIComponent(gpToken())
            + '&photoURL=' + encodeURIComponent(d.url)).catch(function(){});
    }).catch(function(){ gpPhotoStat('That did not go through.'); });
  }

  // ── One thing at a time, 2026-08-30 ───────────────────────────────────────
  // Five questions in a column is a form. One question on a screen is a conversation, and it is

  var GP_STEP_TITLES = ['Location', 'Joy', 'Skills', 'Attention towards', 'Offerings', 'Open to work', 'Your answers'];

  // What counts as an answer: a tapped word, or something typed. Either half is an answer,

    return !!(el && String(el.value || '').trim());

  function gpStepOK(n){
    // Jessie, 2026-09-13: "Languages required on next screen". The skills screen needs a skill and a language.
    if (GP_BROWSE && n === 2) return gpAnswered('introSkills') && Object.keys(_gpLangPicked || {}).some(function(k){ return _gpLangPicked[k]; });
    if (GP_BROWSE && GP_REQUIRED_STEPS[n]) return gpAnswered(GP_REQUIRED_STEPS[n].key);

  // THE RAIL. Start goes back to the home page's first screen, where the path is chosen, and each screen of this form is

  function gpStepPaint(){

  function gpThanksBlock(){

  // Into Your answers. The answers save in the background, the same as every other Next, so nobody waits on

  // Back goes back one screen. It used to leave the intro entirely and drop somebody on the

  function gpBuildPreview(){

    var on = function(m){ return Object.keys(m || {}).filter(function(k){ return m[k]; }); };
    var thanks = GP_THANKS.filter(function(o){ return _gpThanksPicked[o.value]; }).map(function(o){ return o.label; });

    };
    el.innerHTML =
        row('Where are you?', gpLocString(_gpLoc))
      + row('What brings you joy?', val('introEnjoy'))
      + row('What skills do you have?', val('introSkills'))
      + row('What comes most naturally to you?', on(_gpMethodPicked).join(', '))
      + row('Which languages do you speak?', on(_gpLangPicked).join(', '))
      + row('What do you care about?', val('introValues'))
      + row('Who would you most like to serve in your work or life?', Object.keys(CW_SERVE).filter(function(k){ return CW_SERVE[k]; }).join(', '))
      + row('For additional forms of income or trade, do you have any resources to offer others right now?', [cwOfferNames('space').length ? 'Space: ' + cwOfferNames('space').join(', ') : '', cwOfferNames('thing').length ? 'Things: ' + cwOfferNames('thing').join(', ') : ''].filter(Boolean).join('\n'))
      + row('What outcomes would you like work to give you?', cwWorkText())
      + row('How do you like to get appreciated?', thanks.join(', '))
      + row('If you\u2019re open to paid work, what type of paid work are you open to?', cwOtwList('paid').join(', '))
      + (CW_RETIRED.on ? row('I\u2019m retired', 'Yes') : '')
      + row('If you\u2019re open to non-paid work, what type are you open to?', cwOtwList('unpaid').join(', '))
      + row('What is your availability for non-paid work?', cwOtwList('unpaidTime').join(', '))
      + cwPurposeBox()
      + '<div style="background:#F7FBFF;border:1px solid #C9DFF3;border-radius:12px;padding:18px 20px;margin-top:10px;">'
      + '<div style="font-size:15.5px;font-weight:800;margin-bottom:4px;color:#1A2E42;">What happens next</div>'
      + '<div style="font-size:14px;color:#4B5A6D;">The person who invited you or someone from Creating.Works will reach out and look at this together.</div></div>';
  }

  // Next does one of three things: move on, save, or leave. Back never saves, because going
  // back to look at something should not write anything.
  // Every move forward writes what is on the screen. Nobody should be able to answer four
  // questions, close the tab, and find out none of it was kept because they never reached a
  // button at the end. Quiet on purpose: it takes nothing over and says nothing unless it fails.
  // Looking as somebody else is looking, never writing. identity.js sets `viewing` and says
  // every page that writes is expected to check it. This one did not, so pressing Next while
  // viewing as another member would have written this screen onto their row.
  function gpViewingSomebodyElse(){
    try { return !!(window.CW && CW.me && CW.me().viewing); } catch (e) { return false; }
  }

  // THE SAVE, built in one place for every Next and for Send.
  // WORK VALUES AND THINGS. Jessie, 2026-09-14, of these answers showing under Things on her 2Gather profile: "Those should
  // fall under VALUES - but under a heading Work values in the values page. Money should be a thing yes". An answer that
  // names a kind of thing (the profile's own four: Money, Physical goods, Consumables, Living things) stays a need marked
  // :work; every other answer is a work value, in ikigai.workValues (workValuesTags in saveIntro).
  var CW_THING_KINDS = { 'money': 1, 'physical goods': 1, 'consumables': 1, 'living things': 1 };
  function cwIsThing(n){ return !!CW_THING_KINDS[String(n || '').trim().toLowerCase()]; }
  // WORK EXPERIENCE IS NEVER A NEED (2026-09-15), as on 2gather.network/intro. Jessie: "are resources and money under needs not
  // in the right place? should this on work experience I'm creating?" Every pick goes to ikigai.workValues, Money and
  // Resources too; a need marked ":work" is dropped from needs and never shown in the Needs box. n124 moved the saved ones.
  function cwWorkValuesTags(){
    return Object.keys(CW_WORK.picked).filter(function(k){ return CW_WORK.picked[k]; }).join('|');
  }
  function cwNeedsTags(base){
    var rest = String(base || '').split('|').map(function(x){ return x.trim(); }).filter(Boolean);
    if (window._gpLoaded) rest = rest.filter(function(x){ return !/:work$/i.test(x) && !CW_WORK.picked[String(x).split(':')[0].trim()]; });
    return rest.join('|');
  }
  function cwBuildQs(){
    var val = function(k){ var el = document.getElementById('gp-intro-' + k); return el ? String(el.value || '').trim() : ''; };
    var picked = function(map, sep){ return Object.keys(map).filter(function(k){ return map[k]; }).join(sep); };
    var tagFor = function(k){
      var el = document.getElementById('gp-intro-' + k);
      var orig = _gpOrig[k] || {};
      return String((el && el.value) || '').split(',').map(function(x){ return x.trim(); })
        .filter(Boolean)
        // Send back exactly what arrived, level and all, unless it is a word added just now.
        .map(function(w){ return orig[w.toLowerCase()] || w; })
        .join('|');
    };
    var qs = 'action=saveIntro&appearId=' + encodeURIComponent(meId)
      + (window._gpLoaded ? '&tagsMode=replace' : '')
      + '&appreciation=' + encodeURIComponent(picked(_gpThanksPicked, '|'))
      + '&languages='    + encodeURIComponent(picked(_gpLangPicked, ', '))
      + '&methods='      + encodeURIComponent(picked(_gpMethodPicked, '|'));
    GP_INTRO_Q.forEach(function(q){
      var v = val(q.key);
      if (q.key === 'introOffer') return;   // offers live in ikigai.skills and ikigai.haves now (cw-offers)
      // THE SENTENCE STAYS THE PERSON'S (row 176, 2026-09-15). The box joins the care-about tags with the person's own
      // sentence split at its commas, and saving it wrote that word list over the sentence and made its pieces tags.
      // The sentence is not sent from here now; the tags are.
      if (q.key === 'introValues') return;
      qs += '&' + q.key + '=' + encodeURIComponent(v);
    });
    qs += '&workValuesTags=' + encodeURIComponent(cwWorkValuesTags());
    qs += '&needsTags='     + encodeURIComponent(cwNeedsTags(tagFor('introNeed')))
        + '&interestsTags=' + encodeURIComponent(tagFor('introEnjoy'))
        + '&skillsTags='    + encodeURIComponent(tagFor('introSkills'))
        + '&valuesTags='    + encodeURIComponent(gpSplitCare(cwCareTags(tagFor('introValues'))).values)
        + '&domainsTags='   + encodeURIComponent(gpSplitCare(cwCareTags(tagFor('introValues'))).domains)
        + '&location='      + encodeURIComponent(gpLocString(_gpLoc));
    if (window._gpLoaded) qs += '&havesTags=' + encodeURIComponent(CW_HAVES.join('|'))
      + '&openToPaidWork=' + encodeURIComponent(cwOtwList('paid').join('|'))
      + '&openToUnpaidTime=' + encodeURIComponent(cwOtwList('unpaidTime').join('|'))
      + '&openToUnpaidWork=' + encodeURIComponent(cwOtwList('unpaid').join('|'))
      + '&servesWho=' + encodeURIComponent(Object.keys(CW_SERVE).filter(function(k){ return CW_SERVE[k]; }).join('|'))
      + '&retired=' + encodeURIComponent(cwRetiredValue());
    return qs;
  }
  // Saved on every Next, but only when something changed since the last save: one trip to the backend
  // fewer, and the answers' time only moves when an answer did, which is what Sent is measured against.
  var _cwLastQs = null, _cwSentQs = null;
  function cwSendKey(){ return cwBuildQs() + '&purposeKey=' + encodeURIComponent(CW_PURPOSE.text || ''); }
  function cwIsSent(){ return !!window._cwSent && _cwSentQs !== null && cwSendKey() === _cwSentQs; }
  // NOTHING SAVES BEFORE THE SAVED ANSWERS ARRIVE. Jessie, 2026-09-13: "Fix now with deploy". Every save writes
  // every box, blanks included, so a Next pressed while they were still loading (up to 40 seconds) wrote empty
  // boxes over real answers. Until they are here a Next only moves on, and the save runs the moment they land.
  function cwStat(msg, bad){ var st = document.getElementById('gp-intro-status'); if (st) { st.style.color = bad ? '#7A2410' : '#6B7A8D'; st.textContent = msg || ''; } }
  function gpQuietSave(){
    if (CW_MOCKUP) return;
    if (!GP_BROWSE || !meId) return;
    if (gpViewingSomebodyElse()) return;
    if (!window._gpLoaded) {
      window._cwWantedSave = true;
      cwStat(window._cwLoadFailed ? 'Your saved answers did not load, so nothing here saves. A reload tries again.'
                                  : 'Your saved answers are still loading and this saves as soon as they arrive.', !!window._cwLoadFailed);
      return;
    }
    var qs = cwBuildQs();
    if (qs === _cwLastQs) return;
    _cwLastQs = qs;
    fetch(GS_URL + '?' + qs).catch(function(){ _cwLastQs = null; });
  }
  // SEND. Saves once more and emails the person their answers, with the operators copied. One trip, and
  // the button says Sending until it answers, then a greyed Sent until an answer changes.
  function cwSend(btn){
    var stat = document.getElementById('gp-intro-status');
    if (gpViewingSomebodyElse()) { if (stat) stat.textContent = 'You are looking as somebody else, so nothing is sent.'; return; }
    if (!window._gpLoaded) { cwStat(window._cwLoadFailed ? 'Your saved answers did not load, so nothing can be sent. A reload tries again.' : 'Your saved answers are still loading and Send works once they arrive.', !!window._cwLoadFailed); return; }
    var tk = cwToken();
    if (!tk) {
      if (stat) { stat.style.color = '#7A2410'; stat.innerHTML = 'Sending needs you signed in on <a href="https://creating.works/intro/" style="color:#1F699E;font-weight:700;">the intro page</a>.'; }
      return;
    }
    var qs = cwBuildQs();
    window._cwSending = true; gpStepPaint();
    if (stat) { stat.style.color = '#6B7A8D'; stat.textContent = ''; }
    // The purpose goes on Send: always into the email, and onto ikigai.purpose only when there was none or it was changed.
    var pq = '&purposeShown=' + encodeURIComponent(CW_PURPOSE.text || '');
    if (CW_PURPOSE.text && (!CW_PURPOSE.saved || CW_PURPOSE.edited)) pq += '&purpose=' + encodeURIComponent(CW_PURPOSE.text);
    var sentKey = cwSendKey();
    fetch(GS_URL + '?' + qs + pq + '&send=1&editToken=' + encodeURIComponent(tk))
      .then(function(r){ return r.json(); })
      .then(function(d){
        window._cwSending = false;
        if (d && (d.status === 'ok' || d.ok === true) && d.sentAt) {
          window._cwSent = true; _cwSentQs = sentKey; _cwLastQs = qs;
          if (CW_PURPOSE.text && (!CW_PURPOSE.saved || CW_PURPOSE.edited)) { CW_PURPOSE.saved = CW_PURPOSE.text; CW_PURPOSE.edited = false; }
          gpStepPaint(); return;
        }
        if (stat) { stat.style.color = '#7A2410'; stat.textContent = (d && d.message) || 'Your answers did not send this time and Send tries again.'; }
        gpStepPaint();
      })
      .catch(function(){
        window._cwSending = false;
        if (stat) { stat.style.color = '#7A2410'; stat.textContent = 'Your answers did not send this time and Send tries again.'; }
        gpStepPaint();
      });
  }

  document.getElementById('gp-step-next').addEventListener('click', function(){
    if (_gpStep === GP_LAST) { if (!cwIsSent() && !window._cwSending) cwSend(this); return; }
    if (_gpStep === GP_LAST) {
      // Say where it is going while it goes there. The jump is not instant and a button that
      // stays put reads as a press that did not land. It names the real destination rather than
      // always saying "your profile", because _next is the group when somebody arrived from one.
      var _isGroup = /\/group/.test(_next);
      var _go = _isGroup ? _next : 'https://2gather.network/profile/';
      this.textContent = _isGroup ? 'Taking you back to the group\u2026' : 'Taking you to your profile\u2026';
      this.disabled = true;
      window.location.href = _go;
      return;
    }
    if (_gpStep === GP_LAST - 1) { gpSaveIntro(); return; }
    if (!gpStepOK(_gpStep)) { gpStepPaint(); return; }

    gpShowStep(_gpStep + 1);
  });
  document.getElementById('gp-step-back').addEventListener('click', function(){ gpShowStep(_gpStep - 1); });
  document.getElementById('gp-step-skip').addEventListener('click', function(){ gpQuietSave(); gpShowStep(_gpStep + 1); });
  // Show somebody what they already said before asking them to say it again.
  // saveIntro writes whatever is in a box, blank included, so a page that opens
  // empty quietly erases the answers of anybody who has been here before. Only
  // enjoy and skills are required, which is exactly how need and values used to
  // disappear. Draw the empty form first so a slow or failed lookup never leaves
  // somebody staring at nothing, then fill it in when their answers arrive.
  gpRenderIntro(null);
  // NOTHING IS ASKED BEFORE THE SAVED ANSWERS ARE HERE. Jessie, 2026-09-13: "If I already see my answers the first time,
  // shouldn't it not show unanswered pages and instead show a breathing loading info button?". The empty questions were a
  // claim that nothing had been said. Until getIntake answers, the card holds only the pill; then the first screen opens
  // with everything filled in. A failed load opens the form with its note that nothing saves.
  function cwWaiting(on){
    setTimeout(function(){ try { cwPaintRail(); } catch (e) {} }, 0);
    var w = document.getElementById('cw-wait'), q = document.getElementById('gp-intro-qs'), f = document.getElementById('gp-footer');
    if (w) w.style.display = on ? '' : 'none';
    if (q) q.style.display = on ? 'none' : '';
    if (f) f.style.display = on ? 'none' : 'flex';
  }
  if (meId) cwWaiting(true);

  // ── WHAT WOULD WORK GIVE YOU, ON THE OFFER SCREEN ───────────────────────────────────────────
  // It was the first screen, then was to follow joy, and Jessie put it on the offer screen instead,
  // under "For work, income, or trade what do you have to offer right now?" (2026-09-13).
  // Jessie, 2026-09-13: "Start with What you need page on c works form we have". The home page's own
  // question, its choices from reference-data.needFor and Anything else, asked before the group form's
  // screens. The choices and this person's saved answers arrive the way the home page gets them: this
  // device's copy first, then one read through the gate. Until they are here it says it is looking.
  var CW_WORK = { choices: null, picked: {}, more: '', touched: false };
  function cwNorm(x){ return String(x || '').split('.').join('').toLowerCase(); }
  function cwToken(){
    try {
      var o = JSON.parse(localStorage.getItem('cw-edit-' + cwNorm(meId)) || 'null');

    var lines = function(){ return String(CW_PURPOSE.text || '').split('\n').map(function(x){ return x.trim(); }).filter(Boolean); };
    setTimeout(function(){
      var ta = document.getElementById('cw-purpose');
      if (ta) ta.addEventListener('input', function(){ CW_PURPOSE.text = ta.value; CW_PURPOSE.edited = true; gpStepPaint(); cwPaintPurposePicks(); });
      document.querySelectorAll('[data-cw-purpose]').forEach(function(b){
        b.onclick = function(){
          var sLine = opts[parseInt(b.getAttribute('data-cw-purpose'), 10)], l = lines(), at = l.indexOf(sLine);
          if (at > -1) l.splice(at, 1); else l.push(sLine);
          CW_PURPOSE.text = l.join('\n'); CW_PURPOSE.edited = true;
          var t = document.getElementById('cw-purpose'); if (t) t.value = CW_PURPOSE.text;
          gpStepPaint(); cwPaintPurposePicks();
        };
      });
      cwPaintPurposePicks();
    }, 0);
    window._cwPurposeOpts = opts;
    // Header size with a line above, so it stands apart from the answers. Jessie, 2026-09-14: "Make Your purpose a header
    // size on the answers page so it stands out with horizontal line above".
    return '<div style="font-size:22px;font-weight:800;color:#1A2E42;border-top:1px solid #DDE3EA;margin-top:10px;padding-top:18px;">Your purpose</div>'
      + (opts.length ? '<div style="font-size:13.5px;color:#6B7A8D;margin:2px 0 10px;">We drew these from your answers. Pick one or more and change any of it to say it your way.</div>'
          + '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;">'
          + opts.map(function(o, i){ return '<button type="button" data-cw-purpose="' + i + '" style="font:inherit;font-size:14px;text-align:left;padding:10px 14px;border-radius:12px;cursor:pointer;line-height:1.45;">' + _gpEsc(o) + '</button>'; }).join('')
          + '</div>'
        : '<div style="font-size:13.5px;color:#6B7A8D;margin:2px 0 8px;">Say what you are making, for whom, and in service to what.</div>')
      + '<textarea id="cw-purpose" rows="3" class="cw-intro-box" placeholder="Example: Facilitating and coaching, for families new to the area, in service to community health" '
      + 'style="width:100%;border:1.5px solid #DDE3EA;background:#F7FBFF;border-radius:10px;padding:12px 14px;font:inherit;font-size:14.5px;color:#1A2E42;line-height:1.5;resize:vertical;margin-bottom:14px;">'
      + _gpEsc(CW_PURPOSE.text || '') + '</textarea>';
  }
  // A statement in the box is shown picked, filled blue like every other choice.
  function cwPaintPurposePicks(){
    var l = String(CW_PURPOSE.text || '').split('\n').map(function(x){ return x.trim(); });
    document.querySelectorAll('[data-cw-purpose]').forEach(function(b){
      var on = l.indexOf((window._cwPurposeOpts || [])[parseInt(b.getAttribute('data-cw-purpose'), 10)]) > -1;
      b.style.background = on ? '#1F699E' : '#fff';
      b.style.color = on ? '#fff' : '#1F699E';
      b.style.border = on ? '1px solid #1F699E' : '1px solid #C9DFF3';
      b.style.fontWeight = on ? '700' : '600';
    });
  }

  function cwLoadWork(){
    try {
      var d = JSON.parse(localStorage.getItem('cw-inquiry-draft-' + cwNorm(meId)) || 'null');
      if (d && Array.isArray(d.choices) && d.choices.length) {
        CW_WORK.choices = d.choices.slice();
        (Array.isArray(d.needFor) ? d.needFor : []).forEach(function(n){ CW_WORK.picked[n] = true; });
        CW_WORK.more = String(d.needMore || '');
      }
    } catch (e) {}
    cwPaintWork();
    var tk = cwToken();
    if (!tk || !meId) { if (!CW_WORK.choices) cwPaintWork('signin'); return; }
    fetch(GS_URL + '?action=getInquiry&appearId=' + encodeURIComponent(meId) + '&editToken=' + encodeURIComponent(tk) + '&path=all')
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.code === 'signin') { if (!CW_WORK.choices) cwPaintWork('signin'); return; }
        if (!d || d.status !== 'ok') { if (!CW_WORK.choices) cwPaintWork('failed'); return; }
        if (Array.isArray(d.needChoices) && d.needChoices.length) CW_WORK.choices = d.needChoices.slice();
        var w = d.paths && d.paths.work;
        if (w && w.found && w.data && !CW_WORK.touched && !CW_WORK.fromIkigai) {
          CW_WORK.picked = {};
          String(w.data.needFor || '').split('|').map(function(x){ return x.trim(); }).filter(Boolean)
            .forEach(function(n){ CW_WORK.picked[n] = true; });
          CW_WORK.more = String(w.data.needMore || '');
        }
        if (!CW_WORK.touched) cwPaintWork(); else if (!document.querySelector('[data-cw-need]')) cwPaintWork();
      })
      .catch(function(){ if (!CW_WORK.choices) cwPaintWork('failed'); });
  }
  cwLoadWork();
  cwPaintOffers();
  cwPaintOtw();
  cwPaintServe();
  // Most people answered these long before the intro* columns existed, and their words
  // sit one column away under the older names. Asking somebody to type out again what
  // we already hold is how a form earns a reputation for not listening, so fall back to
  // the older field wherever the newer one is empty.
  // The care-about tags without the words that are only in the person's sentence (see THE SENTENCE STAYS THE PERSON'S).
  function cwCareTags(tags){
    var only = window._gpSentenceOnly || {};
    return String(tags || '').split('|').filter(function(t){
      var w = String(t).split(':')[0].replace(/^[^\p{L}\p{N}]+/u, '').trim().toLowerCase();
      return w && !only[w];
    }).join('|');
  }
  // SECTORS GO TO SECTORS (row 176, 2026-09-15; the same as 2gather.network/intro). A care-about pick that is on the
  // reference sectors list is saved in ikigai.domains (domainsTags, only ever added to); the rest stay in ikigai.values.
  function gpSplitCare(tags){
    var rd = window._gpRd || {}, sec = {};
    (rd.domains || []).forEach(function(v){ var w = String((v && v.item !== undefined) ? v.item : v).trim().toLowerCase(); if (w) sec[w] = 1; });
    var vals = [], doms = [];
    String(tags || '').split('|').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(t){
      var bits = t.split(':'), w = String(bits[0] || '').replace(/^[^\p{L}\p{N}]+/u, '').trim();
      if (!sec[w.toLowerCase()]) { vals.push(t); return; }
      var lvl = (bits[1] === 'Value') ? (bits[2] || '') : (bits[1] || '');
      doms.push(w + (lvl ? ':' + lvl : ''));
    });
    return { values: vals.join('|'), domains: doms.join('|') };
  }
  window.gpSplitCare = gpSplitCare; window.cwCareTags = cwCareTags;   // the save is written in another part of the page
  var GP_OLDER = {
    introNeed:   'needs',
    introEnjoy:  'interests',
    introSkills: 'skills',
    introValues: 'values',
    introOffer:  'offers'
  };

  if (meId) {
    fetch(GS_URL + '?action=getIntake&appearId=' + encodeURIComponent(meId))
      .then(function(r){ return r.json(); })
      .then(function(d){
        var have = (d && d.data) || {};
        var use = {}, any = false;
        var _cwWorkNames = {};
        String(have.workValues || '').split('|').concat(String(have.needs || '').split('|').filter(function(x){ return /:work$/i.test(x); }))
          .forEach(function(x){ var n = String(x).split(':')[0].trim().toLowerCase(); if (n) _cwWorkNames[n] = 1; });
        GP_INTRO_Q.forEach(function(q){
          // The real column holds tags, not sentences: items split by | and each one
          // carrying its type and level after a colon, as in "Ping Pong:Participant".
          // Shown raw that reads as gibberish, so keep the names only. An older picker also
          // stored the emoji with the word, and the picture was always decoration.
          var clean = function(part){
            var name = String(part).split(':')[0].trim();
            return name.replace(/^[^\p{L}\p{N}]+/u, '').trim();
          };
          // Both, not one or the other. This used to fall back to the real column only when the
          // intro's own field was empty, so a single word typed here hid a list somebody had
          // spent months building. Nobody loses what they already said.
          var seenW = {}, all = [];
          _gpOrig[q.key] = _gpOrig[q.key] || {};
          // Each list has its own separator and only its own. The real column is pipe
          // separated and a single item may hold commas of its own, as "Kayaking:Fan,Participant"
          // does. Splitting it on commas too tore that in half and invented a person who enjoys
          // "Participant".
          [[String(have[GP_OLDER[q.key]] || ''), '|'],
           [String(have[q.key] || ''), ',']].forEach(function(pair){
            pair[0].split(pair[1]).forEach(function(part){
              var w = clean(part);
              if (!w) return;
              var kw = w.toLowerCase();
              // The work picks never show as needs (2026-09-15).
              if (q.key === 'introNeed' && (/:work$/i.test(String(part).trim()) || _cwWorkNames[kw])) return;
              // Remember the fullest version seen, so a level or a category survives the trip.
              var raw = String(part).trim();
              if (raw && (!_gpOrig[q.key][kw] || raw.length > _gpOrig[q.key][kw].length)) {
                _gpOrig[q.key][kw] = raw;
              }
              if (seenW[kw]) return;
              seenW[kw] = 1; all.push(w);
            });
          });
          // Words that are only in the person's own sentence, not in the column (row 176): shown in the box, never saved
          // as tags, and the sentence itself is left as it is.
          if (q.key === 'introValues') {
            var colSet = {};
            String(have[GP_OLDER[q.key]] || '').split('|').forEach(function(part){ var w = clean(part); if (w) colSet[w.toLowerCase()] = 1; });
            window._gpSentenceOnly = {};
            all.forEach(function(w){ if (!colSet[w.toLowerCase()]) window._gpSentenceOnly[w.toLowerCase()] = 1; });
          }
          var v = all.join(', ');
          if (v) { use[q.key] = v; any = true; }
        });
        // Anything already chosen shows as chosen, so nobody picks their own languages twice.
        String(have.languages || '').split(/[|,]/).forEach(function(l){
          var v = String(l).trim(); if (v) { _gpLangPicked[v] = true; any = true; }
        });
        String(have.methods || '').split('|').forEach(function(m){
          var v = String(m).trim(); if (v) { _gpMethodPicked[v] = true; any = true; }
        });
        // APPRECIATION IS READ BACK. Jessie, 2026-09-13: "Same with appreciated". 2Gather's form never read it,
        // so it opened empty and every save wrote that empty choice over what somebody had.
        String(have.appreciation || '').split('|').forEach(function(a){
          var v = String(a).trim(); if (v) { _gpThanksPicked[v] = true; any = true; }
        });
        GP_INTRO_Q.forEach(function(q){
          var el = document.getElementById('gp-intro-' + q.key);
          var typed = el ? String(el.value || '').trim() : '';
          if (typed) { use[q.key] = typed; any = true; }
        });
        gpLocFrom(have.location);
        if (gpLocString(_gpLoc)) any = true;
        window._gpLoaded = true;
        CW_HAVES = String(have.haves || '').split('|').map(function(x){ return x.trim(); }).filter(Boolean);
        var _split = function(v){ return String(v || '').split('|').map(function(x){ return x.trim(); }).filter(Boolean); };
        var _paid = _split(have.openToPaidWork), _unpaid = _split(have.openToUnpaidWork), _unpaidTime = _split(have.openToUnpaidTime);
        // Nothing saved here yet: the kinds the old intake kept in ikigai.retired ("openToWork|kind:Projects|pay:Both")
        // show as picked, and any the list no longer holds still show, so nobody loses an answer.
        if (!_paid.length && !_unpaid.length) {
          _paid = _split(have.retired).filter(function(x){ return x.indexOf('kind:') === 0; }).map(function(x){ return x.slice(5).trim(); }).filter(Boolean);
        }
        CW_SERVE = {}; _split(have.servesWho).forEach(function(v){ CW_SERVE[v] = true; });
        CW_PURPOSE.saved = String(have.purpose || '').trim();
        var _rt = _split(have.retired);
        CW_RETIRED = { on: _rt.some(function(x){ return x.toLowerCase() === 'true'; }), rest: _rt.filter(function(x){ return x.toLowerCase() !== 'true'; }) };
        CW_OTW = { paid: {}, unpaidTime: {}, unpaid: {} };
        _paid.forEach(function(v){ CW_OTW.paid[v] = true; });
        _unpaidTime.forEach(function(v){ CW_OTW.unpaidTime[v] = true; });
        _unpaid.forEach(function(v){ CW_OTW.unpaid[v] = true; });
        // Work needs already saved from here are the truth once there are any; before that, the home page's
        // Finding work picks (read in cwLoadWork) stand in and are saved as work needs on the first Next.
        var _workSaved = String(have.needs || '').split('|').map(function(x){ return x.trim(); })
          .filter(function(x){ return /:work$/i.test(x); }).map(function(x){ return x.replace(/:work$/i, ''); })
          // and the work values (see WORK VALUES AND THINGS)
          .concat(String(have.workValues || '').split('|').map(function(x){ return x.trim(); }).filter(Boolean));
        if (_workSaved.length && !CW_WORK.touched) {
          CW_WORK.picked = {}; _workSaved.forEach(function(n){ CW_WORK.picked[n] = true; });
          CW_WORK.fromIkigai = true;
        }
        // Sent, if the answers have not moved since they were sent.
        var _sentT = Date.parse(String(have.introSentDate || '')), _savedT = Date.parse(String(have.timestamp || ''));
        window._cwSentLoaded = !isNaN(_sentT) && (isNaN(_savedT) || _savedT <= _sentT + 5000);
        if (any) { gpRenderIntro(use); }
        if (CW_WORK.fromIkigai) cwPaintWork();
        cwPaintOffers();
        cwPaintOtw();
        cwPaintServe();
        // What is on screen is what is saved, unless the home page's work picks still have to be written here.
        var _homePicks = !CW_WORK.fromIkigai && Object.keys(CW_WORK.picked).some(function(k){ return CW_WORK.picked[k]; });
        _cwLastQs = _homePicks ? null : cwBuildQs();
        if (window._cwSentLoaded) { window._cwSent = true; if (!CW_PURPOSE.edited) CW_PURPOSE.text = CW_PURPOSE.saved; _cwSentQs = cwSendKey(); }
        // A Next pressed while loading saves now, from the answers as they stand with the saved ones in.
        if (window._cwWantedSave) { window._cwWantedSave = false; _cwLastQs = null; cwStat(''); gpQuietSave(); }
        cwWaiting(false);
        gpStepPaint();
      })
      .catch(function(){ window._cwLoadFailed = true; cwWaiting(false); cwStat('Your saved answers did not load, so nothing here saves. A reload tries again.', true); });
  }
</script>
