<!-- Version: V1.00 | Date: 2026-08-24 | LAST CHANGE: clean rebuild of My events, matching profile.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>My events</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<style>
  :root{
    --bg:#1F699E; --brand:#1F699E; --ink:#1A2E42; --soft:#4B5A6D; --muted:#6B7A8D;
    --line:#DDE4EE; --panel:#F7FBFF; --panel-line:#C9DFF3; --card:#fff;
    --err-bg:#FBE9E7; --err-line:#E8B0A5; --err-ink:#7A2410;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5;}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 20px 70px;}
  .hello{margin-bottom:16px;}
  h1{font-size:28px;font-weight:800;margin:0;color:#fff;letter-spacing:-.01em;}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .tab{background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:14px;padding:9px 16px;
    border-radius:22px;cursor:pointer;border:0;font-family:inherit;text-decoration:none;display:inline-block;}
  .tab:hover{background:rgba(255,255,255,.26);}
  .tab.on{background:#fff;color:var(--brand);}
  .tab:focus-visible{outline:2px solid #fff;outline-offset:2px;}

  .panel{background:var(--card);border-radius:16px;padding:26px 30px;min-height:280px;}
  .panel h2{font-size:21px;font-weight:800;margin:0 0 3px;}
  .panel .lead{color:var(--soft);font-size:14.5px;margin:0 0 20px;}

  .subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .subtabs.when{margin-bottom:20px;}
  .subtabs.when .subtab{font-size:12.5px;padding:6px 13px;}
  .subtab{background:var(--panel);border:1px solid var(--panel-line);color:var(--ink);font:inherit;
    font-size:13.5px;font-weight:700;padding:8px 15px;border-radius:20px;cursor:pointer;}
  .subtab.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .subtab:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  .ev{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;
    padding:15px 17px;margin-bottom:10px;text-decoration:none;color:inherit;cursor:pointer;}
  .ev:hover{background:var(--panel);border-color:var(--panel-line);}
  .ev .thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#DDE4EE;flex-shrink:0;}
  .ev .thumb.fallback{object-fit:contain;background:var(--panel);border:1px solid var(--panel-line);padding:7px;}
  .ev .nm{font-size:16px;font-weight:800;}
  .ev .when{font-size:13.5px;color:var(--soft);margin-top:3px;}
  .ev .where{font-size:13.5px;color:var(--muted);margin-top:2px;}
  .ev.past{opacity:.72;}

  .status{border-radius:10px;padding:12px 15px;font-size:14px;}
  .status.info{background:var(--panel);border:1px solid var(--panel-line);color:var(--soft);}
  .status.err{background:var(--err-bg);border:1px solid var(--err-line);color:var(--err-ink);}
  .empty{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;
    padding:22px;text-align:center;color:var(--soft);font-size:14.5px;}
  .empty .btn{margin-top:14px;}
  .btn{display:inline-block;background:var(--brand);color:#fff;border:0;padding:10px 18px;
    border-radius:24px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;}

  @media(max-width:640px){ .panel{padding:20px 18px;} h1{font-size:24px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="hello"><h1>My events</h1></div>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"><div class="status info">Loading your events…</div></div>
</div>

<script>
(function(){
  var GS_URL='https://cw-api-gate.jessieupp.workers.dev';
  var LOGO='https://raw.githubusercontent.com/2Gather-Network/events/main/images/2gather_logo.png';
  window._safeNavGo=function(el){try{var u=el&&el.getAttribute&&el.getAttribute('data-nav');if(u){window.location.href=u;}}catch(e){}return false;};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function P(k){try{return new URLSearchParams(location.search).get(k)||'';}catch(e){return '';}}
  var meId=(P('CWid')||P('id')||P('me')||P('memberCard')||P('appearId')||'').trim();
  function nrm(x){return String(x||'').split('.').join('').toLowerCase();}

  function go(u){ window.location.href=u; }
  var LINKS={
    profile:'https://creating.works/profile.html'+(meId?'?CWid='+encodeURIComponent(meId):''),
    groups:'https://gather.2gather.network/groups/host.html'+(meId?'?CWid='+encodeURIComponent(meId):''),
    browse:'https://gather.2gather.network/events.html'
  };
  function eventUrl(id){ return 'https://gather.2gather.network/myevents.html?id='+encodeURIComponent(id)+(meId?'&me='+encodeURIComponent(meId):''); }

  (function buildTabs(){
    var t=document.getElementById('tabs');
    [['My profile',LINKS.profile,false],['My events','',true]].forEach(function(x){
      var b=document.createElement('button'); b.type='button'; b.className='tab'+(x[2]?' on':''); b.textContent=x[0];
      if(!x[2]) b.onclick=function(){ go(x[1]); };
      t.appendChild(b);
    });
  })();

  // Dates arrive as ISO; times arrive on a 1899 placeholder date, so read their clock only.
  function fmtDate(iso){
    if(!iso) return '';
    var d=new Date(iso); if(isNaN(d)) return '';
    return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  }
  function fmtTime(iso){
    if(!iso) return '';
    var d=new Date(iso); if(isNaN(d)) return '';
    return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  }
  function whenLine(ev){
    var day=fmtDate(ev.date);
    if(!day) return 'Date to be announced';
    var s=fmtTime(ev.startTime), e=fmtTime(ev.endTime);
    return day+(s?(' · '+s+(e?(' – '+e):'')):'');
  }
  function isPast(ev){
    if(!ev.date) return false;
    var d=new Date(ev.date); if(isNaN(d)) return false;
    var today=new Date(); today.setHours(0,0,0,0);
    return d<today;
  }
  function card(ev){
    var img='<img class="thumb'+(ev.imageUrl?'':' fallback')+'" src="'+esc(ev.imageUrl||LOGO)+'" alt="">';
    var loc=ev.location||ev.venue||'';
    return '<a class="ev'+(isPast(ev)?' past':'')+'" role="link" tabindex="0" data-nav="'+esc(eventUrl(ev.id))+'" onclick="return _safeNavGo(this)">'
      +img+'<div style="flex:1;min-width:0;"><div class="nm">'+esc(ev.title||'Untitled event')+'</div>'
      +'<div class="when">'+esc(whenLine(ev))+'</div>'
      +(loc?'<div class="where">📍 '+esc(loc)+'</div>':'')
      +'</div></a>';
  }
  function split(evs){
    var up=evs.filter(function(e){return !isPast(e);});
    var past=evs.filter(isPast);
    up.sort(function(a,b){ return new Date(a.date||0)-new Date(b.date||0); });
    past.sort(function(a,b){ return new Date(b.date||0)-new Date(a.date||0); });
    return {upcoming:up, past:past};
  }

  var ATTENDING=[], HOSTING=[], view='attending', when='upcoming';
  function render(){
    var p=document.getElementById('panel');
    var browseBtn='<div><a class="btn" role="link" tabindex="0" data-nav="'+esc(LINKS.browse)+'" onclick="return _safeNavGo(this)">Browse events</a></div>';
    var parts=split(view==='attending'?ATTENDING:HOSTING);
    var shown=parts[when];
    var emptyMsg = (view==='attending')
      ? (when==='upcoming' ? 'No upcoming events you are registered for.' : 'No past events you attended.')
      : (when==='upcoming' ? 'No upcoming events you are hosting.' : 'No past events you hosted.');
    p.innerHTML=
      '<div class="subtabs">'
      +'<button type="button" class="subtab'+(view==='attending'?' on':'')+'" data-v="attending">Attending ('+ATTENDING.length+')</button>'
      +'<button type="button" class="subtab'+(view==='hosting'?' on':'')+'" data-v="hosting">Hosting ('+HOSTING.length+')</button>'
      +'</div>'
      +'<div class="subtabs when">'
      +'<button type="button" class="subtab'+(when==='upcoming'?' on':'')+'" data-w="upcoming">Upcoming ('+parts.upcoming.length+')</button>'
      +'<button type="button" class="subtab'+(when==='past'?' on':'')+'" data-w="past">Past ('+parts.past.length+')</button>'
      +'</div>'
      +(shown.length ? shown.map(card).join('') : '<div class="empty">'+esc(emptyMsg)+browseBtn+'</div>');
    p.querySelectorAll('.subtab[data-v]').forEach(function(b){
      b.onclick=function(){ view=b.getAttribute('data-v'); render(); };
    });
    p.querySelectorAll('.subtab[data-w]').forEach(function(b){
      b.onclick=function(){ when=b.getAttribute('data-w'); render(); };
    });
  }

  if(!meId){
    document.getElementById('panel').innerHTML='<div class="status err">This page needs your profile link. Open it from your profile or your group page so it knows who you are.</div>';
    return;
  }
  // The events payload is edge-cached and fast; registrations are slow, so both go out at once.
  var pEvents=fetch(GS_URL+'?t='+Date.now()).then(function(r){return r.json();}).catch(function(){return null;});
  var pRegs=fetch(GS_URL+'?action=getRegistrations&appearId='+encodeURIComponent(meId)).then(function(r){return r.json();}).catch(function(){return null;});
  Promise.all([pEvents,pRegs]).then(function(res){
    var ed=res[0], rd=res[1];
    if(!ed || !ed.events){
      document.getElementById('panel').innerHTML='<div class="status err">Could not load events. Reload the page to try again.</div>';
      return;
    }
    var byId={};
    ed.events.filter(function(e){return e && e.id;}).forEach(function(e){ byId[String(e.id).trim()]=e; });
    // Latest registration row per event wins, so a re-registration undoes an earlier cancel.
    var latest={};
    ((rd&&rd.registrations)||[]).forEach(function(r){
      var eid=String(r.eventId||'').trim(); if(!eid) return;
      var prev=latest[eid];
      if(!prev || new Date(r.timestamp||0)>=new Date(prev.timestamp||0)) latest[eid]=r;
    });
    // Recurring registrations carry a generated id (recurring-<slug>-<date>) that matches no
    // row, so resolve them back to their rec- template and show the occurrence date.
    var bySlug={};
    ed.events.forEach(function(e){
      if(e && e.id && String(e.id).indexOf('rec-')===0 && e.title){
        bySlug[String(e.title).toLowerCase().replace(/\s+/g,'-')]=e;
      }
    });
    function resolve(eid){
      if(byId[eid]) return byId[eid];
      if(eid.indexOf('recurring-')!==0) return null;
      var date=eid.slice(-10), slug=eid.slice('recurring-'.length, eid.length-11);
      var tmpl=bySlug[slug]; if(!tmpl) return null;
      var occ={}; for(var k in tmpl){ occ[k]=tmpl[k]; }
      occ.id=eid; occ.date=date+'T00:00:00';
      return occ;
    }
    Object.keys(latest).forEach(function(eid){
      var r=latest[eid];
      var cancelled=(r.cancelled===true||String(r.cancelled).toLowerCase()==='true');
      if(cancelled) return;
      var ev=resolve(eid);
      if(ev) ATTENDING.push(ev);
    });
    // Hosted events are identified by the member id inside hostlink; userID is blank on these
    // rows. Dedupe by id, since the same event can appear more than once in the sheet.
    var me=nrm(meId), seenHost={};
    ed.events.forEach(function(e){
      if(!e || !e.id) return;
      if(nrm(e.userID)!==me && nrm(e.hostlink).indexOf(me)===-1) return;
      var k=String(e.id).trim(); if(seenHost[k]) return; seenHost[k]=1;
      HOSTING.push(e);
    });
    render();
  });
})();
</script>
</body>
</html>
