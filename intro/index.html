<style>
  :root{
    --bg:#1F699E; --brand:#1F699E; --ink:#1A2E42; --soft:#4B5A6D; --muted:#6B7A8D;
    --line:#DDE4EE; --panel:#F7FBFF; --panel-line:#C9DFF3; --card:#fff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5;}

  .wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px;}
  .layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start;}

  .head{margin-bottom:16px;}
  h1{font-size:26px;font-weight:800;margin:0;color:#fff;}
  .head .sub{color:#fff;opacity:.92;font-size:15px;margin-top:6px;max-width:62ch;}

  .btn{display:inline-block;background:#fff;color:var(--brand);border:0;padding:11px 20px;border-radius:26px;
    font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;}
  .btn.solid{background:var(--brand);color:#fff;}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--panel-line);}

  .tabs{background:#fff;border-radius:14px;padding:12px;height:fit-content;
    display:flex;flex-direction:column;gap:6px;}
  .tab{display:block;width:100%;text-align:left;background:#fff;color:var(--brand);
    border:1.5px solid #C9D6E2;border-radius:9px;font-family:inherit;font-size:14px;
    font-weight:700;padding:11px 14px;cursor:pointer;line-height:1.25;}
  .tab:hover{background:var(--panel);}
  .tab.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .tab.on:hover{background:var(--brand);}
  .tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  .tab span{display:block;font-size:12px;font-weight:600;opacity:.75;margin-top:2px;}

  .panel{background:var(--card);border-radius:14px;padding:12px 30px 28px;min-height:280px;}
  .panel h2{font-size:22px;font-weight:800;margin:6px 0 3px;}
  .panel .lead{color:var(--soft);font-size:14.5px;margin:0 0 22px;max-width:64ch;}

  .f{margin-bottom:22px;}
  .f label,.f .lab{display:block;font-size:15px;font-weight:800;color:var(--ink);margin-bottom:2px;}
  .f .help{font-size:13.5px;color:var(--soft);margin-bottom:8px;max-width:64ch;}
  .f input[type=text],.f input[type=email],.f textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
    font:inherit;color:var(--ink);background:#fff;}
  .f textarea{min-height:84px;resize:vertical;}
  .f input:focus,.f textarea:focus{outline:2px solid var(--panel-line);outline-offset:1px;border-color:var(--brand);}

  .choice{display:flex;gap:8px;flex-wrap:wrap;}
  .choice button{background:#fff;color:var(--brand);border:1.5px solid #C9D6E2;border-radius:9px;
    font:inherit;font-size:14px;font-weight:700;padding:9px 16px;cursor:pointer;}
  .choice button.on{background:var(--brand);color:#fff;border-color:var(--brand);}

  .picks{display:flex;flex-direction:column;gap:16px;margin-bottom:8px;}
  .pick{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start;}
  .pick button{background:#fff;color:var(--brand);border:1.5px solid #C9D6E2;border-radius:9px;
    font:inherit;font-size:14px;font-weight:700;padding:11px 16px;text-align:left;cursor:pointer;}
  .pick button.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .pick button:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  .pick .gray{font-size:13.5px;color:var(--muted);padding-top:2px;max-width:60ch;}
  .addrow{display:flex;gap:10px;flex-wrap:wrap;}
  .addrow input{flex:1 1 240px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--panel-line);
    border-radius:16px;padding:6px 8px 6px 14px;font-size:14px;font-weight:700;color:var(--brand);}
  .chip button{background:none;border:0;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;padding:0 2px;}
  .none{font-size:13.5px;color:var(--muted);}

  .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}

  .rv{margin-bottom:22px;}
  .rv .t{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .rv .q{font-size:14px;font-weight:700;color:var(--ink);}
  .rv .a{font-size:14.5px;color:var(--soft);margin:2px 0 12px;white-space:pre-wrap;}
  .rv .a.empty{color:var(--muted);font-style:italic;}
  .infobox{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:18px 20px;margin-bottom:14px;}
  .infobox .t{font-size:15.5px;font-weight:800;margin-bottom:4px;}
  .infobox .d{font-size:14px;color:var(--soft);}
  
  .cw-loading{display:inline-flex;align-items:center;gap:8px;background:#1F699E;color:#fff;
    font-size:13px;font-weight:700;padding:8px 16px;border-radius:20px;white-space:nowrap;
    animation:cw-breathe 2.3s ease-in-out infinite;}   
  @keyframes cw-breathe{0%,100%{opacity:1}50%{opacity:.62}}
  .tick{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);margin:0 0 12px;cursor:pointer;}
  .tick input{width:18px;height:18px;flex-shrink:0;margin:2px 0 0;accent-color:var(--brand);}
  .tick a{color:var(--brand);font-weight:700;}
  .say{font-size:14px;margin-top:12px;}
  
  .au-g{display:flex;justify-content:center;min-height:44px;}
  .au-gwait{display:flex;justify-content:center;margin-top:12px;}
  .au-gwait[hidden]{display:none;}
  .au-gor{display:flex;align-items:center;gap:10px;color:#8A97A6;font-size:13px;margin:16px 0 18px;}
  .au-gor::before,.au-gor::after{content:"";flex:1;height:1px;background:#DDE3EA;}
  
  .au-col{max-width:440px;margin:0 auto;text-align:center;}
  .au-col .acts{justify-content:center;}
  .au-col .f,.au-col .tick{text-align:left;}
  .au-col .f.au-mid{text-align:center;}
  .au-col .f.au-mid input{margin:0 auto;}
  .say.bad{color:#7A2410;}
  .say.ok{color:var(--soft);}
  .quiet{font-size:13.5px;color:var(--muted);margin-top:18px;}
  .savestat{font-size:13.5px;color:var(--muted);font-weight:600;}
  .quiet a{color:var(--brand);font-weight:700;cursor:pointer;}

  @media(max-width:860px){
    .layout{grid-template-columns:1fr;}
    
    .tabs{flex-direction:row;flex-wrap:wrap;}
    .tab{width:auto;flex:1 1 40%;}
    .pick{grid-template-columns:1fr;gap:6px;}
  }
  @media(max-width:760px){
    .panel{padding:12px 18px 22px;}
    h1{font-size:24px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>Start a conversation</h1>
    <div class="sub">Answer what you can and we will take it from there together.</div>
  </div>

  <div class="layout">
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel"></div>
  </div>

</div>

<script>
(function(){

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function P(k){try{return new URLSearchParams(location.search).get(k)||'';}catch(e){return '';}}

  var GS_URL='https://cw-api-gate.jessieupp.workers.dev';
  var signedId='';
  function whoId(){
    if(signedId) return signedId;
    try{ if(window.CW&&CW.realMe){ var r=CW.realMe(); return r.known?r.id:''; } }catch(e){}
    return '';
  }
  function signed(){ return !!whoId(); }
  function viewing(){ try{ return !!(window.CW && CW.me && CW.me().viewing); }catch(e){ return false; } }
  function readId(){ try{ return viewing() ? CW.me().id : whoId(); }catch(e){ return whoId(); } }
  function viewerParam(){ return viewing() ? '&viewer='+encodeURIComponent(whoId()) : ''; }
  function viewedName(){ try{ return String(sessionStorage.getItem('cw-view-as-name')||'').trim(); }catch(e){ return ''; } }
  function norm(id){ return String(id||'').split('.').join('').toLowerCase(); }
  function draftKey(){ return 'cw-inquiry-draft-'+norm(whoId()); }
  try{ localStorage.removeItem('cw-inquiry-draft'); }catch(e){}
  var A={path:'',sent_build:'',sent_work:'',edited_build:'',edited_work:'',
         base_build:'',base_work:'',seen_build:'',seen_work:'',choices:[],
         building:'',forWhom:'',serves:'',asking:'',orgDoes:'',first:'',who:[],person:'',group:'',gather:'',
         needFor:[],needMore:'',offer:'',values:'',how:'',setting:'',scale:'',conditions:'',tools:'',want:'',enjoy:'',contribution:''};
  var BLANK=JSON.stringify(A);
  function loadDraft(){
    var chosen=A.path;
    A=JSON.parse(BLANK);
    if(signed() && !viewing()){
      try{ var saved=JSON.parse(localStorage.getItem(draftKey())||'null'); if(saved) for(var k in A){ if(saved[k]!=null) A[k]=saved[k]; } }catch(e){}
    }
    if(chosen) A.path=chosen;
    if(!Array.isArray(A.who)) A.who=[];
    if(!Array.isArray(A.needFor)) A.needFor=[];
    A.needFor=A.needFor.map(function(n){ return n==='Passing time' ? 'Enjoying my time' : (n==='Impact' ? 'Values-aligned' : n); });
  }
  loadDraft();
  function keep(){ if(!signed() || viewing()) return; try{ localStorage.setItem(draftKey(),JSON.stringify(A)); }catch(e){} }

  var PATHS={
    build:[
      {key:'picture', label:'The big picture'},
      {key:'who',     label:'Who you serve'},
      {key:'help',    label:'What would help'},
      {key:'review',  label:'Your answers'}
    ],
    work:[
      {key:'bring',   label:'What you bring'},
      {key:'need',    label:'What you need'},
      {key:'fits',    label:'Where it fits'},
      {key:'suits',   label:'What suits you'},
      {key:'review',  label:'Your answers'}
    ]
  };
  function parts(){ return [{key:'start',label:'Start'}].concat(signed()?(PATHS[A.path]||[]):[]); }
  function firstPart(){ return A.path&&PATHS[A.path] ? PATHS[A.path][0].key : 'start'; }
  var needChoices=[];
  function needOptions(){
    var l=needChoices.slice();
    A.needFor.forEach(function(n){ if(l.indexOf(n)<0) l.push(n); });
    return l;
  }
  function joinChoices(l){
    if(l.length<2) return l.join('');
    if(l.length===2) return l[0]+' and '+l[1];
    if(l.length===3) return l[0]+', '+l[1]+', and '+l[2];
    return l.join(' / ');
  }

  function area(key,lab,help,ph){
    return '<div class="f"><label for="q-'+key+'">'+esc(lab)+'</label>'
      +'<div class="help">'+esc(help)+'</div>'
      +'<textarea id="q-'+key+'" data-a="'+key+'" placeholder="'+esc(ph)+'">'+esc(A[key])+'</textarea></div>';
  }
  function acts(back,next,extra){
    return '<div class="acts" style="align-items:center;">'
      +(back?'<button type="button" class="btn ghost" data-go="'+back+'">Back</button>':'')
      +(next?'<button type="button" class="btn solid" data-go="'+next+'">Next</button>':'')
      +(extra||'')
      +'<span class="savestat" id="save-stat">'+esc(saveText)+'</span>'
      +'</div>';
  }

  function renderPanel(key){
    var p=document.getElementById('panel');

    if(key==='start'){
      p.innerHTML='<h2>What brings you here?</h2>'
        +'<p class="lead">Each one asks its own questions. Pick the one closest to where you are and change it whenever you like.</p>'
        +'<div class="picks">'
          +'<div class="pick"><button type="button" data-path="build"'+(A.path==='build'?' class="on"':'')+'>Building something</button>'
            +'<div class="gray">It can be a business, a project, or a nonprofit. The questions are about what you are building and the people it serves.</div></div>'
          +'<div class="pick"><button type="button" data-path="work"'+(A.path==='work'?' class="on"':'')+'>Finding work</button>'
            +'<div class="gray">It can be full-time or part-time work, gigs, or your own clients and customers. The questions are about you and the work that would suit you.</div></div>'
        +'</div>'
        +(signed()?'<p class="quiet" id="who-line">'+whoLine()+'</p>':'');
      p.querySelectorAll('[data-path]').forEach(function(b){
        b.onclick=function(){ A.path=b.getAttribute('data-path'); keep(); if(A.path==='work' && signed()){ toNewWork(); return; } show(firstPart()); };
      });
      if(signed() && !knownName()) waitForName();
      bindSignOut();
      return;
    }

    else if(key==='signin'){ renderSignin(p); return; }

    else if(key==='need'){
      p.innerHTML='<h2>What you need</h2>'
        +'<p class="lead">Tell us what you need right now and put it your own way.</p>'
        +(needOptions().length
          ? '<div class="f"><div class="lab">What would work give you?</div>'
            +'<div class="help">Pick as many as fit and add your own below.</div>'
            +'<div class="choice">'+needOptions().map(function(n){
              return '<button type="button" data-need="'+esc(n)+'"'+(A.needFor.indexOf(n)>-1?' class="on"':'')+'>'+esc(n)+'</button>';
            }).join('')+'</div></div>'
          : '')
        +area('needMore','Anything else','Say it in your own words, as much or as little as you like.',
              'Example: Steady income while I figure out what comes next')
        +acts('bring','fits');
      p.querySelectorAll('[data-need]').forEach(function(b){
        b.onclick=function(){
          var n=b.getAttribute('data-need'), i=A.needFor.indexOf(n);
          if(i>-1) A.needFor.splice(i,1); else A.needFor.push(n);
          changed();
          b.classList.toggle('on',i<0); keep();
        };
      });
    }

    else if(key==='bring'){
      p.innerHTML='<h2>What you bring</h2>'
        +'<p class="lead">Start with what you have to offer - somebody paying you means you have something to provide.</p>'
        +area('offer','What do you have to offer?','Name your superpowers - the ones people already seek out.',
              'Example: I can calm a room and get people talking')
        +area('values','What do you value?','Tell us what matters to you when you picture a good day.',
              'Example: Kindness, time outdoors, and work that helps somebody')
        +area('how','What ways of working bring out your best?','Think about your pace, your setting, and the company you keep.',
              'Example: One to one, with time to prepare')
        +acts('start','need');
    }

    else if(key==='fits'){
      p.innerHTML='<h2>Where it fits</h2>'
        +'<p class="lead">Picture the place where what you offer lands.</p>'
        +area('setting','In what setting?','Describe the place you picture and the people who share it.',
              'Example: A small team in my own neighborhood')
        +area('scale','At what scale?','Say how big you picture it, whether a handful of people or a whole organization.',
              'Example: A handful of people I see every week')
        +area('conditions','Under what conditions?','Name any limits you have or say there are none.',
              'Example: Mornings only and close to a bus line')
        +area('tools','Using what tools?','List the tools and instruments you like using.',
              'Example: A laptop, a kitchen, or a camera')
        +acts('need','suits');
    }

    else if(key==='suits'){
      p.innerHTML='<h2>What suits you</h2>'
        +'<p class="lead">Set need aside for a moment and imagine what would suit you.</p>'
        +area('want','What would you want?','Describe what you would choose if the choice were fully yours.',
              'Example: Work where I set my own hours and learn something new')
        +area('enjoy','What would you enjoy?','Think about the moments in a day that feel good.',
              'Example: Teaching, cooking for people, and being outside')
        +area('contribution','What would bring out your greatest contribution?','Name what would let you give everything you have.',
              'Example: Bringing strangers together until they feel like neighbors')
        +acts('fits','review');
    }

    else if(key==='picture'){
      p.innerHTML='<h2>The big picture</h2>'
        +'<p class="lead">Start by telling it your way.</p>'
        +area('building','What are you building?','It can be anything you are starting, standing up, or offering.',
              'Example: A leadership program for people working anywhere in our county')
        +area('forWhom','Who do you picture using it?','Include the people it serves as well as the ones using it.',
              'Example: Emerging leaders from business, government, and nonprofits')
        +area('serves','What does it serve?','A purpose names what you are making, who it serves, and the higher contribution it makes.',
              'Example: A county where leaders in every sector know each other well')
        +'<div class="f"><div class="lab">Who is asking?</div>'
          +'<div class="help">Are you working for yourself or are you representing a team within an organization?</div>'
          +'<div class="choice" id="asking">'
            +'<button type="button" data-ask="org"'+(A.asking==='org'?' class="on"':'')+'>An organization</button>'
            +'<button type="button" data-ask="me"'+(A.asking==='me'?' class="on"':'')+'>Myself</button>'
          +'</div></div>'
        +'<div id="org-q">'+(A.asking==='org'
          ? area('orgDoes','What does your organization do?','Say who you serve and how you serve them.',
                 'Example: We run a leadership program for the whole county, across industry and government')
          : '')+'</div>'
        +area('first','What do you picture it doing first?','List the first few things you would want it to do.',
              'Example: Keep each cohort connected after graduation')
        +acts('start','who');
      bindAsking();
    }

    else if(key==='who'){
      p.innerHTML='<h2>Who you serve</h2>'
        +'<p class="lead">A constituency is any group of people or organizations your work touches. List every one you can name.</p>'
        +'<div class="f"><label for="who-in">Add a constituency</label>'
          +'<div class="help">Think about where each person comes from, which organization sent them, and what drives them.</div>'
          +'<div class="addrow"><input type="text" id="who-in" placeholder="Example: Alumni of the program">'
          +'<button type="button" class="btn solid" id="who-add">Add</button></div>'
          +'<div class="chips" id="who-list"></div></div>'
        +'<p class="lead" style="margin-top:-6px;">Each one sets its own context and we take them one at a time when we talk.</p>'
        +acts('picture','help');
      renderWho();
      var inp=document.getElementById('who-in');
      document.getElementById('who-add').onclick=addWho;
      inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addWho(); } });
    }

    else if(key==='help'){
      p.innerHTML='<h2>What would help</h2>'
        +'<p class="lead">What would you like every person in every constituency to have?</p>'
        +area('person','For each person on their own','Start with what one person needs to take part and to give back.',
              'Example: A profile that shows what they offer and what they are looking for')
        +area('group','For their group or peers','Picture a cohort, a team, or a circle of peers and what they need together.',
              'Example: A private alumni group where needs and offers find each other')
        +area('gather','When they gather','Include their meetings, convenings, and conferences.',
              'Example: One place to sign up for the annual conference and see who is coming')
        +acts('who','review');
    }

    else {
      var rows=function(list){
        return list.map(function(r){
          var v=String(r[1]||'').trim();
          return '<div class="q">'+esc(r[0])+'</div><div class="a'+(v?'':' empty')+'">'+(v?esc(v):'Not answered yet')+'</div>';
        }).join('');
      };
      if(A.path==='work'){
        p.innerHTML='<h2>Your answers</h2>'
          +'<p class="lead">Every answer you gave is gathered here and any part on the left opens again to change it.</p>'
          +'<div class="rv"><div class="t">What you bring</div>'+rows([
              ['What do you have to offer?',A.offer],['What do you value?',A.values],['What ways of working bring out your best?',A.how]])+'</div>'
          +'<div class="rv"><div class="t">What you need</div>'+rows([
              ['What would work give you?',joinChoices(A.needFor)],['Anything else',A.needMore]])+'</div>'
          +'<div class="rv"><div class="t">Where it fits</div>'+rows([
              ['In what setting?',A.setting],['At what scale?',A.scale],['Under what conditions?',A.conditions],['Using what tools?',A.tools]])+'</div>'
          +'<div class="rv"><div class="t">What suits you</div>'+rows([
              ['What would you want?',A.want],['What would you enjoy?',A.enjoy],['What would bring out your greatest contribution?',A.contribution]])+'</div>'
          +'<div class="infobox"><div class="t">What happens next</div>'
            +'<div class="d">The person who invited you or someone from Creating.Works will reach out and look at this together.</div></div>'
          +acts('suits','',sendButton())+invites();
        bindCommon(p); return;
      }
      var pic=[['What are you building?',A.building],['Who do you picture using it?',A.forWhom],['What does it serve?',A.serves],
               ['Who is asking?',A.asking==='org'?'An organization':(A.asking==='me'?'Myself':'')]];
      if(A.asking==='org') pic.push(['What does your organization do?',A.orgDoes]);
      pic.push(['What do you picture it doing first?',A.first]);
      p.innerHTML='<h2>Your answers</h2>'
        +'<p class="lead">Every answer you gave is gathered here and any part on the left opens again to change it.</p>'
        +'<div class="rv"><div class="t">The big picture</div>'+rows(pic)+'</div>'
        +'<div class="rv"><div class="t">Who you serve</div>'
          +(A.who.length
            ? '<div class="chips" style="margin-top:0;">'+A.who.map(function(w){ return '<span class="chip" style="padding-right:14px;">'+esc(w)+'</span>'; }).join('')+'</div>'
            : '<div class="a empty">None listed yet</div>')
        +'</div>'
        +'<div class="rv"><div class="t">What would help</div>'+rows([

    if(auth.mode==='up'){
      if(!document.getElementById('au-agree').checked){ say('Tick the box to agree to the terms.'); return; }
      if(!document.getElementById('au-18').checked){ say('An account here is for people 18 or older.'); return; }
    }
    auth.step=2; renderSignin(document.getElementById('panel')); fireSend();
  }
  function fireSend(){
    var u=GS_URL+'?action=sendSigninPin&from=creatingworks'
      +(auth.mode==='up'?'&signup=1&terms=1&age=1&first='+encodeURIComponent(auth.first)+'&last='+encodeURIComponent(auth.last):'')
      +'&email='+encodeURIComponent(auth.email);
    fetch(u).then(function(r){ return r.json(); }).then(function(){
      var s=document.getElementById('au-sent');
      if(s){ s.className='lead'; s.textContent='We sent a six digit code to '+auth.email+'. It expires in fifteen minutes.'; }
    }).catch(function(){
      auth.step=1; renderSignin(document.getElementById('panel'));
      say('The code did not send and your connection is the first thing to check.');
    });
  }
  function verifyCode(){
    var c=(document.getElementById('au-code').value||'').trim();
    if(c.length<6){ say('The code is six digits.'); return; }
    var b=document.getElementById('au-verify'); b.disabled=true;
    say('');
    var s=document.getElementById('au-sent'); if(s){ s.className=''; s.innerHTML='<span class="cw-loading">Checking your code</span>'; }
    fetch(GS_URL+'?action=verifySigninPin&from=creatingworks&email='+encodeURIComponent(auth.email)+'&code='+encodeURIComponent(c))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d&&d.status==='ok'&&d.appearId){
          signedInAs(d, auth.mode==='up'?auth.first:'', auth.mode==='up'?auth.last:'');
          return;
        }
        b.disabled=false;
        if(s){ s.className='lead'; s.textContent='We sent a six digit code to '+auth.email+'. It expires in fifteen minutes.'; }
        say((d&&d.message)||'That code did not match and Send another brings a fresh one.');
      })
      .catch(function(){
        b.disabled=false;
        if(s){ s.className='lead'; s.textContent='We sent a six digit code to '+auth.email+'. It expires in fifteen minutes.'; }
        say('The code did not check and your connection is the first thing to look at.');
      });
  }
  function signedInAs(d, first, last){
    try{
      if(window.CW&&CW.remember) CW.remember(d.appearId);
      localStorage.setItem('cw-id',d.appearId);
      localStorage.setItem('appear-id',d.appearId);
      if(first){
        localStorage.setItem('cw-first',first);
        localStorage.setItem('cw-name-'+d.appearId,(first+' '+(last||'')).trim());
      }
      if(d.name) localStorage.setItem('cw-name-'+d.appearId,String(d.name).trim());
      if(d.name){ localStorage.setItem('cw-name',String(d.name).trim()); localStorage.setItem('cw-name-for',d.appearId); window.CW_NAME=String(d.name).trim(); }
      if(d.photo){
        localStorage.setItem('cw-photo',d.photo); localStorage.setItem('cw-photo-for',d.appearId);
        localStorage.setItem('cw-photo-at',String(Date.now())); window.CW_TOPBAR_PHOTO=d.photo;
      }
      if(d.editToken){
        localStorage.setItem('cw-token',d.editToken);
        var exp=parseInt(String(d.editToken).split('.')[1],10);
        if(!exp||exp<Date.now()) exp=Date.now()+60*60*1000;
        localStorage.setItem('cw-edit-'+norm(d.appearId),JSON.stringify({t:d.editToken,exp:exp}));
      }
    }catch(e){}
    signedId=d.appearId;
    allP=null; allData=null;
    try{ if(window.CW_REDRAW_BAR) window.CW_REDRAW_BAR(); }catch(e){}
    loadDraft(); keep();
    auth={mode:'',step:1,email:'',first:'',last:''};
    if(A.path==='work'){ toNewWork(); return; }
    show(current&&isForm(current)&&current!=='signin'?current:firstPart());
  }
  function nameKey(){ return 'cw-name-'+whoId(); }
  function knownName(){
    try{
      var own=String(localStorage.getItem(nameKey())||'').trim();
      if(own) return own;
      if(norm(localStorage.getItem('cw-name-for'))===norm(whoId())) return String(localStorage.getItem('cw-name')||'').trim();
    }catch(e){}
    return '';
  }
  function whoLine(){
    if(viewing()){ var vn=viewedName(); return 'You are viewing '+(vn?esc(vn)+'\u2019s':'their')+' answers and nothing here can be changed.'; }
    var n=knownName();
    return (n?'Signed in as '+esc(n)+'. ':'')+'Not you? <a role="link" tabindex="0" id="sign-out">Sign out.</a>';
  }
  function waitForName(){
    if(!window.CW_SHOW_BAR){ fetchName(); return; }
    var tries=0, t=setInterval(function(){
      tries++;
      if(knownName()){ clearInterval(t); if(current==='start'){ var el=document.getElementById('who-line'); if(el){ el.innerHTML=whoLine(); bindSignOut(); } } }
      else if(tries>40) clearInterval(t);
    }, 1500);
  }
  var _nameAsked=false;
  function fetchName(){
    if(_nameAsked) return; _nameAsked=true;
    var id=whoId(); if(!id) return;
    fetch(GS_URL+'?action=lookupProfile&appearId='+encodeURIComponent(id))
      .then(function(r){ return r.json(); })
      .then(function(d){
        var n=String((d&&d.found&&d.name)||'').trim();
        if(!n || whoId()!==id) return;
        try{ localStorage.setItem('cw-name-'+id,n); }catch(e){}
        if(current==='start'){ var el=document.getElementById('who-line'); if(el){ el.innerHTML=whoLine(); bindSignOut(); } }
      }).catch(function(){});
  }
  function bindSignOut(){
    var so=document.getElementById('sign-out');
    if(so) so.onclick=function(){
      try{ if(window.CW&&CW.forget) CW.forget(); }catch(e){}
      signedId=''; _nameAsked=false; loaded={}; dirty=false; allP=null; allData=null; setSave(''); A=JSON.parse(BLANK); auth={mode:'',step:1,email:'',first:'',last:''}; show('start');
    };
  }
  window._safeNavGo=window._safeNavGo||function(el){try{var u=el&&el.getAttribute&&el.getAttribute('data-nav');if(u){window.location.href=u;}}catch(e){}return false;};

  var current='start';
  function railParts(active){
    if(active==='start' || active==='signin' || A.path==='work') return [{key:'start',label:'Start'}];
    return parts();
  }
  function buildTabs(active){
    var t=document.getElementById('tabs'); t.innerHTML='';
    railParts(active).forEach(function(s){
      var b=document.createElement('button'); b.type='button';
      b.className='tab'+((s.key===active||(active==='signin'&&s.key==='start'))?' on':'');
      b.textContent=s.label;
      if(s.key==='who' && A.who.length){
        var c=document.createElement('span'); c.textContent=A.who.length+' listed'; b.appendChild(c);
      }
      b.onclick=function(){ show(s.key); };
      t.appendChild(b);
    });
  }
  function show(key){
    if(key!=='start' && key!=='signin' && !signed()) key = A.path ? 'signin' : 'start';
    if(dirty && isForm(current)) save(false);
    setAddress(key);
    if(isForm(key) && !loaded[A.path]){
      if(!viewing() && A['seen_'+A.path] && token()){ openFromDevice(A.path); }
      else { current=key; buildTabs(key); loadThen(key); return; }
    }
    current=key; buildTabs(key); renderPanel(key);
    if(viewing() && isForm(key)) lockForViewing();
  }
  function toNewWork(replace){ try{ if(replace) location.replace('/work/'); else location.href='/work/'; }catch(e){} }
  function lockForViewing(){
    var p=document.getElementById('panel');
    p.querySelectorAll('textarea,input').forEach(function(el){ el.readOnly=true; el.disabled=true; });
    p.querySelectorAll('[data-need],[data-ask],[data-drop],#who-add').forEach(function(b){ b.disabled=true; b.style.cursor='default'; });
    var vn=viewedName();
    var note=document.createElement('p');
    note.className='lead'; note.style.cssText='background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:10px 14px;';
    note.textContent='You are viewing '+(vn?vn+'\u2019s':'their')+' answers and nothing here can be changed.';
    p.insertBefore(note, p.firstChild);
  }
  function setAddress(key){
    try{
      var target=urlFor(key);
      var same=location.pathname===target && !location.search;
      if(_navQuiet || same) history.replaceState(null,'',target); else history.pushState(null,'',target);
    }catch(e){}
  }
  function slugOf(k){ return k==='review' ? 'answers' : k; }
  function keyOf(s){ return s==='answers' ? 'review' : s; }
  function urlFor(key){ return (key==='start' || !A.path) ? '/intro/' : '/'+A.path+'/'+slugOf(key); }
  function readRoute(){
    var p=P('to') || location.pathname;
    var m=String(p).match(/^\/(build|work)(?:\/([a-z]+))?\/?$/);
    if(m) return { path:m[1], part: m[2] ? keyOf(m[2]) : '' };
    var lp=P('path'), lk=P('part');
    return { path: PATHS[lp] ? lp : '', part: lk ? keyOf(lk) : '' };
  }
  var _navQuiet=true;
  window.addEventListener('popstate',function(){
    var r=readRoute();
    if(r.path==='work' && signed()){ toNewWork(true); return; }
    if(PATHS[r.path]) A.path=r.path;
    var k=r.part || (r.path ? firstPart() : 'start');
    if(k==='signin' && signed()) k='start';
    if(k!=='signin' && !parts().some(function(s){ return s.key===k; })) k='start';
    _navQuiet=true; show(k); _navQuiet=false;
  });
  window.addEventListener('pageshow',function(e){ if(e.persisted) location.reload(); });

  var route=readRoute();
  var askPath=route.path; if(PATHS[askPath]){ A.path=askPath; keep(); }
  if(askPath==='work' && signed()){ toNewWork(true); return; }
  if(A.path==='work' && askPath!=='work'){ A.path=''; keep(); }
  var start=route.part;
  if(parts().some(function(s){ return s.key===start; })) show(start);
  else show(A.path && askPath ? PATHS[A.path][0].key : 'start');
  _navQuiet=false;
  if(signed()) fetchAll();
})();
</script>
<script>window.CW_SHOW_BAR = true;</script>
<script>try{localStorage.removeItem('cw-super')}catch(e){}</script>
<script src="https://2gather.network/nav/topbar.js?v=6.27" defer></script>
</body>
