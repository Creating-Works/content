<!-- Version: V2.39 | Date: 2026-07-05 | LAST CHANGE: Path A - Retired toggle, postal after skills, Person/Space/Thing seeking reframe, multi-select confirmed -->
<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community profile</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#1F699E;--card:#FFFFFF;--text:#1A2E42;--soft:#4A6080;--muted:#6A8FAF;--brand:#1F699E;--border:#DDE4EE;--input-bg:#F7F9FC;--hover:#185885;--ph:#B8CCDE;--sel-bg:#EBF3FA;--sel-border:#1F699E;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;padding:40px 20px 60px;color:var(--text);}
    @keyframes spin{to{transform:rotate(360deg);}}
    .card{background:var(--card);max-width:660px;margin:0 auto;border-radius:16px;padding:52px;box-shadow:0 24px 64px rgba(0,0,0,0.25),0 4px 16px rgba(0,0,0,0.12);position:relative;}
    @media(max-width:520px){.card{padding:32px 20px;}}
    /* Top right */
    .top-right-area{position:absolute;top:20px;right:20px;display:flex;align-items:center;gap:6px;z-index:10;}
    .ikigai-btn{display:flex;align-items:center;gap:8px;background:var(--sel-bg);border:1.5px solid var(--sel-border);border-radius:24px;padding:6px 14px 6px 6px;font-size:13px;font-weight:600;color:var(--brand);cursor:pointer;font-family:'DM Sans',sans-serif;transition:background 0.15s;}
    .ikigai-btn:hover{background:#d6eaf8;}
    .btn-photo{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--sel-border);background:var(--input-bg);display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden;flex-shrink:0;}
    .btn-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
    .share-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--sel-border);background:var(--sel-bg);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;transition:background 0.15s;}
    .share-btn:hover{background:#d6eaf8;}
    .footer{text-align:center;margin-top:20px;}
    .footer a{color:white;font-size:13px;text-decoration:none;opacity:0.85;font-family:'DM Sans',sans-serif;}
    h2{font-size:20px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:16px;margin-top:20px;}
    hr{border:none;border-top:1px solid var(--border);margin:20px 0;}
    label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px;font-weight:500;}
    input[type="text"]{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text);outline:none;transition:border-color 0.2s;}
    input[type="text"]:focus{border-color:var(--brand);}
    input[type="text"]::placeholder{color:var(--ph);}
    select{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text);outline:none;}
    /* Progress */
    .progress-wrap{margin-bottom:28px;padding-top:8px;}
    .progress-steps{display:flex;gap:6px;margin-bottom:8px;}
    .progress-step{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background 0.3s;}
    .progress-step.done{background:var(--brand);}
    .progress-label{font-size:12px;color:var(--muted);}
    /* Breadcrumb */
    .breadcrumb-nav{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;}
    .breadcrumb-link{color:var(--brand);cursor:pointer;font-weight:500;text-decoration:underline;}
    .breadcrumb-link:hover{text-decoration:underline;}
    /* Category chips grid */
    .cat-chips-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
    .cat-chip{padding:10px 14px;border-radius:20px;border:1.5px solid var(--border);background:white;font-size:13px;color:var(--soft);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;text-align:center;}
    .cat-chip:hover{border-color:var(--brand);color:var(--brand);}
    .cat-chip.selected{background:var(--brand);border-color:var(--brand);color:white;font-weight:600;}
    /* Sub chips */
    .sub-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
    /* sub-chip style defined below */
    .sub-chip:hover{border-color:var(--brand);color:var(--brand);}
    .sub-chip.selected{background:var(--brand);border-color:var(--brand);color:white;font-weight:500;}
    /* Item chips */
    .item-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
    .item-chip{padding:6px 13px;border-radius:18px;border:1.5px solid var(--border);background:white;font-size:12px;color:var(--soft);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
    .item-chip:hover{border-color:var(--brand);color:var(--brand);border-style:solid;background:var(--sel-bg);}
    .item-chip.added{background:var(--brand);border-color:var(--brand);border-style:solid;color:white;font-weight:600;}
    .item-chip.added:hover{background:var(--brand);border-color:var(--brand);color:white;}
    .item-chip.selected{background:var(--brand);border-color:var(--brand);border-style:solid;color:white;font-weight:600;}
    .btn-primary{background:var(--brand);color:white;border:none;border-radius:10px;padding:8px 18px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
    .btn-primary:hover{opacity:0.9;}
    /* Search */
    .search-wrap{position:relative;margin-bottom:14px;}
    .search-wrap input{padding-left:36px;border-radius:8px;}
    .search-wrap input.has-results{border-radius:8px 8px 0 0;border-bottom-color:transparent;}
    .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none;}
    .search-results{background:white;border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;max-height:220px;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,0.08);margin-bottom:14px;}
    .search-result-item{padding:10px 14px;font-size:14px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.1s;}
    .search-result-item:last-child{border-bottom:none;}
    .search-result-item:hover{background:var(--sel-bg);}
    .search-result-breadcrumb{font-size:11px;color:var(--muted);margin-top:2px;}
    .add-custom-row{padding:12px 16px;font-size:14px;color:white;font-weight:600;cursor:pointer;border:none;border-radius:0 0 10px 10px;background:var(--brand);margin-bottom:14px;display:block;text-align:center;transition:background 0.15s;}
    .custom-add-box{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
    .custom-add-box label{margin-bottom:6px;}
    .custom-add-box select{margin-bottom:10px;}
    .custom-add-confirm{background:var(--brand);color:white;border:none;border-radius:8px;padding:10px 20px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
    .custom-add-cancel{background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;margin-left:10px;}
    /* Added items */
    .added-section{margin-top:16px;} .practice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
    .added-label{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
    .practice-item{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:10px;min-width:0;}
    .practice-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
    .practice-item-name{font-size:14px;font-weight:600;color:var(--text);}
    .practice-item-x{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;padding:0;line-height:1;}
    .practice-item-x:hover{color:var(--text);}
    .practice-item-cat{font-size:11px;color:var(--brand);margin-bottom:8px;}
    .practice-required{font-size:12px;color:var(--brand);font-weight:400;margin-bottom:8px;}
    .practice-options{display:flex;flex-wrap:wrap;gap:8px;}
    .practice-btn{padding:6px 14px;border-radius:16px;border:1.5px solid var(--border);background:white;font-size:12px;color:var(--soft);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
    .practice-btn:hover{border-color:var(--brand);color:var(--brand);}
    .practice-btn.selected{background:var(--brand);border-color:var(--brand);color:white;font-weight:500;}
    /* Needs two-section */
    /* Need items */
    .need-item{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
    .need-item-left{flex:1;}
    .need-item-name{font-size:14px;font-weight:600;color:var(--text);}
    .need-item-cat{font-size:11px;color:var(--muted);margin-top:2px;}
    .need-item-right{display:flex;align-items:center;gap:10px;}
    .local-toggle{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--soft);cursor:pointer;}
    .local-toggle input{width:14px;height:14px;accent-color:var(--brand);cursor:pointer;}
    .local-toggle.active{color:var(--brand);font-weight:600;}
    /* Warning */
    .warning-msg{background:#FFF8E1;border:1px solid #FFD54F;border-radius:8px;padding:10px 14px;font-size:13px;color:#7A5F00;margin-bottom:12px;}
    .reminder-msg{font-size:12px;color:var(--brand);display:inline-block;padding:0;}
    /* Nav */
    .nav-row{display:flex;gap:12px;margin-top:28px;}
    .btn-back{flex:1;padding:14px;border-radius:10px;border:1.5px solid var(--border);background:white;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;color:var(--soft);cursor:pointer;transition:all 0.15s;}
    .btn-back:hover{border-color:var(--brand);color:var(--brand);}
    .btn-next{flex:2;padding:14px;border-radius:10px;border:none;background:var(--brand);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;color:white;cursor:pointer;transition:background 0.15s;}
    .btn-next:hover{background:var(--hover);}
    .btn-outlined{flex:2;padding:14px;border-radius:10px;border:2px solid var(--brand);background:white;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;color:var(--brand);cursor:pointer;transition:all 0.15s;}
    .btn-outlined:hover{background:var(--brand);color:white;}
    /* Profile */
    .profile-section{margin-bottom:0;padding-bottom:20px;border-bottom:1px solid var(--border);margin-top:20px;}
    .profile-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .profile-section-label{font-size:16px;font-weight:700;color:var(--text);letter-spacing:0;text-transform:none;}
    .profile-section-actions{display:flex;align-items:center;gap:8px;}
    .edit-btn{font-size:12px;font-weight:600;color:white;background:var(--brand);border:none;border-radius:16px;cursor:pointer;font-family:'DM Sans',sans-serif;padding:5px 12px;}
    .profile-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;}
    .profile-tag{padding:6px 12px;border-radius:20px;background:var(--sel-bg);border:1.5px solid var(--sel-border);font-size:13px;color:var(--brand);font-weight:500;}
    .tag-level{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px;}
    .profile-empty{font-size:13px;color:var(--muted);font-style:italic;}
    .profile-lang-row{margin-top:4px;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
    .profile-lang-text{font-size:13px;color:var(--soft);}
    /* Lang modal */
    .lang-dropdown-wrap{position:relative;margin-bottom:12px;}
    .lang-search-input{padding-left:36px !important;border-radius:8px 8px 0 0 !important;border-bottom:none !important;}
    .lang-search-icon{position:absolute;left:12px;top:13px;font-size:15px;pointer-events:none;}
    .lang-list{background:white;border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;max-height:200px;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,0.08);}
    .lang-list-item{padding:10px 14px;font-size:14px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;transition:background 0.1s;}
    .lang-list-item:last-child{border-bottom:none;}
    .lang-list-item:hover{background:var(--sel-bg);}
    .lang-list-item.selected{background:var(--sel-bg);color:var(--brand);font-weight:500;}
    .lang-check{color:var(--brand);font-size:14px;min-width:16px;}
    .lang-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
    .lang-tag{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;background:var(--sel-bg);border:1.5px solid var(--sel-border);font-size:13px;color:var(--brand);font-weight:500;}
    .lang-tag-remove{cursor:pointer;color:var(--muted);font-size:15px;}
    /* Modals */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:flex-start;justify-content:center;padding:12px 0 0;}
    .modal-overlay.open{display:flex;}
    .modal{background:#fff;border-radius:16px;padding:32px;max-width:480px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
    .modal-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:16px;}
    .modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
    /* Share modal */
    .share-actions{display:flex;gap:10px;margin-bottom:20px;}
    .share-copy-btn{flex:1;padding:12px;border-radius:10px;border:none;background:var(--brand);color:white;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
    .share-native-btn{flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:white;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
    .qr-wrap{background:white;border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;}
    .qr-wrap img{max-width:200px;width:100%;border-radius:8px;}
    .copy-confirm{font-size:12px;color:var(--brand);margin-top:6px;display:none;}
    .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:white;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:500;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
    .toast.show{opacity:1;}
    .empty{font-size:13px;color:var(--muted);font-style:italic;margin-top:8px;}
    .added-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .level-help-btn{background:none;border:1.5px solid var(--border);border-radius:50%;width:20px;height:20px;font-size:11px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;display:inline-flex;align-items:center;justify-content:center;padding:0;}
    .level-help-btn:hover{border-color:var(--brand);color:var(--brand);}
    .ideas-prompt{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:10px;}
    /* needs-top-chips moved below */
    .needs-top-chip{padding:10px 18px;border-radius:20px;border:1.5px solid var(--border);background:white;font-size:14px;color:var(--soft);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:all 0.15s;}
    .needs-top-chip:hover{border-color:var(--brand);color:var(--brand);}
    .needs-top-chips{display:flex;gap:10px;margin-bottom:0;flex-wrap:wrap;padding-bottom:14px;}
    .cat-picker-inline{background:white;border:1.5px solid var(--brand);border-radius:10px;padding:10px 12px;display:none;flex-wrap:wrap;gap:6px;position:absolute;left:0;top:100%;z-index:200;min-width:220px;box-shadow:0 4px 16px rgba(0,0,0,0.12);}
    .cat-picker-inline.open{display:flex;}
    .cat-pick-btn{padding:5px 12px;border-radius:18px;border:1.5px solid var(--border);background:white;font-size:12px;color:var(--soft);cursor:pointer;font-family:'DM Sans',sans-serif;}
    .cat-pick-btn:hover{border-color:var(--brand);color:var(--brand);}
    .needs-summary{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:14px;}
    .needs-summary-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:14px;font-weight:600;color:var(--text);}
    .needs-summary-body{margin-top:10px;display:flex;flex-wrap:wrap;gap:7px;}
    .needs-summary-tag{background:white;border:1.5px solid var(--border);border-radius:18px;padding:5px 12px;font-size:13px;color:var(--text);}
    .needs-top-chip.selected{background:var(--brand);border-color:var(--brand);color:white;font-weight:600;}
    .needs-detail-box{background:var(--input-bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
    .sub-chip{padding:8px 14px;border-radius:18px;border:1.5px solid var(--border);background:white;font-size:13px;color:var(--soft);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:all 0.15s;display:inline-flex;align-items:center;gap:5px;}
    .sub-chip:hover{border-color:var(--brand);color:var(--brand);}
    .sub-chip.selected{background:var(--brand);border-color:var(--brand);color:white;font-weight:600;}
    .sub-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);}
    .level-popup{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;background:white;border:1px solid var(--border);border-radius:14px;padding:18px 20px;font-size:13px;color:var(--soft);line-height:1.7;box-shadow:0 8px 30px rgba(0,0,0,0.18);max-width:320px;width:90%;}
    .level-popup.open{display:block;}
    .level-popup-close{display:block;margin-top:14px;text-align:center;font-weight:600;color:var(--brand);cursor:pointer;font-size:14px;}
    .methods-list{margin:12px 0 20px;}
    .method-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;transition:background 0.1s;border:1.5px solid transparent;margin-bottom:4px;}
    .method-item:hover{background:var(--sel-bg);}
    .method-item.selected{background:var(--sel-bg);border-color:var(--brand);}
    .method-check{width:22px;height:22px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all 0.15s;}
    .method-check.checked{background:var(--brand);border-color:var(--brand);color:white;font-size:13px;}
    .method-text{font-size:14px;color:var(--text);line-height:1.4;}
    .methods-selected-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;}
    .methods-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:9000;align-items:flex-start;padding-top:4vh;}
    .methods-modal-overlay.open{display:flex;}
    .methods-modal{background:white;border-radius:16px;padding:18px 16px;width:88%;max-width:400px;margin:0 auto;max-height:82vh;overflow-y:auto;box-sizing:border-box;}
    .values-tabs{display:flex;flex-direction:row;gap:8px;margin-bottom:14px;}
    .values-tab{flex:1;text-align:center;padding:10px 8px;border-radius:10px;border:1.5px solid var(--border);background:white;font-size:14px;color:var(--soft);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;transition:all 0.15s;}
    .values-tab.active{background:var(--brand);border-color:var(--brand);color:white;}
    .values-section-label{font-size:13px;font-weight:700;color:var(--text);margin:16px 0 8px;}
    .btn-link{background:none;border:none;color:var(--brand);font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;padding:0;}
    .inline-edit-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);flex-wrap:wrap;}
  </style>
</head>

<body>
<div style="max-width:660px;margin:0 auto;">
  <div class="card" id="main-card">
    <div class="top-right-area" id="top-right-area"></div>
    <div id="app-content">
      <div style="text-align:center;padding:60px 40px">
        <div style="width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;"></div>
        <p style="color:var(--muted);font-size:14px;margin:0;">Loading preferences...</p>
      </div>
    </div>
  </div>
  <div class="footer"><a href="https://creating.works">Creating Works</a></div>
</div>

<!-- Lang modal -->
<div class="modal-overlay" id="lang-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeLangModal()">✕</button>
    <div class="modal-title">Languages</div>
    <div class="lang-dropdown-wrap">
      <span class="lang-search-icon">🔍</span>
      <input type="text" class="lang-search-input" id="lang-modal-search" placeholder="Search languages..." oninput="filterLangs(this.value)">
      <div class="lang-list" id="lang-list"></div>
    </div>
    <div class="lang-tags" id="lang-tags"></div>
    <div style="margin-top:16px">
      <button class="custom-add-confirm" onclick="saveLangModal()">Done</button>

<script>
// ─── Identity ────────────────────────────────────────────────────────────────
var _appearId   = null;
var _showId     = null;
var _viewerMode = false;
var _viewerPhoto = '';
var _viewerName  = '';

(function(){
  var params=new URLSearchParams(window.location.search);
  _showId=params.get('show')||null;
  if(_showId){_viewerMode=true;return;}
  var urlId=params.get('id')||params.get('memberCard');
  if(urlId){_appearId=urlId;try{localStorage.setItem('appear-id',_appearId);}catch(e){}}
  else{try{_appearId=localStorage.getItem('appear-id');}catch(e){}}
})();

var GS_URL='https://script.google.com/macros/s/AKfycbzEavMnG4tMeWemoT5FLu9f_zjlKVIJsZLueG4nhw9akK0_nZqpbkZiXrAlWu1Fyhq9/exec';

// PARENT_CATS loads from reference-data sheet via getCategories; this is the fallback if that load fails
var PARENT_CATS=[
  'Arts & Culture','Food & Drink','Physical Wellbeing','Mental Wellbeing',
  'Family Wellbeing','Self-Expression & Beauty','Home & Construction','Transportation',
  'Mechanical & Manufacturing','Business & Finance','Community & Civic','Recreation & Hobbies',
  'Technology & Communications','Nature & Outdoors','Social Events & Gatherings','Pets & Animal Care'
];
var FLAGGED_WORDS=['expert','leader','director','senior','advanced','junior'];
var REC_TYPES=['Movement & Performance','Sports','Outdoor & Nature','Games & Strategy','Making & Collecting'];

// ─── State ───────────────────────────────────────────────────────────────────
var _screen      = 1;
var _editMode    = false;   // true when editing from profile summary
var _completed   = false;   // true after all 4 screens visited on first pass
var _hasProfile  = false;   // true when ikigai data exists in sheet
var _refData     = null;
var _photo       = '';
var _name        = '';
var _languages   = [];
var _langFilter  = '';
var _postal      = '';

var _interests   = [];
var _skills      = [];
var _values      = [];
var _domains     = [];
var _needsSkill  = [];
var _needsRes    = [];
var _methods     = [];
var _expression  = '';
var _screen2step = 'lang';
var _customCareParent = '';

// Drill state — all keys are strings
var _drill = {
  '1':  {parentCat:'',subCat:'',itemCat:''},
  '2':  {parentCat:'',subCat:'',itemCat:''},
  '3':  {parentCat:'',subCat:'',itemCat:''},
  '4s': {parentCat:'',subCat:'',itemCat:''},
  '4r': {parentCat:'',subCat:'',itemCat:''}
};
function getDrill(s){return _drill[String(s)]||{};}
function resetDrillTo(s,level){
  var d=_drill[String(s)]; if(!d) return;
  if(level<=0){d.parentCat='';d.subCat='';d.itemCat='';}
  else if(level===1){d.subCat='';d.itemCat='';}
  else{d.itemCat='';}
}

var _searchQ={};
var _customItem='';
var _customScreen='';
var _customIsDomain=false;
var _retired=false;

// ─── Helpers ─────────────────────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rawVal(s){return String(s||'').replace(/'/g,"\\'");}
function toast(msg){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}return a;}
function sortAlpha(arr){return arr.slice().sort(function(a,b){return a.localeCompare(b);});}

function matchesQuery(r,ql){
  if((r.item||'').toLowerCase().includes(ql)) return true;
  if((r.category||'').toLowerCase().includes(ql)) return true;
  if((r.recType||'').toLowerCase().includes(ql)) return true;
  var assoc=r.associations||'';
  if(!assoc) return false;
  return assoc.toLowerCase().split(/[\s,]+/).some(function(w){return w===ql||w.startsWith(ql);});
}

function checkFlag(q){var ql=q.toLowerCase();for(var i=0;i<FLAGGED_WORDS.length;i++){if(ql.includes(FLAGGED_WORDS[i]))return FLAGGED_WORDS[i];}return '';}

// ─── Pool helpers ─────────────────────────────────────────────────────────────
function getSkillPool(d){
  if(!_refData) return [];
  var base=_refData.skills||[];
  if(d&&d.parentCat) base=base.filter(function(r){return r.category===d.parentCat;});
  return base;
}
function getRecPool(d){
  if(!_refData) return [];
  var base=_refData.recreation||[];
  if(d&&d.itemCat) return base.filter(function(r){return r.category===d.itemCat;});
  if(d&&d.subCat) return base.filter(function(r){return r.category===d.subCat;});
  if(d&&d.parentCat) return base.filter(function(r){return r.recType===d.parentCat;});
  return base;
}
function getValuePool(d){
  if(!_refData) return [];
  var base=(_refData.values||[]).concat(_refData.domains||[]);
  if(d&&d.parentCat) base=base.filter(function(r){return r.category===d.parentCat;});
  return base;
}
function getResPool(d){
  if(!_refData) return [];
  var base=_refData.resources||[];
  if(d&&d.parentCat) base=base.filter(function(r){return r.category===d.parentCat;});
  return base;
}
function getPool(screen){
  var s=String(screen);
  var d=getDrill(s);
  if(s==='1') return getRecPool(d);
  if(s==='2') return getSkillPool(d);
  if(s==='3') return getValuePool(d);
  if(s==='4s') return getSkillPool(d);
  if(s==='4r') return getResPool(d);
  return [];
}

function getItemChips(screen){
  var pool=getPool(screen);
  return shuffle(pool.map(function(r){return r.item||r;}).filter(Boolean)).slice(0,30);
}

// Sub cats for skills — returns empty if none (falls to item chips directly)
function getSkillSubCats(parentCat){
  if(!_refData||!_refData.skills) return [];
  var s={};
  (_refData.skills||[]).filter(function(r){return r.category===parentCat;})
    .forEach(function(r){if(r.subCategory) s[r.subCategory]=1;});
  return sortAlpha(Object.keys(s));
}

// ─── Data loading ─────────────────────────────────────────────────────────────
async function loadRefData(){
  try{var res=await fetch(GS_URL+'?action=getReferenceData');_refData=await res.json();}
  catch(e){_refData={languages:[],skills:[],values:[],domains:[],recreation:[],resources:[]};}
  // Load parent categories from the reference-data sheet so the list never drifts from the sheet
  try{
    var cres=await fetch(GS_URL+'?action=getCategories');
    var cdata=await cres.json();
    if(cdata&&cdata.categories&&cdata.categories.length){
      PARENT_CATS=cdata.categories.map(function(c){return c.label;}).filter(Boolean);
    }
  }catch(e){}
}
async function loadProfile(){
  var id=_viewerMode?_showId:_appearId; if(!id) return;
  try{
    var res=await fetch(GS_URL+'?action=lookupProfile&appearId='+encodeURIComponent(id));
    var data=await res.json();
    if(data.found){
      if(_viewerMode){_viewerPhoto=data.photo||'';_viewerName=data.name||'';}
      else{_photo=data.photo||'';_name=data.name||'';}
    }
  }catch(e){}
}
async function loadIntake(){
  var id=_viewerMode?_showId:_appearId; if(!id) return;
  try{
    var res=await fetch(GS_URL+'?action=getIntake&appearId='+encodeURIComponent(id));
    var data=await res.json();
    if(data.found&&data.data){
      _hasProfile=true;
      var d=data.data;
      _postal=d.postal||'';
      _retired=String(d.retired||'').trim().toLowerCase()==='true';
      _methods=(d.methods||'').split('|').filter(Boolean);
      _expression=d.expression||'';
      _expressionItems=_expression?_expression.split('|').filter(Boolean):[];
      _languages=d.languages?d.languages.split('|').filter(Boolean):[];
      _interests=parseTagStr(d.interests,'level');
      _skills=parseTagStr(d.skills,'level');
      _values=parseTagStr(d.values,'level');
      _domains=parseTagStr(d.domains,'level').map(function(dm){dm.category='domain';return dm;});
      var np=parseNeedsStr(d.needs);
      _needsSkill=np.filter(function(n){return n.ntype!=='resource';});
      _needsRes=np.filter(function(n){return n.ntype==='resource';});
    }
  }catch(e){}
  // If skills screen already rendered, update lang button immediately
  if(_screen===2){var lb=document.getElementById('lang-edit-btn');if(lb)lb.textContent='✏️ '+(_languages.length?'Languages: '+_languages.join(', '):'Add your languages');}
}

function parseTagStr(str,lk){
  if(!str) return [];
  return str.split('|').filter(Boolean).map(function(s){
    var p=s.split(':');var o={item:p[0],category:p.length>=3?p[1]:''};o[lk]=p.length>=3?p[2]||'':p[1]||'';return o;
  });
}
function parseNeedsStr(str){
  if(!str) return [];
  return str.split('|').filter(Boolean).map(function(s){
    var p=s.split(':');
    return{item:p[0],category:p[3]||'',local:p[1]==='local',ntype:p[2]||'skill'};
  });
}

// ─── Auto-save ────────────────────────────────────────────────────────────────
function autoSave(){
  if(!_appearId||_viewerMode) return;
  var iStr=_interests.map(function(s){return s.item+(s.level?':'+s.level:'');}).join('|');
  var sStr=_skills.map(function(s){return s.item+(s.level?':'+s.level:'');}).join('|');
  var vStr=_values.map(function(s){return s.item+':'+(s.category||'')+':'+(s.level||'');}).join('|');
  var dStr=_domains.map(function(s){return s.item+(s.level?':'+s.level:'');}).join('|');
  var nStr=[].concat(
    _needsSkill.map(function(s){return s.item+(s.local?':local':'')+':skill'+(s.category?':'+s.category:'');}),
    _needsRes.map(function(s){return s.item+(s.local?':local':'')+':thing'+(s.category?':'+s.category:'');})
  ).join('|');
  var mStr=_methods.join('|');
  fetch(GS_URL+'?action=saveIntake'
    +'&appearId='+encodeURIComponent(_appearId)
    +'&languages='+encodeURIComponent(_languages.join('|'))
    +'&postal='+encodeURIComponent(_postal)
    +'&interests='+encodeURIComponent(iStr)
    +'&skills='+encodeURIComponent(sStr)
    +'&values='+encodeURIComponent(vStr)
    +'&domains='+encodeURIComponent(dStr)
    +'&needs='+encodeURIComponent(nStr)
    +'&methods='+encodeURIComponent(mStr)
    +'&expression='+encodeURIComponent(_expression)
    +'&retired='+encodeURIComponent(_retired?'true':'')
  ).catch(function(){});
  _hasProfile=true;
}

// ─── Drill-down render ────────────────────────────────────────────────────────
window.renderDrill = function(screen, containerId){
  var el=document.getElementById(containerId); if(!el) return;
  var s=String(screen);
  var d=getDrill(s);
  var html='';

  // Breadcrumb
  if(d.parentCat){
    html+='<div class="breadcrumb-nav">';
    html+='<span class="breadcrumb-link" onclick="doResetDrill(\''+s+'\',0)">All categories</span>';
    html+='<span> › </span><span class="breadcrumb-link" onclick="doResetDrill(\''+s+'\',1)">'+esc(d.parentCat)+'</span>';
    if(d.subCat) html+='<span> › </span><span class="breadcrumb-link" onclick="doResetDrill(\''+s+'\',2)">'+esc(d.subCat)+'</span>';
    if(d.itemCat) html+='<span> › </span><span>'+esc(d.itemCat)+'</span>';
    html+='</div>';
  }

  if(!d.parentCat){
    // Level 0: show top-level chips
    if(s==='1'){
      // Recreation: show rec types as sub chips
      html+='<div class="sub-chips">';
      REC_TYPES.forEach(function(t){
        html+='<div class="sub-chip" onclick="doSetDrill(\'1\',\'parentCat\',\''+rawVal(t)+'\')">'+esc(t)+'</div>';
      });
      html+='</div>';
    } else {
      html+='<div class="cat-chips-grid">';
      PARENT_CATS.forEach(function(c){
        html+='<div class="cat-chip" onclick="doSetDrill(\''+s+'\',\'parentCat\',\''+rawVal(c)+'\')">'+esc(c)+'</div>';
      });
      html+='</div>';
    }
  } else if(s==='1'){
    // Rec drill: level 1 = sub sport cats, level 2 = items
    var pool=(_refData&&_refData.recreation)||[];
    if(!d.subCat){
      var subCats=(function(){var sc={};pool.filter(function(r){return r.recType===d.parentCat;}).forEach(function(r){if(r.category)sc[r.category]=1;});return sortAlpha(Object.keys(sc));})();
      if(subCats.length){
        html+='<div class="sub-chips">';
        subCats.forEach(function(c){html+='<div class="sub-chip" onclick="doSetDrill(\'1\',\'subCat\',\''+rawVal(c)+'\')">'+esc(c)+'</div>';});
        html+='</div>';
      }
    }
    // Show chips: always when rec type has no sub-cats, or when subCat is selected
    var chips=getItemChips(s);
    var hasSubCats=(function(){var sc={};pool.filter(function(r){return r.recType===d.parentCat;}).forEach(function(r){if(r.category)sc[r.category]=1;});return Object.keys(sc).length>0;})();
    if(chips.length && (d.subCat || !hasSubCats)){
      var addedArr=_interests;
      html+='<div class="ideas-prompt">Here are some ideas to get you started.</div>';
      html+='<div class="item-chips">';
      chips.forEach(function(item){
        var isAdded=addedArr.some(function(r){return r.item===item;});
        html+='<div class="item-chip'+(isAdded?' added':'')+'" onclick="addItemFromChip(\''+s+'\',\''+esc(item)+'\',\''+esc(d.parentCat)+'\')">'+esc(item)+'</div>';
      });
      html+='<div class="item-chip" style="border-style:dashed;color:var(--brand);font-weight:700;" onclick="showCustomAdd(\'1\',\'\')" >+ Other</div>';
      html+='</div>';
    }
  } else {
    // Non-rec: check for sub-cats (skills only), then show item chips
    if(s==='2'||s==='4s'){
      var subs=getSkillSubCats(d.parentCat);
      if(subs.length&&!d.subCat){
        html+='<div class="sub-chips">';
        subs.forEach(function(c){html+='<div class="sub-chip" onclick="doSetDrill(\''+s+'\',\'subCat\',\''+rawVal(c)+'\')">'+esc(c)+'</div>';});
        html+='</div>';
      }
    }
    // Item chips
    var chips2=getItemChips(s);
    if(chips2.length){
      var arr2=s==='2'?_skills:s==='3'?_values:s==='4s'?_needsSkill:_needsRes;
      html+='<div class="ideas-prompt">Here are some ideas to get you started.</div>';
      html+='<div class="item-chips">';
      chips2.forEach(function(item){
        var isAdded=arr2.some(function(r){return r.item===item;});
        var isPending=s==='4s'&&_pendingNeedsItem.item===item;
        var chipOnclick=s==='4s'?'selectNeedsItem(\''+esc(item)+'\',\''+esc(d.parentCat)+'\')':'addItemFromChip(\''+s+'\',\''+esc(item)+'\',\''+esc(d.parentCat)+'\')';
        html+='<div class="item-chip'+(isAdded?' added':isPending?' selected':'')+'\" onclick="'+chipOnclick+'">'+esc(item)+'</div>';
      });
      html+='<div class="item-chip" style="border-style:dashed;color:var(--brand);font-weight:700;" onclick="showCustomAdd(\''+s+'\',\'\')" >+ Other</div>';
      html+='</div>';
      if(s==='4s'&&_pendingNeedsItem.item){
        html+='<div id="needs-confirm-bar" style="margin-top:12px;padding:12px;background:var(--input-bg);border-radius:10px;display:flex;align-items:center;justify-content:space-between;">'          +'<span style="font-size:14px;color:var(--soft);">'+esc(_pendingNeedsItem.item)+'</span>'          +'<div style="display:flex;gap:8px;">'          +'<button class="btn-outlined" style="padding:6px 14px;font-size:13px;" onclick="_pendingNeedsItem={item:\'\',category:\'\'};renderDrill(\'4s\',\'drill-4s\')">Cancel</button>'          +'<button class="btn-primary" style="padding:6px 14px;font-size:13px;" onclick="confirmNeedsItem()">Add '+esc(_pendingNeedsItem.item)+'</button>'          +'</div></div>';
      }
    }
  }

  el.innerHTML=html;
};

window.doSetDrill = function(screen, key, val){
  var s=String(screen);
  var d=_drill[s]; if(!d) return;
  if(key==='parentCat'){
    if(d.parentCat===val){d.parentCat='';d.subCat='';d.itemCat='';}
    else{d.parentCat=val;d.subCat='';d.itemCat='';}
  } else if(key==='subCat'){d.subCat=val;d.itemCat='';}
  else{d.itemCat=val;}
  window.renderDrill(s,'drill-'+s);
};

window.doResetDrill = function(screen, level){
  resetDrillTo(screen, level);
  window.renderDrill(String(screen),'drill-'+String(screen));
};

// ─── Add items ────────────────────────────────────────────────────────────────
function refreshNeedsSummary(){
  var el=document.getElementById('needs-summary-block');
  if(!el) return;
  var expanded=document.getElementById('needs-summary-body')&&document.getElementById('needs-summary-body').style.display!=='none';
  var html=buildNeedsSummary();
  var nav=document.querySelector('.nav-row');
  if(nav&&nav.parentNode){
    var old=document.getElementById('needs-summary-block');
    if(old) old.parentNode.removeChild(old);
    var tmp=document.createElement('div');
    tmp.innerHTML=html;
    if(tmp.firstChild) nav.parentNode.insertBefore(tmp.firstChild,nav);
    if(expanded){
      var body=document.getElementById('needs-summary-body');
      var arrow=document.getElementById('needs-summary-arrow');
      if(body) body.style.display='flex';
      if(arrow) arrow.textContent='▲';
    }
  }
}
window.selectNeedsItem = function(item, category){
  _pendingNeedsItem={item:item,category:category};
  window.renderDrill('4s','drill-4s');
};
window.confirmNeedsItem = function(){
  if(!_pendingNeedsItem.item) return;
  window.addItemFromChip('4s',_pendingNeedsItem.item,_pendingNeedsItem.category);
  _pendingNeedsItem={item:'',category:''};
};
window.addItemFromChip = function(screen, item, category){
  var s=String(screen);
  // Determine target array for screen 3 based on whether this is a domain
  var isDomain=(String(category||'').toLowerCase()==='domain');
  var targetArr;
  if(s==='3') targetArr=isDomain?_domains:_values;
  else targetArr=getArr(s);
  // Already added — deselect and remove
  var existingIdx=targetArr.findIndex(function(r){return r.item===item;});
  if(existingIdx>-1){
    targetArr.splice(existingIdx,1);
    document.querySelectorAll('.item-chips .item-chip').forEach(function(el){
      if(el.textContent.trim()===item) el.classList.remove('added');
    });
    if(s==='3'){
      var el0v=document.getElementById('added-3-values');
      var el0d=document.getElementById('added-3-domains');
      if(el0v) el0v.innerHTML=buildValAddedHTML(_values, 'Added values');
      if(el0d) el0d.innerHTML=buildValAddedHTML(_domains, 'Added domains');
    } else { updateAddedSection(s); }
    if(s==='4s'||s==='4r') refreshNeedsSummary();
    autoSave();
    return;
  }
  addItem(screen, item, category);
  document.querySelectorAll('.item-chips .item-chip').forEach(function(el){
    if(el.textContent.trim()===item) el.classList.add('added');
  });
  if(s==='3'){
    // Refresh both added sections
    var elv=document.getElementById('added-3-values');
    var eld=document.getElementById('added-3-domains');
    if(elv) elv.innerHTML=buildValAddedHTML(_values, 'Added values');
    if(eld) eld.innerHTML=buildValAddedHTML(_domains, 'Added domains');
    // Auto-expand the section that got a new item
    if(isDomain) expandValSection('val-body-Added-domains','val-arrow-Added-domains');
    else expandValSection('val-body-Added-values','val-arrow-Added-values');
  }
  if(s==='4s'||s==='4r') refreshNeedsSummary();
};

function addItem(screen, item, category){
  var s=String(screen);
  if(s==='3'){
    // Route by category: domain (any case) goes to _domains, everything else to _values
    var isDomainCat=String(category||'').toLowerCase()==='domain';
    if(isDomainCat){
      if(_domains.some(function(r){return r.item===item;})){toast('Already added');return;}
      _domains.unshift({item:item,category:'domain',level:''});
    } else {
      if(_values.some(function(r){return r.item===item;})){toast('Already added');return;}
      _values.unshift({item:item,category:category||'',level:''});
    }
    toast('Added below ↓');
    clearSearch(s);
    updateAddedSection(s);
    return;
  }
  var arr=getArr(s);
  if(arr.some(function(r){return r.item===item;})){toast('Already added');return;}
  if(s==='1') _interests.unshift({item:item,category:category||'',level:''});
  else if(s==='2') _skills.unshift({item:item,category:category||'',level:''});
  else if(s==='4s'){_needsSkill.unshift({item:item,category:category||(_drill['4s']&&_drill['4s'].parentCat)||'',local:false,ntype:'skill'});var tc=document.getElementById('needs-type-chips');if(tc)tc.style.display='';setTimeout(function(){if(_needsCat)window.setNeedsCat(_needsCat);},50);}
  else if(s==='4r'){_needsRes.unshift({item:item,category:category||(_drill['4r']&&_drill['4r'].parentCat)||'',local:false,ntype:'resource'});var tc2=document.getElementById('needs-type-chips');if(tc2)tc2.style.display='';setTimeout(function(){if(_needsCat)window.setNeedsCat(_needsCat);},50);}
  toast('Added below ↓');
  clearSearch(s);
  updateAddedSection(s);
}

function getArr(s){
  s=String(s);
  if(s==='1') return _interests;
  if(s==='2') return _skills;
  if(s==='3') return _values.concat(_domains);
  if(s==='4s') return _needsSkill;
  if(s==='4r') return _needsRes;
  return [];
}

function refreshNeedsVisible(){
  var vis=document.getElementById('needs-added-visible');
  if(vis){
    vis.innerHTML=(_needsSkill.length?buildAddedHTML('4s'):'')+(_needsRes.length?buildAddedHTML('4r'):'');
  }
}
window.removeItem = function(screen, idx){
  var s=String(screen);
  if(s==='3'){
    // For screen 3, need to determine if item is from _values or _domains
    // Combined array is _values.concat(_domains)
    if(idx<_values.length){
      _values.splice(idx,1);
    } else {
      _domains.splice(idx-_values.length,1);
    }
  } else {
    getArr(s).splice(idx,1);
  }
  updateAddedSection(s);
  if(s==='4s'||s==='4r') refreshNeedsVisible();
  else window.renderDrill(s,'drill-'+s);
};

window.setLevel = function(screen, idx, level){
  var s=String(screen);
  var arr;
  if(s==='3'){
    // For screen 3, determine which array and adjust index
    if(idx<_values.length){
      arr=_values;
    } else {
      arr=_domains;
      idx=idx-_values.length;
    }
  } else {
    arr=getArr(s);
  }
  if(!arr[idx]) return;
  if(s==='3'){
    arr[idx].level=(arr[idx].level===level?'':level);
    updateAddedSection('3');
    return;
  }
  var current=arr[idx].level||'';
  var parts=current?current.split(','):[];
  var pos=parts.indexOf(level);
  if(pos>-1) parts.splice(pos,1); else parts.push(level);
  arr[idx].level=parts.join(',');
  updateAddedSection(s);
};

window.toggleLocal = function(screen, idx){
  var arr=getArr(String(screen));
  if(arr[idx]) arr[idx].local=!arr[idx].local;
  updateAddedSection(String(screen));
};

function updateAddedSection(s){
  if(s==='3'){
    // Update in place instead of full re-render to avoid wiping added sections
    var elV=document.getElementById('added-3-values');
    var elD=document.getElementById('added-3-domains');
    if(elV) elV.innerHTML=buildValAddedHTML(_values,'Added values');
    if(elD) elD.innerHTML=buildValAddedHTML(_domains,'Added domains');
    return;
  }
  var el=document.getElementById('added-'+s);
  if(el){ el.innerHTML=buildAddedHTML(s); expandAddedSection('added-body-'+s,'added-arrow-'+s); }
  if(s==='4s'||s==='4r') refreshNeedsVisible();
}

function getFullPool(s){
  if(!_refData) return [];
  if(s==='1') return _refData.recreation||[];
  if(s==='2'||s==='4s') return _refData.skills||[];
  if(s==='3') return (_refData.values||[]).concat(_refData.domains||[]);
  if(s==='4r') return _refData.resources||[];
  return [];
}
window.runSearch = function(screen, q){
  var s=String(screen);
  _searchQ[s]=q;
  if(s==='2'){
    var flagged=checkFlag(q);
    var warnEl=document.getElementById('title-warning-2');
    if(warnEl) warnEl.innerHTML=flagged?'<div class="warning-msg">Gentle note: titles like "'+esc(flagged)+'" carry a level of knowledge we ask about separately. Try the role name on its own.</div>':'';
  }
  var pool=q&&q.length>=1?getFullPool(s):getPool(s);
  var res=[];
  if(q&&q.length>=1){var ql=q.toLowerCase();res=pool.filter(function(r){return matchesQuery(r,ql);}).slice(0,25);}
  var container=document.getElementById('search-results-'+s); if(!container) return;
  var inp=document.getElementById('search-input-'+s);
  if(inp){if(q&&res.length)inp.classList.add('has-results');else inp.classList.remove('has-results');}
  if(!q||q.length<1){container.innerHTML='';return;}
  if(res.length){
    container.innerHTML='<div class="search-results">'
      +res.map(function(r){
          var item=esc(r.item||r);
          var crumb=s==='1'?breadcrumbForRec(r):(r.category||'');
          return '<div class="search-result-item" onclick="addItem(\''+s+'\',\''+item+'\',\''+esc(r.category||'')+'\')">'
            +item+(crumb?'<div class="search-result-breadcrumb">'+esc(crumb)+'</div>':'')+'</div>';
        }).join('')+'</div>';
  } else {
    container.innerHTML='<div class="add-custom-row" onclick="showCustomAdd(\''+s+'\',\''+esc(q)+'\')">+ Add "'+esc(q)+'" to my list</div>';
  }
};

function breadcrumbForRec(r){
  var parts=['Recreation & Hobbies'];
  if(r.recType) parts.push(r.recType);
  if(r.category&&r.category!==r.recType) parts.push(r.category);
  return parts.join(' › ');
}

function clearSearch(s){
  _searchQ[s]='';
  var inp=document.getElementById('search-input-'+s);
  if(inp){inp.value='';inp.classList.remove('has-results');}
  var rc=document.getElementById('search-results-'+s); if(rc) rc.innerHTML='';
}

function stripMethodEmoji(s){
  // Remove leading emoji + space (emoji are typically 2 chars via surrogate pairs or single codepoints)
  return s.replace(/^[\uD800-\uDBFF][\uDC00-\uDFFF]\s*/,'').replace(/^\p{Emoji}\s*/u,'').trim();
}
function methodsMatch(a, b){
  return stripMethodEmoji(a)===stripMethodEmoji(b);
}
var _methodOpts=[];
function renderMethodsModalList(){
  var el=document.getElementById('methods-modal-list'); if(!el) return;
  var opts=(_refData&&_refData.methodsDisplay)||[];
  if(!opts.length){el.innerHTML='<div class="empty">Loading...</div>';return;}
  _methodOpts=opts.slice();
  el.innerHTML=opts.map(function(m,i){
    var checked=_methodsDraft.some(function(d){return methodsMatch(d,m);});
    return '<div class="method-item'+(checked?' selected':'')+'" onclick="toggleMethodDraft('+i+')">'
      +'<div class="method-check'+(checked?' checked':'')+'">'+( checked?'✓':'')+'</div>'
      +'<div class="method-text">'+esc(m)+'</div>'
      +'</div>';
  }).join('');
}
window.toggleMethodDraft = function(i){
  var m=_methodOpts[i]; if(m===undefined) return;
  var idx=-1;
  _methodsDraft.forEach(function(d,j){if(methodsMatch(d,m))idx=j;});
  if(idx>-1){ _methodsDraft.splice(idx,1); }
  else { _methodsDraft.push(m); }
  renderMethodsModalList();
};
var _methodInlineOpts=[];

  if(!opts||!opts.length) return '<div class="empty">Loading...</div>';
  _methodInlineOpts=opts.slice();

  opts.forEach(function(m,i){
    var checked=draftArr.some(function(d){return methodsMatch(d,m);});
    h+='<div class="method-item'+(checked?' selected':'')+'" onclick="toggleMethodInline('+i+')">'
      +'<div class="method-check'+(checked?' checked':'')+'">'+( checked?'✓':'')+'</div>'
      +'<div class="method-text">'+esc(m)+'</div>'
      +'</div>';
  });
  h+='</div>';
  return h;
}
window.toggleMethodInline = function(i){
  var m=_methodInlineOpts[i]; if(m===undefined) return;

function toTitleCase(str){
  return str.replace(/[^\s]+/g,function(w){
    if(w.length<=5&&w===w.toUpperCase()&&/^[A-Z]+$/.test(w)) return w;
    return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
  });
}

window.filterLangs = function(q){

    var sel=_languages.indexOf(lang)>-1;
    return '<div class="lang-list-item'+(sel?' selected':'')+'" onclick="toggleLang(\''+esc(lang)+'\')">'

    +'</div>'

    +(_methods.length
      ?_methods.map(function(m){return '<div class="profile-tag" style="background:var(--input-bg);border-color:var(--border);color:var(--soft);font-size:12px;">'+esc(m)+'</div>';}).join('')
      :'<span style="font-size:13px;color:var(--muted);">What comes most naturally to you?</span>')
    +'</div>'
    +'<div class="profile-tags">'
    +(_skills.length
      ?_skills.map(function(r,i){
          var lv=r.level||'';

          var lvOpts=['Entry Level','Mid Level','Expert Level'];

          var missingTag=missingLevel?'<span style="font-size:11px;color:#d32f2f;font-weight:500;margin-left:4px;cursor:pointer;" onclick="openCatPicker(\'2\','+i+')">Category missing ▾</span>':'';
          return '<div style="position:relative;display:inline-block;"><div class="profile-tag"'+(missingLevel?' style="border-color:#d32f2f;"':'')+'>'+esc(r.item)+(lv?'<span class="tag-level">'+esc(lv)+'</span>':'')+missingTag+'</div>'+picker+'</div>';

function buildValAddedHTML(arr, label){
  if(!arr.length) return '';

  var valShowArrow=arr.length>7;
  var valArrowSpan=valShowArrow?'<span id="'+arrowId+'" style="font-size:12px;color:white;">▼</span>':'';
  var valHdrClick=valShowArrow?' onclick="toggleValSection(\''+bodyId+'\',\''+arrowId+'\')"':'';
  var valHdrCursor=valShowArrow?'cursor:pointer;':'';
  h+='<div class="added-header-row" style="'+valHdrCursor+'background:var(--brand);border-radius:8px;padding:8px 12px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;"'+valHdrClick+'>';

  h+='<div style="display:flex;align-items:center;gap:8px;">';
  h+='<button class="level-help-btn" style="border-color:rgba(255,255,255,0.5);color:white;" onclick="event.stopPropagation();toggleLevelHelp(\'3\')">?</button>';
  h+=valArrowSpan;
  h+='</div></div>';
  h+='<div id="'+bodyId+'" style="display:block;"><div class="practice-grid">';
  arr.forEach(function(item,i){
    // Calculate combined index: if this item is in _domains, add _values.length
    var idx=i;
    if(arr===_domains) idx=_values.length+i;
    var btns='';
    ['Exploring','Engaged','Leading'].forEach(function(lv){
      var sel=item.level===lv;
      btns+='<button class="practice-btn'+(sel?' selected':'')+'" onclick="setLevel(\'3\','+idx+',\''+lv+'\')">'+lv+'</button>';
    });
    h+='<div class="practice-item">';
    h+='<div class="practice-item-header">';
    h+='<div>';
    h+='<div class="practice-item-name">'+esc(item.item)+'</div>';
    if(item.category){
      var isDom=String(item.category).toLowerCase()==='domain';
      var catColor=isDom?'var(--brand)':'var(--muted)';
      var catLabel=isDom?'Domain':item.category;
      h+='<div style="font-size:11px;color:'+catColor+';margin-top:2px;">'+esc(catLabel)+'</div>';

    h+='<div class="practice-options">'+btns+'</div>';
    h+='</div>';
  });

  return h;

    if(missing.length){
      var ex=document.getElementById('skill-reminder');
      if(!ex){
        var nr=document.createElement('div');
        nr.id='skill-reminder';nr.className='reminder-msg';
        nr.textContent='Gentle reminder: '+missing.map(function(s){return s.item;}).join(', ')+(missing.length===1?' is':' are')+' still missing a level.';
        var nav=document.querySelector('.nav-row');
        if(nav) nav.parentNode.insertBefore(nr,nav);
        return;
      }
    }
    autoSave();
    _screen2step='postal'; render(); return;
  }
  if(_screen===2&&!_editMode&&_screen2step==='postal'){
    var inp=document.getElementById('postal-input');
    if(inp) _postal=inp.value.trim();
    autoSave();
    _screen++; render(); return;
  }
  if(_screen===2){
    // edit mode or fallback: check skill levels then advance
    var missing2=_skills.filter(function(s){return !s.level;});
    if(missing2.length){
      var ex2=document.getElementById('skill-reminder');
      if(!ex2){
        var nr2=document.createElement('div');
        nr2.id='skill-reminder';nr2.className='reminder-msg';
        nr2.textContent='Gentle reminder: '+missing2.map(function(s){return s.item;}).join(', ')+(missing2.length===1?' is':' are')+' still missing a level.';
        var nav2=document.querySelector('.nav-row');
        if(nav2) nav2.parentNode.insertBefore(nr2,nav2);
        return;
      }
    }
  }
  autoSave();
  if(_screen===4){
    // After needs, move to expression screen
    _screen='1b'; render(); return;
  }
  if(_screen==='1b'){
    // After expression, move to share/completion
    _completed=true; _hasProfile=true; _screen='share'; render(); return;
  }
  if(_screen==='share'){
    // Complete intake
    _screen=0; render(); return;
  }
  if(_screen===3&&!_editMode&&_valTab!=='domains'){
    _valTab='domains'; renderScreen3(null); return;
  }
  if(_screen===1){ _screen++; render(); return; }
  _screen++; render();
};

window.goBack = function(){
  if(_screen===2&&!_editMode&&_screen2step==='postal'){
    _screen2step='skills'; render(); return;
  }
  if(_screen===2&&!_editMode&&_screen2step==='skills'){
    _screen2step='naturally'; render(); return;
  }
  if(_screen===2&&!_editMode&&_screen2step==='naturally'){
    _screen2step='lang'; render(); return;
  }
  if(_screen===2&&!_editMode&&_screen2step==='lang'){
    _screen=1; render(); return;
  }
  if(_screen==='1b'){ _screen=4; render(); return; }
  if(_screen==='share'){ _screen='1b'; render(); return; }
  if(_screen===3&&!_editMode&&_valTab==='domains'){
    _valTab=''; renderScreen3(null); return;
  }
  if(_screen<=1){ return; }
  _screen--; render();
};

// ─── Boot ─────────────────────────────────────────────────────────────────────
(async function init(){
  if(_viewerMode){ await Promise.all([loadRefData(),loadProfile(),loadIntake()]); render(); return; }
  if(!_appearId){ render(); return; }
  await Promise.all([loadRefData(),loadProfile(),loadIntake()]);
  if(_hasProfile){
    _completed=true;
    // Only redirect if data actually loaded from sheet (at least one section has data)
    // Prevents redirect loop when GAS fetch fails or returns empty
    var _dataLoaded=(_interests.length||_skills.length||_values.length||_methods.length||_languages.length);
    if(_dataLoaded){
      if(!_interests.length){ _screen=1; render(); return; }
      if(!_skills.length){ _screen=2; _screen2step='skills'; render(); return; }
      if(!_values.length){ _screen=3; render(); return; }
    }
    _screen=0;
  }
  render();
})();
</script>
