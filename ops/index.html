<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%2310B981'/><stop offset='33%25' stop-color='%233B82F6'/><stop offset='66%25' stop-color='%238B5CF6'/><stop offset='100%25' stop-color='%23F43F5E'/></linearGradient></defs><circle cx='18' cy='18' r='16' fill='transparent' stroke='url(%23g)' stroke-width='3'/></svg>">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://2gather.network/nav/identity.js?v=8"></script>
<style>
  :root{
    --bg:#1F5C86; --card:#fff; --text:#1B2733; --muted:#5B6B7C;
    --brand:#1F699E; --line:#E3E9EF; --warn:#B4451F; --warnbg:#FCEFE9;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
       padding:28px 20px 80px;min-height:100vh;}
  .wrap{max-width:1040px;margin:0 auto;}
  h1{font-size:22px;margin:0 0 4px;color:#fff;}
  .sub{color:#CBDCEA;font-size:14px;margin:0 0 22px;}
  .card{background:var(--card);border-radius:14px;padding:22px;margin-bottom:18px;}
  h2{font-size:17px;margin:0 0 14px;}
  p{line-height:1.55;}
  label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;}
  input{width:100%;max-width:280px;border:1px solid var(--line);border-radius:8px;
        padding:11px 13px;font-family:inherit;font-size:15px;color:var(--text);outline:none;}
  input:focus{border-color:var(--brand);}
  .btn{background:var(--brand);color:#fff;border:0;border-radius:22px;padding:11px 22px;
       font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
  .btn:disabled{opacity:.5;cursor:default;}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  .say{font-size:14px;color:var(--muted);margin-top:12px;min-height:20px;}
  .say.bad{color:var(--warn);}
  .hide{display:none;}
  .scroll{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;font-size:14px;}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
     cursor:pointer;user-select:none;}
  th:hover{color:var(--brand);}
  td.num,th.num{text-align:right;}
  .flag{background:var(--warnbg);color:var(--warn);border-radius:11px;padding:2px 9px;
        font-size:12px;font-weight:700;}
  .tot{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:16px;}
  .tot div{font-size:13px;color:var(--muted);}
  .tot b{display:block;font-size:26px;color:var(--text);font-weight:700;}
  .globe{font-size:19px;line-height:1;padding:10px 16px;}
  #pin{max-width:130px;letter-spacing:.18em;text-align:center;}
  .loading{color:#CBDCEA;font-size:15px;margin:6px 0 0;}
  .fold{background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:0;}
  .fold::before{content:'\25BE ';font-size:.8em;color:var(--muted);}
  .fold.shut::before{content:'\25B8 ';}
  .tot .tile{cursor:pointer;border-radius:8px;padding:4px 8px;margin:-4px -8px;}
  .tot .tile:hover{background:#F1F5F9;}
  .tot .tile.on{background:var(--brand);color:#fff;}
  .tot .tile.on b{color:#fff;}
  .chips{display:flex;flex-wrap:wrap;gap:4px;max-width:230px;}
  .chips button{background:#fff;border:1px solid var(--line);border-radius:12px;
                padding:3px 9px;font-family:inherit;font-size:12px;color:var(--muted);
                cursor:pointer;white-space:nowrap;}
  .chips button:hover{border-color:var(--brand);color:var(--brand);}
  .chips button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700;}
  .reset{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;
         padding:4px 6px;font-family:inherit;}
  .reset:hover{color:var(--brand);text-decoration:underline;}
  .headrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .key{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.7;}
  .key b{color:var(--text);font-weight:700;}
  tr.filters td{padding:4px 8px 10px;border-bottom:1px solid var(--line);}
  tr.filters input{width:100%;min-width:80px;max-width:none;font-size:13px;padding:5px 8px;
                   border-radius:6px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <!-- The page draws nothing until the server says this person may see it. Not a hidden panel,
       not an empty table: nothing. Anybody else gets a blank page and learns nothing from it. -->
  <!-- An unlabelled box and a globe. Nothing here says what the page is, so somebody who finds
       the address learns nothing from it. -->
  <div class="card" id="gate">
    <div class="row">
      <input id="who" type="email" autocomplete="email" placeholder=" " style="max-width:250px;">
      <button class="btn globe" id="send" title="Send a code">&#127760;</button>
    </div>
    <div class="row hide" id="pinRow" style="margin-top:12px;">
      <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
      <button class="btn" id="go">Open</button>
    </div>
    <div class="say" id="s2"></div>
  </div>

  <p class="loading hide" id="loading">Loading data...</p>

  <div class="card hide" id="pboard">
    <div class="headrow">
      <h2><button class="fold" id="pfold" title="Hide or show">People</button></h2>
      <button class="reset" id="preset">reset</button>
    </div>
    <div id="pbody">
    <div class="tot" id="ptot"></div>
    <p class="key">
      <b>knocked</b> gave an address and never came in &nbsp;·&nbsp;
      <b>created account</b> &nbsp;·&nbsp; <b>completed intro</b> &nbsp;·&nbsp;
      <b>joined group</b> &nbsp;·&nbsp; <b>created group</b>
      <br><span style="opacity:.8">The event stages come next and need the registration data.</span>
    </p>
    <div class="row" style="margin-bottom:12px;">
      <input id="q" placeholder="Search everything on a person's row" style="max-width:340px;">
      <label style="font-weight:400;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px;margin:0;">
        <input type="checkbox" id="onlyTest" style="width:auto;"> only test accounts
      </label>
    </div>
    <div class="scroll"><table id="ptbl">
      <thead>
        <tr>
          <th data-k="name">Name</th>
          <th data-k="cwid">ID</th>
          <th data-k="email">Address</th>
          <th data-k="stage">Stage</th>
          <th data-k="roles">Roles</th>
          <th data-k="groups" class="num">Groups</th>
          <th data-k="made">Signed up</th>
          <th data-k="lastSeen">Last seen</th>
        </tr>
        <tr class="filters">
          <td><input data-f="name" placeholder="filter"></td>
          <td><input data-f="cwid" placeholder="filter"></td>
          <td><input data-f="email" placeholder="filter"></td>
          <td><div class="chips" data-f="stage">
                <button type="button" data-v="knocked">knocked</button>
                <button type="button" data-v="created account">created account</button>
                <button type="button" data-v="completed intro">completed intro</button>
                <button type="button" data-v="joined group">joined group</button>
                <button type="button" data-v="created group">created group</button>
              </div></td>
          <td><div class="chips" data-f="roles">
                <button type="button" data-v="superAdmin">superAdmin</button>
                <button type="button" data-v="admin">admin</button>
                <button type="button" data-v="partner">partner</button>
                <button type="button" data-v="guest">guest</button>
                <button type="button" data-v="member">member</button>
                <button type="button" data-v="groupHost">host</button>
                <button type="button" data-v="groupCoHost">co-host</button>
              </div></td>
          <td><input data-f="groups" placeholder="filter"></td>
          <td><input data-f="made" placeholder="filter"></td>
          <td><input data-f="lastSeen" placeholder="filter"></td>
        </tr>
      </thead>
      <tbody></tbody>
    </table></div>
    <p style="color:var(--muted);font-size:13px;margin:14px 0 0;" id="pmore"></p>
    </div>
  </div>

  <div class="card hide" id="board">
    <div class="headrow">
      <h2><button class="fold" id="gfold" title="Hide or show">Groups</button></h2>
      <button class="reset" id="greset">reset</button>
    </div>
    <div id="gbody">
    <div class="tot" id="tot"></div>
    <div class="row" style="margin-bottom:12px;">
      <input id="gq" placeholder="Search everything on a group's row" style="max-width:340px;">
    </div>
    <div class="scroll"><table id="tbl">
      <thead>
        <tr>
          <th data-k="name">Group</th>
          <th data-k="members" class="num">Members</th>
          <th data-k="created">Created</th>
          <th data-k="hostName">Host</th>
          <th data-k="passcode">Passcode</th>
        </tr>
        <tr class="filters">
          <td><input data-f="name" placeholder="filter"></td>
          <td><input data-f="members" placeholder="filter"></td>
          <td><input data-f="created" placeholder="filter"></td>
          <td><input data-f="hostName" placeholder="filter"></td>
          <td><input data-f="passcode" placeholder="filter"></td>
        </tr>
      </thead>
      <tbody></tbody>
    </table></div>
    <p style="color:var(--muted);font-size:13px;margin:14px 0 0;" id="gmore"></p>
    </div>
  </div>
</div>

<script>
(function(){
  var GS='https://cw-api-gate.jessieupp.workers.dev';
  var me=(window.CW_ID||'').trim();
  var token='';
  var rows=[];
  var sortK='members', sortDown=true;
  var people=[], pSortK='made', pSortDown=true, SHOW=200, pDays=0;

  var $=function(id){ return document.getElementById(id); };
  var say=function(el,msg,bad){ var n=$(el); n.textContent=msg||''; n.className='say'+(bad?' bad':''); };

  // An hour's session, kept so a refresh does not ask again. The server decides when it expires;
  // this only remembers what it already handed out. Cleared the moment it stops working.
  var KEY='cw-ops-session';
  function remember(id,tok){
    try{ localStorage.setItem(KEY, JSON.stringify({id:id,tok:tok,until:Date.now()+55*60*1000})); }catch(e){}
  }
  function forget(){ try{ localStorage.removeItem(KEY); }catch(e){} }
  function recall(){
    try{
      var v=JSON.parse(localStorage.getItem(KEY)||'null');
      if(v && v.tok && v.until>Date.now()) return v;
    }catch(e){}
    return null;
  }

  var back=recall();
  if(back){
    me=back.id; token=back.tok;
    $('gate').classList.add('hide');
    load();
  }

  // The address, typed once and kept, so signing in again is the globe and the code.
  if(!back){
    try{ var w=localStorage.getItem('cw-ops-who'); if(w) $('who').value=w; }catch(e){}
  }

  var addr=function(){ return ($('who').value||'').trim(); };

  $('send').addEventListener('click', function(){
    // An empty box used to do nothing at all and say nothing, which reads as a broken page.
    if(!addr() && !me){ $('who').focus(); return; }
    $('send').disabled=true;
    say('s2','');
    fetch(GS+'?action=sendOpsPin&email='+encodeURIComponent(addr())
          +'&appearId='+encodeURIComponent(addr()?'':me)+'&t='+Date.now())
      .then(function(r){ return r.json(); })
      .then(function(){
        // Advances the same way whatever the answer, so this cannot be used to find out who is
        // an operator. Only a server that could not be reached is worth saying out loud.
        $('send').disabled=false;
        try{ localStorage.setItem('cw-ops-who', addr()); }catch(e){}
        $('pinRow').classList.remove('hide');
        $('pin').focus();
      })
      .catch(function(){ $('send').disabled=false; say('s2','Could not reach the server.',true); });
  });

  $('go').addEventListener('click', function(){
    var code=($('pin').value||'').replace(/\s/g,'');
    if(!code){ say('s2','Type the code from your email.',true); return; }
    $('go').disabled=true;
    say('s2','Checking...');
    fetch(GS+'?action=verifyOpsPin&email='+encodeURIComponent(addr())
          +'&appearId='+encodeURIComponent(addr()?'':me)+'&code='+encodeURIComponent(code)+'&t='+Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d||d.status!=='ok'||!d.sessionToken){
          $('go').disabled=false;
          say('s2',(d&&d.message)||'That code does not match.',true);
          return;
        }
        token=d.sessionToken;
        if(d.id){ me=d.id; }
        remember(me, token);
        say('s2','');
        $('gate').classList.add('hide');
        document.title='Ops';
        load();
      })
      .catch(function(){ $('go').disabled=false; say('s2','Could not reach the server.',true); });
  });

  function load(){
    $('loading').classList.remove('hide');
    var done=0;
    var settled=function(){ if(++done>=2) $('loading').classList.add('hide'); };
    fetch(GS+'?action=getOpsGroups&appearId='+encodeURIComponent(me)
          +'&sessionToken='+encodeURIComponent(token)+'&t='+Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d||d.status!=='ok'){
          // The hour is up. Say so and ask, rather than show an empty page.
          forget(); token='';
          $('gate').classList.remove('hide');
          say('s2','That session has expired. Ask for another code.');
          return;
        }
        rows=d.groups||[];
        var people=0; rows.forEach(function(g){ people+=g.members||0; });
        // Two different things. Memberships counts a person once per group they are in; people
        // counts each person once however many groups they are in.
        $('tot').innerHTML=
          '<div><b>'+rows.length+'</b>groups</div>'+
          '<div><b>'+(d.uniquePeople||0)+'</b>people belong to a group</div>'+
          '<div><b>'+people+'</b>joins in total, counting somebody once per group</div>'+
          '<div><b>'+(rows.length? Math.round(people/rows.length):0)+'</b>members in the average group</div>';
        $('board').classList.remove('hide');
        paint();
        settled();
      })
      .catch(function(){ settled(); });

    fetch(GS+'?action=getOpsPeople&appearId='+encodeURIComponent(me)
          +'&sessionToken='+encodeURIComponent(token)+'&t='+Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d||d.status!=='ok'){ return; }
        people=d.people||[];
        // Counted from the stage names the server actually sends. These read zero for a while
        // because the tiles still counted the old names after the stages were renamed. 2026-09-01.
        var by={};
        people.forEach(function(p){ by[p.stage]=(by[p.stage]||0)+1; });
        var since=function(days){
          var cut=new Date(Date.now()-days*86400000).toISOString();
          return people.filter(function(p){ return String(p.made) >= cut; }).length;
        };
        var tile=function(n, label, act, val){
          return '<div class="tile" data-act="'+act+'" data-val="'+val+'"><b>'+n+'</b>'+label+'</div>';
        };
        $('ptot').innerHTML=
          tile(people.length,'people','all','')+
          tile(since(7),'joined in 7 days','days','7')+
          tile(since(30),'joined in 30 days','days','30')+
          tile(by['knocked']||0,'knocked','stage','knocked')+
          tile(by['created account']||0,'created account','stage','created account')+
          tile(by['completed intro']||0,'completed intro','stage','completed intro')+
          tile(by['joined group']||0,'joined group','stage','joined group')+
          tile(by['created group']||0,'created group','stage','created group');

        // Every tile is a filter. Clicking one shows exactly the people it counted.
        Array.prototype.forEach.call($('ptot').querySelectorAll('.tile'), function(t){
          t.addEventListener('click', function(){
            var act=t.getAttribute('data-act'), val=t.getAttribute('data-val');
            if(act==='all'){ resetFilters('#ptbl', function(){}); pDays=0; }
            else if(act==='days'){ pDays=Number(val); }
            else {
              pDays=0;
              Array.prototype.forEach.call(document.querySelectorAll('#ptbl .chips[data-f="stage"] button'), function(b){
                b.classList.toggle('on', b.getAttribute('data-v')===val);
              });
            }
            Array.prototype.forEach.call($('ptot').querySelectorAll('.tile'), function(x){ x.classList.remove('on'); });
            if(act!=='all') t.classList.add('on');
            ppaint();
          });
        });
        $('pboard').classList.remove('hide');
        ppaint();
        settled();
      })
      .catch(function(){ settled(); });
  }

  function colFilters(sel){
    var out={};
    Array.prototype.forEach.call(document.querySelectorAll(sel+' tr.filters input'), function(i){
      var v=(i.value||'').trim().toLowerCase();
      if(v) out[i.getAttribute('data-f')]=v;
    });
    // Chips you click on and off. Picking member and host means somebody who is both. Picking
    // two stages means either, since nobody is at two stages at once.
    Array.prototype.forEach.call(document.querySelectorAll(sel+' tr.filters .chips'), function(box){
      var picked=[];
      Array.prototype.forEach.call(box.querySelectorAll('button.on'), function(b){
        picked.push(String(b.getAttribute('data-v')).toLowerCase());
      });
      if(picked.length){
        var f=box.getAttribute('data-f');
        out[f]= (f==='stage') ? {any:picked} : picked;
      }
    });
    return out;
  }
  function passes(row, f){
    for(var k in f){
      var have=String(row[k]==null?'':row[k]).toLowerCase();
      var want=f[k];
      if(want && want.any){
        var hit=false;
        for(var j=0;j<want.any.length;j++){ if(have===want.any[j]){ hit=true; break; } }
        if(!hit) return false;
      } else if(Object.prototype.toString.call(want)==='[object Array]'){
        for(var i=0;i<want.length;i++){ if(have.indexOf(want[i])===-1) return false; }
      } else if(have.indexOf(want)===-1){ return false; }
    }
    return true;
  }
  function resetFilters(sel, repaint){
    Array.prototype.forEach.call(document.querySelectorAll(sel+' tr.filters input'), function(i){ i.value=''; });
    Array.prototype.forEach.call(document.querySelectorAll(sel+' tr.filters .chips button'), function(b){
      b.classList.remove('on');
    });
    repaint();
  }

  function ppaint(){
    var q=($('q').value||'').trim().toLowerCase();
    var onlyTest=$('onlyTest').checked;
    var f=colFilters('#ptbl');
    var list=people.filter(function(p){
      // Ticked means show only test accounts. Unticked hides them.
      if(onlyTest ? !p.test : p.test) return false;
      // The box searches everything on the person's row, not only name and address.
      if(pDays){
        var cut=new Date(Date.now()-pDays*86400000).toISOString();
        if(String(p.made) < cut) return false;
      }
      if(q && String(p.blob||'').indexOf(q)===-1
           && (String(p.name)+' '+String(p.email)).toLowerCase().indexOf(q)===-1) return false;
      return passes(p, f);
    });
    list.sort(function(a,b){
      var x=a[pSortK], y=b[pSortK];
      if(typeof x==='number'&&typeof y==='number'){ return pSortDown? y-x : x-y; }
      x=String(x||'').toLowerCase(); y=String(y||'').toLowerCase();
      return pSortDown? (x<y?1:x>y?-1:0) : (x>y?1:x<y?-1:0);
    });
    var b=document.querySelector('#ptbl tbody');
    b.innerHTML='';
    list.slice(0,SHOW).forEach(function(p){
      var tr=document.createElement('tr');
      for(var i=0;i<8;i++){ tr.appendChild(document.createElement('td')); }
      tr.children[0].textContent=p.name||'(no name)';
      tr.children[1].textContent=p.ids||p.cwid||'';
      tr.children[1].style.cssText='font-size:12px;color:var(--muted);';
      tr.children[2].textContent=p.email||'';
      tr.children[3].textContent=p.stage;
      tr.children[4].textContent=p.roles||'';
      tr.children[5].textContent=p.groups; tr.children[5].className='num';
      tr.children[6].textContent=p.made? String(p.made).slice(0,10) : '';
      tr.children[7].textContent=p.lastSeen? String(p.lastSeen).slice(0,10) : '';
      if(!p.name){ var s2=document.createElement('span'); s2.className='flag'; s2.textContent='no name';
                   tr.children[0].textContent=''; tr.children[0].appendChild(s2); }
      b.appendChild(tr);
    });
    $('pmore').textContent = list.length>SHOW
      ? ('Showing the first '+SHOW+' of '+list.length+'. Narrow it with the box above.')
      : (list.length+' shown.');
  }

  $('q').addEventListener('input', ppaint);
  $('onlyTest').addEventListener('change', ppaint);
  Array.prototype.forEach.call(document.querySelectorAll('#ptbl th'), function(th){
    th.addEventListener('click', function(){
      var k=th.getAttribute('data-k');
      if(k===pSortK){ pSortDown=!pSortDown; } else { pSortK=k; pSortDown=true; }
      ppaint();
    });
  });

  function paint(){
    var gq=($('gq').value||'').trim().toLowerCase();
    var gf=colFilters('#tbl');
    rows.sort(function(a,b){
      var x=a[sortK], y=b[sortK];
      if(typeof x==='number'&&typeof y==='number'){ return sortDown? y-x : x-y; }
      x=String(x||'').toLowerCase(); y=String(y||'').toLowerCase();
      return sortDown? (x<y?1:x>y?-1:0) : (x>y?1:x<y?-1:0);
    });
    var b=document.querySelector('#tbl tbody');
    b.innerHTML='';
    var shown=rows.filter(function(g){
      if(gq && String(g.blob||'').indexOf(gq)===-1
            && String(g.name||'').toLowerCase().indexOf(gq)===-1) return false;
      return passes(g, gf);
    });
    shown.forEach(function(g){
      var tr=document.createElement('tr');
      for(var i=0;i<5;i++){ tr.appendChild(document.createElement('td')); }
      tr.children[0].textContent=g.name||'(no name)';
      tr.children[1].textContent=g.members||0; tr.children[1].className='num';
      tr.children[2].textContent=g.created? String(g.created).slice(0,10) : '';
      tr.children[3].textContent=g.hostName||'';
      if(g.passcode==='set'){ tr.children[4].textContent='set'; }
      else { var s=document.createElement('span'); s.className='flag'; s.textContent='missing'; tr.children[4].appendChild(s); }
      b.appendChild(tr);
    });
    $('gmore').textContent=shown.length+' shown.';
  }

  var fold=function(btn, body){
    $(btn).addEventListener('click', function(){
      var shut=$(body).classList.toggle('hide');
      $(btn).classList.toggle('shut', shut);
    });
  };
  fold('pfold','pbody');
  fold('gfold','gbody');

  $('preset').addEventListener('click', function(){
    $('q').value=''; $('onlyTest').checked=false; pDays=0;
    Array.prototype.forEach.call($('ptot').querySelectorAll('.tile'), function(x){ x.classList.remove('on'); });
    resetFilters('#ptbl', ppaint);
  });
  $('greset').addEventListener('click', function(){ $('gq').value=''; resetFilters('#tbl', paint); });
  Array.prototype.forEach.call(document.querySelectorAll('tr.filters .chips button'), function(b){
    b.addEventListener('click', function(){
      b.classList.toggle('on');                       // click again to unpick it
      (b.closest('#ptbl') ? ppaint : paint)();
    });
  });
  $('gq').addEventListener('input', paint);
  Array.prototype.forEach.call(document.querySelectorAll('#tbl tr.filters input'), function(i){
    i.addEventListener('input', paint);
  });
  Array.prototype.forEach.call(document.querySelectorAll('#ptbl tr.filters input'), function(i){
    i.addEventListener('input', ppaint);
  });

  Array.prototype.forEach.call(document.querySelectorAll('#tbl th'), function(th){
    th.addEventListener('click', function(){
      var k=th.getAttribute('data-k');
      if(k===sortK){ sortDown=!sortDown; } else { sortK=k; sortDown=true; }
      paint();
    });
  });
})();
</script>
