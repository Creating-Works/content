<!-- Design A profile (preview). Standalone test page; promote to intake.html when approved.

<title>My profile · Design A (preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap">
<style>
  :root{--bg:#1F699E;--card:#fff;--ink:#1A2E42;--soft:#4B5A6D;--muted:#6B7A8D;--line:#DDE4EE;--panel:#F7FBFF;--panel-line:#C9DFF3;--brand:#1F699E;--done:#2E9E6B;--amber:#B36A0F;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);}
  .wrap{max-width:820px;margin:0 auto;padding:24px 20px 60px;}
  .preview-tag{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 13px;font-size:12px;font-weight:700;letter-spacing:.03em;margin-bottom:14px;}
  .breadcrumb{color:#fff;font-size:14px;font-weight:600;margin-bottom:16px;opacity:.92;}
  .stepper{display:flex;align-items:flex-start;margin-bottom:18px;border:1px solid rgba(255,255,255,.3);border-radius:12px;background:rgba(255,255,255,.06);padding:16px 18px;}
  .stp{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;cursor:pointer;}
  .stp::before{content:'';position:absolute;top:14px;left:-50%;width:100%;height:2px;background:rgba(255,255,255,.3);z-index:1;}
  .stp:first-child::before{display:none;}
  .stp.done::before{background:var(--done);}
  .stp .dot{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.5);color:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:var(--bg);z-index:2;transition:all .12s;}
  .stp .lbl{margin-top:7px;font-size:12px;font-weight:700;color:rgba(255,255,255,.7);text-align:center;}
  .stp:hover .dot{border-color:#fff;color:#fff;}
  .stp.on .dot{background:#fff;border-color:#fff;color:var(--brand);}
  .stp.on .lbl{color:#fff;}
  .stp.done .dot{background:var(--done);border-color:var(--done);color:#fff;}
  .stp.done .lbl{color:rgba(255,255,255,.9);}
  .headrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  h1{color:#fff;font-size:24px;font-weight:800;margin:0;line-height:1.25;}
  .summary{color:#fff;font-size:14px;font-weight:700;opacity:.85;white-space:nowrap;}
  .list{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:680px){.list{grid-template-columns:1fr;}}
  .list.flow{display:block;background:#fff;border-radius:14px;padding:20px 22px;}
  .needcard{background:#fff;border:1px solid var(--panel-line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
  .needcard .cardtitle{background:var(--brand);color:#fff;font-size:15px;font-weight:600;padding:12px 16px;line-height:1.3;}
  .needcard .cardtitle input{width:100%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);border-radius:8px;outline:none;color:#fff;font-family:inherit;font-size:15px;font-weight:600;padding:8px 11px;}
  .needcard .cardtitle input:focus{background:rgba(255,255,255,.24);border-color:#fff;}
  .needcard .cardtitle input::placeholder{color:rgba(255,255,255,.6);}
  .needcard .body{padding:14px 16px;display:flex;flex-direction:column;}
  .sub-label{font-size:13px;font-weight:700;color:var(--soft);margin:14px 0 6px;}
  .sub-label:first-of-type{margin-top:0;}
  .cat-row{display:flex;flex-wrap:wrap;gap:6px;}
  .cat{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;user-select:none;transition:all .12s;}
  .cat:hover{border-color:var(--brand);color:var(--brand);}
  .cat.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  .cat.more{color:var(--muted);background:transparent;border-style:dashed;}
  .cat.more:hover{color:var(--brand);border-color:var(--brand);}
  .extras{display:none;flex-wrap:wrap;gap:6px;margin-top:6px;width:100%;}
  .extras.on{display:flex;}
  input[type=text]{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;line-height:1.5;background:#fff;color:var(--ink);}
  input[type=text]:focus{outline:none;border-color:var(--brand);}
  input::placeholder{color:#9AA8B7;}
  .cardfoot{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .footbtn{border-radius:20px;padding:7px 15px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;background:#fff;}
  .footbtn.met{border:1.5px solid var(--brand);color:var(--brand);}
  .footbtn.met:hover{background:#EAF3FB;}
  .removelink{margin-left:auto;background:none;border:0;color:var(--soft);font-family:inherit;font-size:13px;font-weight:400;text-decoration:underline;cursor:pointer;padding:4px 0;}
  .removelink:hover{color:#C0392B;}
  .confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;}
  .confirm .q{font-size:13px;font-weight:700;color:#C0392B;flex:1;}
  .confirm .yes{background:#C0392B;border:0;color:#fff;border-radius:16px;padding:6px 13px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .confirm .no{background:#fff;border:1.5px solid var(--line);color:var(--soft);border-radius:16px;padding:6px 13px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .metchoice{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;}
  .metq{font-size:13px;font-weight:700;color:var(--soft);flex:1;}
  .addtile{display:flex;align-items:center;justify-content:center;gap:9px;align-self:start;background:var(--brand);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;padding:13px 16px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;transition:filter .12s;}
  .addtile:hover{filter:brightness(1.1);}
  .addtile .plus{font-size:20px;line-height:1;}
  .met-section{margin-top:28px;display:none;}
  .met-section.show{display:block;}
  .met-header{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:12px;padding:13px 16px;color:#fff;font-size:15px;font-weight:800;}
  .met-header .caret{transition:transform .15s;}
  .met-header.open .caret{transform:rotate(180deg);}
  .met-list{display:none;margin-top:12px;}
  .met-list.open{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:680px){.met-list.open{grid-template-columns:1fr;}}
  .metcard{background:#fff;border:1px solid var(--panel-line);border-radius:14px;overflow:hidden;}
  .metcard .cardtitle{background:var(--brand);color:#fff;font-size:15px;font-weight:600;padding:12px 16px;display:flex;align-items:center;gap:8px;}
  .metcard .check{width:20px;height:20px;border-radius:50%;background:var(--done);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
  .metcard .body{padding:14px 16px;}
  .metcard .nudge{font-size:13px;color:var(--soft);margin-top:8px;line-height:1.5;}
  .moveback{display:inline-block;margin-top:2px;color:var(--brand);font-size:13px;font-weight:700;text-decoration:underline;cursor:pointer;}
  .appr-btn{background:#fff;border:1.5px solid var(--brand);color:var(--brand);border-radius:18px;padding:6px 13px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px;}
  .appr-box{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;}
  .appr-box.open{display:block;}
  .appr-results{display:none;margin-top:8px;}
  .appr-result{padding:8px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);}
  .appr-result:hover{border-color:var(--brand);color:var(--brand);}
  .appr-linkwrap{display:none;margin-top:10px;}
  .appr-textlink{color:var(--brand);font-size:13px;font-weight:700;text-decoration:underline;cursor:pointer;}
  .actions{display:flex;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap;}
  .btn{background:#fff;color:var(--brand);border:0;padding:11px 22px;border-radius:26px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
  .btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6);}
  /* Enjoy section — mirrors the current intake */
  .enjoy-q{font-size:20px;font-weight:800;color:var(--ink);margin:0 0 8px;line-height:1.25;}
  .enjoy-sub{color:var(--brand);font-size:14px;margin:0 0 12px;}
  .enjoy-search{display:flex;align-items:center;gap:8px;background:#F7F9FC;border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:14px;}
  .enjoy-search input{flex:1;border:0;background:transparent;outline:none;font-family:inherit;font-size:15px;color:var(--ink);padding:0;}
  /* copied from live intake.html */
  .added-header-row{background:var(--brand);border-radius:8px;padding:10px 14px;margin:16px 0 8px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .added-label{color:#fff;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
  .added-right{display:flex;align-items:center;gap:10px;}
  .level-help-btn{background:none;border:1.5px solid rgba(255,255,255,.6);border-radius:50%;width:22px;height:22px;font-size:12px;color:#fff;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;padding:0;}
  .added-arrow{color:#fff;font-size:12px;}
  .practice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
  .practice-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:0;}
  .practice-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .practice-item-name{font-size:14px;font-weight:600;color:var(--ink);}
  .practice-item-x{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;padding:0;line-height:1;}
  .practice-item-x:hover{color:var(--ink);}
  .practice-options{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .practice-btn{padding:6px 14px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-size:12px;color:var(--soft);cursor:pointer;font-family:inherit;transition:all .15s;}
  .practice-btn:hover{border-color:var(--brand);color:var(--brand);}
  .practice-btn.selected{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500;}
  .drill-crumb{font-size:14px;font-weight:700;margin-bottom:12px;}
  .drill-crumb a{color:var(--brand);text-decoration:underline;cursor:pointer;}
  .drill-crumb .sep{color:var(--muted);margin:0 6px;font-weight:400;}
  .drill-crumb .cur{color:var(--brand);}
  .ideas{color:var(--soft);font-style:italic;font-size:14px;margin:0 0 12px;}
  .addown{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:16px;margin:10px 0;}
  .addown input{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:15px;color:var(--ink);}
  .addown-label{font-size:14px;font-weight:700;color:var(--ink);margin:12px 0 8px;}
  .addown-results{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .addown-note{font-size:12px;font-weight:600;color:var(--soft);}
  .addown-hit{padding:9px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink);background:#fff;}
  .addown-hit:hover{border-color:var(--brand);color:var(--brand);}
  .addown-hit .tag{color:var(--muted);font-weight:500;font-size:12px;margin-left:6px;}
  .search-results{display:none;border:1px solid var(--line);border-radius:10px;margin:-6px 0 12px;overflow:hidden;}
  .search-hit{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line);background:#fff;}
  .search-hit:last-child{border-bottom:none;}
  .search-hit:hover{background:var(--panel);}
  .sh-name{font-size:15px;font-weight:600;color:var(--ink);}
  .sh-tag{font-size:12px;color:var(--soft);margin-top:1px;}
  .addown-actions{display:flex;align-items:center;gap:16px;}
  .addown-btn{background:var(--brand);color:#fff;border:0;border-radius:22px;padding:11px 22px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;}
  .addown-cancel{background:none;border:0;color:var(--soft);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
  .qlabel{font-size:16px;font-weight:800;color:var(--ink);margin:18px 0 8px;}
  .some-h{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin:16px 0 6px;}
  .some-item{display:flex;align-items:center;justify-content:space-between;background:#F7F9FC;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px;color:var(--ink);}
  .some-item .x{color:var(--muted);cursor:pointer;font-weight:700;}
  .some-input{flex:1;border:0;background:transparent;outline:none;font-family:inherit;font-size:15px;color:var(--ink);padding:0;}
  /* Skills — mirrors the current intake "What skill pays the bills?" */
  .lang-pill{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;border-radius:20px;padding:7px 14px;font-size:14px;font-weight:700;margin-bottom:12px;}
  .practice-item-cat{font-size:12px;font-weight:600;color:var(--brand);margin-top:2px;}
  .cat-missing{font-size:12px;font-weight:600;color:#C0392B;cursor:pointer;margin-top:2px;display:inline-block;}
  .cat-select{margin-top:6px;font-size:12px;padding:6px 8px;border-radius:6px;border:1.5px solid var(--brand);width:100%;font-family:inherit;color:var(--ink);background:#fff;}
  .methods-list{margin:8px 0 4px;}
  .method-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;border:1.5px solid transparent;margin-bottom:6px;transition:background .1s;}
  .method-item:hover{background:var(--panel);}
  .method-item.on{background:var(--panel);border-color:var(--brand);}
  .method-check{width:22px;height:22px;border-radius:5px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:#fff;font-weight:800;}
  .method-item.on .method-check{background:var(--brand);border-color:var(--brand);}
  .method-text{font-size:15px;color:var(--ink);line-height:1.4;}
  /* Shared profile view ("This is me") — the main screen others see */
  .crumb-link{color:#fff;text-decoration:underline;cursor:pointer;}
  .pv-card{background:#fff;border-radius:14px;padding:8px 24px 18px;}
  .pv-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 0 4px;}
  .pv-title{font-size:24px;font-weight:800;color:var(--ink);margin:0;}
  .pv-photo{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1.5px solid var(--panel-line);font-size:24px;flex-shrink:0;overflow:hidden;}
  .pv-section{padding:18px 0;border-bottom:1px solid var(--line);}
  .pv-section:last-child{border-bottom:none;}
  .pv-section-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .pv-section-label{font-size:18px;font-weight:800;color:var(--ink);}
  .pv-edit{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;border:0;border-radius:20px;padding:7px 15px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;}
  .pv-edit:hover{filter:brightness(1.08);}
  .pv-tags{display:flex;flex-wrap:wrap;gap:8px;}
  .pv-tag{background:#fff;border:1.5px solid var(--panel-line);border-radius:14px;padding:8px 15px;font-size:15px;font-weight:600;color:var(--brand);}
  .pv-tag .lv{color:var(--muted);font-weight:500;font-size:13px;margin-left:6px;}
  .pv-tag .sub{display:block;color:var(--soft);font-weight:500;font-size:12px;margin-top:1px;}
  .pv-tag.m{background:var(--panel);border-color:var(--line);color:var(--ink);font-size:13px;}
  .pv-sub-h{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:14px 0 8px;}
  .pv-sub-h:first-child{margin-top:0;}
  .pv-some{margin-top:10px;text-align:right;font-size:13px;color:var(--soft);}
  .pv-some b{text-transform:uppercase;font-size:10px;letter-spacing:.08em;color:var(--amber);font-weight:800;}
  .pv-bm{display:flex;align-items:center;gap:12px;padding:12px 0 0;}
  .pv-bm-av{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0;}
  .pv-bm-name{font-size:16px;font-weight:700;color:var(--ink);flex:1;}
  .pv-bm-x{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;}
  /* Needs — mirrors the intake "What are you seeking right now?" */
  .needs-crumb{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--brand);}
  .needs-crumb a{color:var(--brand);text-decoration:underline;cursor:pointer;}
  .needs-crumb .sep{color:var(--muted);margin:0 6px;font-weight:400;}
  .needs-detail-box{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:16px;margin:6px 0 12px;}
  .needs-add-btn{width:100%;margin-top:14px;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:13px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;}
  .local-line{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--ink);cursor:pointer;}
  .needs-group{margin-bottom:14px;}
  .needs-group-header{background:var(--brand);border-radius:8px;padding:9px 14px;margin-bottom:8px;color:#fff;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
  .need-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .need-item-left{flex:1;min-width:0;}
  .need-item-name{font-size:15px;font-weight:700;color:var(--ink);}
  .need-item-cat{font-size:12px;color:var(--soft);margin-top:2px;}
  .need-item-detail{font-size:12px;color:var(--brand);font-style:italic;margin-top:2px;}
  .need-item-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .need-icon-btn{background:none;border:0;cursor:pointer;font-size:15px;padding:0;line-height:1;}
  .local-toggle{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--soft);cursor:pointer;}
  .local-toggle.active{color:var(--brand);}
  .need-x{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;}
  .need-x:hover{color:var(--ink);}
  .needs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:680px){.needs-grid{grid-template-columns:1fr;}}
  .need-editor{background:var(--panel);border:2px solid var(--brand);border-radius:14px;padding:16px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px;}
  .need-editor input[type=text],.need-editor select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:15px;background:#fff;color:var(--ink);}
  .need-editor select{cursor:pointer;}
  .ne-level-label{font-size:12px;font-weight:700;color:var(--soft);margin-bottom:6px;}
  .ne-local{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);cursor:pointer;}
  .ne-actions{display:flex;gap:10px;margin-top:4px;}

  .ne-cancel{background:#fff;border:1.5px solid var(--line);color:var(--soft);border-radius:10px;padding:13px 22px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
</style>

<div class="wrap">
  <div class="preview-tag">🌱 Design A · preview</div>
  <div class="breadcrumb" id="breadcrumb"></div>

  <div id="profile-view"></div>

  <div id="edit-mode" style="display:none;">
    <div class="stepper" id="stepper"></div>

    <div class="headrow">
      <h1 id="sectitle">My needs</h1>
      <div class="summary" id="summary"></div>
    </div>

    <div class="list" id="list"></div>

<script>
  // ── Phase 3.3a: load a real profile (read-only). Escaping + intake's exact parsers. ──
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function _param(k){ try{ return new URLSearchParams(location.search).get(k)||''; }catch(e){ return ''; } }
  var _id = _param('id')||_param('show')||_param('CWid')||_param('me')||_param('memberCard')||_param('appearId')||'';
  var _profilePhoto='', _profileName='', _loaded={};
  var EXPRESSION_ADDED = ['My 2.5 pickleball game'];
  function parseNeedsStr(str){
    if(!str) return [];
    return String(str).split('|').filter(Boolean).map(function(s){
      var detail=''; var tio=s.indexOf('~');
      if(tio>-1){ try{ detail=decodeURIComponent(s.slice(tio+1)); }catch(e){ detail=s.slice(tio+1); } s=s.slice(0,tio); }
      var p=s.split(':'); var item=p[0]; var local=false, ntype='skill', category='';
      if(p[1]==='local'){ local=true; ntype=p[2]||'skill'; category=p.slice(3).join(':'); }
      else { ntype=p[1]||'skill'; category=p.slice(2).join(':'); }
      return {item:item, category:category, local:local, ntype:ntype, detail:detail};
    });
  }
  function parseTagStr(str,lk){
    if(!str) return [];
    return String(str).split('|').filter(Boolean).map(function(s){
      var p=s.split(':'); var o={item:p[0],category:p.length>=3?p[1]:''}; o[lk]=p.length>=3?(p[2]||''):(p[1]||''); return o;
    });
  }
  function loadProfile(d){
    try{
      _loaded={ postal:d.postal||'', retired:d.retired||'', bringType:d.bringType||'', wantsSignupList:d.wantsSignupList||'', languages:d.languages||'' };
      var na=parseNeedsStr(d.needs||'');
      if(na.length) NEEDS_ADDED = na.map(function(n){ return { item:n.item, type:(n.ntype==='skill'?'person':n.ntype==='space'?'space':'thing'), category:n.category||'', level:'', local:!!n.local, detail:n.detail||'' }; });
      var ia=parseTagStr(d.interests||'','level');
      if(ia.length) ENJOY_ADDED = ia.map(function(x){ return { t:x.item, sel:(x.level?String(x.level).split(',').map(function(s){return s.trim();}).filter(Boolean):[]) }; });
      var sa=parseTagStr(d.skills||'','level');
      if(sa.length) SKILLS_ADDED = sa.map(function(x){ return { t:x.item, cat:x.category||'', level:x.level||'' }; });
      var ma=(d.methods||'').split('|').filter(Boolean); if(ma.length) SKILL_METHODS_ON = ma;
      var va=parseTagStr(d.values||'','level'); if(va.length) VALUES_ADDED = va.map(function(x){ return { t:x.item, lvl:x.level||'' }; });
      var dm=parseTagStr(d.domains||'','level'); if(dm.length) DOMAINS_ADDED = dm.map(function(x){ return { t:x.item, lvl:x.level||'' }; });
      var ea=(d.expression||'').split('|').filter(Boolean); EXPRESSION_ADDED = ea.length?ea:[''];
      var ha=(d.haves||'').split('|').filter(Boolean);
      if(ha.length) SECTIONS[4].data = ha.map(function(t){ var p=t.split(':'); return { text:p[0]||'', cats:(p.length>1?[p.slice(1).join(':')]:[]), level:'', aud:'' }; });
    }catch(e){}
  }

  var CORE_CATS = ['Home & Transportation','Business & Finance','Skills & Services','Food & Drink'];
  var MORE_CATS = ['Nature & Outdoors','Events & Gatherings','Arts & Media','Pets & Animal Care','Health & Wellness','Education & Learning','Environment','Housing & Land'];

  var SECTIONS = [
    { tab:'Needs', base:'My needs', custom:'needs', data:[] },
    { tab:'Enjoy', base:'What I enjoy', custom:'enjoy', data:[] },
    { tab:'Skills', base:'My skills', custom:'skills', data:[] },
    { tab:'Values', base:'My values', custom:'values', data:[] },
    { tab:'Haves', base:'My haves', item:'have', addLabel:'Add a have', prompt:'What do you have to offer?',
      cats:true, levels:null, audience:false, met:false,
      data:[{text:'20 acres open for camping',cats:['Nature & Outdoors'],level:'',aud:''},
            {text:'A truck I can lend on weekends',cats:['Home & Transportation'],level:'',aud:''}] }
  ];

  var stepper = document.getElementById('stepper');
  var listEl = document.getElementById('list');
  var metListEl = document.getElementById('met-list');
  var curSec = 0;
  var SEC_DONE = [false,false,false,false,false];

  var addtile = document.createElement('button'); addtile.type='button'; addtile.className='addtile';

  function chip(lab, on, cls){ var d=document.createElement('div'); d.className='cat'+(cls?' '+cls:'')+(on?' on':''); d.textContent=lab; return d; }
  function label(text, cls){ var d=document.createElement('div'); d.className=cls; d.textContent=text; return d; }
  function metCount(){ return metListEl.children.length; }
  function sortAlpha(arr){ return arr.slice().sort(function(a,b){ return a.localeCompare(b); }); }
  // Live "did you mean" search for every add-your-own panel: as the person types, surface
  // existing items from the pool so they pick one instead of adding a near-duplicate.
  function matchExisting(inp, results, poolFn, onPick){
    inp.addEventListener('input', function(){
      results.innerHTML='';
      var q=inp.value.trim().toLowerCase();
      if(q.length<2) return;
      var seen={}, hits=[];
      poolFn().forEach(function(p){ var n=p.name.toLowerCase(); if(n.indexOf(q)===-1||seen[n]) return; seen[n]=1; hits.push(p); });
      hits=hits.slice(0,8);
      if(!hits.length) return;
      var note=document.createElement('div'); note.className='addown-note'; note.textContent='Did you mean one of these?'; results.appendChild(note);
      hits.forEach(function(h){ var row=document.createElement('div'); row.className='addown-hit'; row.textContent=h.name; if(h.tag){ var t=document.createElement('span'); t.className='tag'; t.textContent=h.tag; row.appendChild(t); } row.onclick=function(){ onPick(h); }; results.appendChild(row); });
    });
  }
  // Live search box (icon + input + results dropdown), mirroring the intake search.
  function wireSearch(inp, results, poolFn, onPick){
    inp.addEventListener('input', function(){
      results.innerHTML='';
      var q=inp.value.trim().toLowerCase();
      if(q.length<2){ results.style.display='none'; return; }
      var seen={}, hits=[];
      poolFn().forEach(function(p){ var n=p.name.toLowerCase(); if(n.indexOf(q)===-1||seen[n]) return; seen[n]=1; hits.push(p); });
      hits=hits.slice(0,10);
      if(!hits.length){ results.style.display='none'; return; }
      results.style.display='block';
      hits.forEach(function(h){ var row=document.createElement('div'); row.className='search-hit'; var nm=document.createElement('div'); nm.className='sh-name'; nm.textContent=h.name; row.appendChild(nm); if(h.tag){ var tg=document.createElement('div'); tg.className='sh-tag'; tg.textContent=h.tag; row.appendChild(tg); } row.onclick=function(){ onPick(h); inp.value=''; results.innerHTML=''; results.style.display='none'; }; results.appendChild(row); });
    });
  }
  function makeSearchBox(placeholder, poolFn, onPick){
    var wrap=document.createElement('div');
    var sb=document.createElement('div'); sb.className='enjoy-search';
    sb.appendChild(document.createTextNode('🔍 '));
    var inp=document.createElement('input'); inp.type='text'; inp.placeholder=placeholder; sb.appendChild(inp);
    wrap.appendChild(sb);
    var results=document.createElement('div'); results.className='search-results'; wrap.appendChild(results);
    wireSearch(inp, results, poolFn, onPick);
    return wrap;
  }

  function updateSummary(){
    var sec=SECTIONS[curSec];
    document.getElementById('sectitle').textContent=sec.base;
    var sm=document.getElementById('summary');
    if (sec.custom){ sm.textContent=''; }
    else { var s=sec.data.length+' '+sec.tab.toLowerCase(); if (sec.met) s+=' · '+metCount()+' met'; sm.textContent=s; }
    document.getElementById('met-count').textContent=metCount();
    document.getElementById('met-section').classList.toggle('show', curSec===0 && metCount()>0);
  }

  function removeItem(p){ var d=SECTIONS[curSec].data; var k=d.indexOf(p); if(k>-1) d.splice(k,1); renderSection(curSec); }

  function markMet(card, p, openAppr){
    var d=SECTIONS[0].data; var k=d.indexOf(p); if(k>-1) d.splice(k,1);
    renderSection(curSec);
    var m=document.createElement('div'); m.className='metcard';
    var title=document.createElement('div'); title.className='cardtitle';
    var ck=document.createElement('span'); ck.className='check'; ck.textContent='✓';
    var tx=document.createElement('span'); tx.textContent=p.text||'This need';
    title.appendChild(ck); title.appendChild(tx); m.appendChild(title);
    var body=document.createElement('div'); body.className='body';
    var back=document.createElement('a'); back.className='moveback'; back.href='#'; back.textContent='Move back to needs';
    back.onclick=function(){ m.remove(); SECTIONS[0].data.push(p); if(curSec===0) renderSection(0); updateSummary(); return false; };
    body.appendChild(back);
    var nudge=document.createElement('div'); nudge.className='nudge'; nudge.textContent='Someone help with this? You can thank them.';
    body.appendChild(nudge);
    var apprBtn=document.createElement('button'); apprBtn.className='appr-btn'; apprBtn.textContent='Thank who helped';
    var box=document.createElement('div'); box.className='appr-box';
    var srch=document.createElement('input'); srch.type='text'; srch.placeholder='Search anyone on Appear…';
    var results=document.createElement('div'); results.className='appr-results';
    var res=document.createElement('div'); res.className='appr-result'; res.textContent='Frank Blau · Data Architect'; results.appendChild(res);
    var linkWrap=document.createElement('div'); linkWrap.className='appr-linkwrap';
    var tlink=document.createElement('a'); tlink.className='appr-textlink'; tlink.href='#'; tlink.textContent='Open their page to Show appreciation'; tlink.onclick=function(){ return false; }; linkWrap.appendChild(tlink);
    srch.addEventListener('input', function(){ results.style.display = srch.value.trim() ? 'block' : 'none'; });
    res.addEventListener('click', function(){ srch.value='Frank Blau'; results.style.display='none'; linkWrap.style.display='block'; });
    box.appendChild(srch); box.appendChild(results); box.appendChild(linkWrap);
    apprBtn.addEventListener('click', function(){ box.classList.toggle('open'); });
    body.appendChild(apprBtn); body.appendChild(box);
    m.appendChild(body); metListEl.appendChild(m); updateSummary();
    if (openAppr){ document.getElementById('met-header').classList.add('open'); metListEl.classList.add('open'); box.classList.add('open'); m.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  }

  function footer(card, p, sec){
    var f=document.createElement('div'); f.className='cardfoot';
    if (sec.met){
      var met=document.createElement('button'); met.className='footbtn met'; met.textContent='This need was met'; f.appendChild(met);
      met.addEventListener('click', function(){
        f.innerHTML='';
        var c=document.createElement('div'); c.className='metchoice';
        var lbl=document.createElement('span'); lbl.className='metq'; lbl.textContent='Met! What next?';
        var give=document.createElement('button'); give.className='footbtn met'; give.textContent='Give appreciation';
        var arch=document.createElement('button'); arch.className='footbtn met'; arch.textContent='Archive';
        c.appendChild(lbl); c.appendChild(give); c.appendChild(arch); f.appendChild(c);
        give.addEventListener('click', function(){ markMet(card, p, true); });
        arch.addEventListener('click', function(){ markMet(card, p, false); });
      });
    }
    var rm=document.createElement('button'); rm.className='removelink'; rm.textContent='Remove this card'; f.appendChild(rm);
    rm.addEventListener('click', function(){
      f.innerHTML='';
      var c=document.createElement('div'); c.className='confirm';
      c.innerHTML='<span class="q">Delete this '+sec.item+'? This can\'t be undone.</span>';
      var yes=document.createElement('button'); yes.className='yes'; yes.textContent='Delete';
      var no=document.createElement('button'); no.className='no'; no.textContent='Keep';
      c.appendChild(yes); c.appendChild(no); f.appendChild(c);
      yes.addEventListener('click', function(){ removeItem(p); });
      no.addEventListener('click', function(){ f.replaceWith(footer(card, p, sec)); });
    });
    return f;
  }

  function buildCard(p, sec){
    var card=document.createElement('div'); card.className='needcard';
    var titleWrap=document.createElement('div'); titleWrap.className='cardtitle';
    var ni=document.createElement('input'); ni.type='text'; ni.placeholder=sec.prompt; ni.value=p.text||'';
    ni.addEventListener('input', function(){ p.text=ni.value; });
    titleWrap.appendChild(ni); card.appendChild(titleWrap);
    var body=document.createElement('div'); body.className='body';
    if (sec.cats){
      body.appendChild(label('Category','sub-label'));
      var row=document.createElement('div'); row.className='cat-row';
      var extras=document.createElement('div'); extras.className='extras';
      function mkCat(c, host){ var el=chip(c, p.cats.indexOf(c)!==-1); el.addEventListener('click', function(){ var k=p.cats.indexOf(c); if(k===-1){ p.cats.push(c); el.classList.add('on'); } else { p.cats.splice(k,1); el.classList.remove('on'); } }); host.appendChild(el); }
      var allCats=sortAlpha(CORE_CATS.concat(MORE_CATS));
      allCats.slice(0,4).forEach(function(c){ mkCat(c,row); });
      var more=chip('More…',false,'more'); allCats.slice(4).forEach(function(c){ mkCat(c,extras); });
      more.addEventListener('click', function(){ extras.classList.toggle('on'); more.style.display='none'; });
      row.appendChild(more); body.appendChild(row); body.appendChild(extras);
    }
    if (sec.levels){
      body.appendChild(label(sec.levelLabel||'Level','sub-label'));
      var lrow=document.createElement('div'); lrow.className='cat-row';
      sec.levels.forEach(function(lv){ var el=chip(lv, p.level===lv); el.addEventListener('click', function(){ var was=el.classList.contains('on'); lrow.querySelectorAll('.cat').forEach(function(x){x.classList.remove('on');}); if(!was){ el.classList.add('on'); p.level=lv; } else { p.level=''; } }); lrow.appendChild(el); });
      body.appendChild(lrow);
    }
    if (sec.audience){
      body.appendChild(label(sec.audienceLabel,'sub-label'));
      var ai=document.createElement('input'); ai.type='text'; ai.placeholder='Ex: youth, seniors, or founders'; ai.value=p.aud||'';
      ai.addEventListener('input', function(){ p.aud=ai.value; });
      body.appendChild(ai);
    }
    body.appendChild(footer(card, p, sec));
    card.appendChild(body);
    return card;
  }

  // Enjoy section — mirrors the current intake "What do you enjoy doing?"
  var ENJOY_CATS = ['Movement & Performance','Sports','Outdoor & Nature','Games & Strategy','Making & Collecting'];
  // Real 3-level recreation tree, pulled from the live intake's reference-data sheet
  // (recType > category > item). Some top categories have sub-categories that drill a
  // third level (Sports > Racquet > Tennis); others go straight to items (Outdoor & Nature
  // > Hiking). Movement & Performance mixes both: Climbing/Dance/Equestrian drill, while
  // Yoga/Skateboarding/Rollerblading are direct items.
  var ENJOY_TREE = {
    'Movement & Performance':{subs:{'Climbing':['Rock Climbing','Bouldering','Indoor Climbing','Sport Climbing','Trad Climbing','Ice Climbing','Via Ferrata'], 'Dance':['Ballet','Hip Hop','Salsa','Ballroom','Contemporary','Swing','Folk Dance','Breaking','Tap','Line Dancing','Belly Dancing'], 'Equestrian':['Horseback Riding','Polo','Rodeo','Dressage','Show Jumping','Trail Riding']}, items:['Yoga','Skateboarding','Rollerblading']},
    'Sports':{subs:{'Racquet':['Tennis','Pickleball','Ping Pong','Squash','Badminton','Racquetball','Padel'], 'Water':['Swimming','Rowing','Paddling','Kayaking','Surfing','Diving','Water Polo','Stand Up Paddleboarding','Wakeboarding','Water Skiing','Open Water Swimming','Freediving'], 'Snow':['Skiing','Snowboarding','Ice Skating','Hockey','Curling','Cross Country Skiing','Snowshoeing','Biathlon','Bobsled'], 'Field':['Soccer','Baseball','Football','Track and Field','Lacrosse','Rugby','Cricket','Ultimate Frisbee','Flag Football','Softball','Field Hockey'], 'Court':['Basketball','Volleyball','Handball','Netball','Beach Volleyball','Futsal'], 'Strength':['Weightlifting','Wrestling','Gymnastics','Powerlifting','CrossFit','Bodybuilding','Olympic Lifting','Strongman'], 'Combat':['Martial Arts','Boxing','Fencing','Judo','Karate','Taekwondo','Brazilian Jiu Jitsu','Muay Thai','MMA','Kickboxing'], 'Air':['Paragliding','Skydiving','Hang Gliding','Drone Racing','Hot Air Ballooning','Wingsuit Flying'], 'Motor':['Auto Racing','Motorcycle Racing','ATV Racing','Motorboat Racing','Go Kart Racing','Motocross','Rally Racing'], 'Endurance':['Marathon','Triathlon','Cycling','Cross Country','Ultra Running','Open Water Swimming','Obstacle Course Racing','Duathlon','Swimming'], 'Precision':['Archery','Golf','Bowling','Darts','Shooting Sports','Disc Golf','Cornhole','Bocce Ball','Croquet']}, items:[]},
    'Outdoor & Nature':{subs:{}, items:['Hiking','Walking','Gardening','Fishing','Camping','Bird Watching','Picnicking','Foraging','Stargazing']},
    'Games & Strategy':{subs:{}, items:['Chess','Card Games','Strategy Board Games','Fantasy Sports','eSports','Tabletop RPG','Trivia','Puzzles']},
    'Making & Collecting':{subs:{'Visual Art':['Painting','Drawing','Illustration','Printmaking','Calligraphy','Sculpture','Ceramics','Pottery'], 'Textile & Fiber':['Knitting','Crochet','Sewing','Quilting','Weaving','Embroidery','Macramé'], 'Wood, Metal & Jewelry':['Woodworking','Carpentry','Furniture Making','Whittling','Metalworking','Jewelry Making'], 'Paper & Books':['Scrapbooking','Origami','Bookbinding','Card Making','Zine Making'], 'Music Making':['Singing','Guitar','Piano','Drums','Violin','Ukulele','Songwriting'], 'Photo, Film & Digital':['Photography','Videography','Digital Art','Graphic Design','Animation','Podcasting'], 'Collecting':['Coins','Stamps','Trading Cards','Vinyl Records','Antiques','Model Building']}, items:[]}
  };
  var ENJOY_ADDED = [
    {t:'Singing',sel:['Participant']},{t:'Ping Pong',sel:['Participant']},{t:'Camping',sel:['Participant']},
    {t:'Pickleball',sel:['Participant']},{t:'Flute',sel:['Participant']},{t:'Craft Drinks',sel:['Fan']},
    {t:'Kayaking',sel:['Participant','Fan']}
  ];
  var EXPRESS = ['My kitchen','My car','My bike','My garden','My wardrobe','My friends'];

  function renderEnjoy(){
    listEl.className='list flow'; listEl.innerHTML='';
    var eq=document.createElement('div'); eq.className='enjoy-q'; eq.textContent='What do you enjoy doing?'; listEl.appendChild(eq);
    var sub=document.createElement('div'); sub.className='enjoy-sub'; sub.textContent='Search by keywords, select chips to add, or add your own.'; listEl.appendChild(sub);
    listEl.appendChild(makeSearchBox('Search to add…', enjoyItemPool, function(h){ addJoyCard(h.name, [], true); }));
    var catzone=document.createElement('div'); listEl.appendChild(catzone);

    var hdr=document.createElement('div'); hdr.className='added-header-row';
    var lbl=document.createElement('span'); lbl.className='added-label';
    var right=document.createElement('span'); right.className='added-right'; right.innerHTML='<button class="level-help-btn">?</button><span class="added-arrow" id="joy-arrow">▲</span>';
    hdr.appendChild(lbl); hdr.appendChild(right); listEl.appendChild(hdr);
    var grid=document.createElement('div'); grid.className='practice-grid'; listEl.appendChild(grid);
    function refreshCount(){ lbl.textContent='Joy added ('+grid.querySelectorAll('.practice-item').length+')'; }
    function addJoyCard(name, sel, hasLevels){
      var card=document.createElement('div'); card.className='practice-item';
      var head=document.createElement('div'); head.className='practice-item-header';
      var nm=document.createElement('div'); nm.className='practice-item-name'; nm.textContent=name;
      var x=document.createElement('button'); x.className='practice-item-x'; x.innerHTML='&times;'; x.onclick=function(){ card.remove(); refreshCount(); };
      head.appendChild(nm); head.appendChild(x); card.appendChild(head);
      if (hasLevels){
        var opts=document.createElement('div'); opts.className='practice-options';
        ['Fan','Participant','Coach'].forEach(function(lv){ var b=document.createElement('button'); b.className='practice-btn'+((sel&&sel.indexOf(lv)>-1)?' selected':''); b.textContent=lv; b.onclick=function(){ b.classList.toggle('selected'); }; opts.appendChild(b); });
        card.appendChild(opts);
      }
      grid.appendChild(card); refreshCount();
    }
    ENJOY_ADDED.forEach(function(it){ addJoyCard(it.t, it.sel, it.levels!==false); });
    hdr.addEventListener('click', function(e){ if(e.target.classList.contains('level-help-btn')) return; var open=grid.style.display!=='none'; grid.style.display=open?'none':'grid'; document.getElementById('joy-arrow').textContent=open?'▼':'▲'; });

    function enjoyItemPool(){
      var out=[];
      ENJOY_CATS.forEach(function(c){ var n=ENJOY_TREE[c]||{subs:{},items:[]}; Object.keys(n.subs||{}).forEach(function(sc){ (n.subs[sc]||[]).forEach(function(l){ out.push({name:l, tag:c+' › '+sc}); }); }); (n.items||[]).forEach(function(it){ out.push({name:it, tag:c}); }); });
      return out;
    }
    function showAddOwn(path){
      var ex=catzone.querySelector('.addown'); if(ex) ex.remove();
      var panel=document.createElement('div'); panel.className='addown';
      var inp=document.createElement('input'); inp.type='text'; inp.placeholder='What would you like to add?';
      var results=document.createElement('div'); results.className='addown-results';
      var lbl=document.createElement('div'); lbl.className='addown-label'; lbl.textContent='Add your own to '+(path[0]||'your list')+':';
      var acts=document.createElement('div'); acts.className='addown-actions';
      var add=document.createElement('button'); add.className='addown-btn'; add.textContent='Add to my list';
      var cancel=document.createElement('button'); cancel.className='addown-cancel'; cancel.textContent='Cancel';
      acts.appendChild(add); acts.appendChild(cancel);
      panel.appendChild(inp); panel.appendChild(results); panel.appendChild(lbl); panel.appendChild(acts);
      catzone.appendChild(panel); inp.focus();
      matchExisting(inp, results, enjoyItemPool, function(hit){ addJoyCard(hit.name, [], true); panel.remove(); });
      add.onclick=function(){ var v=inp.value.trim(); if(v) addJoyCard(v, [], true); panel.remove(); };
      cancel.onclick=function(){ panel.remove(); };
    }
    function itemsAt(path){
      if (path.length===0) return sortAlpha(ENJOY_CATS).map(function(c){ return {name:c, drill:true}; });
      if (path.length===1){
        var node=ENJOY_TREE[path[0]]||{subs:{},items:[]};
        var out=Object.keys(node.subs||{}).map(function(k){ return {name:k, drill:true}; });
        (node.items||[]).forEach(function(it){ out.push({name:it, drill:false}); });
        return out;
      }
      var leaves=((ENJOY_TREE[path[0]]||{}).subs||{})[path[1]]||[];
      return leaves.map(function(l){ return {name:l, drill:false}; });
    }
    function renderNav(path){
      catzone.innerHTML='';
      if (path.length){
        var cr=document.createElement('div'); cr.className='drill-crumb';
        var a0=document.createElement('a'); a0.href='#'; a0.textContent='All categories'; a0.onclick=function(){ renderNav([]); return false; }; cr.appendChild(a0);
        path.forEach(function(seg, idx){
          var sep=document.createElement('span'); sep.className='sep'; sep.textContent='›'; cr.appendChild(sep);
          if (idx===path.length-1){ var cur=document.createElement('span'); cur.className='cur'; cur.textContent=seg; cr.appendChild(cur); }
          else { var a=document.createElement('a'); a.href='#'; a.textContent=seg; a.onclick=function(){ renderNav(path.slice(0,idx+1)); return false; }; cr.appendChild(a); }
        });
        catzone.appendChild(cr);
      }
      var items=itemsAt(path);
      var hasLeaves=items.some(function(x){ return !x.drill; });
      if (path.length && hasLeaves){ var idea=document.createElement('div'); idea.className='ideas'; idea.textContent='Here are some ideas to get you started.'; catzone.appendChild(idea); }
      var row=document.createElement('div'); row.className='cat-row';

      function seg(label, link, onclick){ var s=document.createElement('span'); s.className='sep'; s.textContent='›'; c.appendChild(s); if(link){ var a=document.createElement('a'); a.textContent=label; a.onclick=onclick; c.appendChild(a); } else { var t=document.createTextNode(label); c.appendChild(t); } }
      var typeLabel=type==='person'?'Person':type==='space'?'Space':'Thing';
      if(type==='person' && personSub){ seg('Person', true, function(){ personSub=''; skillPath=[]; renderFlow(); }); seg(personSub, false); }
      else if(type==='thing' && thingSub){ seg('Thing', true, function(){ thingSub=''; renderFlow(); }); seg(thingSub, false); }
      else { seg(typeLabel, false); }
      return c;
    }

    function detailBox(placeholderText){
      var box=document.createElement('div'); box.className='needs-detail-box';
      var inp=document.createElement('input'); inp.type='text'; inp.placeholder=placeholderText||'Please share some details'; box.appendChild(inp);
      var ll=document.createElement('label'); ll.className='local-line'; var ck=document.createElement('input'); ck.type='checkbox'; ck.checked=true; ll.appendChild(ck); ll.appendChild(document.createTextNode('📍 This is a local request')); box.appendChild(ll);
      var add=document.createElement('button'); add.className='needs-add-btn'; add.textContent='Add to list'; box.appendChild(add);
      return {box:box, inp:inp, ck:ck, add:add};
    }

    function renderFlow(){
      flow.innerHTML='';
      if(!type) return;
      flow.appendChild(crumb());
      if(type==='person'){
        if(!personSub){
          var row=document.createElement('div'); row.className='cat-row';
          PERSON_SUBS.forEach(function(sub){ var el=chip(sub,false); el.onclick=function(){ personSub=sub; skillPath=[]; renderFlow(); }; row.appendChild(el); });
          var other=chip('+ Other',false,'more'); other.onclick=function(){ personSub='Other'; skillPath=[]; renderFlow(); }; row.appendChild(other);
          flow.appendChild(row);
        } else if(personSub==='Recreation buddy'){
          var idea=document.createElement('div'); idea.className='ideas'; idea.textContent='Here are some ideas to get you started.'; flow.appendChild(idea);
          var rrow=document.createElement('div'); rrow.className='cat-row';
          recFlatPool().slice(0,28).forEach(function(name){ var el=chip(name,false); el.onclick=function(){ if(el.classList.contains('on'))return; el.classList.add('on'); openAddPerson(name,'Recreation buddy',''); }; rrow.appendChild(el); });
          var ro=chip('+ Other',false,'more'); ro.onclick=function(){ showNeedAddOwn(flow, function(v){ openAddPerson(v,'Recreation buddy',''); }, 'Recreation buddy'); }; rrow.appendChild(ro);
          flow.appendChild(rrow);
        } else {
          flow.appendChild(makeSearchBox('Search to add…',
            function(){ var out=[]; SKILL_CATS.forEach(function(c){ (SKILL_TREE[c]||[]).forEach(function(it){ out.push({name:it,cat:c,tag:c}); }); }); return out; },
            function(h){ openAddPerson(h.name, h.cat, ''); }));
          renderSkillDrill(flow);
        }
      } else if(type==='space'){
        var d=detailBox('A home, a meeting room, a venue, studio, workshop, or desk.');
        d.add.onclick=function(){ var v=d.inp.value.trim(); if(v) addSpace(v, d.ck.checked); };
        flow.appendChild(d.box);
      } else if(type==='thing'){
        var trow=document.createElement('div'); trow.className='cat-row';
        Object.keys(THING_SUBS).forEach(function(k){ var el=chip(THING_SUBS[k].emoji+' '+k, thingSub===k); el.onclick=function(){ thingSub=k; renderFlow(); }; trow.appendChild(el); });
        flow.appendChild(trow);
        if(thingSub){
          var d2=detailBox(THING_SUBS[thingSub].placeholder);
          d2.add.onclick=function(){ var v=d2.inp.value.trim(); if(v) addThing(thingSub, v, d2.ck.checked); };
          flow.appendChild(d2.box);
        }
      }
    }

    function renderSkillDrill(host){
      var zone=document.createElement('div'); host.appendChild(zone);
      function items(path){ if(path.length===0) return sortAlpha(SKILL_CATS).map(function(c){return {name:c,drill:true};}); return (SKILL_TREE[path[0]]||[]).map(function(l){return {name:l,drill:false};}); }
      function nav(path){
        zone.innerHTML='';
        if(path.length){ var idea=document.createElement('div'); idea.className='ideas'; idea.textContent='Here are some ideas to get you started.'; zone.appendChild(idea); }
        var row=document.createElement('div'); row.className='cat-row';
        items(path).forEach(function(it){ var el=chip(it.name,false); el.onclick=function(){ if(it.drill){ nav(path.concat(it.name)); } else { if(el.classList.contains('on'))return; el.classList.add('on'); openAddPerson(it.name, path[0], ''); } }; row.appendChild(el); });
        var other=chip('+ Other',false,'more'); other.onclick=function(){ showNeedAddOwn(host, function(v){ openAddPerson(v, path[0]||'', ''); }, path[0]||'your list'); }; row.appendChild(other);
        zone.appendChild(row);
      }
      nav(skillPath);
    }

    function showNeedAddOwn(host, onAdd, where){
      var ex=host.querySelector('.addown'); if(ex) ex.remove();
      var panel=document.createElement('div'); panel.className='addown';
      var inp=document.createElement('input'); inp.type='text'; inp.placeholder='What would you like to add?';
      var results=document.createElement('div'); results.className='addown-results';
      var lbl=document.createElement('div'); lbl.className='addown-label'; lbl.textContent='Add your own to '+where+':';
      var acts=document.createElement('div'); acts.className='addown-actions';
      var add=document.createElement('button'); add.className='addown-btn'; add.textContent='Add to my list';
      var cancel=document.createElement('button'); cancel.className='addown-cancel'; cancel.textContent='Cancel';
      acts.appendChild(add); acts.appendChild(cancel);
      panel.appendChild(inp); panel.appendChild(results); panel.appendChild(lbl); panel.appendChild(acts);
      host.appendChild(panel); inp.focus();
      matchExisting(inp, results, function(){ var out=[]; SKILL_CATS.forEach(function(c){ (SKILL_TREE[c]||[]).forEach(function(it){ out.push({name:it, tag:c}); }); }); return out; }, function(hit){ onAdd(hit.name); panel.remove(); });
      add.onclick=function(){ var v=inp.value.trim(); if(v) onAdd(v); panel.remove(); };
      cancel.onclick=function(){ panel.remove(); };
    }

    var TYPE_LABEL={person:'Person',space:'Space',thing:'Thing'};
    function addNeed(obj){ NEEDS_ADDED.unshift(obj); renderAdded(); }
    // Person adds go through the confirm editor first (ask local / level / more context).
    function openAddPerson(item, category){ openAddEditor({item:item,type:'person',category:category||'',level:'',detail:'',local:true}); }
    function addSpace(detail, local){ addNeed({item:detail,type:'space',category:'',level:'',local:!!local,detail:''}); }
    function addThing(sub, detail, local){ addNeed({item:detail,type:'thing',category:sub,level:'',local:!!local,detail:''}); }

    // Shared editor form (screenshot): name, type, category, optional level, "what exactly",
    // local. Used both as a confirm step before adding and when editing via the pencil.
    function buildNeedEditor(src, onSave, onCancel){
      var d={item:src.item||'',type:src.type||'person',category:src.category||'',level:src.level||'',detail:src.detail||'',local:!!src.local};
      var box=document.createElement('div'); box.className='need-editor';
      var itemInp=document.createElement('input'); itemInp.type='text'; itemInp.placeholder='Name'; itemInp.value=d.item; box.appendChild(itemInp);
      var typeSel=document.createElement('select');
      [['person','👤 Person'],['space','🏡 Space'],['thing','📦 Thing']].forEach(function(p){ var o=document.createElement('option'); o.value=p[0]; o.textContent=p[1]; typeSel.appendChild(o); });
      typeSel.value=d.type; box.appendChild(typeSel);
      var catSel=document.createElement('select'); box.appendChild(catSel);
      function fillCats(){
        var t=typeSel.value; catSel.innerHTML='';
        var opts=t==='thing'?Object.keys(THING_SUBS):t==='space'?[]:sortAlpha(SKILL_CATS);
        catSel.style.display=(t==='space')?'none':'';
        var o0=document.createElement('option'); o0.value=''; o0.textContent='Choose a category (optional)'; catSel.appendChild(o0);
        opts.forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c; catSel.appendChild(o); });
        catSel.value=d.category;
      }
      typeSel.onchange=fillCats; fillCats();
      var detailInp=document.createElement('input'); detailInp.type='text'; detailInp.placeholder='What exactly are you seeking? (e.g. A baker for my wedding party)'; detailInp.value=d.detail; box.appendChild(detailInp);
      var ll=document.createElement('label'); ll.className='ne-local'; var ck=document.createElement('input'); ck.type='checkbox'; ck.checked=d.local; ll.appendChild(ck); ll.appendChild(document.createTextNode('📍 Local')); box.appendChild(ll);
      var acts=document.createElement('div'); acts.className='ne-actions';
      var save=document.createElement('button'); save.className='ne-save'; save.textContent='Save';
      var cancel=document.createElement('button'); cancel.className='ne-cancel'; cancel.textContent='Cancel';
      acts.appendChild(save); acts.appendChild(cancel); box.appendChild(acts);
      save.onclick=function(){ d.item=itemInp.value.trim()||d.item; d.type=typeSel.value; d.category=(typeSel.value==='space')?'':catSel.value; d.detail=detailInp.value.trim(); d.local=ck.checked; onSave(d); };
      cancel.onclick=function(){ onCancel(); };
      return box;
    }
    function openAddEditor(draft){
      var ex=flow.querySelector('.need-editor'); if(ex) ex.remove();
      var editor=buildNeedEditor(draft, function(d){ addNeed({item:d.item,type:d.type,category:d.category,level:d.level,detail:d.detail,local:d.local}); editor.remove(); }, function(){ editor.remove(); });
      flow.appendChild(editor); editor.scrollIntoView({behavior:'smooth',block:'nearest'});
    }

    function needCard(obj){
      var card=document.createElement('div'); card.className='need-item';
      var left=document.createElement('div'); left.className='need-item-left';
      var nm=document.createElement('div'); nm.className='need-item-name'; nm.textContent=TYPE_LABEL[obj.type]+': '+obj.item; left.appendChild(nm);
      if(obj.category){ var cat=document.createElement('div'); cat.className='need-item-cat'; cat.textContent=obj.category; left.appendChild(cat); }
      if(obj.detail){ var detEl=document.createElement('div'); detEl.className='need-item-detail'; detEl.textContent='Seeking: '+obj.detail; left.appendChild(detEl); }
      card.appendChild(left);
      var right=document.createElement('div'); right.className='need-item-right';
      var edit=document.createElement('button'); edit.className='need-icon-btn'; edit.title='Edit'; edit.textContent='✏️';
      edit.onclick=function(){ var editor=buildNeedEditor(obj, function(d){ obj.item=d.item; obj.type=d.type; obj.category=d.category; obj.level=d.level; obj.detail=d.detail; obj.local=d.local; renderAdded(); }, function(){ renderAdded(); }); card.replaceWith(editor); };
      var lt=document.createElement('label'); lt.className='local-toggle'+(obj.local?' active':''); var lck=document.createElement('input'); lck.type='checkbox'; lck.checked=!!obj.local; lt.appendChild(lck); lt.appendChild(document.createTextNode(' 📍 Local'));
      lck.onchange=function(){ obj.local=lck.checked; lt.classList.toggle('active', lck.checked); };
      var x=document.createElement('button'); x.className='need-x'; x.innerHTML='&times;'; x.onclick=function(){ var k=NEEDS_ADDED.indexOf(obj); if(k>-1) NEEDS_ADDED.splice(k,1); renderAdded(); };
      right.appendChild(edit); right.appendChild(lt); right.appendChild(x);
      card.appendChild(right);
      return card;
    }

    function groupRender(label, items){
      if(!items.length) return;
      var g=document.createElement('div'); g.className='needs-group';
      var h=document.createElement('div'); h.className='needs-group-header'; h.textContent=label+' ('+items.length+')'; g.appendChild(h);
      var grid=document.createElement('div'); grid.className='needs-grid';
      items.forEach(function(o){ grid.appendChild(needCard(o)); });
      g.appendChild(grid); added.appendChild(g);
    }
    function renderAdded(){
      added.innerHTML='';
      var by={person:[],space:[],thing:[]};
      NEEDS_ADDED.forEach(function(o){ (by[o.type]||by.person).push(o); });
      groupRender('👤 Person', by.person);
      groupRender('🏡 Space', by.space);
      groupRender('📦 Thing', by.thing);
      if(!NEEDS_ADDED.length){ var e=document.createElement('div'); e.className='ideas'; e.textContent='Nothing added yet.'; added.appendChild(e); }
    }

    function syncTypeChips(){ typeRow.querySelectorAll('.cat').forEach(function(c){ c.classList.remove('on'); }); if(type){ var map={person:'👤 Person',space:'🏡 Space',thing:'📦 Thing'}; typeRow.querySelectorAll('.cat').forEach(function(c){ if(c.textContent===map[type]) c.classList.add('on'); }); } }
    [['person','👤 Person'],['space','🏡 Space'],['thing','📦 Thing']].forEach(function(p){
      var el=chip(p[1],false); el.onclick=function(){ if(type===p[0]){ type=''; } else { type=p[0]; } personSub=''; thingSub=''; skillPath=[]; syncTypeChips(); renderFlow(); }; typeRow.appendChild(el);
    });
    renderFlow(); renderAdded();
  }

  function renderSection(i){
    var sec=SECTIONS[i];
    if (sec.custom==='needs'){ renderNeeds(); return; }
    if (sec.custom==='enjoy'){ renderEnjoy(); return; }
    if (sec.custom==='skills'){ renderSkills(); return; }
    if (sec.custom==='values'){ renderValues(); return; }
    listEl.className='list'; listEl.innerHTML='';
    sec.data.forEach(function(p){ listEl.appendChild(buildCard(p, sec)); });
    addtile.innerHTML='<span class="plus">+</span> '+sec.addLabel;
    listEl.appendChild(addtile);
  }

  function paint(i){
    curSec=i;
    stepper.querySelectorAll('.stp').forEach(function(x, j){
      var isCur=(j===i), isDone=SEC_DONE[j];
      x.classList.toggle('on', isCur);
      x.classList.toggle('done', !isCur && isDone);
      x.querySelector('.dot').textContent = isDone ? '✓' : (j+1);
    });
    var nb=document.getElementById('next-btn');
    if (nb) nb.textContent = (i < SECTIONS.length-1) ? ('Next: ' + SECTIONS[i+1].tab.toLowerCase()) : 'Done';
    renderSection(i);
    updateSummary();
  }

  // ── Shared profile view ("This is me") — the main screen others see ──
  function pvTag(name, opts){
    opts=opts||{};
    var lv=opts.level?'<span class="lv">'+esc(opts.level)+'</span>':'';
    var sb=opts.sub?'<span class="sub">'+esc(opts.sub)+'</span>':'';
    return '<div class="pv-tag'+(opts.cls?' '+opts.cls:'')+'">'+esc(name)+lv+sb+'</div>';
  }
  function pvSection(label, step, tagsHtml, extra){
    return '<div class="pv-section"><div class="pv-section-header"><div class="pv-section-label">'+label+'</div>'
      +'<button class="pv-edit" data-step="'+step+'">✏️ Edit</button></div>'
      +(tagsHtml?'<div class="pv-tags">'+tagsHtml+'</div>':'')+(extra||'')+'</div>';
  }
  function renderProfileView(){
    var pv=document.getElementById('profile-view');
    var seeking=NEEDS_ADDED.map(function(n){ return pvTag((n.local?'📍 ':'')+n.item, {sub:n.category||''}); }).join('');
    var enjoy=ENJOY_ADDED.map(function(it){ return pvTag(it.t, {level:(it.sel||[]).join(', ')}); }).join('');
    var _ex=EXPRESSION_ADDED.filter(Boolean);
    var expr=_ex.length?'<div class="pv-some"><b>This is so me:</b> '+esc(_ex.join(', '))+'</div>':'';
    var methods='<div class="pv-tags" style="margin-bottom:10px;">'+SKILL_METHODS_ON.map(function(m){ return pvTag(m, {cls:'m'}); }).join('')+'</div>';
    var skills='<div class="pv-tags">'+SKILLS_ADDED.map(function(s){ return pvTag(s.t, {level:s.level}); }).join('')+pvTag('English',{cls:'m'})+'</div>';
    var vals='<div class="pv-sub-h">Values</div><div class="pv-tags">'+VALUES_ADDED.map(function(v){ return pvTag(v.t,{level:v.lvl}); }).join('')+'</div>';
    var doms='<div class="pv-sub-h">Domains</div><div class="pv-tags">'+DOMAINS_ADDED.map(function(v){ return pvTag(v.t,{level:v.lvl}); }).join('')+'</div>';
    var haves=SECTIONS[4].data.map(function(h){ return pvTag(h.text||'A have', {sub:(h.cats&&h.cats[0])||''}); }).join('');
    pv.innerHTML='<div class="pv-card">'
      +'<div class="pv-head"><h2 class="pv-title">'+(_profileName?('This is '+esc(String(_profileName).trim().split(' ')[0])):'This is me')+' 🌱</h2><div class="pv-photo">'+(_profilePhoto?'<img src="'+esc(_profilePhoto)+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">':'🌱')+'</div></div>'
      +pvSection("What I'm seeking",0,seeking)
      +pvSection('What I enjoy',1,enjoy,expr)
      +pvSection('My skills',2,'',methods+skills)
      +pvSection('What I care about',3,'',vals+doms)
      +pvSection('My haves',4,haves)
      +'<div class="pv-section"><div class="pv-section-label" style="margin-bottom:12px;">People I want to meet (bookmarked)</div>'
      +'<div class="pv-bm"><div class="pv-bm-av">C</div><div class="pv-bm-name">Carla</div><button class="pv-bm-x">✕</button></div></div>'
      +'</div>';
    pv.querySelectorAll('.pv-edit').forEach(function(b){ b.onclick=function(){ showEdit(parseInt(b.getAttribute('data-step'),10)); }; });
  }
  function setBreadcrumb(mode){
    var bc=document.getElementById('breadcrumb');
    if(mode==='edit'){ bc.innerHTML='‹ <span class="crumb-link" id="crumb-home">My profile</span> / Edit'; var h=document.getElementById('crumb-home'); if(h) h.onclick=showView; }
    else { bc.innerHTML=''; }
  }
  function showView(){
    document.getElementById('edit-mode').style.display='none';
    document.getElementById('profile-view').style.display='';
    setBreadcrumb('view'); renderProfileView();
    window.scrollTo({top:0,behavior:'smooth'});
  }
  function showEdit(step){
    document.getElementById('profile-view').style.display='none';
    document.getElementById('edit-mode').style.display='';
    setBreadcrumb('edit'); paint(step||0);
    window.scrollTo({top:0,behavior:'smooth'});
  }

  SECTIONS.forEach(function(s, i){
    var st=document.createElement('div'); st.className='stp';
    var dot=document.createElement('div'); dot.className='dot'; dot.textContent=(i+1);
    var lbl=document.createElement('div'); lbl.className='lbl'; lbl.textContent=s.tab;
    st.appendChild(dot); st.appendChild(lbl);
    st.addEventListener('click', function(){ paint(i); window.scrollTo({top:0,behavior:'smooth'}); });
    stepper.appendChild(st);
  });

  addtile.addEventListener('click', function(){
    var p={text:'',cats:[],level:'',aud:''};
    SECTIONS[curSec].data.push(p);
    renderSection(curSec); updateSummary();
    var cards=listEl.querySelectorAll('.needcard'); var last=cards[cards.length-1];
    if (last){ var ni=last.querySelector('.cardtitle input'); if(ni) ni.focus(); last.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  });

  document.getElementById('met-header').addEventListener('click', function(){ this.classList.toggle('open'); metListEl.classList.toggle('open'); });
  document.getElementById('next-btn').addEventListener('click', function(){ SEC_DONE[curSec]=true; if(curSec<SECTIONS.length-1){ paint(curSec+1); window.scrollTo({top:0,behavior:'smooth'}); } else { showView(); } });
  document.getElementById('back-btn').addEventListener('click', function(){ if(curSec>0){ paint(curSec-1); window.scrollTo({top:0,behavior:'smooth'}); } else { showView(); } });

  // ── Phase 3.2: build the category trees from the live reference-data ──
  // (getReferenceData), falling back to the hardcoded trees if the fetch fails.
  var GS_URL='https://cw-api-gate.jessieupp.workers.dev';
  function buildTreesFromRefData(rd){
    try{
      // Recreation → Enjoy tree (recType > category > item)
      var recOrder=['Movement & Performance','Sports','Outdoor & Nature','Games & Strategy','Making & Collecting'];
      var etree={};
      (rd.recreation||[]).forEach(function(r){
        var rt=String(r.recType||'').trim(), cat=String(r.category||'').trim(), it=String(r.item||'').trim();
        if(!rt||!it) return;
        if(!etree[rt]) etree[rt]={subs:{},items:[]};
        if(cat){ if(!etree[rt].subs[cat]) etree[rt].subs[cat]=[]; if(etree[rt].subs[cat].indexOf(it)<0) etree[rt].subs[cat].push(it); }
        else { if(etree[rt].items.indexOf(it)<0) etree[rt].items.push(it); }
      });
      var ecats=recOrder.filter(function(c){return etree[c];}).concat(Object.keys(etree).filter(function(c){return recOrder.indexOf(c)<0;}));
      if(ecats.length){ ENJOY_CATS=ecats; ENJOY_TREE=etree; }
      // Skills → per parent-category lists (16 fixed parent cats)
      var scats=['Arts & Culture','Food & Drink','Physical Wellbeing','Mental Wellbeing','Family Wellbeing','Self-Expression & Beauty','Home & Construction','Transportation','Mechanical & Manufacturing','Business & Finance','Community & Civic','Recreation & Hobbies','Technology & Communications','Nature & Outdoors','Social Events & Gatherings','Pets & Animal Care'];
      var stree={}, sseen={}; scats.forEach(function(c){ stree[c]=[]; sseen[c]={}; });
      (rd.skills||[]).forEach(function(s){
        var cat=String(s.category||'').trim(), it=String(s.item||'').trim();
        if(stree[cat]!==undefined && it && !sseen[cat][it.toLowerCase()]){ sseen[cat][it.toLowerCase()]=1; stree[cat].push(it); }
      });
      SKILL_CATS=scats; SKILL_TREE=stree;
      // Values / Domains
      var vi=(rd.values||[]).map(function(v){return String((v&&v.item!==undefined)?v.item:v||'').trim();}).filter(Boolean);
      var di=(rd.domains||[]).map(function(v){return String((v&&v.item!==undefined)?v.item:v||'').trim();}).filter(Boolean);
      if(vi.length) VALUE_IDEAS=vi;
      if(di.length) DOMAIN_IDEAS=di;
      // Methods (display strings) and Person sub-types
      var md=(rd.methodsDisplay||[]).map(function(m){return String(m||'').trim();}).filter(Boolean);
      if(md.length) METHODS=md;
      var pt=(rd.personTypes||[]).map(function(p){return String(p||'').trim();}).filter(function(p){return p && p.toLowerCase()!=='other';});
      if(pt.length) PERSON_SUBS=pt;
    }catch(e){ /* keep the hardcoded fallback */ }
  }
  var _pRef=fetch(GS_URL+'?action=getReferenceData').then(function(r){return r.json();}).then(function(rd){ buildTreesFromRefData(rd); }).catch(function(){});
  var _pProf=_id ? fetch(GS_URL+'?action=getProfile&appearId='+encodeURIComponent(_id)).then(function(r){return r.json();}).then(function(resp){ if(resp&&resp.found&&resp.data){ _profilePhoto=resp.photo||''; _profileName=resp.name||''; loadProfile(resp.data); } }).catch(function(){}) : Promise.resolve();
  Promise.all([_pRef,_pProf]).then(function(){ showView(); });
</script>
