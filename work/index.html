  function gpPickRow(all, picked, firstN){
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
    function btn(word){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = word;
      var paint = function(){
        b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
          + (picked[word]
              ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
              : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
      };
      paint();
      b.addEventListener('click', function(){
        picked[word] = !picked[word]; paint();
        if (typeof gpStepPaint === 'function') gpStepPaint();
      });
      return b;
    }
    var shown = all.filter(function(w, i){ return !firstN || i < firstN || picked[w]; });
    var rest  = all.filter(function(w){ return shown.indexOf(w) === -1; });
    shown.forEach(function(w){ row.appendChild(btn(w)); });
    if (rest.length) {
      row.appendChild(gpMoreBtn('More', function(){
        rest.forEach(function(w){ row.appendChild(btn(w)); });
      }));
    }
    return { row: row, add: function(w){ picked[w] = true; row.appendChild(btn(w)); } };
  }

        if (GP_LANGS[i].toLowerCase() === v.toLowerCase()) { known = GP_LANGS[i]; break; }

      _gpChipsPicked[key][word] = on;
      var parts = String(ta.value || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
      var at = -1;
      for (var pi = 0; pi < parts.length; pi++) {
        if (parts[pi].toLowerCase() === String(word).toLowerCase()) { at = pi; break; }
      }
      if (on && at === -1) parts.push(word);
      if (!on && at > -1) parts.splice(at, 1);

      paint();
    });

  function gpRefOnce(){

    _gpRefP = fetch(GS_URL + '?action=getReferenceData&v=' + CW_REF_V)
      .then(function(r){ return r.json(); })

  function gpCorpus(source, rd){
    var out = [], seen = {};
    var push = function(w, c, a){
      w = String(w || '').trim(); if (!w) return;
      var k = w.toLowerCase(); if (seen[k]) return;
      seen[k] = 1; out.push({ word: w, cat: String(c || '').trim(), assoc: String(a || '').toLowerCase() });
    };
    if (source === 'recreation') {
      (rd.recreation || []).forEach(function(r){ push(r.item, r.recType, r.associations); });
    } else if (source === 'skills') {
      (rd.skills || []).forEach(function(s){ push(s.item, s.category, s.associations); });
    } else if (source === 'values') {
      (rd.values || []).forEach(function(v){
        push((v && v.item !== undefined) ? v.item : v, (v && v.category) || 'Values', v && v.associations);
      });
      (rd.domains || []).forEach(function(v){
        push((v && v.item !== undefined) ? v.item : v, (v && v.category) || 'Domains', v && v.associations);
      });
      var lens = (GP_CHIPS.introValues && GP_CHIPS.introValues.lenses) || [];
      lens.forEach(function(l){
        (l.words || []).forEach(function(w){ push(w, l.label, ''); });
        (l.more  || []).forEach(function(w){ push(w, l.label, ''); });
      });
    } else if (source === 'resources') {
      (rd.resources || []).forEach(function(r){ push(r.item, r.category, r.associations); });
    } else if (source === 'need') {
      (rd.skills || []).forEach(function(s){ push(s.item, s.category, s.associations); });
      (rd.recreation || []).forEach(function(r){ push(r.item, r.recType, r.associations); });
    }
    return out;
  }

  function gpAddWord(key, word, cat, ta){
    word = String(word || '').trim(); if (!word) return;
    if (!_gpTags[key]) _gpTags[key] = {};
    _gpTags[key][word] = cat || '';
    var parts = String(ta.value || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].toLowerCase() === word.toLowerCase()) return;
    }
    parts.push(word);
    ta.value = parts.join(', ');
    if (typeof gpStepPaint === 'function') gpStepPaint();
  }
  function gpDropWord(key, word, ta){
    if (_gpTags[key]) delete _gpTags[key][word];
    var parts = String(ta.value || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
    ta.value = parts.filter(function(p){ return p.toLowerCase() !== String(word).toLowerCase(); }).join(', ');
    if (typeof gpStepPaint === 'function') gpStepPaint();
  }
  function gpHasWord(key, word){
    return !!(_gpTags[key] && _gpTags[key][word] !== undefined);
  }

  function gpPill(label, on){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
      + (on ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
            : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
    return b;
  }

  function gpBuildTree(source, rd){
    var tree = {}, seen = {};
    var add = function(top, sub, item){
      top = String(top || '').trim(); sub = String(sub || '').trim(); item = String(item || '').trim();
      if (!top || !item) return;
      var k = (top + '|' + sub + '|' + item).toLowerCase();
      if (seen[k]) return; seen[k] = 1;
      if (!tree[top]) tree[top] = { subs:{}, items:[] };
      if (sub) { if (!tree[top].subs[sub]) tree[top].subs[sub] = []; tree[top].subs[sub].push(item); }
      else tree[top].items.push(item);
    };
    if (source === 'recreation') {
      (rd.recreation || []).forEach(function(r){ add(r.recType, r.category, r.item); });
    } else if (source === 'skills') {
      (rd.skills || []).forEach(function(s){ add(s.category, '', s.item); });
    } else if (source === 'values') {
      var vs = (rd.values || []).filter(function(v){ return v && v.item; });
      if (vs.length) {
        vs.forEach(function(v){ add(v.category || 'Values', '', v.item); });
      } else {
        ((GP_CHIPS.introValues && GP_CHIPS.introValues.lenses) || []).forEach(function(l){
          (l.words || []).forEach(function(w){ add(l.label, '', w); });
          (l.more  || []).forEach(function(w){ add(l.label, '', w); });
        });
      }
    }
    return tree;
  }
  function gpLevel(tree, path){
    var alpha = function(x){ return x.slice().sort(function(a,b){ return a.localeCompare(b); }); };
    if (!path.length) return alpha(Object.keys(tree)).map(function(k){ return { name:k, drill:true }; });
    var node = tree[path[0]] || { subs:{}, items:[] };
    if (path.length === 1) {
      var out = alpha(Object.keys(node.subs)).map(function(k){ return { name:k, drill:true }; });
      alpha(node.items).forEach(function(i){ out.push({ name:i, drill:false }); });
      return out;
    }
    return alpha(node.subs[path[1]] || []).map(function(i){ return { name:i, drill:false }; });
  }

  var GP_BARE_KEYS = { introEnjoy:1, introSkills:1, introValues:1, introNeed:1, introOffer:1 };
  var GP_BARE_HEAD = { introEnjoy:1, introSkills:1, introValues:1, introOffer:1 };
  function gpBareKey(key){ return GP_BROWSE && !!GP_BARE_KEYS[key]; }

    box.appendChild(row);

    var corpus = [];
    var _browseOn = GP_BROWSE && !!GP_BROWSE_KEYS[key] && !_bare;
    var browseWrap = document.createElement('div');

    if (_browseOn) {
      box.appendChild(browseWrap);
      var _wait = document.createElement('div');

    function gpRenderBrowse(tree, path){
      browseWrap.innerHTML = '';

    cfg.examples.forEach(function(label){

          gpAddWord(key, word, '', ta);

          var seen = {}; opts = [];

        }
        var orow = document.createElement('div');

      add.addEventListener('click', commit);
      otherBox.insertBefore(add, ask);

    function gpAddNew(word, mount, done){
      word = String(word || '').trim(); if (!word) return;
      for (var i = 0; i < corpus.length; i++) {
        if (corpus[i].word.toLowerCase() === word.toLowerCase()) {
          gpAddWord(key, corpus[i].word, corpus[i].cat, ta); repaint(); if (done) done(); return;

        return c.word.toLowerCase().indexOf(t) > -1 || (c.assoc && c.assoc.indexOf(t) > -1);

  function gpShrinkPhoto(file){
    gpPhotoStat('Getting it ready\u2026');
    var img = new Image();
    img.onload = function(){
      try {
        var side = Math.min(img.width, img.height);
        var c = document.createElement('canvas'); c.width = 600; c.height = 600;
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 600, 600);
        c.toBlob(function(blob){
          if (!blob) { gpPhotoStat('That picture could not be read.'); return; }
          gpSendPhoto(blob);
        }, 'image/jpeg', 0.85);
      } catch (e) { gpPhotoStat('That picture could not be read.'); }
      finally { try { URL.revokeObjectURL(img.src); } catch (e) {} }
    };
    img.onerror = function(){ gpPhotoStat('That picture could not be read.'); };
    img.src = URL.createObjectURL(file);
  }

      body: blob

      if (!d || d.status !== 'ok' || !d.url) { gpPhotoStat((d && d.message) || 'That did not go through.'); return; }

          .concat(String(have.workValues || '').split('|').map(function(x){ return x.trim(); }).filter(Boolean));
        if (_workSaved.length && !CW_WORK.touched) {
          CW_WORK.picked = {}; _workSaved.forEach(function(n){ CW_WORK.picked[n] = true; });

        if (window._cwWantedSave) { window._cwWantedSave = false; _cwLastQs = null; cwStat(''); gpQuietSave(); }
        cwWaiting(false);
        gpStepPaint();
      })
