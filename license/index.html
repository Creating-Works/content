<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%2310B981'/><stop offset='33%25' stop-color='%233B82F6'/><stop offset='66%25' stop-color='%238B5CF6'/><stop offset='100%25' stop-color='%23F43F5E'/></linearGradient></defs><circle cx='18' cy='18' r='16' fill='transparent' stroke='url(%23g)' stroke-width='3'/></svg>">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>License</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1F5C86; --card:#fff; --text:#1B2733; --muted:#5B6B7C;
    --brand:#1F699E; --line:#E3E9EF; --tick:#2E7D5B; --soft:#F5F8FB;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
       padding:28px 20px 80px;min-height:100vh;}
  .hide{display:none;}
  input{border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-family:inherit;
        font-size:15px;color:var(--text);outline:none;width:100%;}
  input:focus{border-color:var(--brand);}
  .globe{background:var(--brand);color:#fff;border:0;border-radius:22px;padding:10px 18px;
         font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
  .row{display:flex;}
  .wrap{max-width:1000px;margin:0 auto;}
  h1{font-size:24px;margin:0 0 4px;color:#fff;}
  .sub{color:#CBDCEA;font-size:15px;margin:0 0 24px;line-height:1.6;}
  .cols{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}

  .rail{background:var(--card);border-radius:14px;padding:12px;width:220px;flex:0 0 220px;}
  .rail button{display:block;width:100%;text-align:left;background:none;border:0;
               font-family:inherit;font-size:15px;font-weight:700;color:var(--text);
               padding:12px 14px;border-radius:10px;cursor:pointer;margin-bottom:4px;}
  .rail button span{display:block;font-weight:400;font-size:12.5px;color:var(--muted);
                    margin-top:3px;line-height:1.45;}
  .rail button:hover{background:var(--soft);}
  .rail button.on{background:var(--brand);color:#fff;}
  .rail button.on span{color:#D6E6F2;}

  .panel{background:var(--card);border-radius:14px;padding:26px;flex:1 1 420px;min-width:320px;}
  h2{font-size:19px;margin:0 0 4px;}
  .what{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 20px;}

  table{border-collapse:collapse;width:100%;font-size:14.5px;}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
     border-bottom:1.5px solid var(--line);}
  th.mid,td.mid{text-align:center;width:96px;}
  .tick{color:var(--tick);font-weight:700;}
  .dash{color:#C3CDD8;}
  td .note{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5;}
  .empty{color:var(--muted);font-size:14.5px;line-height:1.7;background:var(--soft);
         border-radius:10px;padding:18px;}
  @media (max-width:720px){ .rail{width:100%;flex:1 1 100%;} }
</style>
</head>
<body>
<!-- The same small way in as the operations page. Without it this page was blank whenever the
     hour had passed, and blank is indistinguishable from broken. A stranger still sees an
     unlabelled box and learns nothing. Jessie 2026-09-01. -->
<div class="wrap hide" id="gate">
  <div class="card" style="max-width:420px;">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <input id="who" type="email" autocomplete="email" placeholder=" " style="max-width:230px;">
      <button class="globe" id="send" title="Send a code">&#127760;</button>
    </div>
    <div class="row hide" id="pinRow" style="display:none;gap:10px;margin-top:12px;">
      <input id="pin" inputmode="numeric" maxlength="6" placeholder="000000"
             style="max-width:130px;letter-spacing:.18em;text-align:center;">
      <button class="globe" id="go">Open</button>
    </div>
    <div id="say" style="font-size:14px;color:var(--muted);margin-top:12px;min-height:20px;"></div>
  </div>
</div>

<div class="wrap hide" id="page">
  <h1>License</h1>
  <p class="sub">What each tool gives away, and what a license adds. Operators only, until the lists are right.</p>

  <div class="cols">
    <div class="rail" id="rail"></div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
(function(){
  // Not public. Nothing is drawn unless the server confirms a live operator session, and the
  // session is the one from creating.works/ops. Jessie 2026-09-01: private until the list is
  // right. Anybody else gets a blank page and learns nothing from it.
  var GS='https://cw-api-gate.jessieupp.workers.dev';
  var v=null;
  try{ v=JSON.parse(localStorage.getItem('cw-ops-session')||'null'); }catch(e){}
  var $=function(id){ return document.getElementById(id); };
  var me='', token='';

  function open_(){ $('gate').classList.add('hide'); $('page').classList.remove('hide'); draw(); }
  function askForOne(){ $('gate').classList.remove('hide'); try{ var w=localStorage.getItem('cw-ops-who'); if(w) $('who').value=w; }catch(e){} }

  if(v&&v.tok&&v.id&&v.until>Date.now()){
    me=v.id; token=v.tok;
    fetch(GS+'?action=opsCheck&appearId='+encodeURIComponent(me)
          +'&sessionToken='+encodeURIComponent(token)+'&t='+Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){ if(d&&d.status==='ok'&&d.ok){ open_(); } else { askForOne(); } })
      .catch(function(){ askForOne(); });
  } else { askForOne(); }

  document.addEventListener('click', function(ev){
    var t=ev.target;
    if(t&&t.id==='send'){
      var addr=($('who').value||'').trim();
      if(!addr){ $('who').focus(); return; }
      t.disabled=true; $('say').textContent='';
      fetch(GS+'?action=sendOpsPin&email='+encodeURIComponent(addr)+'&t='+Date.now())
        .then(function(r){ return r.json(); })
        .then(function(){ t.disabled=false;
          try{ localStorage.setItem('cw-ops-who', addr); }catch(e){}
          $('pinRow').style.display='flex'; $('pin').focus(); })
        .catch(function(){ t.disabled=false; $('say').textContent='Could not reach the server.'; });
    }
    if(t&&t.id==='go'){
      var code=($('pin').value||'').replace(/\D/g,'');
      if(!code){ $('pin').focus(); return; }
      t.disabled=true; $('say').textContent='Checking...';
      fetch(GS+'?action=verifyOpsPin&email='+encodeURIComponent(($('who').value||'').trim())
            +'&code='+encodeURIComponent(code)+'&t='+Date.now())
        .then(function(r){ return r.json(); })
        .then(function(d){
          t.disabled=false;
          if(!d||d.status!=='ok'||!d.sessionToken){ $('say').textContent=(d&&d.message)||'That code does not match.'; return; }
          me=d.id||me; token=d.sessionToken; $('say').textContent='';
          try{ localStorage.setItem('cw-ops-session', JSON.stringify({id:me,tok:token,until:Date.now()+55*60*1000})); }catch(e){}
          open_();
        })
        .catch(function(){ t.disabled=false; $('say').textContent='Could not reach the server.'; });
    }
  });

  // Only what can be checked in the code is written down as free. Nothing here is invented:
  // an empty list says it is empty rather than filling itself with plausible rows.
  var TOOLS=[
    { key:'2gather', name:'2Gather', blurb:'Groups, events and the bulletin board',
      what:'Where a group gathers: its people, its introductions and its events.',
      rows:[
        ['Create a group', 1, 1],
        ['A passcode on every group', 1, 1, 'Everybody asks for one. It is what settles joining.'],
        ['Members, with photos and what they offer', 1, 1],
        ['Introductions between members', 1, 1],
        ['Events and the bulletin board', 1, 1],
        ['Members can invite people', 1, 1, 'The host decides whether they may.'],
        ['Hand the group to a new host', 1, 1, 'Offered and accepted, never taken.'],
        ['Screen people before they join', 0, 1, 'Ask a few questions when somebody asks to join, and read the answers before deciding. Offered today on the group admin screen and on Create a group.'],
        ['Different permission levels per host', 0, 1, 'Hosts and co-hosts who can do different things, rather than everyone with the same powers.'],
        ['Associate a group with your other groups', 0, 1, 'Link groups you run so people can move between them.'],
        ['Read and filter stats for your group', 0, 1, 'Who joined and when, how the group is growing, and what people in it offer and need. Free groups see their member list; the numbers behind it are licensed.']
      ] },
    { key:'appear', name:'Appear', blurb:'Profiles and the network',
      what:'A person, what they offer and what they need, and how they find each other.',
      rows:[] },   // nothing licensed here for now, by Jessie's call 2026-09-01
    { key:'daybalancer', name:'DayBalancer', blurb:'',
      what:'', rows:[] }
  ];

  var rail=document.getElementById('rail'), panel=document.getElementById('panel'), at=0;

  function draw(){
    rail.innerHTML='';
    TOOLS.forEach(function(t,i){
      var b=document.createElement('button');
      b.className = (i===at ? 'on' : '');
      b.appendChild(document.createTextNode(t.name));
      if(t.blurb){ var s=document.createElement('span'); s.textContent=t.blurb; b.appendChild(s); }
      b.addEventListener('click', function(){ at=i; draw(); });
      rail.appendChild(b);
    });

    var t=TOOLS[at];
    panel.innerHTML='';
    var h=document.createElement('h2'); h.textContent=t.name; panel.appendChild(h);
    if(t.what){ var w=document.createElement('p'); w.className='what'; w.textContent=t.what; panel.appendChild(w); }

    if(!t.rows.length){
      var e=document.createElement('div'); e.className='empty';
      e.textContent='Nothing is written down for ' + t.name + ' yet. Tell me what is free and what a '
                  + 'license adds, and it goes here. An empty list is better than a plausible one.';
      panel.appendChild(e);
      return;
    }

    var tbl=document.createElement('table');
    var thead=document.createElement('thead');
    thead.innerHTML='<tr><th>What you get</th><th class="mid">Free</th><th class="mid">Licensed</th></tr>';
    tbl.appendChild(thead);
    var tb=document.createElement('tbody');
    t.rows.forEach(function(r){
      var tr=document.createElement('tr');
      var td=document.createElement('td');
      td.appendChild(document.createTextNode(r[0]));
      if(r[3]){ var n=document.createElement('span'); n.className='note'; n.textContent=r[3]; td.appendChild(n); }
      tr.appendChild(td);
      [r[1],r[2]].forEach(function(on){
        var c=document.createElement('td'); c.className='mid';
        c.innerHTML = on ? '<span class="tick">&#10003;</span>' : '<span class="dash">&mdash;</span>';
        tr.appendChild(c);
      });
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    panel.appendChild(tbl);
  }
})();
</script>
</body>
