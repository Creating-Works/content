<!-- An old link carrying ?path=, ?part= or ?to= was meant for the form, so it goes on to /intro/ with everything it
     carried. This is how somebody signed out at /work/ still gets signed in. A plain visit stays here. -->
<script>
  (function(){
    var q = new URLSearchParams(location.search);
    if (q.has('path') || q.has('part') || q.has('to')) location.replace('/intro/' + location.search + location.hash);
  })();
</script>
