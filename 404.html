<!-- Version: V1.0 | Date: 2026-09-12 | LAST CHANGE: first version. The host serves this for any
     address it has no file for. /build and /work addresses belong to the home page's questions, so
     they go there, carrying the address in ?to= for the home page to put back. Anything else says
     plainly that nothing is here. Jessie: "https://creating.works/build then build/picture" and "4 go". -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creating.Works</title>
<script>
  (function () {
    var p = location.pathname;
    if (/^\/(build|work)(\/[a-z]+)?\/?$/.test(p)) {
      location.replace('/?to=' + encodeURIComponent(p) + location.hash);
    }
  })();
</script>
<style>
  body{margin:0;background:#1F699E;color:#fff;font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  .wrap{max-width:560px;margin:0 auto;padding:80px 20px;}
  h1{font-size:26px;font-weight:800;margin:0 0 10px;}
  p{font-size:16px;line-height:1.6;margin:0 0 20px;opacity:.95;}
  a{display:inline-block;background:#fff;color:#1F699E;font-weight:700;text-decoration:none;padding:11px 20px;border-radius:26px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Not found</h1>
  <p>Nothing lives at this address.</p>
  <a href="/">Home</a>
</div>
</body>
</html>
