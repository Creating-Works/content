<html lang="en">
<head>

<meta name="robots" content="noindex, nofollow">
<title>My account</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<style>
  :root{
    --bg:#1F699E; --brand:#1F699E; --ink:#1A2E42; --soft:#4B5A6D; --muted:#6B7A8D;
    --line:#DDE4EE; --panel:#F7FBFF; --panel-line:#C9DFF3; --card:#fff;
    --done-bg:#E7F5EA; --done-ink:#1A5A2C; --err-bg:#FBE9E7; --err-line:#E8B0A5; --err-ink:#7A2410;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5;}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 20px 70px;}

  /* Welcome block */
  .hello{margin-bottom:16px;min-height:42px;}
  h1:empty::after{content:"\200b";}
  h1{font-size:28px;font-weight:400;margin:0;color:#fff;letter-spacing:-.01em;}
  .hello .sub{color:#fff;opacity:.92;font-size:15px;margin-top:6px;}
  .hello .sub a{color:#fff;font-weight:700;text-decoration:underline;cursor:pointer;}
  .btn{display:inline-block;background:#fff;color:var(--brand);border:0;padding:10px 18px;border-radius:24px;
    font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;}
  .btn.line{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.75);}
  .btn.solid{background:var(--brand);color:#fff;}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--panel-line);}
  .btn.sm{padding:8px 15px;font-size:13px;}

  /* Tabs: active = white pill, inactive = translucent on blue */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .tab{background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:14px;padding:9px 16px;
    border-radius:22px;cursor:pointer;border:0;font-family:inherit;}
  .tab:hover{background:rgba(255,255,255,.26);}
  .tab.on{background:#fff;color:var(--brand);}
  .tab:focus-visible{outline:2px solid #fff;outline-offset:2px;}

  /* Content card */
  .panel{background:var(--card);border-radius:16px;padding:26px 30px;min-height:280px;}
  .panel h2{font-size:21px;font-weight:800;margin:0 0 3px;}
  .panel .lead{color:var(--soft);font-size:14.5px;margin:0 0 20px;}

  .fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .f label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;}
  .f input,.f textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
    font:inherit;color:var(--ink);background:#fff;}
  .f input:focus,.f textarea:focus{outline:2px solid var(--panel-line);outline-offset:1px;border-color:var(--brand);}
  .f select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
    font:inherit;color:var(--ink);background:#fff;}
  .f select:focus{outline:2px solid var(--panel-line);outline-offset:1px;border-color:var(--brand);}
  .locrow{display:flex;gap:10px;flex-wrap:wrap;}
  .locrow select{width:auto;flex:1 1 180px;min-width:150px;}
  .photorow{display:flex;gap:16px;align-items:center;margin-bottom:18px;}
  .photo{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#DDE4EE;flex-shrink:0;}

  .prow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid var(--line);}
  .prow:last-of-type{border-bottom:0;}
  .prow .lab{font-size:15px;font-weight:700;}
  .prow .desc{font-size:13px;color:var(--soft);margin-top:2px;}
  .prow .desc a{color:inherit;}
  .toggle{width:48px;height:27px;border-radius:14px;background:var(--line);border:0;position:relative;cursor:pointer;flex-shrink:0;}
  .toggle.on{background:var(--brand);}
  .toggle::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .15s;}
  .toggle.on::after{left:24px;}

  .lang-chips{display:flex;gap:8px;flex-wrap:wrap;}
  .lang-chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--panel-line);
    border-radius:16px;padding:5px 8px 5px 13px;font-size:13.5px;font-weight:700;color:var(--brand);}
  .lang-chip button{background:none;border:0;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:0 2px;}
  .lang-pool{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .lang-opt{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 13px;font:inherit;
    font-size:13.5px;color:var(--ink);cursor:pointer;}
  .lang-opt:hover{background:var(--panel);border-color:var(--panel-line);}

  /* Info boxes inside the white card (answers, Appear page) */
  .infobox{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:18px 20px;margin-bottom:14px;}
  .infobox:last-child{margin-bottom:0;}
  .infobox .t{font-size:15.5px;font-weight:800;margin-bottom:4px;}
  .infobox .d{font-size:14px;color:var(--soft);margin-bottom:14px;}
  .infobox .row{display:flex;gap:10px;flex-wrap:wrap;}

  .status{border-radius:10px;padding:12px 15px;font-size:14px;}
  .status.info{background:var(--panel);border:1px solid var(--panel-line);color:var(--soft);}
  .status.err{background:var(--err-bg);border:1px solid var(--err-line);color:var(--err-ink);}

  @media(max-width:760px){
    .fieldgrid{grid-template-columns:1fr;}
    .panel{padding:20px 18px;}
    h1{font-size:24px;}
  }
  @media(prefers-reduced-motion:reduce){ .toggle::after{transition:none;} }
</style>
</head>
<body>
<div class="wrap">

  <div class="hello">
    <h1 id="hello-title"></h1>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"><div class="status info">Loading your account…</div></div>

</div>

<script>
(function(){
  var GS_URL='https://cw-api-gate.jessieupp.workers.dev';

// Your own record is never served from cache. Added 2026-08-30, after a profile showed the
// answers from before a save for up to six hours. The gate caches getIntake, getProfile,
// lookupProfile, getAccount, getBookmarks and getRegistrations, and a write clears none of them:
// its purge only ever touches the events feed. `nocache` is a switch the gate already has, so
// this asks for a fresh answer rather than changing how the cache works.
//
// Somebody else's profile stays cached and stays fast. Only a read about YOU skips it, which is
// the only case where a stale answer is ever wrong. Wrapped here rather than added to each call,
// because there are six of them today and a list like that drifts the moment a seventh is added.
(function () {
  var _f = window.fetch;
  window.fetch = function (input, init) {
    try {
      var u = (typeof input === 'string') ? input : (input && input.url) || '';
      if (u.indexOf(GS_URL) === 0 && u.indexOf('nocache=') === -1) {
        var me = (window.CW && CW.me && CW.me().key) || '';
        if (me) {
          var norm = function (s) { return String(s || '').split('.').join('').toLowerCase(); };
          var carries = false;
          var q = u.split('?')[1] || '';
          q.split('&').forEach(function (pair) {
            var bits = pair.split('=');
            var k = bits[0];
            if (k !== 'appearId' && k !== 'id' && k !== 'me' && k !== 'CWid' && k !== 'from' && k !== 'memberCard') return;
            if (norm(decodeURIComponent(bits[1] || '')) === norm(me)) carries = true;
          });
          if (carries) { input = (typeof input === 'string') ? (u + '&nocache=1') : new Request(u + '&nocache=1', input); }
        }
      }
    } catch (e) {}
    return _f.call(this, input, init);
  };
})();

  var APPEAR_EDIT='https://appear.network/dl/page/';
  // Hrefless navigation so an id-bearing URL never shows on hover. Same-tab always.
  window._safeNavGo=function(el){try{var u=el&&el.getAttribute&&el.getAttribute('data-nav');if(u){window.location.href=u;}}catch(e){}return false;};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function P(k){try{return new URLSearchParams(location.search).get(k)||'';}catch(e){return '';}}

  // CWid is the standard "this is me" param; id/me/memberCard/appearId accepted too.
  var meId=(window.CW&&CW.me)?CW.me().id:(P('CWid')||P('id')||P('me')||P('memberCard')||P('appearId')||'').trim();
  var D={name:'',firstName:'',lastName:'',photo:'',pageLink:'',postal:'',location:'',languages:'',email:'',phone:'',
       visPublic:'',showPhoto:'',onMap:'',findable:'',ackTerms:'',dateAckTerms:''};

  function go(url){ window.location.href=url; }
  function groupsUrl(){ return 'https://2gather.network/mygroups'+(meId?'?CWid='+encodeURIComponent(meId)+'&ref=profile':'?ref=profile'); }
  function eventsUrl(){ return 'https://2gather.network/myevents'+(meId?'?id='+encodeURIComponent(meId):''); }

  // The stable answers URL. Stays correct after Design A is promoted onto intake.html.
  function answersUrl(){ return 'https://creating.works/profile'+(meId?'?CWid='+encodeURIComponent(meId):''); }
  function profileUrl(){ return 'https://creating.works/profile'+(meId?'?CWid='+encodeURIComponent(meId):''); }
  var TABS=[
    {key:'me', label:'My profile', nav:profileUrl},
    {key:'groups', label:'My groups', nav:groupsUrl},
    {key:'events', label:'My events', nav:eventsUrl},
    {key:'account', label:'My account'},
    // Permissions is hidden until its toggles map to real fields. The panel still answers to
    // ?tab=permissions so the work stays reachable.
    // {key:'permissions', label:'Permissions'}
  ];

  function field(key,lab,type,val,ph){
    return '<div class="f"><label>'+esc(lab)+'</label><input data-acct="'+esc(key)+'" type="'+type+'" value="'+esc(val||'')+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'></div>';
  }
  // A name shown here comes from the Appear page, and Glide owns that row, so anything written
  // back would be overwritten on the next sync. It is shown, not offered for editing.
  function readonlyField(lab,val,note){
    return '<div class="f"><label>'+esc(lab)+'</label>'
      +'<input type="text" value="'+esc(val||'')+'" readonly style="background:var(--panel);color:var(--soft);">'
      +(note?'<div style="font-size:12.5px;color:var(--muted);margin-top:6px;">'+note+'</div>':'')+'</div>';
  }

  // Each switch stands for one stored field. Blank means the person has never set it, so the
  // default is what the site does today: a profile is reachable by link, the photo shows, the
  // map includes everyone, and search finds you. Turning one off records the choice; the pages
  // that show a profile have to read the field before the choice takes effect anywhere.
  var PERM_DEFAULT={visPublic:true,showPhoto:true,onMap:true,findable:true};
  function permOn(key){
    var v=D[key];
    if(v===''||v==null) return !!PERM_DEFAULT[key];
    return String(v).trim().toLowerCase()==='true';
  }
  function toggleRow(key,lab,desc){
    var on=permOn(key);
    return '<div class="prow"><div><div class="lab">'+esc(lab)+'</div><div class="desc">'+desc+'</div></div>'
      +'<button class="toggle'+(on?' on':'')+'" data-perm="'+esc(key)+'" aria-pressed="'+(on?'true':'false')+'"></button></div>';
  }
  function bindToggles(root){
    root.querySelectorAll('[data-perm]').forEach(function(b){
      b.onclick=function(){
        var on=!b.classList.contains('on');
        b.classList.toggle('on',on);
        b.setAttribute('aria-pressed',on?'true':'false');
        D[b.getAttribute('data-perm')]=on?'true':'false';
        markDirty();
      };
    });
  }
  // The text fields only live in the DOM until this reads them back.
  function harvestAccount(){
    var p=document.getElementById('panel'); if(!p) return;
    p.querySelectorAll('[data-acct]').forEach(function(i){ D[i.getAttribute('data-acct')]=i.value.trim(); });
  }

  // ---- Saving ----
  // Nothing on this page saved until now, which broke the rule that anything settable stays
  // editable. A save carries the same one-time-code token the profile page mints, so an account
  // cannot be changed by whoever merely holds the link. The token sits under the same browser key
  // profile.html uses, so verifying once covers both pages for the hour.
  var _EDIT_KEY='cw-edit-'+String(meId||'').split('.').join('').toLowerCase();
  function _tokenGet(){
    try{
      var raw=localStorage.getItem(_EDIT_KEY);
      if(!raw){
        // Signing in mints exactly this session and keeps it under its own name. Somebody who
        // has just signed in is not asked again here.
        var t2=localStorage.getItem('cw-token')||'';
        var who=String(localStorage.getItem('cw-id')||'').split('.').join('').toLowerCase();
        var mine=String(meId||'').split('.').join('').toLowerCase();
        if(t2 && who && who===mine){
          var exp2=parseInt(String(t2).split('.')[1],10);
          if(exp2 && Date.now()<=(exp2-60000)) return t2;
          localStorage.removeItem('cw-token');
        }
        return '';
      }
      var o=JSON.parse(raw);
      if(!o||!o.t||!o.exp||Date.now()>(o.exp-60000)){ localStorage.removeItem(_EDIT_KEY); return ''; }
      return o.t;
    }catch(e){ return ''; }
  }
  function _tokenSet(t){ try{ localStorage.setItem(_EDIT_KEY, JSON.stringify({t:t, exp:Date.now()+60*60*1000})); }catch(e){} }
  function _tokenClear(){ try{ localStorage.removeItem(_EDIT_KEY); }catch(e){} }
  var _editToken=_tokenGet(), _dirty=false;

  // The panel used to print "Aug 2026" whether or not anything had been accepted. It now says
  // only what the row actually holds.
  function termsRecorded(){
    return !!(String(D.dateAckTerms||'').trim() || String(D.ackTerms||'').trim());
  }
  function termsStamp(){
    var d=String(D.dateAckTerms||'').trim();
    if(d){
      var t=new Date(d);
      if(!isNaN(t.getTime())) return t.toLocaleDateString(undefined,{month:'short',year:'numeric'});
      return d;
    }
    return String(D.ackTerms||'').trim() ? 'Accepted' : 'Not recorded';
  }
  // The row used to claim an acceptance whatever the sheet held. It now only claims one when
  // there is a record of it.
  function termsLede(){ return termsRecorded() ? 'You accepted the ' : 'Read the '; }
  function saveRow(){
    return '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:24px;'
      +'padding-top:20px;border-top:1px solid var(--line);">'
      +'<button type="button" class="btn solid" id="acct-save">Save changes</button>'
      +'<span id="acct-savestat" style="font-size:13.5px;color:var(--soft);font-weight:600;"></span>'
      +'</div><div id="acct-gate"></div>';
  }
  function setStat(t){ var el=document.getElementById('acct-savestat'); if(el) el.textContent=t||''; }
  function markDirty(){ _dirty=true; setStat('Not saved yet.'); }
  function bindSave(){ var b=document.getElementById('acct-save'); if(b) b.onclick=function(){ saveAccount(); }; }

  function saveAccount(){
    if(!meId) return;
    harvestAccount();
    if(!_editToken){ showPinBar(function(){ saveAccount(); }); return; }
    var b=document.getElementById('acct-save'); if(b) b.disabled=true;
    setStat('Saving…');
    var u=GS_URL+'?action=saveAccount&appearId='+encodeURIComponent(meId)
      +'&secure=1&editToken='+encodeURIComponent(_editToken)
      +'&postal='+encodeURIComponent(D.postal||'')
      +'&location='+encodeURIComponent(D.location||'')
      +'&languages='+encodeURIComponent(D.languages||'')
      +'&firstName='+encodeURIComponent(D.firstName||'')
      +'&lastName='+encodeURIComponent(D.lastName||'')
      +'&visPublic='+(permOn('visPublic')?'true':'false')
      +'&showPhoto='+(permOn('showPhoto')?'true':'false')
      +'&onMap='+(permOn('onMap')?'true':'false')
      +'&findable='+(permOn('findable')?'true':'false');
    fetch(u).then(function(r){ return r.json(); }).then(function(resp){
      if(b) b.disabled=false;
      if(resp&&resp.status==='ok'){ _dirty=false; setStat('Saved 🌱'); setTimeout(function(){ setStat(''); },2500); return; }
      // An expired hour asks again rather than dropping the edit.
      _editToken=''; _tokenClear(); setStat('');
      showPinBar(function(){ saveAccount(); },(resp&&resp.message)||'Your hour ran out. Verify again to save.');
    }).catch(function(){ if(b) b.disabled=false; setStat('Could not save. Try again.'); });
  }

  // Inline on the page, never an overlay, and the code goes out only when it is asked for.
  function showPinBar(onOk,msg){
    var host=document.getElementById('acct-gate'); if(!host) return;
    host.innerHTML='';
    var bar=document.createElement('div');
    bar.style.cssText='background:#FFF7E6;border:1.5px solid #E5A93B;border-radius:12px;padding:16px 18px;margin-top:16px;';
    var t=document.createElement('div');
    t.style.cssText='font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:6px;';
    t.textContent=msg||'Verify it is you';
    var st=document.createElement('div');
    st.style.cssText='font-size:13.5px;color:var(--soft);margin-bottom:12px;line-height:1.5;';
    st.textContent='We will email a one-time 6-digit code to the address on your profile. It expires in 15 minutes and can only be used once.';
    var row=document.createElement('div');
    row.style.cssText='display:flex;gap:10px;flex-wrap:wrap;align-items:center;';
    var send=document.createElement('button'); send.type='button'; send.className='btn solid'; send.textContent='Email me a code';
    var inp=document.createElement('input'); inp.type='text'; inp.inputMode='numeric'; inp.maxLength=6;
    inp.placeholder='Example: 428091';
    inp.style.cssText='display:none;width:160px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;text-align:center;letter-spacing:.16em;';
    var go=document.createElement('button'); go.type='button'; go.className='btn solid'; go.textContent='Unlock'; go.style.display='none';
    row.appendChild(send); row.appendChild(inp); row.appendChild(go);
    bar.appendChild(t); bar.appendChild(st); bar.appendChild(row); host.appendChild(bar);

    send.onclick=function(){
      send.disabled=true; st.textContent='Sending your code…';
      fetch(GS_URL+'?action=sendProfilePin&appearId='+encodeURIComponent(meId))
        .then(function(r){return r.json();}).then(function(resp){
          send.disabled=false;
          if(resp&&resp.sent){
            send.textContent='Resend'; st.textContent='Check your email for the code.';
            inp.style.display=''; go.style.display=''; inp.focus();
          } else { st.textContent='There is no email on file for this profile yet.'; }
        }).catch(function(){ send.disabled=false; st.textContent='Could not send. Try again.'; });
    };
    go.onclick=function(){
      var c=(inp.value||'').trim(); if(!c) return;
      go.disabled=true; st.textContent='Checking…';
      fetch(GS_URL+'?action=verifyProfilePin&appearId='+encodeURIComponent(meId)+'&code='+encodeURIComponent(c))
        .then(function(r){return r.json();}).then(function(resp){
          go.disabled=false;
          if(resp&&resp.status==='ok'&&resp.editToken){
            _editToken=resp.editToken; _tokenSet(_editToken);
            host.innerHTML=''; if(onOk) onOk();
          } else { st.textContent=(resp&&resp.message)||'That code did not match.'; }
        }).catch(function(){ go.disabled=false; st.textContent='Could not verify. Try again.'; });
    };
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') go.click(); });
    bar.scrollIntoView({behavior:'smooth',block:'center'});
  }

  function renderPanel(key){
    var p=document.getElementById('panel');
    if(key==='me'){
      p.innerHTML=
        '<div class="infobox">'
        +'<div class="t">Profile answers</div>'
        +'<div class="d">Your profile answers follow you in any event or group you join.</div>'
        +'<div class="row"><a class="btn solid" role="link" tabindex="0" data-nav="'+esc(answersUrl())+'" onclick="return _safeNavGo(this)">Update answers</a></div>'
        +'</div>'
        ;
      return;
    }
    if(key==='permissions'){
      p.innerHTML='<h2>My permissions</h2>'
        +toggleRow('visPublic','Public profile','Anyone with the link can view your profile.')
        +toggleRow('showPhoto','Show my photo','Display your headshot on your profile and the network map.')
        +toggleRow('onMap','Appear on the network map','Include me in the shared map of people and resources.')
        +toggleRow('findable','Findable in search','Let people find me by skills, interests, and needs.')
        +'<div class="prow"><div><div class="lab">Terms accepted</div><div class="desc">'+termsLede()
        +'<a href="https://creating.works/terms-of-service.html">Terms of Service</a>, '
        +'<a href="https://creating.works/privacy-policy.html">Privacy Policy</a>, and '
        +'<a href="https://creating.works/code-of-conduct.html">Code of Conduct</a>.</div></div>'
        +'<div style="font-size:13px;color:var(--soft);">'+esc(termsStamp())+'</div></div>'
        +saveRow();
      bindToggles(p); bindSave(); return;
    }
    // My account
    var ph=D.photo?'<img class="photo" src="'+esc(D.photo)+'" alt="">':'<div class="photo"></div>';
    p.innerHTML='<h2>My account</h2>'
      +'<div class="photorow">'+ph
        +'<div><button type="button" id="photo-upload" class="btn ghost" style="font-size:14px;padding:9px 16px;">Upload new</button>'
        // 2026-08-30. This said the photo comes from Appear, next to an Upload new button that
        // now genuinely works. Uploading here is the way to change it, so the sentence went.
        +'<div id="photo-note" style="display:none;font-size:13.5px;color:var(--soft);margin-top:8px;max-width:44ch;"></div></div>'
      +'</div>'
      +'<div class="fieldgrid">'
      +field('firstName','First name','text',D.firstName,'')
      +field('lastName','Last name','text',D.lastName,'')
      +readonlyField('Email', D.email, _editToken
        ? ''
        : 'Hidden until you verify it is you. Press Save changes to verify.')
      +field('postal','Postal code','text',D.postal,'98026')
      +'</div>'
      +'<div class="f" style="margin-top:16px;"><label>Location</label><div id="loc-box"></div></div>'
      +'<div class="f" style="margin-top:16px;"><label>Languages</label><div id="lang-box"></div></div>'
      +saveRow();
    var up=document.getElementById('photo-upload');
    if(up) up.onclick=function(){ var n=document.getElementById('photo-note'); if(n) n.style.display=''; };
    renderLoc();
    renderLangs();
    bindSave();
    p.querySelectorAll('[data-acct]').forEach(function(i){ i.addEventListener('input',markDirty); });
  }

  // Location reuses the picker people already meet on the events page: region, then country, then
  // state once the country is the United States. It is held as one plain string ("Washington,
  // United States") so anything showing a profile can print it without knowing the three levels.
  // Same starting point as events.html: North America / United States, so picking a US state is
  // one tap. A part-made choice still stores nothing, so nobody is recorded as being in the
  // United States until they pick a state.
  var REGIONS=['North America','South America','Europe','Asia','Africa','Oceania','Antarctica'];
  var NA_COUNTRIES=['United States','Canada','Mexico'];
  var US_STATES=["Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming","Washington D.C."];
  var _loc={region:'',country:'',state:''};

  // Read a stored string back into the three levels so the picker opens where the person left it.
  function parseLoc(v){
    var t=String(v||'').trim();
    if(!t) return {region:'',country:'',state:''};
    var bits=t.split(',').map(function(x){ return x.trim(); });
    if(bits.length>1 && bits[1]==='United States' && US_STATES.indexOf(bits[0])>-1){
      return {region:'North America',country:'United States',state:bits[0]};
    }
    if(NA_COUNTRIES.indexOf(t)>-1) return {region:'North America',country:t,state:''};
    if(REGIONS.indexOf(t)>-1) return {region:t,country:'',state:''};
    return {region:'',country:'',state:''};
  }
  // A part-made choice stores nothing. "North America" on its own says less than the blank does.
  function locString(l){
    if(l.state) return l.state+', United States';
    if(l.country && l.country!=='United States') return l.country;
    if(l.region && l.region!=='North America') return l.region;
    return '';
  }
  function renderLoc(){
    var box=document.getElementById('loc-box'); if(!box) return;
    var l=_loc;
    function sel(id,list,val,ph){
      var h='<select id="'+id+'"><option value="">'+esc(ph)+'</option>';
      list.forEach(function(x){ h+='<option'+(x===val?' selected':'')+'>'+esc(x)+'</option>'; });
      return h+'</select>';
    }
    var h='<div class="locrow">'+sel('loc-region',REGIONS,l.region,'Select region…');
    if(l.region==='North America') h+=sel('loc-country',NA_COUNTRIES,l.country,'Select country…');
    if(l.region==='North America' && l.country==='United States') h+=sel('loc-state',US_STATES,l.state,'Select state…');
    box.innerHTML=h+'</div>';

    var rg=box.querySelector('#loc-region');
    if(rg) rg.onchange=function(){
      _loc={region:rg.value,country:'',state:''};
      // Only North America opens a country, matching the events page. Anywhere else is the answer.
      if(rg.value==='North America') _loc.country='United States';
      D.location=locString(_loc); markDirty(); renderLoc();
    };
    var ct=box.querySelector('#loc-country');
    if(ct) ct.onchange=function(){
      _loc.country=ct.value; _loc.state='';
      D.location=locString(_loc); markDirty(); renderLoc();
    };
    var st=box.querySelector('#loc-state');
    if(st) st.onchange=function(){
      _loc.state=st.value;
      D.location=locString(_loc); markDirty(); renderLoc();
    };
  }

  // Languages pick the same way they do on the profile: click to add or remove, filter to find.
  var LANGS=[], _langFilter='';
  function renderLangs(){
    var box=document.getElementById('lang-box'); if(!box) return;
    var chosen=String(D.languages||'').split('|').map(function(x){return x.trim();}).filter(Boolean);
    var chips=chosen.length
      ? chosen.map(function(l){
          return '<span class="lang-chip">'+esc(l)+'<button type="button" data-drop="'+esc(l)+'" aria-label="Remove '+esc(l)+'">&times;</button></span>';
        }).join('')
      : '<span style="font-size:13.5px;color:var(--muted);">None chosen yet.</span>';
    var pool=LANGS.filter(function(l){
      if(chosen.indexOf(l)>-1) return false;
      return !_langFilter || l.toLowerCase().indexOf(_langFilter.toLowerCase())>-1;
    }).slice(0,14);
    box.innerHTML='<div class="lang-chips">'+chips+'</div>'
      +'<input type="text" id="lang-filter" placeholder="Search languages" value="'+esc(_langFilter)+'" style="margin-top:10px;">'
      +'<div class="lang-pool">'+(pool.length
          ? pool.map(function(l){ return '<button type="button" class="lang-opt" data-add="'+esc(l)+'">'+esc(l)+'</button>'; }).join('')
          : '<span style="font-size:13px;color:var(--muted);">No match.</span>')+'</div>';
    box.querySelectorAll('[data-add]').forEach(function(b){
      b.onclick=function(){
        var cur=String(D.languages||'').split('|').map(function(x){return x.trim();}).filter(Boolean);
        cur.push(b.getAttribute('data-add')); D.languages=cur.join('|'); _langFilter=''; markDirty(); renderLangs();
      };
    });
    box.querySelectorAll('[data-drop]').forEach(function(b){
      b.onclick=function(){
        var gone=b.getAttribute('data-drop');
        D.languages=String(D.languages||'').split('|').map(function(x){return x.trim();})
          .filter(function(x){ return x && x!==gone; }).join('|');
        markDirty(); renderLangs();
      };
    });
    var f=box.querySelector('#lang-filter');
    if(f) f.addEventListener('input', function(){ _langFilter=f.value; renderLangs(); var g=document.getElementById('lang-filter'); if(g){ g.focus(); g.setSelectionRange(g.value.length,g.value.length); } });
  }
  // The language list is reference data, so it is read from the same place the profile reads it.
  fetch(GS_URL+'?action=getReferenceData').then(function(r){return r.json();}).then(function(rd){
    var raw=(rd&&(rd.Languages||rd.languages))||[];
    LANGS=(Array.isArray(raw)?raw:String(raw).split('|')).map(function(x){return String(x).trim();}).filter(Boolean);
    renderLangs();
  }).catch(function(){});

  function buildTabs(active){
    var t=document.getElementById('tabs'); t.innerHTML='';
    TABS.forEach(function(s){
      var b=document.createElement('button'); b.className='tab'+(s.key===active?' on':''); b.type='button'; b.textContent=s.label;
      b.onclick=function(){
        if(s.nav){ go(s.nav()); return; }
        t.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
        b.classList.add('on'); renderPanel(s.key);
      };
      t.appendChild(b);
    });
  }

  var nameKey='cw-name-'+meId;
  function paintIdentity(){
    var nm=String(D.name||'').trim();
    if(!nm) return;
    document.getElementById('hello-title').textContent=nm+' 🌱';
    try{ localStorage.setItem(nameKey,nm); }catch(e){}
  }
  // Show the last name seen straight away; the fetch below only refreshes it.
  (function(){ try{ var c=localStorage.getItem(nameKey); if(c) document.getElementById('hello-title').textContent=c+' 🌱'; }catch(e){} })();

  // 'account' is the key; 'data' still works so older links keep landing in the right place.
  var _t=P('tab'); if(_t==='data') _t='account';
  var startTab=(['permissions','account'].indexOf(_t)>-1)?_t:'account';
  buildTabs(startTab);

  if(!meId){
    document.getElementById('panel').innerHTML='<div class="status err">This device does not know who you are yet. <a href="https://2gather.network/signin/?next=%2Faccount%2F" style="color:#1F699E;font-weight:700;">Sign in</a> and you will land back here.</div>';
    return;
  }
  // Two reads in parallel (one round-trip of wall-clock): lookupProfile carries the name, photo,
  // and the stored Appear page link; getProfile carries the contact fields.
  var pLookup=fetch(GS_URL+'?action=lookupProfile&appearId='+encodeURIComponent(meId)).then(function(r){return r.json();}).catch(function(){return null;});
  var pProfile=fetch(GS_URL+'?action=getProfile&appearId='+encodeURIComponent(meId)).then(function(r){return r.json();}).catch(function(){return null;});
  Promise.all([pLookup,pProfile]).then(function(res){
    var lu=res[0]||{}, pr=res[1]||{};
    if(lu.found){ D.name=lu.name||''; D.photo=lu.photo||''; D.pageLink=lu.pageLink||''; }
    if(D.name && !D.firstName && !D.lastName){
      var _bits=String(D.name).trim().split(/\s+/);
      D.lastName=_bits.length>1?_bits.pop():'';
      D.firstName=_bits.join(' ');
    }
    if(pr.found){
      if(!D.name) D.name=pr.name||'';
      if(!D.photo) D.photo=pr.photo||'';
      var d=pr.data||{};
      D.postal=d.postal||''; D.languages=d.languages||''; D.phone=d.phone||'';
      D.location=d.location||''; _loc=parseLoc(D.location);
      if(!_loc.region) _loc={region:'North America',country:'United States',state:''};
      // The permission columns may not exist on the sheet yet. A missing one stays blank,
      // and a blank falls back to what the site does today rather than inventing a choice.
      ['visPublic','showPhoto','onMap','findable','ackTerms','dateAckTerms'].forEach(function(k){
        D[k]=(d[k]==null?'':String(d[k]));
      });
    }
    if(!lu.found && !pr.found){
      document.getElementById('panel').innerHTML='<div class="status err">Could not load your account. Reload the page to try again.</div>';
      return;
    }
    paintIdentity(); renderPanel(startTab);
    loadEmail(startTab);
  });

  // The address lives on the account, not on the profile, and it is deliberately absent from
  // every public read so that holding somebody's link never hands you their email. It arrives
  // only behind the same verified session that saving needs.
  function loadEmail(tab){
    if(!_editToken || !meId) return;
    fetch(GS_URL+'?action=getAccount&appearId='+encodeURIComponent(meId)
      +'&editToken='+encodeURIComponent(_editToken))
      .then(function(r){ return r.json(); })
      .then(function(resp){
        if(!resp || resp.status!=='ok') return;
        if(resp.email) D.email=resp.email;
        // The two name columns come back from the account now. The page used to hold only one
        // joined name and rebuild both boxes by splitting it, calling the last word the surname,
        // so a two-word surname could never survive a reload. Anything typed since the page
        // opened wins, so a slow answer cannot wipe an edit in progress.
        if(!_dirty && (resp.firstName || resp.lastName)){
          D.firstName=String(resp.firstName||'');
          D.lastName=String(resp.lastName||'');
        }
        // Only repaint when the person is looking at the panel that shows it.
        var t=document.querySelector('.tab.on');
        if(t && t.textContent==='My account') renderPanel('account');
      }).catch(function(){});
  }
})();
</script>
