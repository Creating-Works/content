<style>
  :root{
    --bg:#1F699E; --brand:#1F699E; --ink:#1A2E42; --soft:#4B5A6D; --muted:#6B7A8D;
    --line:#DDE4EE; --panel:#F7FBFF; --panel-line:#C9DFF3; --card:#fff;
    --done-bg:#E7F5EA; --done-ink:#1A5A2C; --err-bg:#FBE9E7; --err-line:#E8B0A5; --err-ink:#7A2410;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5;}
  
  .wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px;}
  .layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start;}

  .hello{margin-bottom:16px;min-height:42px;}
  h1:empty::after{content:"\200b";}
  h1{font-size:28px;font-weight:400;margin:0;color:#fff;letter-spacing:-.01em;}
  .hello .sub{color:#fff;opacity:.92;font-size:15px;margin-top:6px;}
  .hello .sub a{color:#fff;font-weight:700;text-decoration:underline;cursor:pointer;}
  .btn{display:inline-block;background:#fff;color:var(--brand);border:0;padding:10px 18px;border-radius:24px;
    font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;}
  .btn.line{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.75);}
  .btn.solid{background:var(--brand);color:#fff;}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--panel-line);}
  .btn.sm{padding:8px 15px;font-size:13px;}

  .tabs{background:#fff;border-radius:14px;padding:12px;height:fit-content;
    display:flex;flex-direction:column;gap:6px;}
  .tab{display:block;width:100%;text-align:left;background:#fff;color:var(--brand);
    border:1.5px solid #C9D6E2;border-radius:9px;font-family:inherit;font-size:14px;
    font-weight:700;padding:11px 14px;cursor:pointer;line-height:1.25;}
  .tab:hover{background:var(--panel);}
  .tab.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .tab.on:hover{background:var(--brand);}
  .tab:focus-visible{outline:2px solid #fff;outline-offset:2px;}

  .cw-loading{display:inline-flex;align-items:center;gap:8px;background:#1F699E;color:#fff;
    font-size:13px;font-weight:700;padding:8px 16px;border-radius:20px;white-space:nowrap;
    animation:cw-breathe 1.6s ease-in-out infinite;}
  @keyframes cw-breathe{0%,100%{opacity:1}50%{opacity:.62}}

  .panel{background:var(--card);border-radius:14px;padding:26px 30px;min-height:280px;}
  .panel h2{font-size:21px;font-weight:800;margin:0 0 3px;}
  .panel .lead{color:var(--soft);font-size:14.5px;margin:0 0 20px;}

  .fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .f label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink);margin-bottom:6px;}
  .f input,.f textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
    font:inherit;color:var(--ink);background:#fff;}
  .f input:focus,.f textarea:focus{outline:2px solid var(--panel-line);outline-offset:1px;border-color:var(--brand);}
  .f select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
    font:inherit;color:var(--ink);background:#fff;}
  .f select:focus{outline:2px solid var(--panel-line);outline-offset:1px;border-color:var(--brand);}
  .locrow{display:flex;gap:10px;flex-wrap:wrap;}
  
  .emaillist{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;
    grid-auto-columns:minmax(0,1fr);column-gap:28px;}
  .locrow select{width:auto;flex:1 1 180px;min-width:150px;}
  
  .locrow input{width:auto;flex:1 1 180px;min-width:150px;}
  .photorow{display:flex;gap:16px;align-items:center;margin-bottom:18px;}
  .photo{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#DDE4EE;flex-shrink:0;}

  .prow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;}
  .prow .lab{font-size:15px;font-weight:700;}
  .prow .desc{font-size:13px;color:var(--soft);margin-top:2px;}
  .prow .desc a{color:inherit;}
  .toggle{width:48px;height:27px;border-radius:14px;background:var(--line);border:0;position:relative;cursor:pointer;flex-shrink:0;}
  .toggle.on{background:var(--brand);}
  .toggle::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .15s;}
  .toggle.on::after{left:24px;}

  .lang-chips{display:flex;gap:8px;flex-wrap:wrap;}
  .lang-chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--panel-line);
    border-radius:16px;padding:5px 8px 5px 13px;font-size:13.5px;font-weight:700;color:var(--brand);}
  .lang-chip button{background:none;border:0;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:0 2px;}
  .lang-pool{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .lang-opt{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 13px;font:inherit;
    font-size:13.5px;color:var(--ink);cursor:pointer;}
  .lang-opt:hover{background:var(--panel);border-color:var(--panel-line);}

  .infobox{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:18px 20px;margin-bottom:14px;}
  .infobox:last-child{margin-bottom:0;}
  .infobox .t{font-size:15.5px;font-weight:800;margin-bottom:4px;}
  .infobox .d{font-size:14px;color:var(--soft);margin-bottom:14px;}
  .infobox .row{display:flex;gap:10px;flex-wrap:wrap;}

  .status{border-radius:10px;padding:12px 15px;font-size:14px;}
  .status.info{background:var(--panel);border:1px solid var(--panel-line);color:var(--soft);}
  .status.err{background:var(--err-bg);border:1px solid var(--err-line);color:var(--err-ink);}

  @media(max-width:860px){
    .layout{grid-template-columns:1fr;}
    
    .tabs{flex-direction:row;flex-wrap:wrap;}
    .tab{width:auto;}
  }
  @media(max-width:760px){
    .fieldgrid{grid-template-columns:1fr;}
    .emaillist{display:block;}
    .panel{padding:20px 18px;}
    h1{font-size:24px;}
  }
  @media(prefers-reduced-motion:reduce){ .toggle::after{transition:none;} }
</style>

<script>
(function(){
  var GS_URL='https://cw-api-gate.jessieupp.workers.dev';


  var APPEAR_EDIT='https://appear.network/dl/page/';
  window._safeNavGo=function(el){try{var u=el&&el.getAttribute&&el.getAttribute('data-nav');if(u){window.location.href=u;}}catch(e){}return false;};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function P(k){try{return new URLSearchParams(location.search).get(k)||'';}catch(e){return '';}}

  var meId=(window.CW&&CW.me)?CW.me().id:(P('CWid')||P('id')||P('me')||P('memberCard')||P('appearId')||'').trim();
  var _placeUnread=false;
  var D={name:'',firstName:'',lastName:'',photo:'',pageLink:'',postal:'',location:'',county:'',city:'',languages:'',email:'',alsoEmails:[],vanity:'',phone:'',
       visPublic:'',showPhoto:'',onMap:'',findable:'',ackTerms:'',dateAckTerms:''};

  function go(url){ window.location.href=url; }
  function groupsUrl(){ return 'https://2gather.network/mygroups'+'?ref=profile'; }
  function eventsUrl(){ return 'https://2gather.network/myevents/'; }

  function answersUrl(){ return 'https://creating.works/profile'; }
  function profileUrl(){ return 'https://creating.works/profile'; }
  var TABS=[
    {key:'me', label:'My profile', nav:profileUrl},
    {key:'groups', label:'My groups', nav:groupsUrl},
    {key:'events', label:'My events', nav:eventsUrl},
    {key:'account', label:'My account'},
    {key:'support', label:'Support', nav:function(){ return 'https://2gather.network/support?from=' + encodeURIComponent(location.pathname); }},
    {key:'signout', label:'Sign out', out:true},
  ];

  function field(key,lab,type,val,ph){
    return '<div class="f"><label>'+esc(lab)+'</label><input data-acct="'+esc(key)+'" type="'+type+'" value="'+esc(val||'')+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'></div>';
  }
  function emailBlock(){
    var hint=_editToken?'':'Hidden until you verify it is you. Press Save changes to verify.';
    if(!_editToken || !D.alsoEmails.length){
      return readonlyField('Email', D.email, hint);
    }
    function line(addr, primary){
      return '<div style="display:flex;align-items:baseline;gap:10px;padding:9px 0;'
        + 'border-bottom:1px solid var(--line);">'
        + '<span style="font-size:15px;color:var(--ink);word-break:break-all;">'+esc(addr)+'</span>'
        + (primary
            ? '<span style="font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;'
              + 'color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 8px;'
              + 'white-space:nowrap;">Primary</span>'
            : '<span style="margin-left:auto;white-space:nowrap;font-size:13px;">'
              + '<a href="#" data-emprime="'+esc(addr)+'" style="color:#1F699E;text-decoration:none;">Make primary</a>'
              + '<a href="#" data-emdrop="'+esc(addr)+'" style="color:var(--muted);text-decoration:none;margin-left:12px;">Remove</a>'
              + '</span>')
        + '</div>';
    }
    var rows=line(D.email||'', true);
    D.alsoEmails.forEach(function(a){ rows+=line(a, false); });
    rows+='<div id="em-add" style="padding:10px 0 2px;">'
      +'<a href="#" id="em-open" style="color:#1F699E;font-weight:700;font-size:14px;text-decoration:none;">Add another email address</a>'
      +'<div id="em-form" style="display:none;margin-top:8px;">'
        +'<div id="em-step1"><input id="em-new" type="email" placeholder="you@work.com" autocomplete="email" style="max-width:320px;">'
          +'<div style="margin-top:14px;display:flex;gap:10px;align-items:center;">'
          +'<button type="button" id="em-send" class="btn ghost" style="font-size:14px;padding:9px 16px;">Send a code</button>'
          +'<button type="button" class="btn ghost em-cancel" style="font-size:14px;padding:9px 16px;">Cancel</button></div></div>'
        +'<div id="em-step2" style="display:none;"><input id="em-code" type="text" inputmode="numeric" maxlength="6" placeholder="000000" style="max-width:160px;letter-spacing:6px;">'
          +'<div style="margin-top:14px;display:flex;gap:10px;align-items:center;">'
          +'<button type="button" id="em-ok" class="btn ghost" style="font-size:14px;padding:9px 16px;">Add this address</button>'
          +'<button type="button" class="btn ghost em-cancel" style="font-size:14px;padding:9px 16px;">Cancel</button></div></div>'
        +'<div id="em-say" style="font-size:13px;color:var(--soft);margin-top:8px;"></div>'
      +'</div></div>';
    return '<div class="f" style="grid-column:1/-1;"><label>Email addresses</label>'
      +'<div style="font-size:12.5px;color:var(--muted);margin:-2px 0 8px;">'
      +'Signing in with any of these reaches this account.</div>'
      +'<div class="emaillist" style="border-top:1px solid var(--line);">'+rows+'</div>'
      +'<div id="em-note" style="font-size:13px;color:#7A2410;margin-top:8px;display:none;"></div>'
      +'<div id="em-conf" style="display:none;margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);">'
        +'<div id="em-conf-ask" style="font-size:14px;line-height:1.5;"></div>'
        +'<div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">'
        +'<input id="em-conf-word" type="text" placeholder="remove" autocomplete="off" style="max-width:160px;">'
        +'<button type="button" id="em-conf-go" class="btn ghost" style="font-size:14px;padding:9px 16px;">Remove</button>'
        +'<button type="button" id="em-conf-no" class="btn ghost" style="font-size:14px;padding:9px 16px;">Cancel</button></div>'
      +'</div></div>';
  }

  function wireEmails(p){
    if(!p) return;
    function say(m,bad){ var el=document.getElementById('em-say'); if(el){ el.textContent=m||''; el.style.color=bad?'#7A2410':'var(--soft)'; } }
    function after(resp){
      if(!resp||resp.status!=='ok') return false;
      if(resp.email) D.email=resp.email;
      D.alsoEmails=Array.isArray(resp.alsoEmails)?resp.alsoEmails:D.alsoEmails;
      harvestAccount();
      renderPanel('account');
      return true;
    }
    var open=document.getElementById('em-open');
    function call(action, extra, done){
      var u=GS_URL+'?action='+action+'&appearId='+encodeURIComponent(meId)
        +'&editToken='+encodeURIComponent(_editToken);
      Object.keys(extra||{}).forEach(function(k){ u+='&'+k+'='+encodeURIComponent(extra[k]); });
      fetch(u).then(function(r){ return r.json(); }).then(done)
        .catch(function(){ say('That did not reach the server. Try once more.',true); });
    }
    if(open) open.onclick=function(ev){ ev.preventDefault();
      var f=document.getElementById('em-form'); if(f){ f.style.display='block'; }
      open.style.display='none';
      var n=document.getElementById('em-new'); if(n) n.focus();
      return false; };
    p.querySelectorAll('.em-cancel').forEach(function(b){
      b.onclick=function(){
        var f=document.getElementById('em-form'); if(f) f.style.display='none';
        if(open) open.style.display='';
        var n=document.getElementById('em-new'), c=document.getElementById('em-code');
        if(n) n.value=''; if(c) c.value='';
        document.getElementById('em-step1').style.display='';
        document.getElementById('em-step2').style.display='none';
        say('');
      };
    });
    var send=document.getElementById('em-send');
    if(send) send.onclick=function(){
      var n=document.getElementById('em-new'); var v=n?String(n.value||'').trim():'';
      if(!v){ say('Type the address first.',true); return; }
      send.disabled=true; say('Sending a code to '+v+'…');
      call('addEmailStart',{email:v},function(r){
        send.disabled=false;
        if(!r||r.status!=='ok'){ say((r&&r.message)||'That did not work.',true); return; }
        document.getElementById('em-step1').style.display='none';
        document.getElementById('em-step2').style.display='block';
        say('We sent a code to '+v+'. Type it here. It expires in fifteen minutes.');
        var c=document.getElementById('em-code'); if(c) c.focus();
      });
    };
    var ok=document.getElementById('em-ok');
    if(ok) ok.onclick=function(){
      var n=document.getElementById('em-new'), c=document.getElementById('em-code');
      var v=n?String(n.value||'').trim():'', code=c?String(c.value||'').trim():'';
      if(!code){ say('Type the code.',true); return; }
      ok.disabled=true; say('Checking…');
      call('addEmailConfirm',{email:v,code:code},function(r){
        ok.disabled=false;
        if(!after(r)) say((r&&r.message)||'That did not work.',true);
      });
    };
    function note(m){ var el=document.getElementById('em-note');
      if(el){ el.textContent=m||''; el.style.display=m?'block':'none'; } }
    p.querySelectorAll('[data-emprime]').forEach(function(a){
      a.onclick=function(ev){ ev.preventDefault(); note('');
        call('makePrimaryEmail',{email:a.getAttribute('data-emprime')},function(r){
          if(!after(r)) note((r&&r.message)||'That did not work. Try once more.');
        });
        return false; };
    });
    var conf=document.getElementById('em-conf');
    function closeConf(){ if(conf) conf.style.display='none';
      var w=document.getElementById('em-conf-word'); if(w) w.value=''; }
    var no=document.getElementById('em-conf-no'); if(no) no.onclick=function(){ closeConf(); note(''); };
    p.querySelectorAll('[data-emdrop]').forEach(function(a){
      a.onclick=function(ev){ ev.preventDefault(); note('');
        var addr=a.getAttribute('data-emdrop');
        var ask=document.getElementById('em-conf-ask');
        if(ask) ask.innerHTML='Are you sure you want to remove <strong>'+esc(addr)+'</strong>? '
          +'It will stop signing you in. Type <strong>remove</strong> to confirm.';
        var go=document.getElementById('em-conf-go');
        if(go) go.onclick=function(){
          var w=document.getElementById('em-conf-word');
          var typed=w?String(w.value||'').trim().toLowerCase():'';
          if(typed!=='remove'){ note('Type the word remove to confirm, or press Cancel.'); return; }
          go.disabled=true; note('Removing '+addr+'\u2026');
          call('removeEmail',{email:addr},function(r){
            go.disabled=false;
            if(after(r)){ closeConf(); }
            else note((r&&r.message)||'That did not work. Try once more.');
          });
        };
        if(conf) conf.style.display='block';
        var w0=document.getElementById('em-conf-word'); if(w0){ w0.value=''; w0.focus(); }
        return false; };
    });
  }

  var VHOST='2gather.network';
  function vanityBlock(){
    if(!_editToken){
      return '<div class="f" style="grid-column:1/-1;"><label>Your link</label>'
        +'<div style="font-size:12.5px;color:var(--muted);margin:-2px 0 0;">'
        +'Hidden until you verify it is you. Press Save changes to verify.</div></div>';
    }
    var have=String(D.vanity||'').trim();
    var shown=have
      ? '<div style="font-size:15px;color:var(--ink);word-break:break-all;">'
        +VHOST+'/hi/<strong>'+esc(have)+'</strong></div>'
      : '<div style="font-size:15px;color:var(--soft);">You do not have one yet.</div>';
    return '<div class="f" style="grid-column:1/-1;"><label>Your link</label>'
      +'<div style="font-size:12.5px;color:var(--muted);margin:-2px 0 8px;">'
      +'This is where people find your profile. Share it to connect with anyone.</div>'
      +'<div style="border-top:1px solid var(--line);padding:9px 0;display:flex;align-items:baseline;'
      +'gap:10px;flex-wrap:wrap;">'+shown
      +'<span style="margin-left:auto;white-space:nowrap;font-size:13px;">'
      +'<a href="#" id="vn-open" style="color:#1F699E;text-decoration:none;font-weight:700;">'
      +(have?'Change':'Choose a name')+'</a></span></div>'
      +'<div id="vn-form" style="display:none;margin-top:10px;">'
        +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">'
        +'<span style="font-size:14px;color:var(--soft);">'+VHOST+'/hi/</span>'
        +'<input id="vn-new" type="text" autocomplete="off" spellcheck="false" placeholder="your-name"'
        +' value="'+esc(have)+'" style="flex:0 1 220px;min-width:150px;"></div>'
        +'<div style="margin-top:14px;display:flex;gap:10px;align-items:center;">'
        +'<button type="button" id="vn-save" class="btn ghost" style="font-size:14px;padding:9px 16px;">Save this name</button>'
        +'<button type="button" id="vn-cancel" class="btn ghost" style="font-size:14px;padding:9px 16px;">Cancel</button></div>'
        +'<div id="vn-say" style="font-size:13px;color:var(--soft);margin-top:8px;min-height:18px;"></div>'
        +(have?'<div style="font-size:12.5px;color:var(--muted);margin-top:6px;">'
          +'Your old link keeps working, so anything you have already shared still opens.</div>':'')
      +'</div></div>';
  }

  function wireVanity(){
    var open=document.getElementById('vn-open');
    if(!open) return;
    var form=document.getElementById('vn-form'), box=document.getElementById('vn-new');
    function say(m,bad){ var el=document.getElementById('vn-say');
      if(el){ el.textContent=m||''; el.style.color=bad?'#7A2410':'var(--soft)'; } }
    function clean(v){ return String(v||'').trim().toLowerCase(); }
    open.onclick=function(ev){ ev.preventDefault();
      if(form) form.style.display='block';
      open.style.display='none';
      if(box){ box.focus(); box.select(); }
      return false; };
    var cancel=document.getElementById('vn-cancel');
    if(cancel) cancel.onclick=function(){
      if(form) form.style.display='none';
      open.style.display='';
      if(box) box.value=String(D.vanity||'');
      say('');
    };
    var timer=null, asked='';
    if(box) box.oninput=function(){
      var v=clean(box.value);
      if(timer) clearTimeout(timer);
      if(v===clean(D.vanity)){ say(''); return; }
      if(!/^[a-z0-9-]{2,30}$/.test(v)){ say(v?'Use 2 to 30 letters, numbers or dashes.':''); return; }
      say('Checking…');
      timer=setTimeout(function(){
        asked=v;
        fetch(GS_URL+'?action=checkVanity&slug='+encodeURIComponent(v))
          .then(function(r){ return r.json(); })
          .then(function(d){
            if(clean(box.value)!==asked) return;   
            if(d&&d.available) say(v+' is free.');

  var _EDIT_KEY='cw-edit-'+String(meId||'').split('.').join('').toLowerCase();
  function _tokenGet(){
    try{
      var raw=localStorage.getItem(_EDIT_KEY);
      if(!raw){
        var t2=localStorage.getItem('cw-token')||'';
        var who=String(localStorage.getItem('cw-id')||'').split('.').join('').toLowerCase();
        var mine=String(meId||'').split('.').join('').toLowerCase();
        if(t2 && who && who===mine){
          var exp2=parseInt(String(t2).split('.')[1],10);
          if(exp2 && Date.now()<=(exp2-60000)) return t2;
          localStorage.removeItem('cw-token');
        }
        return '';
      }
      var o=JSON.parse(raw);
      if(!o||!o.t||!o.exp||Date.now()>(o.exp-60000)){ localStorage.removeItem(_EDIT_KEY); return ''; }
      return o.t;
    }catch(e){ return ''; }
  }
  function _tokenSet(t){ try{ localStorage.setItem(_EDIT_KEY, JSON.stringify({t:t, exp:Date.now()+60*60*1000})); }catch(e){} }
  function _tokenClear(){ try{ localStorage.removeItem(_EDIT_KEY); }catch(e){} }

  function shrinkPhoto(file){
    photoStat('Getting it ready…');
    var img=new Image();
    img.onload=function(){
      try{
        var side=Math.min(img.width,img.height);
        var c=document.createElement('canvas'); c.width=600; c.height=600;
        c.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,600,600);
        c.toBlob(function(blob){
          if(!blob){ photoStat('That picture could not be read.'); return; }
          sendPhoto(blob);
        },'image/jpeg',0.85);
      }catch(e){ photoStat('That picture could not be read.'); }
      finally{ try{ URL.revokeObjectURL(img.src); }catch(e){} }
    };
    img.onerror=function(){ photoStat('That picture could not be read.'); };
    img.src=URL.createObjectURL(file);
  }

  function sendPhoto(blob){

        ['skills','Skills and languages'],['offers','Offerings'],['otw','Open to opportunities'],
        ['care','What I care about and sectors'],['work','Work experience I\u2019m creating'],
        ['purpose','My purpose']
      ];
      var PERM_COL={photo:'photo',needs:'needs',enjoy:'enjoy',skills:'skillsLanguages',
        offers:'offerings',otw:'openToWork',care:'careSectors',work:'workExperience',purpose:'purpose'};
      var NAME_CHOICES=[['full','Full name'],['short','First name, last initial'],['initials','Initials']];
      var PLACE_CHOICES=[['city','City'],['county','County'],['state','State'],['country','Country'],['hidden','Hidden']];
      function permPill(on){ return 'font:inherit;font-size:14px;font-weight:700;padding:9px 14px;border-radius:20px;'
        +'cursor:pointer;'+(on?'background:#1F699E;border:1.5px solid #1F699E;color:#fff;':'background:#fff;border:1.5px solid #C9D6E2;color:#1F699E;'); }
      function permSw(on){ return '<span style="display:inline-block;width:46px;height:26px;border-radius:999px;position:relative;'
        +'background:'+(on?'#E2711D':'#C9D3DE')+';vertical-align:middle;">'
        +'<span style="position:absolute;top:3px;left:'+(on?'23':'3')+'px;width:20px;height:20px;border-radius:50%;background:#fff;"></span></span>'; }
      function permDraw(){
        var P=_perm||{}, h='';
        h='<h2>Global permissions</h2>'
          +'<div style="font-size:12.5px;color:var(--muted);margin:-6px 0 16px;">'
          +'These hold for every group you are in.</div>';
        if(_permState==='looking'){ return h+'<div style="font-size:14px;color:var(--soft);">Looking\u2026</div>'; }
        if(_permState==='refused'){ return h+'<div style="font-size:13.5px;color:#7A2410;line-height:1.55;">'
          +'We could not read your permissions just now, so nothing below would be your answer. '
          +'<a href="https://2gather.network/signin/?next=%2Faccount%2F" style="color:#1F699E;font-weight:700;">Sign in again</a> '
          +'and they come back.</div>'; }
        h+='<div style="background:#EEF2F6;border:1px solid #DDE3EA;border-radius:12px;padding:12px 14px;margin-bottom:6px;">'
          +'<div style="font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-bottom:3px;">Who is looking</div>'
          +'<div style="font-size:13px;color:#6B7A8D;">Set these once and they hold for every group you are in.</div>'
          +'<div style="margin-top:10px;"><span style="'+permPill(true)+'display:inline-block;">Global permissions for all groups</span></div></div>'
          +'<div style="text-align:right;font-size:13.5px;font-weight:700;color:#1A2E42;margin:6px 0 18px;">These permissions will be set for all groups</div>'
          +'<div style="font-size:15px;font-weight:800;margin-bottom:8px;">Your name</div>'
          +'<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;">'
          +NAME_CHOICES.map(function(o){ return '<button type="button" data-permname="'+o[0]+'" style="'+permPill(P.nameShown===o[0])+'">'+esc(o[1])+'</button>'; }).join('')
          +'</div>'
          +'<div style="font-size:15px;font-weight:800;margin-bottom:8px;">Where you are</div>'
          +'<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px;">'
          +PLACE_CHOICES.map(function(o){ return '<button type="button" data-permwhere="'+o[0]+'" style="'+permPill(P.placeShown===o[0])+'">'+esc(o[1])+'</button>'; }).join('')
          +'</div>'
          +'<div style="font-size:15px;font-weight:800;margin-bottom:4px;">What shows</div>';
        PERM_ITEMS.forEach(function(it){
          h+='<button type="button" data-permflag="'+it[0]+'" style="display:flex;align-items:center;justify-content:space-between;'
            +'width:100%;font:inherit;font-size:15px;font-weight:700;color:#1A2E42;background:#fff;border:0;'
            +'border-bottom:1px solid var(--line);padding:13px 2px;cursor:pointer;text-align:left;">'
            +'<span>'+esc(it[1])+'</span>'+permSw(P[it[0]]===true)+'</button>';
        });
        h+='<div id="perm-status" style="font-size:13.5px;color:var(--soft);margin-top:14px;min-height:18px;"></div>';
        return h;
      }
      p.innerHTML=permDraw();
      bindPerm(p);
      if(_permState==='new'){ loadPerm(); }
      return;
    }
    var ph=D.photo?'<img class="photo" src="'+esc(D.photo)+'" alt="">':'<div class="photo"></div>';
    p.innerHTML='<h2>My account</h2>'
      +'<div class="photorow">'+ph
        +'<div><button type="button" id="photo-upload" class="btn ghost" style="font-size:14px;padding:9px 16px;">Upload new</button>'
        +'<div id="photo-note" style="display:none;font-size:13.5px;color:var(--soft);margin-top:8px;max-width:44ch;"></div></div>'
      +'</div>'
      +'<div class="fieldgrid">'
      +field('firstName','First name','text',D.firstName,'')
      +field('lastName','Last name','text',D.lastName,'')
      +emailBlock()
      +vanityBlock()
      +'</div>'
      +'<div class="f" style="margin-top:16px;"><label>Location</label>'
      +(_placeUnread
        ? '<div style="font-size:13.5px;color:#7A2410;line-height:1.5;">We could not read your place '
          +'just now, so nothing below is your answer. <a href="https://2gather.network/signin/?next=%2Faccount%2F" '
          +'style="color:#1F699E;font-weight:700;">Sign in again</a> and it comes back. '
          +'Do not press Save changes until it does.</div>'
        : '')
      +'<div id="loc-box"></div></div>'
      +'<div class="f" style="margin-top:18px;"><label>Terms accepted</label>'
      +'<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;">'
      +'<div style="font-size:13.5px;color:var(--soft);line-height:1.6;flex:1 1 320px;min-width:0;">'+termsLede()
      +'<a href="https://creating.works/terms-of-service" style="color:#1F699E;font-weight:700;">Terms of Service</a>, '
      +'<a href="https://creating.works/privacy-policy" style="color:#1F699E;font-weight:700;">Privacy Policy</a>, and '
      +'<a href="https://creating.works/code-of-conduct" style="color:#1F699E;font-weight:700;">Code of Conduct</a>.</div>'
      +(termsStamp()?'<div style="font-size:13px;color:var(--soft);white-space:nowrap;">'+esc(termsStamp())+'</div>':'')
      +'</div></div>'
      +saveRow();
    var up=document.getElementById('photo-upload');
    if(up) up.onclick=choosePhoto;
    renderLoc();
    renderLangs();
    bindSave();
    p.querySelectorAll('[data-acct]').forEach(function(i){ i.addEventListener('input',markDirty); });
    wireEmails(p);
    wireVanity();
  }

  var REGIONS=['North America','South America','Europe','Asia','Africa','Oceania','Antarctica'];
  var NA_COUNTRIES=['United States','Canada','Mexico'];
  var US_STATES=["Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming","Washington D.C."];
  var _loc={region:'',country:'',state:''};
  var US_ABBR={"Alabama":"AL","Alaska":"AK","Arizona":"AZ","Arkansas":"AR","California":"CA","Colorado":"CO","Connecticut":"CT","Delaware":"DE","District of Columbia":"DC","Florida":"FL","Georgia":"GA","Hawaii":"HI","Idaho":"ID","Illinois":"IL","Indiana":"IN","Iowa":"IA","Kansas":"KS","Kentucky":"KY","Louisiana":"LA","Maine":"ME","Maryland":"MD","Massachusetts":"MA","Michigan":"MI","Minnesota":"MN","Mississippi":"MS","Missouri":"MO","Montana":"MT","Nebraska":"NE","Nevada":"NV","New Hampshire":"NH","New Jersey":"NJ","New Mexico":"NM","New York":"NY","North Carolina":"NC","North Dakota":"ND","Ohio":"OH","Oklahoma":"OK","Oregon":"OR","Pennsylvania":"PA","Rhode Island":"RI","South Carolina":"SC","South Dakota":"SD","Tennessee":"TN","Texas":"TX","Utah":"UT","Vermont":"VT","Virginia":"VA","Washington":"WA","West Virginia":"WV","Wisconsin":"WI","Wyoming":"WY"};
  var _places=null,_placesP=null;
  function placesOnce(){
    if(!_placesP) _placesP=fetch(GS_URL+'?action=getPlaces').then(function(r){ return r.json(); })
      .then(function(d){ if(d&&d.counties){ _places=d; renderLoc(); } else { _placesP=null; } })
      .catch(function(){ _placesP=null; });
    return _placesP;
  }

  function parseLoc(v){
    var t=String(v||'').trim();
    if(!t) return {region:'',country:'',state:''};
    var bits=t.split(',').map(function(x){ return x.trim(); });
    if(bits.length>1 && bits[1]==='United States' && US_STATES.indexOf(bits[0])>-1){
      return {region:'North America',country:'United States',state:bits[0]};
    }
    if(NA_COUNTRIES.indexOf(t)>-1) return {region:'North America',country:t,state:''};
    if(REGIONS.indexOf(t)>-1) return {region:t,country:'',state:''};
    return {region:'',country:'',state:''};
  }
  function locString(l){
    if(l.state) return l.state+', United States';
    if(l.country && l.country!=='United States') return l.country;
    if(l.region && l.region!=='North America') return l.region;
    return '';
  }
  function renderLoc(){
    var box=document.getElementById('loc-box'); if(!box) return;
    var l=_loc;
    function sel(id,list,val,ph){
      var h='<select id="'+id+'"><option value="">'+esc(ph)+'</option>';
      list.forEach(function(x){ h+='<option'+(x===val?' selected':'')+'>'+esc(x)+'</option>'; });
      return h+'</select>';
    }
    var h='<div class="locrow">'+sel('loc-region',REGIONS,l.region,'Select region…');
    if(l.region==='North America') h+=sel('loc-country',NA_COUNTRIES,l.country,'Select country…');
    if(l.region==='North America' && l.country==='United States') h+=sel('loc-state',US_STATES,l.state,'Select state…');
    var ab=l.state?US_ABBR[l.state]:'';
    if(ab){
      if(_places){
        var cs=(_places.counties[ab]||[]).slice().sort();
        var ci=(_places.cities[ab]||[]).slice().filter(function(x,i,a){ return a.indexOf(x)===i; }).sort();
        if(D.county && cs.indexOf(D.county)<0) cs.push(D.county);
        if(cs.length) h+=sel('loc-county',cs,D.county,'County (optional)');
        h+='<input id="loc-city" list="loc-cities" placeholder="City (optional)" value="'+esc(D.city||'')+'" style="flex:0 1 220px;min-width:150px;">'
          +'<datalist id="loc-cities">'+ci.map(function(c){ return '<option value="'+esc(c)+'">'; }).join('')+'</datalist>';
      } else { placesOnce(); }
    }
    h+='<input data-acct="postal" id="loc-postal" type="text" placeholder="Postal code"'
      +' value="'+esc(D.postal||'')+'" style="flex:0 1 150px;">';
    box.innerHTML=h+'</div>';
    var pc=box.querySelector('#loc-postal');
    if(pc) pc.addEventListener('input',function(){ D.postal=String(pc.value||'').trim(); markDirty(); });
    var cy=box.querySelector('#loc-county');
    if(cy) cy.onchange=function(){ D.county=cy.value; markDirty(); };
    var cit=box.querySelector('#loc-city');
    if(cit) cit.onchange=function(){ D.city=String(cit.value||'').trim(); markDirty(); };

    var rg=box.querySelector('#loc-region');
    if(rg) rg.onchange=function(){
      _loc={region:rg.value,country:'',state:''};
      if(rg.value==='North America') _loc.country='United States';
      D.county=''; D.city='';
      D.location=locString(_loc); markDirty(); renderLoc();
    };
    var ct=box.querySelector('#loc-country');
    if(ct) ct.onchange=function(){
      _loc.country=ct.value; _loc.state=''; D.county=''; D.city='';
      D.location=locString(_loc); markDirty(); renderLoc();
    };
    var st=box.querySelector('#loc-state');
    if(st) st.onchange=function(){
      _loc.state=st.value; D.county=''; D.city='';
      D.location=locString(_loc); markDirty(); renderLoc();
    };
  }

  var LANGS=[], _langFilter='';
  function renderLangs(){
    var box=document.getElementById('lang-box'); if(!box) return;
    var chosen=String(D.languages||'').split('|').map(function(x){return x.trim();}).filter(Boolean);
    var chips=chosen.length
      ? chosen.map(function(l){
          return '<span class="lang-chip">'+esc(l)+'<button type="button" data-drop="'+esc(l)+'" aria-label="Remove '+esc(l)+'">&times;</button></span>';
        }).join('')
      : '<span style="font-size:13.5px;color:var(--muted);">None chosen yet.</span>';
    var pool=LANGS.filter(function(l){
      if(chosen.indexOf(l)>-1) return false;
      return !_langFilter || l.toLowerCase().indexOf(_langFilter.toLowerCase())>-1;
    }).slice(0,14);
    box.innerHTML='<div class="lang-chips">'+chips+'</div>'
      +'<input type="text" id="lang-filter" placeholder="Search languages" value="'+esc(_langFilter)+'" style="margin-top:10px;">'
      +'<div class="lang-pool">'+(pool.length
          ? pool.map(function(l){ return '<button type="button" class="lang-opt" data-add="'+esc(l)+'">'+esc(l)+'</button>'; }).join('')
          : '<span style="font-size:13px;color:var(--muted);">No match.</span>')+'</div>';
    box.querySelectorAll('[data-add]').forEach(function(b){
      b.onclick=function(){
        var cur=String(D.languages||'').split('|').map(function(x){return x.trim();}).filter(Boolean);
        cur.push(b.getAttribute('data-add')); D.languages=cur.join('|'); _langFilter=''; markDirty(); renderLangs();
      };
    });
    box.querySelectorAll('[data-drop]').forEach(function(b){
      b.onclick=function(){
        var gone=b.getAttribute('data-drop');
        D.languages=String(D.languages||'').split('|').map(function(x){return x.trim();})
          .filter(function(x){ return x && x!==gone; }).join('|');
        markDirty(); renderLangs();
      };
    });
    var f=box.querySelector('#lang-filter');
    if(f) f.addEventListener('input', function(){ _langFilter=f.value; renderLangs(); var g=document.getElementById('lang-filter'); if(g){ g.focus(); g.setSelectionRange(g.value.length,g.value.length); } });
  }
  fetch(GS_URL+'?action=getReferenceData').then(function(r){return r.json();}).then(function(rd){
    var raw=(rd&&(rd.Languages||rd.languages))||[];
    LANGS=(Array.isArray(raw)?raw:String(raw).split('|')).map(function(x){return String(x).trim();}).filter(Boolean);
    renderLangs();
  }).catch(function(){});

  function buildTabs(active){
    var t=document.getElementById('tabs'); t.innerHTML='';
    TABS.forEach(function(s){
      var b=document.createElement('button'); b.className='tab'+(s.key===active?' on':''); b.type='button'; b.textContent=s.label;
      b.onclick=function(){
        if(s.out){
          try{ if(window.CW && window.CW.forget){ window.CW.forget(); } }catch(e){}
          window.location.href='https://2gather.network/signin/?out=1';
          return;
        }
        if(s.nav){ go(s.nav()); return; }
        t.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
        b.classList.add('on'); renderPanel(s.key);
      };
      t.appendChild(b);
    });
  }

  var nameKey='cw-name-'+meId;
  function paintIdentity(){
    var nm=String(D.name||'').trim();
    if(!nm) return;
    document.getElementById('hello-title').textContent=nm+' 🌱';
    try{ localStorage.setItem(nameKey,nm); }catch(e){}
  }
  (function(){ try{ var c=localStorage.getItem(nameKey); if(c) document.getElementById('hello-title').textContent=c+' 🌱'; }catch(e){} })();

  var PANES = ['me','account','permissions','balance','appear','gather','license'];
  function paneFromHash(){
    var h = String(location.hash || '').replace(/^#/, '').toLowerCase();
    return PANES.indexOf(h) > -1 ? h : '';
  }
  var _t=P('tab'); if(_t==='data') _t='account';
  var startTab = paneFromHash() || ((['permissions','account'].indexOf(_t)>-1) ? _t : 'account');
  buildTabs(startTab);

  if(!meId){
    document.getElementById('panel').innerHTML='<div class="status err">This device does not know who you are yet. <a href="https://2gather.network/signin/?next=%2Faccount%2F" style="color:#1F699E;font-weight:700;">Sign in</a> and you will land back here.</div>';
    return;
  }
  var pLookup=fetch(GS_URL+'?action=lookupProfile&appearId='+encodeURIComponent(meId)).then(function(r){return r.json();}).catch(function(){return null;});
  var pProfile=fetch(GS_URL+'?action=getProfile&appearId='+encodeURIComponent(meId)+'&meToken='+encodeURIComponent((function(){try{return localStorage.getItem('cw-token')||'';}catch(e){return '';}})())).then(function(r){return r.json();}).catch(function(){return null;});
  Promise.all([pLookup,pProfile]).then(function(res){
    var lu=res[0]||{}, pr=res[1]||{};
    if(lu.found){ D.name=lu.name||''; D.photo=lu.photo||''; D.pageLink=lu.pageLink||''; }
    if(D.name && !D.firstName && !D.lastName){
      var _bits=String(D.name).trim().split(/\s+/);
      D.lastName=_bits.length>1?_bits.pop():'';
      D.firstName=_bits.join(' ');
    }
    if(pr.found){
      if(!D.name) D.name=pr.name||'';
      if(!D.photo) D.photo=pr.photo||'';
      var d=pr.data||{};
      D.postal=d.postal||''; D.languages=d.languages||''; D.phone=d.phone||'';
      D.location=d.location||''; _loc=parseLoc(D.location);
      D.county=d.county||''; D.city=d.city||'';
      if(!_loc.region) _loc={region:'North America',country:'United States',state:''};
      D.enabledSolution=String(d.enabledSolution||'');
      ['visPublic','showPhoto','onMap','findable','ackTerms','dateAckTerms'].forEach(function(k){
        D[k]=(d[k]==null?'':String(d[k]));
      });
    }
    _placeUnread = !(pr && pr.found);
    if(pr && pr.status==='error' && pr.code==='signin'){
      var _ph=document.getElementById('panel');
      if(_ph){ _ph.innerHTML='<div class="status err">This device needs to prove who you are before '
        +'your details can be shown. <a href="https://2gather.network/signin/?next=%2Faccount%2F" '
        +'style="color:#1F699E;font-weight:700;">Sign in again</a> and you will land back here.</div>'; }
      return;
    }
    if(!lu.found && !pr.found){
      document.getElementById('panel').innerHTML='<div class="status err">Could not load your account. Reload the page to try again.</div>';
      return;
    }
    var _paneSafe = function (key) {
      try { renderPanel(key); }
      catch (err) {
        try { console.error('pane ' + key + ' failed', err); } catch (e2) {}
        var _pp = document.getElementById('panel');
        if (_pp) { _pp.insertAdjacentHTML('afterbegin', '<div class="status err">This part did not open: ' + esc(String((err && err.message) || err)) + '. Tell us what it says.</div>'); }
      }
    };
    window.cwAccountPick = function (key) {
      _paneSafe(key);
      try { if (PANES.indexOf(key) > -1 && history.replaceState) history.replaceState({}, '', '#' + key); } catch (e) {}
    };
    try { paintIdentity(); } catch (e) {}
    try { paintSolutionDots(); } catch (e) {}
    _paneSafe(startTab);
    window.addEventListener('hashchange', function(){ var k = paneFromHash(); if (k) renderPanel(k); });
    loadEmail(startTab);
  });

  function loadEmail(tab){
    if(!_editToken || !meId) return;
    fetch(GS_URL+'?action=getAccount&appearId='+encodeURIComponent(meId)
      +'&editToken='+encodeURIComponent(_editToken))
      .then(function(r){ return r.json(); })
      .then(function(resp){
        if(!resp || resp.status!=='ok'){
          _editToken='';
          try{ localStorage.removeItem('cw-edit-'+meId); }catch(e){}
          try{ renderPanel('account'); }catch(e){}
          return;
        }
        if(resp.email) D.email=resp.email;
        D.alsoEmails=Array.isArray(resp.alsoEmails)?resp.alsoEmails:[];
        D.vanity=String(resp.vanity||'');
        try {
          if (D.vanity) {
            localStorage.setItem('cw-vanity', D.vanity);
            localStorage.setItem('cw-vanity-for', String(meId||''));
          } else { localStorage.removeItem('cw-vanity'); }
        } catch(e){}
        if(!_dirty && (resp.firstName || resp.lastName)){
          D.firstName=String(resp.firstName||'');
          D.lastName=String(resp.lastName||'');
        }
        var t=document.querySelector('.tab.on');
        if(t && t.textContent==='My account') renderPanel('account');
      }).catch(function(){});
  }
})();
</script>
