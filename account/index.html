<!-- Version: V1.25 | Date: 2026-09-19 | LAST CHANGE: a place that could not be READ is not an empty place, and the help line stops promising. Jessie: "no", with Location still empty on V1.24. My first guard looked for status error AND code signin exactly and whatever came back carried neither, so the page went on drawing an empty picker. The test is simpler now: if getProfile did not FIND her, the Location section says so in red, offers Sign in again, and tells her not to press Save changes until it comes back - because saving from a page that was refused would write the emptiness over the real answer. The rest of the page stays usable rather than being blocked behind one failed read. Also: "Adding another one is coming" comes off the help line, which the V1.19 edit had aimed at and missed. -->
<!-- Version: V1.24 | Date: 2026-09-19 | LAST CHANGE: the page says it was refused rather than drawing an empty place. Jessie: "city is gone from this again htough" and "and county". Her record was never touched - n161 read all four cells back intact. getProfile now refuses without a proved session, which is this afternoon's security fix, and answers found:false with code signin; this page reads every place field out of that answer, so it drew an empty picker instead of saying it could not read, and because lookupProfile still answered the could-not-load line never fired. A page asserting something before it knows, again. -->
<!-- Version: V1.23 | Date: 2026-09-19 | LAST CHANGE: the Location row reads like the welcome step of the intro, and the rule above Save changes is gone. Jessie: "make look slike this on welcome" and "remove horizontal line above save changes". On the intro, region, country, state, county and city run across one line with the postal code on its own beneath, so city takes the same width as the selects beside it and postal is forced onto its own line rather than tucked beside city. Space separates the save row now; a line between every section draws a grid nobody asked for. -->
<!-- Version: V1.22 | Date: 2026-09-19 | LAST CHANGE: removing an address is asked for in words. Jessie: "put a message Are you sure you want to remove 'email' ? and say type remove". Inline rather than a dialog, because this site has no modals. The address is NAMED in the question rather than left to whichever row the finger landed on, and the word has to be typed, so it cannot happen by a stray press. It also says what removing costs - it will stop signing you in. The press says Removing... while it waits, because the backend proves the write before answering. -->
<!-- Version: V1.21 | Date: 2026-09-19 | LAST CHANGE: Remove and Make primary can say what happened. Jessie: "remove didn't work when I tried to remove it" - and she saw NO message, because the only place this block had to speak was inside the add-an-address form, which is hidden until Add is pressed. So a refusal landed nowhere and the press looked like it did nothing. There is a line under the list now that both of them write to. A page that knows exactly what happened must never say nothing. -->
<!-- Version: V1.20 | Date: 2026-09-19 | LAST CHANGE: room and a Cancel on the add-an-address form, and Languages comes off this screen. Jessie: "put cancel to the right of send a code button and give some room beneath field and above buttons - looks squished - and left justify under field for email" and "remove languages from account screen?" The buttons were inline after the field with an 8px nudge, so on wrapping they landed indented and tight under it; they are their own row now, under the left edge, with 14px above. Cancel empties the form and puts it away, so reopening never shows a half-typed address or an expired code. Languages is asked in the Skills step of the intro and belongs there alone (row 186); Info.languages is still read on load and still sent on save, so nothing is blanked, and the picker is kept unreferenced so it is one line to put back. -->
<!-- Version: V1.19 | Date: 2026-09-19 | LAST CHANGE: Add another email address, Make primary and Remove, at her "0 build". Two proofs and neither alone is enough: the page already holds the verified session that saving needs, which proves the account is yours, and adding an address sends a code to THAT address, which proves you hold it. Remove is never offered on the primary, so nobody can lock themselves out; making another one primary first is the way, and the old primary stays on the list rather than being dropped. Nothing is optimistic - the list is redrawn from what the backend answers, never from what the page hoped. Still behind ?emails=1, and it needs the deploy that carries addEmailStart, addEmailConfirm, makePrimaryEmail and removeEmail. -->
<!-- Version: V1.18 | Date: 2026-09-19 | LAST CHANGE: the help line under Email addresses moves above the list. Jessie: "put 'Signing in with any of these reaches this account.' below header. all in help small liners like this go under headers." Her rule from 2026-09-08, in design-checklist.md ever since, and I wrote it the wrong way round: help under the thing is help after the decision. -->
<!-- Version: V1.17 | Date: 2026-09-19 | LAST CHANGE: the city box is short, and the addresses fill two columns. Jessie: "emdonds is still a very long field. make it a short field." and "now we can use better space for eamil with 2 columns - maybe put the third and fourth where postcal code whent?" City is flex:0 1 220px, so it may shrink on a narrow screen and can never grow to fill a line it is alone on, which is what stretched it. The address list is two fixed ROWS with the flow set to column, so the first two stay put and the third and fourth appear beside them in the space the postal code left; a two-column grid would have put the second address on the right instead. One column on a phone. -->
<!-- Version: V1.16 | Date: 2026-09-19 | LAST CHANGE: the postal code sits beside the city rather than up in the name grid. Jessie: "city shouldn't be this long of a field  and zip code should go t the right of city". City was the only thing on the second line of the location row, so flex-grow stretched it across the whole panel. Postal is always drawn, state chosen or not, because somebody outside the United States still has one and losing the field loses the way to edit it; it keeps data-acct="postal" so it is collected on save exactly as before, and it marks the page dirty from inside renderLoc because that function redraws the row and would otherwise take the listener with it. The Email addresses list spans the grid now that it is a list rather than a box. -->
<!-- Version: V1.15 | Date: 2026-09-19 | LAST CHANGE: the addresses are a list rather than boxes, at her "l list". She asked "is this how github's UI is for mutiiple eamlis?" and it was not: GitHub draws each address as plain text on its own line with a small label beside it. A readonly input the same shape as the boxes around it reads as something you can type into and cannot, which is the door-onto-nothing fault in miniature. Plain text, a hairline between each, PRIMARY as a small outlined label, and the foot of the list is where Add another email address goes once the code flow exists. Still behind ?emails=1. -->
<!-- Version: V1.14 | Date: 2026-09-19 | LAST CHANGE: ?emails=1 shows every address that reaches this account, primary labelled. Jessie, having signed in with her second address and landed on her own account: "can i see all asosciated emails in the account sectino? - just shows gmail right now". Reading only, and no Add button, because adding one safely needs two proofs at once - already signed in, AND a code typed back from the new address - and that flow is not built; a box that looked like it could add one would be a door onto nothing. Behind the parameter until she has looked at it, and the plain single Email field is exactly as it was without it. -->

<html lang="en">
<head>
<meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
<script src="https://2gather.network/nav/identity.js?v=21"></script>
<script src="/moved.js?v=2"></script>
<meta name="robots" content="noindex, nofollow">
<title>My account</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<style>
  :root{
    --bg:#1F699E; --brand:#1F699E; --ink:#1A2E42; --soft:#4B5A6D; --muted:#6B7A8D;
    --line:#DDE4EE; --panel:#F7FBFF; --panel-line:#C9DFF3; --card:#fff;
    --done-bg:#E7F5EA; --done-ink:#1A5A2C; --err-bg:#FBE9E7; --err-line:#E8B0A5; --err-ink:#7A2410;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5;}
  /* THE PAGE TEMPLATE. 1200 wide, a 340 rail, an 18px gap, one column below 860.
     design/component-library/page-template.md. This page was the last one carrying its own
     width - 1040, no rail, folding at 760 - which made it read as a different product from
     My groups, My events and the editing page sitting beside it in the same navigation. */
  .wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px;}
  .layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start;}

  /* Welcome block */
  .hello{margin-bottom:16px;min-height:42px;}
  h1:empty::after{content:"\200b";}
  h1{font-size:28px;font-weight:400;margin:0;color:#fff;letter-spacing:-.01em;}
  .hello .sub{color:#fff;opacity:.92;font-size:15px;margin-top:6px;}
  .hello .sub a{color:#fff;font-weight:700;text-decoration:underline;cursor:pointer;}
  .btn{display:inline-block;background:#fff;color:var(--brand);border:0;padding:10px 18px;border-radius:24px;
    font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;}
  .btn.line{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.75);}
  .btn.solid{background:var(--brand);color:#fff;}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--panel-line);}
  .btn.sm{padding:8px 15px;font-size:13px;}

  /* THE RAIL. The six pills that ran across the top are the list down the left now, which is
     where every other page in this navigation puts them, and the panel holds whatever is open.

     Separate white buttons with their own borders, never one box holding a pressed control, so
     all six look pressable rather than only the chosen one. Selected is filled blue with white
     lettering and nothing else marks it - no tick, which would say what the colour already says
     and shift every label sideways by a character as you move down the list. */
  /* The rail is a white card, the same one My events and the editing page use, and it is what
     makes the chosen pill readable: filled blue on the blue ground disappeared into it. A button
     sitting on the blue is white with brand-blue lettering, never a blue fill. */
  .tabs{background:#fff;border-radius:14px;padding:12px;height:fit-content;
    display:flex;flex-direction:column;gap:6px;}
  .tab{display:block;width:100%;text-align:left;background:#fff;color:var(--brand);
    border:1.5px solid #C9D6E2;border-radius:9px;font-family:inherit;font-size:14px;
    font-weight:700;padding:11px 14px;cursor:pointer;line-height:1.25;}
  .tab:hover{background:var(--panel);}
  .tab.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .tab.on:hover{background:var(--brand);}
  .tab:focus-visible{outline:2px solid #fff;outline-offset:2px;}

  /* WAITING IS THE BLINKING PILL, not a spinner and not a grey box saying "Loading your
     account...". The backend answers in anywhere between nine and thirty-nine seconds and a
     spinner beside that reads as something being wrong. It sits in the panel, because the rail
     draws at once and only the panel is waiting on an answer. */
  .cw-loading{display:inline-flex;align-items:center;gap:8px;background:#1F699E;color:#fff;
    font-size:13px;font-weight:700;padding:8px 16px;border-radius:20px;white-space:nowrap;
    animation:cw-breathe 1.6s ease-in-out infinite;}
  @keyframes cw-breathe{0%,100%{opacity:1}50%{opacity:.62}}

  /* Content card */
  .panel{background:var(--card);border-radius:14px;padding:26px 30px;min-height:280px;}
  .panel h2{font-size:21px;font-weight:800;margin:0 0 3px;}
  .panel .lead{color:var(--soft);font-size:14.5px;margin:0 0 20px;}

  .fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .f label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;}
  .f input,.f textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
    font:inherit;color:var(--ink);background:#fff;}
  .f input:focus,.f textarea:focus{outline:2px solid var(--panel-line);outline-offset:1px;border-color:var(--brand);}
  .f select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
    font:inherit;color:var(--ink);background:#fff;}
  .f select:focus{outline:2px solid var(--panel-line);outline-offset:1px;border-color:var(--brand);}
  .locrow{display:flex;gap:10px;flex-wrap:wrap;}
  /* Addresses fill DOWN two rows and then across, so one and two stay put and three and four
     appear beside them rather than everything reshuffling each time one is added. */
  .emaillist{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;
    grid-auto-columns:minmax(0,1fr);column-gap:28px;}
  .locrow select{width:auto;flex:1 1 180px;min-width:150px;}
  /* City is typed, not picked, so it needs the same rule as the selects beside it (row 206). */
  .locrow input{width:auto;flex:1 1 180px;min-width:150px;}
  .photorow{display:flex;gap:16px;align-items:center;margin-bottom:18px;}
  .photo{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#DDE4EE;flex-shrink:0;}

  /* Space does the separating, never a rule. A line between every row draws a grid nobody
     asked for. Jessie, 2026-09-08: "no horiziontal lines anywhere". */
  .prow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;}
  .prow .lab{font-size:15px;font-weight:700;}
  .prow .desc{font-size:13px;color:var(--soft);margin-top:2px;}
  .prow .desc a{color:inherit;}
  .toggle{width:48px;height:27px;border-radius:14px;background:var(--line);border:0;position:relative;cursor:pointer;flex-shrink:0;}
  .toggle.on{background:var(--brand);}
  .toggle::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .15s;}
  .toggle.on::after{left:24px;}

  .lang-chips{display:flex;gap:8px;flex-wrap:wrap;}
  .lang-chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--panel-line);
    border-radius:16px;padding:5px 8px 5px 13px;font-size:13.5px;font-weight:700;color:var(--brand);}
  .lang-chip button{background:none;border:0;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:0 2px;}
  .lang-pool{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .lang-opt{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 13px;font:inherit;
    font-size:13.5px;color:var(--ink);cursor:pointer;}
  .lang-opt:hover{background:var(--panel);border-color:var(--panel-line);}

  /* Info boxes inside the white card (answers, Appear page) */
  .infobox{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:18px 20px;margin-bottom:14px;}
  .infobox:last-child{margin-bottom:0;}
  .infobox .t{font-size:15.5px;font-weight:800;margin-bottom:4px;}
  .infobox .d{font-size:14px;color:var(--soft);margin-bottom:14px;}
  .infobox .row{display:flex;gap:10px;flex-wrap:wrap;}

  .status{border-radius:10px;padding:12px 15px;font-size:14px;}
  .status.info{background:var(--panel);border:1px solid var(--panel-line);color:var(--soft);}
  .status.err{background:var(--err-bg);border:1px solid var(--err-line);color:var(--err-ink);}

  @media(max-width:860px){
    .layout{grid-template-columns:1fr;}
    /* Six buttons stacked down a phone is most of a screen before the panel starts, so below the
       fold the rail lies back down and wraps. */
    .tabs{flex-direction:row;flex-wrap:wrap;}
    .tab{width:auto;}
  }
  @media(max-width:760px){
    .fieldgrid{grid-template-columns:1fr;}
    .emaillist{display:block;}
    .panel{padding:20px 18px;}
    h1{font-size:24px;}
  }
  @media(prefers-reduced-motion:reduce){ .toggle::after{transition:none;} }
</style>
</head>
<body>
<div class="wrap">

  <div class="hello">
    <h1 id="hello-title"></h1>
  </div>

  <div class="layout">
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel"><span class="cw-loading">Loading your account</span></div>
  </div>

</div>

<script>
(function(){
  var GS_URL='https://cw-api-gate.jessieupp.workers.dev';

// The cache is trusted now, and nothing here skips it.
//
// History, because this line has moved twice in three days. On 2026-08-30 the page began adding
// nocache=1 to every read about you, since a save cleared nothing at the gate and a profile could
// show pre-save answers for six hours. That cost the whole wait on every visit. On 2026-09-01 the
// gate learned to clear a person's cached reads the moment they write, so the bypass was cut down
// to twenty seconds after a save.
//
// Twenty seconds was still wrong, and Jessie found it within minutes: the editor autosaves, so
// every save restamped the clock and kept her in the slow path the entire time she was editing,
// and for twenty seconds after every keystroke that triggered a save. She saved, moved pages, came
// back, and everything took five seconds again.
//
// It is gone. Every read this page makes carries appearId and nothing else, which is exactly the
// key the gate's purge rebuilds, so a save clears them all and the next read is fresh. The thirty
// second life on those entries is the backstop if a purge ever misses.

  var APPEAR_EDIT='https://appear.network/dl/page/';
  // Hrefless navigation so an id-bearing URL never shows on hover. Same-tab always.
  window._safeNavGo=function(el){try{var u=el&&el.getAttribute&&el.getAttribute('data-nav');if(u){window.location.href=u;}}catch(e){}return false;};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function P(k){try{return new URLSearchParams(location.search).get(k)||'';}catch(e){return '';}}

  // CWid is the standard "this is me" param; id/me/memberCard/appearId accepted too.
  var meId=(window.CW&&CW.me)?CW.me().id:(P('CWid')||P('id')||P('me')||P('memberCard')||P('appearId')||'').trim();
  var _placeUnread=false;
  var D={name:'',firstName:'',lastName:'',photo:'',pageLink:'',postal:'',location:'',county:'',city:'',languages:'',email:'',alsoEmails:[],phone:'',
       visPublic:'',showPhoto:'',onMap:'',findable:'',ackTerms:'',dateAckTerms:''};

  function go(url){ window.location.href=url; }
  function groupsUrl(){ return 'https://2gather.network/mygroups'+(meId?'?CWid='+encodeURIComponent(meId)+'&ref=profile':'?ref=profile'); }
  function eventsUrl(){ return 'https://2gather.network/manage/'; }   // My events is the manage page since 2026-09-08

  // The stable answers URL. Stays correct after Design A is promoted onto intake.html.
  function answersUrl(){ return 'https://creating.works/profile'+(meId?'?CWid='+encodeURIComponent(meId):''); }
  function profileUrl(){ return 'https://creating.works/profile'+(meId?'?CWid='+encodeURIComponent(meId):''); }
  var TABS=[
    {key:'me', label:'My profile', nav:profileUrl},
    {key:'groups', label:'My groups', nav:groupsUrl},
    {key:'events', label:'My events', nav:eventsUrl},
    {key:'account', label:'My account'},
      // SUPPORT AND SIGN OUT LIVE HERE NOW. Jessie, 2026-09-08: "add support to button to top of
      // sub buttons, to the right of my account" and "add signout can go under my acdount".
      // The top bar lost its menus the same day, and the More menu was the only door to both.
    {key:'support', label:'Support', nav:function(){ return 'https://2gather.network/support?from=' + encodeURIComponent(location.pathname); }},
    {key:'signout', label:'Sign out', out:true},
    // Permissions is hidden until its toggles map to real fields. The panel still answers to
    // ?tab=permissions so the work stays reachable.
    // {key:'permissions', label:'Permissions'}
  ];

  function field(key,lab,type,val,ph){
    return '<div class="f"><label>'+esc(lab)+'</label><input data-acct="'+esc(key)+'" type="'+type+'" value="'+esc(val||'')+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'></div>';
  }
  // A name shown here comes from the Appear page, and Glide owns that row, so anything written
  // back would be overwritten on the next sync. It is shown, not offered for editing.
  // EVERY ADDRESS THAT REACHES THIS ACCOUNT. Jessie, 2026-09-19: "can i see all asosciated emails
  // in the account sectino? - just shows gmail right now", after signing in with her second address
  // and landing on her own account.
  //
  // Behind ?emails=1 until she has looked at it, so nobody meets it without the parameter.
  //
  // READING ONLY. There is no Add here and no Remove, because adding an address safely needs two
  // proofs at once - you are already signed in, AND you type a code sent to the new address - and
  // that flow is steps three and four of
  // design/features/many-addresses-one-person-2026-09-03.md and is not built. A box that looked
  // like it could add one would be a door onto nothing.
  //
  // The primary is labelled, because which address a code goes to is the one thing somebody
  // actually needs to know from this list.
  function emailBlock(){
    var hint=_editToken?'':'Hidden until you verify it is you. Press Save changes to verify.';
    // THE PARAMETER IS GONE. Jessie, 2026-09-19: "https://2gather.network/account/ doesn't match
    // the 2gather.network/account/?emails=1." It did not, and there was no longer a reason for it
    // to: she approved this look twice and tested adding, promoting and removing an address on it.
    // The list is simply the page now. Somebody with one address still sees the plain Email field,
    // because a list of one is a list nobody needs.
    if(!_editToken || !D.alsoEmails.length){
      return readonlyField('Email', D.email, hint);
    }
    // A LIST, NOT BOXES. Jessie, 2026-09-19, seeing the first version: "is this how github's UI is
    // for mutiiple eamlis?" It was not. GitHub draws each address as plain text on its own line
    // with a small label beside it, and an Add box at the foot. Ours put each one in a readonly
    // input, the same shape as the First name and Postal code boxes beside it, so it read as
    // something you could type into and could not - the same door-onto-nothing fault as an Add
    // button that cannot add, in a smaller form.
    function line(addr, primary){
      return '<div style="display:flex;align-items:baseline;gap:10px;padding:9px 0;'
        + 'border-bottom:1px solid var(--line);">'
        + '<span style="font-size:15px;color:var(--ink);word-break:break-all;">'+esc(addr)+'</span>'
        + (primary
            ? '<span style="font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;'
              + 'color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 8px;'
              + 'white-space:nowrap;">Primary</span>'
            // Make primary and Remove belong to an address that is NOT the primary. Remove is
            // deliberately never offered on the primary, so nobody can lock themselves out of
            // their own account; making another one primary first is the way.
            : '<span style="margin-left:auto;white-space:nowrap;font-size:13px;">'
              + '<a href="#" data-emprime="'+esc(addr)+'" style="color:#1F699E;text-decoration:none;">Make primary</a>'
              + '<a href="#" data-emdrop="'+esc(addr)+'" style="color:var(--muted);text-decoration:none;margin-left:12px;">Remove</a>'
              + '</span>')
        + '</div>';
    }
    var rows=line(D.email||'', true);
    D.alsoEmails.forEach(function(a){ rows+=line(a, false); });
    rows+='<div id="em-add" style="padding:10px 0 2px;">'
      +'<a href="#" id="em-open" style="color:#1F699E;font-weight:700;font-size:14px;text-decoration:none;">Add another email address</a>'
      +'<div id="em-form" style="display:none;margin-top:8px;">'
        // THE BUTTONS SIT UNDER THE LEFT EDGE OF THE FIELD, WITH ROOM ABOVE THEM. Jessie,
        // 2026-09-19: "put cancel to the right of send a code button and give some room beneath
        // field and above buttons - looks squished - and left justify under field for email".
        // They were inline after the field with an 8px nudge, so when they wrapped they landed
        // indented and tight under it.
        +'<div id="em-step1"><input id="em-new" type="email" placeholder="you@work.com" autocomplete="email" style="max-width:320px;">'
          +'<div style="margin-top:14px;display:flex;gap:10px;align-items:center;">'
          +'<button type="button" id="em-send" class="btn ghost" style="font-size:14px;padding:9px 16px;">Send a code</button>'
          +'<button type="button" class="btn ghost em-cancel" style="font-size:14px;padding:9px 16px;">Cancel</button></div></div>'
        +'<div id="em-step2" style="display:none;"><input id="em-code" type="text" inputmode="numeric" maxlength="6" placeholder="000000" style="max-width:160px;letter-spacing:6px;">'
          +'<div style="margin-top:14px;display:flex;gap:10px;align-items:center;">'
          +'<button type="button" id="em-ok" class="btn ghost" style="font-size:14px;padding:9px 16px;">Add this address</button>'
          +'<button type="button" class="btn ghost em-cancel" style="font-size:14px;padding:9px 16px;">Cancel</button></div></div>'
        +'<div id="em-say" style="font-size:13px;color:var(--soft);margin-top:8px;"></div>'
      +'</div></div>';
    // TWO COLUMNS, FILLING DOWN THEN ACROSS. Jessie, 2026-09-19: "now we can use better space for
    // eamil with 2 columns - maybe put the third and fourth where postcal code whent?" So the
    // first two addresses stay where they are and the third and fourth appear beside them, in the
    // space the postal code left. Two fixed ROWS with the flow set to column is what does that:
    // a grid of two columns would put the second address on the right instead.
    // It collapses to one column on a phone, in .emaillist below.
    // THE HELP LINE SITS UNDER THE HEADING, NEVER UNDER THE THING. Jessie, 2026-09-19: "put
    // 'Signing in with any of these reaches this account. Adding another one is coming.' below
    // header. all in help small liners like this go under headers." It is her rule from
    // 2026-09-08 and design-checklist.md has carried it since: help under the field is help AFTER
    // the decision, and by then it has been read too late to be help at all.
    return '<div class="f" style="grid-column:1/-1;"><label>Email addresses</label>'
      +'<div style="font-size:12.5px;color:var(--muted);margin:-2px 0 8px;">'
      +'Signing in with any of these reaches this account.</div>'
      +'<div class="emaillist" style="border-top:1px solid var(--line);">'+rows+'</div>'
      // WHERE REMOVE AND MAKE PRIMARY SAY ANYTHING AT ALL. Jessie, 2026-09-19: "remove didn't work
      // when I tried to remove it" - and she saw NO message, because the only place this block had
      // to speak was inside the add-an-address form, which is hidden until Add is pressed. So a
      // refusal from Remove or Make primary landed nowhere and the press looked like it did
      // nothing. A page that knows exactly what happened must never say nothing.
      +'<div id="em-note" style="font-size:13px;color:#7A2410;margin-top:8px;display:none;"></div>'
      // TAKING AN ADDRESS OFF IS ASKED FOR IN WORDS. Jessie, 2026-09-19: "put a message Are you
      // sure you want to remove \'email\' ? and say type remove". Inline rather than a dialog,
      // because this site has no modals - and typing the word is the point: it cannot happen by a
      // stray press, and the address being removed is named in the question rather than left to
      // whichever row the finger landed on.
      +'<div id="em-conf" style="display:none;margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);">'
        +'<div id="em-conf-ask" style="font-size:14px;line-height:1.5;"></div>'
        +'<div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">'
        +'<input id="em-conf-word" type="text" placeholder="remove" autocomplete="off" style="max-width:160px;">'
        +'<button type="button" id="em-conf-go" class="btn ghost" style="font-size:14px;padding:9px 16px;">Remove</button>'
        +'<button type="button" id="em-conf-no" class="btn ghost" style="font-size:14px;padding:9px 16px;">Cancel</button></div>'
      +'</div></div>';
  }

  // ADDING, PROMOTING AND REMOVING AN ADDRESS. Jessie, 2026-09-19: "0 build", and before it
  // "how do they udpate these emails btw?" and "can they cjange one email to be the primary
  // instead?"
  //
  // TWO PROOFS AND NEITHER ALONE IS ENOUGH: this page already holds the verified session that
  // saving needs, which proves the account is yours, and adding an address sends a code to THAT
  // address which proves you hold it. The backend checks both and checks again on the second
  // half, because minutes pass in between.
  //
  // Nothing here is optimistic: the list is redrawn from what the backend answers, never from
  // what the page hoped. A save that half worked would otherwise leave the screen lying.
  function wireEmails(p){
    if(!p) return;
    function say(m,bad){ var el=document.getElementById('em-say'); if(el){ el.textContent=m||''; el.style.color=bad?'#7A2410':'var(--soft)'; } }
    function after(resp){
      if(!resp||resp.status!=='ok') return false;
      if(resp.email) D.email=resp.email;
      D.alsoEmails=Array.isArray(resp.alsoEmails)?resp.alsoEmails:D.alsoEmails;
      renderPanel('account');
      return true;
    }
    var open=document.getElementById('em-open');
    function call(action, extra, done){
      var u=GS_URL+'?action='+action+'&appearId='+encodeURIComponent(meId)
        +'&editToken='+encodeURIComponent(_editToken);
      Object.keys(extra||{}).forEach(function(k){ u+='&'+k+'='+encodeURIComponent(extra[k]); });
      fetch(u).then(function(r){ return r.json(); }).then(done)
        .catch(function(){ say('That did not reach the server. Try once more.',true); });
    }
    if(open) open.onclick=function(ev){ ev.preventDefault();
      var f=document.getElementById('em-form'); if(f){ f.style.display='block'; }
      open.style.display='none';
      var n=document.getElementById('em-new'); if(n) n.focus();
      return false; };
    // Cancel puts the whole thing away and empties it, so reopening never shows a half-typed
    // address or a code that has expired since.
    p.querySelectorAll('.em-cancel').forEach(function(b){
      b.onclick=function(){
        var f=document.getElementById('em-form'); if(f) f.style.display='none';
        if(open) open.style.display='';
        var n=document.getElementById('em-new'), c=document.getElementById('em-code');
        if(n) n.value=''; if(c) c.value='';
        document.getElementById('em-step1').style.display='';
        document.getElementById('em-step2').style.display='none';
        say('');
      };
    });
    var send=document.getElementById('em-send');
    if(send) send.onclick=function(){
      var n=document.getElementById('em-new'); var v=n?String(n.value||'').trim():'';
      if(!v){ say('Type the address first.',true); return; }
      send.disabled=true; say('Sending a code to '+v+'…');
      call('addEmailStart',{email:v},function(r){
        send.disabled=false;
        if(!r||r.status!=='ok'){ say((r&&r.message)||'That did not work.',true); return; }
        document.getElementById('em-step1').style.display='none';
        document.getElementById('em-step2').style.display='block';
        say('We sent a code to '+v+'. Type it here. It expires in fifteen minutes.');
        var c=document.getElementById('em-code'); if(c) c.focus();
      });
    };
    var ok=document.getElementById('em-ok');
    if(ok) ok.onclick=function(){
      var n=document.getElementById('em-new'), c=document.getElementById('em-code');
      var v=n?String(n.value||'').trim():'', code=c?String(c.value||'').trim():'';
      if(!code){ say('Type the code.',true); return; }
      ok.disabled=true; say('Checking…');
      call('addEmailConfirm',{email:v,code:code},function(r){
        ok.disabled=false;
        if(!after(r)) say((r&&r.message)||'That did not work.',true);
      });
    };
    function note(m){ var el=document.getElementById('em-note');
      if(el){ el.textContent=m||''; el.style.display=m?'block':'none'; } }
    p.querySelectorAll('[data-emprime]').forEach(function(a){
      a.onclick=function(ev){ ev.preventDefault(); note('');
        call('makePrimaryEmail',{email:a.getAttribute('data-emprime')},function(r){
          if(!after(r)) note((r&&r.message)||'That did not work. Try once more.');
        });
        return false; };
    });
    // Remove ASKS FIRST, and the answer is the word itself.
    var conf=document.getElementById('em-conf');
    function closeConf(){ if(conf) conf.style.display='none';
      var w=document.getElementById('em-conf-word'); if(w) w.value=''; }
    var no=document.getElementById('em-conf-no'); if(no) no.onclick=function(){ closeConf(); note(''); };
    p.querySelectorAll('[data-emdrop]').forEach(function(a){
      a.onclick=function(ev){ ev.preventDefault(); note('');
        var addr=a.getAttribute('data-emdrop');
        var ask=document.getElementById('em-conf-ask');
        if(ask) ask.innerHTML='Are you sure you want to remove <strong>'+esc(addr)+'</strong>? '
          +'It will stop signing you in. Type <strong>remove</strong> to confirm.';
        var go=document.getElementById('em-conf-go');
        if(go) go.onclick=function(){
          var w=document.getElementById('em-conf-word');
          var typed=w?String(w.value||'').trim().toLowerCase():'';
          if(typed!=='remove'){ note('Type the word remove to confirm, or press Cancel.'); return; }
          go.disabled=true; note('Removing '+addr+'\u2026');
          call('removeEmail',{email:addr},function(r){
            go.disabled=false;
            if(after(r)){ closeConf(); }
            else note((r&&r.message)||'That did not work. Try once more.');
          });
        };
        if(conf) conf.style.display='block';
        var w0=document.getElementById('em-conf-word'); if(w0){ w0.value=''; w0.focus(); }
        return false; };
    });
  }

  function readonlyField(lab,val,note){
    return '<div class="f"><label>'+esc(lab)+'</label>'
      +'<input type="text" value="'+esc(val||'')+'" readonly style="background:var(--panel);color:var(--soft);">'
      +(note?'<div style="font-size:12.5px;color:var(--muted);margin-top:6px;">'+note+'</div>':'')+'</div>';
  }

  // Each switch stands for one stored field. Blank means the person has never set it, so the
  // default is what the site does today: a profile is reachable by link, the photo shows, the
  // map includes everyone, and search finds you. Turning one off records the choice; the pages
  // that show a profile have to read the field before the choice takes effect anywhere.
  var PERM_DEFAULT={visPublic:true,showPhoto:true,onMap:true,findable:true};
  function permOn(key){
    var v=D[key];
    if(v===''||v==null) return !!PERM_DEFAULT[key];
    return String(v).trim().toLowerCase()==='true';
  }
  function toggleRow(key,lab,desc){
    var on=permOn(key);
    return '<div class="prow"><div><div class="lab">'+esc(lab)+'</div><div class="desc">'+desc+'</div></div>'
      +'<button class="toggle'+(on?' on':'')+'" data-perm="'+esc(key)+'" aria-pressed="'+(on?'true':'false')+'"></button></div>';
  }
  function bindToggles(root){
    root.querySelectorAll('[data-perm]').forEach(function(b){
      b.onclick=function(){
        var on=!b.classList.contains('on');
        b.classList.toggle('on',on);
        b.setAttribute('aria-pressed',on?'true':'false');
        D[b.getAttribute('data-perm')]=on?'true':'false';
        markDirty();
      };
    });
  }
  // The text fields only live in the DOM until this reads them back.
  function harvestAccount(){
    var p=document.getElementById('panel'); if(!p) return;
    p.querySelectorAll('[data-acct]').forEach(function(i){ D[i.getAttribute('data-acct')]=i.value.trim(); });
  }

  // ---- Saving ----
  // Nothing on this page saved until now, which broke the rule that anything settable stays
  // editable. A save carries the same one-time-code token the profile page mints, so an account
  // cannot be changed by whoever merely holds the link. The token sits under the same browser key
  // profile.html uses, so verifying once covers both pages for the hour.
  var _EDIT_KEY='cw-edit-'+String(meId||'').split('.').join('').toLowerCase();
  function _tokenGet(){
    try{
      var raw=localStorage.getItem(_EDIT_KEY);
      if(!raw){
        // Signing in mints exactly this session and keeps it under its own name. Somebody who
        // has just signed in is not asked again here.
        var t2=localStorage.getItem('cw-token')||'';
        var who=String(localStorage.getItem('cw-id')||'').split('.').join('').toLowerCase();
        var mine=String(meId||'').split('.').join('').toLowerCase();
        if(t2 && who && who===mine){
          var exp2=parseInt(String(t2).split('.')[1],10);
          if(exp2 && Date.now()<=(exp2-60000)) return t2;
          localStorage.removeItem('cw-token');
        }
        return '';
      }
      var o=JSON.parse(raw);
      if(!o||!o.t||!o.exp||Date.now()>(o.exp-60000)){ localStorage.removeItem(_EDIT_KEY); return ''; }
      return o.t;
    }catch(e){ return ''; }
  }
  function _tokenSet(t){ try{ localStorage.setItem(_EDIT_KEY, JSON.stringify({t:t, exp:Date.now()+60*60*1000})); }catch(e){} }
  function _tokenClear(){ try{ localStorage.removeItem(_EDIT_KEY); }catch(e){} }
  var _editToken=_tokenGet(), _dirty=false;

  // The panel used to print "Aug 2026" whether or not anything had been accepted. It now says
  // only what the row actually holds.
  function termsRecorded(){
    return !!(String(D.dateAckTerms||'').trim() || String(D.ackTerms||'').trim());
  }
  function termsStamp(){
    var d=String(D.dateAckTerms||'').trim();
    if(d){
      var t=new Date(d);
      if(!isNaN(t.getTime())) return t.toLocaleDateString(undefined,{month:'short',year:'numeric'});
      return d;
    }
    return String(D.ackTerms||'').trim() ? 'Accepted' : 'Not recorded';
  }
  // The row used to claim an acceptance whatever the sheet held. It now only claims one when
  // there is a record of it.
  function termsLede(){ return termsRecorded() ? 'You accepted the ' : 'Read the '; }
  function saveRow(){
    // NO RULE ABOVE SAVE CHANGES. Jessie, 2026-09-19: "remove horizontal line above save changes".
    // Space does the separating; a line between every section draws a grid nobody asked for, which
    // is what the note further up this file already says about rows.
    return '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:26px;">'
      +'<button type="button" class="btn solid" id="acct-save">Save changes</button>'
      +'<span id="acct-savestat" style="font-size:13.5px;color:var(--soft);font-weight:600;"></span>'
      +'</div><div id="acct-gate"></div>';
  }
  function setStat(t){ var el=document.getElementById('acct-savestat'); if(el) el.textContent=t||''; }
  function markDirty(){ _dirty=true; setStat('Not saved yet.'); }
  function bindSave(){ var b=document.getElementById('acct-save'); if(b) b.onclick=function(){ saveAccount(); }; }

  // ── The photo ──────────────────────────────────────────────────────────────────────────────
  // Upload new revealed a note and did nothing else, so the one page named after changing your
  // details could not change the first thing on it. Jessie, 2026-09-07: "upload new doesn't work
  // when i click on it". It was not broken. It was never built.
  //
  // Lifted from the profile page, which has done this correctly since the photo work: pick, shrink
  // to a 600px square because a round frame crops to one anyway, send to cw-photos, then write the
  // address back. The address is cache-busted on screen so the new face appears at once rather than
  // when the edge forgets the old one, and the SAVED address is the clean one.
  var PHOTO_URL='https://cw-photos.jessieupp.workers.dev';
  function photoStat(msg){ var n=document.getElementById('photo-note'); if(!n) return; n.textContent=msg||''; n.style.display=msg?'':'none'; }

  function choosePhoto(){
    if(!meId) return;
    if(!_editToken){ showPinBar(function(){ choosePhoto(); },'Verify it is you, then choose a picture.'); return; }
    var inp=document.createElement('input');
    inp.type='file'; inp.accept='image/*';
    inp.onchange=function(){ var f=inp.files&&inp.files[0]; if(f) shrinkPhoto(f); };
    inp.click();
  }

  function shrinkPhoto(file){
    photoStat('Getting it ready…');
    var img=new Image();
    img.onload=function(){
      try{
        var side=Math.min(img.width,img.height);
        var c=document.createElement('canvas'); c.width=600; c.height=600;
        c.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,600,600);
        c.toBlob(function(blob){
          if(!blob){ photoStat('That picture could not be read.'); return; }
          sendPhoto(blob);
        },'image/jpeg',0.85);
      }catch(e){ photoStat('That picture could not be read.'); }
      finally{ try{ URL.revokeObjectURL(img.src); }catch(e){} }
    };
    img.onerror=function(){ photoStat('That picture could not be read.'); };
    img.src=URL.createObjectURL(file);
  }

  function sendPhoto(blob){
    photoStat('Sending…');
    fetch(PHOTO_URL+'/upload?id='+encodeURIComponent(meId),{
      method:'POST',
      headers:{'Content-Type':'image/jpeg','x-cw-token':_editToken},
      body:blob
    }).then(function(r){ return r.json(); }).then(function(d){
      if(!d||d.status!=='ok'||!d.url){ photoStat((d&&d.message)||'That did not go through.'); return; }
      D.photo=d.url;
      var im=document.querySelector('img.photo');
      if(im){ im.src=d.url+'?v='+Date.now(); }
      else{
        var box=document.querySelector('.photorow .photo');
        if(box&&box.parentNode){
          var ni=document.createElement('img');
          ni.className='photo'; ni.alt=''; ni.src=d.url+'?v='+Date.now();
          box.parentNode.replaceChild(ni,box);
        }
      }
      photoStat('Saving…');
      savePhotoUrl(d.url);
    }).catch(function(){ photoStat('That did not go through.'); });
  }

  // Written on its own rather than through saveAccount, so a picture never carries the rest of the
  // form with it and a half-filled form cannot be saved by choosing a photo.
  function savePhotoUrl(url){
    fetch(GS_URL+'?action=saveAccount&appearId='+encodeURIComponent(meId)
      +'&secure=1&editToken='+encodeURIComponent(_editToken)
      +'&guestPhotoURL='+encodeURIComponent(url))
      .then(function(r){ return r.json(); })
      .then(function(resp){
        if(resp&&resp.status==='ok'){ photoStat('Photo saved 🌱'); setTimeout(function(){ photoStat(''); },2500); return; }
        _editToken=''; _tokenClear();
        showPinBar(function(){ savePhotoUrl(url); },(resp&&resp.message)||'Your hour ran out. Verify again to save the photo.');
      })
      .catch(function(){ photoStat('The picture went up but did not save. Try again.'); });
  }

  function saveAccount(){
    if(!meId) return;
    harvestAccount();
    if(!_editToken){ showPinBar(function(){ saveAccount(); }); return; }
    var b=document.getElementById('acct-save'); if(b) b.disabled=true;
    setStat('Saving…');
    var u=GS_URL+'?action=saveAccount&appearId='+encodeURIComponent(meId)
      +'&secure=1&editToken='+encodeURIComponent(_editToken)
      +'&postal='+encodeURIComponent(D.postal||'')
      +'&location='+encodeURIComponent(D.location||'')
      // COUNTY AND CITY, row 206, 2026-09-15. Jessie: "add location fields to https://2gather.network/account/ too?"
      // The intro has asked for them since V1.61 and this page did not, so the two pages held different halves of one
      // place. Both write Info.county and Info.city now.
      +'&county='+encodeURIComponent(D.county||'')
      +'&city='+encodeURIComponent(D.city||'')
      +'&languages='+encodeURIComponent(D.languages||'')
      +'&firstName='+encodeURIComponent(D.firstName||'')
      +'&lastName='+encodeURIComponent(D.lastName||'')
      +'&visPublic='+(permOn('visPublic')?'true':'false')
      +'&showPhoto='+(permOn('showPhoto')?'true':'false')
      +'&onMap='+(permOn('onMap')?'true':'false')
      +'&findable='+(permOn('findable')?'true':'false');
    fetch(u).then(function(r){ return r.json(); }).then(function(resp){
      if(b) b.disabled=false;
      if(resp&&resp.status==='ok'){ _dirty=false; setStat('Saved 🌱'); setTimeout(function(){ setStat(''); },2500); return; }
      // An expired hour asks again rather than dropping the edit.
      _editToken=''; _tokenClear(); setStat('');
      showPinBar(function(){ saveAccount(); },(resp&&resp.message)||'Your hour ran out. Verify again to save.');
    }).catch(function(){ if(b) b.disabled=false; setStat('Could not save. Try again.'); });
  }

  // Inline on the page, never an overlay, and the code goes out only when it is asked for.
  function showPinBar(onOk,msg){
    var host=document.getElementById('acct-gate'); if(!host) return;
    host.innerHTML='';
    var bar=document.createElement('div');
    bar.style.cssText='background:#FFF7E6;border:1.5px solid #E5A93B;border-radius:12px;padding:16px 18px;margin-top:16px;';
    var t=document.createElement('div');
    t.style.cssText='font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:6px;';
    t.textContent=msg||'Verify it is you';
    var st=document.createElement('div');
    st.style.cssText='font-size:13.5px;color:var(--soft);margin-bottom:12px;line-height:1.5;';
    st.textContent='We will email a one-time 6-digit code to the address on your profile. It expires in 15 minutes and can only be used once.';
    var row=document.createElement('div');
    row.style.cssText='display:flex;gap:10px;flex-wrap:wrap;align-items:center;';
    var send=document.createElement('button'); send.type='button'; send.className='btn solid'; send.textContent='Email me a code';
    var inp=document.createElement('input'); inp.type='text'; inp.inputMode='numeric'; inp.maxLength=6;
    inp.placeholder='Example: 428091';
    inp.style.cssText='display:none;width:160px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;text-align:center;letter-spacing:.16em;';
    var go=document.createElement('button'); go.type='button'; go.className='btn solid'; go.textContent='Unlock'; go.style.display='none';
    row.appendChild(send); row.appendChild(inp); row.appendChild(go);
    bar.appendChild(t); bar.appendChild(st); bar.appendChild(row); host.appendChild(bar);

    send.onclick=function(){
      send.disabled=true; st.textContent='Sending your code…';
      fetch(GS_URL+'?action=sendProfilePin&appearId='+encodeURIComponent(meId))
        .then(function(r){return r.json();}).then(function(resp){
          send.disabled=false;
          if(resp&&resp.sent){
            send.textContent='Resend'; st.textContent='Check your email for the code.';
            inp.style.display=''; go.style.display=''; inp.focus();
          } else { st.textContent='There is no email on file for this profile yet.'; }
        }).catch(function(){ send.disabled=false; st.textContent='Could not send. Try again.'; });
    };
    go.onclick=function(){
      var c=(inp.value||'').trim(); if(!c) return;
      go.disabled=true; st.textContent='Checking…';
      fetch(GS_URL+'?action=verifyProfilePin&appearId='+encodeURIComponent(meId)+'&code='+encodeURIComponent(c))
        .then(function(r){return r.json();}).then(function(resp){
          go.disabled=false;
          if(resp&&resp.status==='ok'&&resp.editToken){
            _editToken=resp.editToken; _tokenSet(_editToken);
            host.innerHTML=''; if(onOk) onOk();
          } else { st.textContent=(resp&&resp.message)||'That code did not match.'; }
        }).catch(function(){ go.disabled=false; st.textContent='Could not verify. Try again.'; });
    };

    bar.scrollIntoView({behavior:'smooth',block:'center'});
  }

  function renderPanel(key){

    }
    if(key==='permissions'){

    // My account

    p.innerHTML='<h2>My account</h2>'

        +'<div id="photo-note" style="display:none;font-size:13.5px;color:var(--soft);margin-top:8px;max-width:44ch;"></div></div>'
      +'</div>'

      +(_placeUnread
        ? '<div style="font-size:13.5px;color:#7A2410;line-height:1.5;">We could not read your place '
          +'just now, so nothing below is your answer. <a href="https://2gather.network/signin/?next=%2Faccount%2F" '

        : '')
      +'<div id="loc-box"></div></div>'
      // LANGUAGES COMES OFF THIS SCREEN. Jessie, 2026-09-19: "move laungauges away since we have
      // them here already: https://2gather.network/intro/?perm=1&step=skills and we'll be suing
      // that anyways", then "remove languages from account screen?" It is asked and answered in
      // the Skills step of the intro, which is the one place it belongs (row 186, her own
      // "languages move to skills" on 2026-09-15). NOTHING IS LOST: Info.languages is still read
      // when this page loads and still sent on every save, so a save from here carries whatever
      // the intro stored rather than blanking it. The picker itself is kept below, unreferenced,
      // so putting it back is one line.
      +saveRow();
    var up=document.getElementById('photo-upload');
    if(up) up.onclick=choosePhoto;
    renderLoc();

  }

  // Location reuses the picker people already meet on the events page: region, then country, then
  // state once the country is the United States. It is held as one plain string ("Washington,
  // United States") so anything showing a profile can print it without knowing the three levels.
  // Same starting point as events.html: North America / United States, so picking a US state is
  // one tap. A part-made choice still stores nothing, so nobody is recorded as being in the
  // United States until they pick a state.
  var REGIONS=['North America','South America','Europe','Asia','Africa','Oceania','Antarctica'];
  var NA_COUNTRIES=['United States','Canada','Mexico'];
  var US_STATES=["Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming","Washington D.C."];
  var _loc={region:'',country:'',state:''};
  // COUNTY AND CITY, row 206, 2026-09-15. The same lists the intro offers, from the same read
  // (getPlaces, held six hours at the edge), keyed by the state's two letters. Asked for only once
  // a US state is chosen, because that is as far as the list goes.
  var US_ABBR={"Alabama":"AL","Alaska":"AK","Arizona":"AZ","Arkansas":"AR","California":"CA","Colorado":"CO","Connecticut":"CT","Delaware":"DE","District of Columbia":"DC","Florida":"FL","Georgia":"GA","Hawaii":"HI","Idaho":"ID","Illinois":"IL","Indiana":"IN","Iowa":"IA","Kansas":"KS","Kentucky":"KY","Louisiana":"LA","Maine":"ME","Maryland":"MD","Massachusetts":"MA","Michigan":"MI","Minnesota":"MN","Mississippi":"MS","Missouri":"MO","Montana":"MT","Nebraska":"NE","Nevada":"NV","New Hampshire":"NH","New Jersey":"NJ","New Mexico":"NM","New York":"NY","North Carolina":"NC","North Dakota":"ND","Ohio":"OH","Oklahoma":"OK","Oregon":"OR","Pennsylvania":"PA","Rhode Island":"RI","South Carolina":"SC","South Dakota":"SD","Tennessee":"TN","Texas":"TX","Utah":"UT","Vermont":"VT","Virginia":"VA","Washington":"WA","West Virginia":"WV","Wisconsin":"WI","Wyoming":"WY"};
  var _places=null,_placesP=null;
  function placesOnce(){
    if(!_placesP) _placesP=fetch(GS_URL+'?action=getPlaces').then(function(r){ return r.json(); })
      .then(function(d){ if(d&&d.counties){ _places=d; renderLoc(); } else { _placesP=null; } })
      .catch(function(){ _placesP=null; });
    return _placesP;
  }

  // Read a stored string back into the three levels so the picker opens where the person left it.
  function parseLoc(v){
    var t=String(v||'').trim();
    if(!t) return {region:'',country:'',state:''};
    var bits=t.split(',').map(function(x){ return x.trim(); });
    if(bits.length>1 && bits[1]==='United States' && US_STATES.indexOf(bits[0])>-1){
      return {region:'North America',country:'United States',state:bits[0]};
    }
    if(NA_COUNTRIES.indexOf(t)>-1) return {region:'North America',country:t,state:''};
    if(REGIONS.indexOf(t)>-1) return {region:t,country:'',state:''};
    return {region:'',country:'',state:''};
  }
  // A part-made choice stores nothing. "North America" on its own says less than the blank does.
  function locString(l){
    if(l.state) return l.state+', United States';
    if(l.country && l.country!=='United States') return l.country;
    if(l.region && l.region!=='North America') return l.region;
    return '';
  }
  function renderLoc(){
    var box=document.getElementById('loc-box'); if(!box) return;
    var l=_loc;
    function sel(id,list,val,ph){
      var h='<select id="'+id+'"><option value="">'+esc(ph)+'</option>';
      list.forEach(function(x){ h+='<option'+(x===val?' selected':'')+'>'+esc(x)+'</option>'; });
      return h+'</select>';
    }
    var h='<div class="locrow">'+sel('loc-region',REGIONS,l.region,'Select region…');
    if(l.region==='North America') h+=sel('loc-country',NA_COUNTRIES,l.country,'Select country…');
    if(l.region==='North America' && l.country==='United States') h+=sel('loc-state',US_STATES,l.state,'Select state…');
    var ab=l.state?US_ABBR[l.state]:'';
    if(ab){
      if(_places){
        var cs=(_places.counties[ab]||[]).slice().sort();
        var ci=(_places.cities[ab]||[]).slice().filter(function(x,i,a){ return a.indexOf(x)===i; }).sort();
        if(D.county && cs.indexOf(D.county)<0) cs.push(D.county);
        if(cs.length) h+=sel('loc-county',cs,D.county,'County (optional)');
        // A CITY NAME IS SHORT, SO THE BOX IS. Jessie, 2026-09-19: "emdonds is still a very long
        // field. make it a short field." flex:0 1 means it may shrink on a narrow screen and will
        // never grow to fill a line it happens to be alone on, which is what stretched it.
        h+='<input id="loc-city" list="loc-cities" placeholder="City (optional)" value="'+esc(D.city||'')+'" style="flex:0 1 220px;min-width:150px;">'
          +'<datalist id="loc-cities">'+ci.map(function(c){ return '<option value="'+esc(c)+'">'; }).join('')+'</datalist>';
      } else { placesOnce(); }
    }
    // POSTAL CODE SITS BESIDE THE CITY. Jessie, 2026-09-19: "city shouldn't be this long of a field
    // and zip code should go t the right of city". It was over in the name grid, so City was the
    // only thing on its own line and flex-grow stretched it the whole width of the panel.
    // It is ALWAYS drawn, whether or not a state has been chosen, because somebody outside the
    // United States still has a postal code and losing the field would lose the way to edit it.
    // It keeps data-acct="postal", which is how every field on this page is collected on save, so
    // moving it changes where it sits and nothing about what it writes.
    // THE SAME ROW AS THE INTRO. Jessie, 2026-09-19, of the welcome step: "make look slike this".
    // There: region, country, state, county and city run across one line and the postal code sits
    // on its own beneath. So postal is forced onto its own line rather than tucked beside the city,
    // which is where it went an hour ago when city was the only thing on the second line.
    h+='<div style="flex-basis:100%;height:0;"></div>'
      +'<input data-acct="postal" id="loc-postal" type="text" placeholder="Postal code"'
      +' value="'+esc(D.postal||'')+'" style="flex:0 1 150px;">';
    box.innerHTML=h+'</div>';
    // renderLoc redraws this whole row whenever the region, country or state changes, which takes
    // the page-level input listener with it, so postal marks the page dirty from here instead.
    var pc=box.querySelector('#loc-postal');
    if(pc) pc.addEventListener('input',function(){ D.postal=String(pc.value||'').trim(); markDirty(); });
    var cy=box.querySelector('#loc-county');
    if(cy) cy.onchange=function(){ D.county=cy.value; markDirty(); };
    var cit=box.querySelector('#loc-city');
    if(cit) cit.onchange=function(){ D.city=String(cit.value||'').trim(); markDirty(); };

    var rg=box.querySelector('#loc-region');
    if(rg) rg.onchange=function(){
      _loc={region:rg.value,country:'',state:''};
      // Only North America opens a country, matching the events page. Anywhere else is the answer.
      if(rg.value==='North America') _loc.country='United States';
      D.county=''; D.city='';
      D.location=locString(_loc); markDirty(); renderLoc();
    };
    var ct=box.querySelector('#loc-country');
    if(ct) ct.onchange=function(){
      _loc.country=ct.value; _loc.state=''; D.county=''; D.city='';
      D.location=locString(_loc); markDirty(); renderLoc();
    };
    var st=box.querySelector('#loc-state');
    if(st) st.onchange=function(){
      _loc.state=st.value; D.county=''; D.city='';
      D.location=locString(_loc); markDirty(); renderLoc();
    };
  }

  // Languages pick the same way they do on the profile: click to add or remove, filter to find.
  var LANGS=[], _langFilter='';
  function renderLangs(){
    var box=document.getElementById('lang-box'); if(!box) return;
    var chosen=String(D.languages||'').split('|').map(function(x){return x.trim();}).filter(Boolean);
    var chips=chosen.length
      ? chosen.map(function(l){
          return '<span class="lang-chip">'+esc(l)+'<button type="button" data-drop="'+esc(l)+'" aria-label="Remove '+esc(l)+'">&times;</button></span>';
        }).join('')
      : '<span style="font-size:13.5px;color:var(--muted);">None chosen yet.</span>';
    var pool=LANGS.filter(function(l){
      if(chosen.indexOf(l)>-1) return false;
      return !_langFilter || l.toLowerCase().indexOf(_langFilter.toLowerCase())>-1;
    }).slice(0,14);
    box.innerHTML='<div class="lang-chips">'+chips+'</div>'
      +'<input type="text" id="lang-filter" placeholder="Search languages" value="'+esc(_langFilter)+'" style="margin-top:10px;">'
      +'<div class="lang-pool">'+(pool.length
          ? pool.map(function(l){ return '<button type="button" class="lang-opt" data-add="'+esc(l)+'">'+esc(l)+'</button>'; }).join('')
          : '<span style="font-size:13px;color:var(--muted);">No match.</span>')+'</div>';
    box.querySelectorAll('[data-add]').forEach(function(b){
      b.onclick=function(){
        var cur=String(D.languages||'').split('|').map(function(x){return x.trim();}).filter(Boolean);
        cur.push(b.getAttribute('data-add')); D.languages=cur.join('|'); _langFilter=''; markDirty(); renderLangs();
      };
    });
    box.querySelectorAll('[data-drop]').forEach(function(b){
      b.onclick=function(){
        var gone=b.getAttribute('data-drop');
        D.languages=String(D.languages||'').split('|').map(function(x){return x.trim();})
          .filter(function(x){ return x && x!==gone; }).join('|');
        markDirty(); renderLangs();
      };
    });
    var f=box.querySelector('#lang-filter');
    if(f) f.addEventListener('input', function(){ _langFilter=f.value; renderLangs(); var g=document.getElementById('lang-filter'); if(g){ g.focus(); g.setSelectionRange(g.value.length,g.value.length); } });
  }
  // The language list is reference data, so it is read from the same place the profile reads it.
  fetch(GS_URL+'?action=getReferenceData').then(function(r){return r.json();}).then(function(rd){
    var raw=(rd&&(rd.Languages||rd.languages))||[];
    LANGS=(Array.isArray(raw)?raw:String(raw).split('|')).map(function(x){return String(x).trim();}).filter(Boolean);
    renderLangs();
  }).catch(function(){});

  function buildTabs(active){
    var t=document.getElementById('tabs'); t.innerHTML='';
    TABS.forEach(function(s){
      var b=document.createElement('button'); b.className='tab'+(s.key===active?' on':''); b.type='button'; b.textContent=s.label;
      b.onclick=function(){
        // The same sign-out the top bar's More menu used to offer, which went with the menus on
        // 2026-09-08. It forgets the device first, then goes to the front door.
        if(s.out){
          try{ if(window.CW && window.CW.forget){ window.CW.forget(); } }catch(e){}
          window.location.href='https://2gather.network/signin/?out=1';
          return;
        }
        if(s.nav){ go(s.nav()); return; }
        t.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
        b.classList.add('on'); renderPanel(s.key);
      };
      t.appendChild(b);
    });
  }

  var nameKey='cw-name-'+meId;
  function paintIdentity(){
    var nm=String(D.name||'').trim();
    if(!nm) return;
    document.getElementById('hello-title').textContent=nm+' 🌱';
    try{ localStorage.setItem(nameKey,nm); }catch(e){}
  }
  // Show the last name seen straight away; the fetch below only refreshes it.
  (function(){ try{ var c=localStorage.getItem(nameKey); if(c) document.getElementById('hello-title').textContent=c+' 🌱'; }catch(e){} })();

  // 'account' is the key; 'data' still works so older links keep landing in the right place.
  var _t=P('tab'); if(_t==='data') _t='account';
  var startTab=(['permissions','account'].indexOf(_t)>-1)?_t:'account';
  buildTabs(startTab);

  if(!meId){
    document.getElementById('panel').innerHTML='<div class="status err">This device does not know who you are yet. <a href="https://2gather.network/signin/?next=%2Faccount%2F" style="color:#1F699E;font-weight:700;">Sign in</a> and you will land back here.</div>';
    return;
  }
  // Two reads in parallel (one round-trip of wall-clock): lookupProfile carries the name, photo,
  // and the stored Appear page link; getProfile carries the contact fields.
  var pLookup=fetch(GS_URL+'?action=lookupProfile&appearId='+encodeURIComponent(meId)).then(function(r){return r.json();}).catch(function(){return null;});
  var pProfile=fetch(GS_URL+'?action=getProfile&appearId='+encodeURIComponent(meId)+'&meToken='+encodeURIComponent((function(){try{return localStorage.getItem('cw-token')||'';}catch(e){return '';}})())).then(function(r){return r.json();}).catch(function(){return null;});
  Promise.all([pLookup,pProfile]).then(function(res){
    var lu=res[0]||{}, pr=res[1]||{};
    if(lu.found){ D.name=lu.name||''; D.photo=lu.photo||''; D.pageLink=lu.pageLink||''; }
    if(D.name && !D.firstName && !D.lastName){
      var _bits=String(D.name).trim().split(/\s+/);
      D.lastName=_bits.length>1?_bits.pop():'';
      D.firstName=_bits.join(' ');
    }
    if(pr.found){
      if(!D.name) D.name=pr.name||'';
      if(!D.photo) D.photo=pr.photo||'';
      var d=pr.data||{};
      D.postal=d.postal||''; D.languages=d.languages||''; D.phone=d.phone||'';
      D.location=d.location||''; _loc=parseLoc(D.location);
      D.county=d.county||''; D.city=d.city||'';
      if(!_loc.region) _loc={region:'North America',country:'United States',state:''};
      // The permission columns may not exist on the sheet yet. A missing one stays blank,
      // and a blank falls back to what the site does today rather than inventing a choice.
      ['visPublic','showPhoto','onMap','findable','ackTerms','dateAckTerms'].forEach(function(k){
        D[k]=(d[k]==null?'':String(d[k]));
      });
    }
    // THE PAGE MUST NOT DRAW A PLACE IT WAS REFUSED. Jessie, 2026-09-19: "city is gone from this
    // again htough" and "and county", with Location showing Select state where it had shown
    // Washington an hour before. Her record was never touched - n161 read all four cells back:
    // Washington, United States / Snohomish County / Edmonds / 98026.
    //
    // WHAT ACTUALLY HAPPENED, and I shipped it this afternoon: getProfile now REFUSES without a
    // proved session, which is the security fix, and it answers { found:false, code:'signin' }.
    // This page reads every place field out of pr.data and simply never got one - so it drew an
    // empty picker rather than saying it could not read. Because lookupProfile still answered, the
    // "could not load" line below never fired either.
    //
    // A page asserting something before it knows, for the fifth time this month. It says so now,
    // and Save changes sends a fresh code so the way back is on the screen rather than a reload.
    // AND IT IS ANY REFUSED READ, not only the one that names itself. Jessie, 2026-09-19: "no",
    // with Location still empty on V1.24. My first guard looked for status 'error' and code
    // 'signin' exactly, and whatever came back did not carry both - so the page went on drawing an
    // empty picker. The honest test is simpler and it is the one below: if getProfile did not
    // FIND her, this page has no place, no postal code and no permissions, and it must not draw
    // them as though they were blank answers. _placeUnread says so in the Location section itself,
    // which keeps the rest of the page usable rather than blocking it behind one failed read.
    _placeUnread = !(pr && pr.found);
    if(pr && pr.status==='error' && pr.code==='signin'){
      var _ph=document.getElementById('panel');
      if(_ph){ _ph.innerHTML='<div class="status err">This device needs to prove who you are before '
        +'your details can be shown. <a href="https://2gather.network/signin/?next=%2Faccount%2F" '
        +'style="color:#1F699E;font-weight:700;">Sign in again</a> and you will land back here.</div>'; }
      return;
    }
    if(!lu.found && !pr.found){
      document.getElementById('panel').innerHTML='<div class="status err">Could not load your account. Reload the page to try again.</div>';
      return;
    }
    paintIdentity(); renderPanel(startTab);
    loadEmail(startTab);
  });

  // The address lives on the account, not on the profile, and it is deliberately absent from
  // every public read so that holding somebody's link never hands you their email. It arrives
  // only behind the same verified session that saving needs.
  function loadEmail(tab){
    if(!_editToken || !meId) return;
    fetch(GS_URL+'?action=getAccount&appearId='+encodeURIComponent(meId)
      +'&editToken='+encodeURIComponent(_editToken))
      .then(function(r){ return r.json(); })
      .then(function(resp){
        if(!resp || resp.status!=='ok'){
          // A token the server will not accept is not a token. Holding onto it meant the page
          // showed an empty Email box and hid the line explaining why, because it believed it
          // was verified. Jessie's id changed and her old token stopped matching. 2026-09-01.
          _editToken='';
          try{ localStorage.removeItem('cw-edit-'+meId); }catch(e){}
          try{ renderPanel('account'); }catch(e){}
          return;
        }
        if(resp.email) D.email=resp.email;
        // The other verified addresses on this row, primary not among them. 2026-09-19.
        D.alsoEmails=Array.isArray(resp.alsoEmails)?resp.alsoEmails:[];
        // The two name columns come back from the account now. The page used to hold only one
        // joined name and rebuild both boxes by splitting it, calling the last word the surname,
        // so a two-word surname could never survive a reload. Anything typed since the page
        // opened wins, so a slow answer cannot wipe an edit in progress.
        if(!_dirty && (resp.firstName || resp.lastName)){
          D.firstName=String(resp.firstName||'');
          D.lastName=String(resp.lastName||'');
        }
        // Only repaint when the person is looking at the panel that shows it.
        var t=document.querySelector('.tab.on');
        if(t && t.textContent==='My account') renderPanel('account');
      }).catch(function(){});
  }
})();
</script>
