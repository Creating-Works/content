<html lang="en">
<head>
<script src="/moved.js?v=2"></script>
<script src="https://2gather.network/nav/identity.js?v=10"></script>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community profile</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#1F699E;--card:#FFFFFF;--text:#1A2E42;--soft:#4A6080;--muted:#6A8FAF;--brand:#1F699E;--border:#DDE4EE;--input-bg:#F7F9FC;--hover:#185885;--ph:#B8CCDE;--sel-bg:#EBF3FA;--sel-border:#1F699E;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;padding:24px 20px 70px;color:var(--text);}
    @keyframes spin{to{transform:rotate(360deg);}}
    .card{background:var(--card);max-width:1040px;margin:0 auto;border-radius:16px;padding:26px 30px;box-shadow:0 24px 64px rgba(0,0,0,0.25),0 4px 16px rgba(0,0,0,0.12);position:relative;}
    @media(max-width:760px){.card{padding:20px 18px;}}
    /* Normal (narrow) page width. Declared here rather than as an inline style attribute on the
       div, because an inline attribute beats any stylesheet rule and would block wide-mode. */
    #page-wrap{max-width:1040px;margin:0 auto;}
    .pl-box{background:var(--input-bg,#F7FBFF);border:1px solid #C9DFF3;border-radius:12px;padding:18px 20px;margin-bottom:14px;}
    .pl-box:last-child{margin-bottom:0;}
    .pl-t{font-size:15.5px;font-weight:800;color:var(--text);margin-bottom:4px;}
    .pl-d{font-size:14px;color:var(--muted);margin-bottom:14px;}
    .pl-row{display:flex;gap:10px;flex-wrap:wrap;}
    .pl-btn{display:inline-block;background:var(--brand,#1F699E);color:#fff;border:0;border-radius:22px;
      padding:9px 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;}
    .pl-btn.ghost{background:#fff;color:var(--brand,#1F699E);border:1.5px solid #C9DFF3;}
    /* Wide mode: one class on <body> turns the narrow single-card layout into a full-width
       hub-style page. Declared here (not mutated inline at render time) so there is one place
       to read and nothing for other screens to undo. Body side padding drops to the hub's 14px
       so the columns run edge-to-edge the way the hub's do. */
    body.wide-mode{padding-left:14px;padding-right:14px;}
    body.wide-mode #page-wrap{max-width:none;}
    body.wide-mode .card{max-width:none;background:transparent;box-shadow:none;padding:0;border:none;}
    body.wide-mode .top-right-area{position:static;justify-content:flex-end;margin:0 0 10px;}
    /* Wide mode sits on the blue page background, so this label needs to be white to read. */
    body.wide-mode .top-right-area span{color:#fff;}
    /* Wide-mode footer nav: one small centred button, no arrow glyphs. */
    body.wide-mode .nav-row{display:flex;justify-content:center;background:none;border:none;padding:0;}
    body.wide-mode .nav-row .btn-back,body.wide-mode .nav-row .btn-next{width:auto;flex:0 0 auto;min-width:0;padding:9px 22px;font-size:14px;border-radius:20px;}
    .bring-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;padding:14px 0;}
    .quadrant{background:#fff;border-radius:14px;border:1px solid #e8eaf0;overflow:hidden;display:flex;flex-direction:column;}
    .q-header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f1f5;background:#fff;}
    .q-title{font-size:15px;font-weight:700;letter-spacing:0.02em;color:#1a1a2e;}
    .q-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px;}
    /* One column on a phone - three of these side by side are unreadable at that width. */
    @media(max-width:720px){
      .bring-grid{grid-template-columns:1fr;}
      .q-body{padding:12px 14px 14px;}
    }
    .q-empty{font-size:12px;color:#c0c4d6;padding:4px 2px;font-style:italic;}
    /* Top right */
    .top-right-area{position:absolute;top:20px;right:20px;display:flex;align-items:center;gap:6px;z-index:10;}
    .ikigai-btn{display:flex;align-items:center;gap:8px;background:var(--sel-bg);border:1.5px solid var(--sel-border);border-radius:24px;padding:6px 14px 6px 6px;font-size:13px;font-weight:600;color:var(--brand);cursor:pointer;font-family:'DM Sans',sans-serif;transition:background 0.15s;}
    .ikigai-btn:hover{background:#d6eaf8;}
    .btn-photo{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--sel-border);background:var(--input-bg);display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden;flex-shrink:0;}
    .btn-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
    .share-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--sel-border);background:var(--sel-bg);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;transition:background 0.15s;}
    .share-btn:hover{background:#d6eaf8;}
    .footer{text-align:center;margin-top:20px;}
    .footer a{color:white;font-size:13px;text-decoration:none;opacity:0.85;font-family:'DM Sans',sans-serif;}
    h2{font-size:20px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:16px;margin-top:20px;}
    hr{border:none;border-top:1px solid var(--border);margin:20px 0;}
    label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px;font-weight:500;}
    input[type="text"]{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text);outline:none;transition:border-color 0.2s;}
    input[type="text"]:focus{border-color:var(--brand);}
    input[type="text"]::placeholder{color:var(--ph);}
    select{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text);outline:none;}
    /* Progress */
    .progress-wrap{margin-bottom:28px;padding-top:8px;}
    .progress-steps{display:flex;gap:6px;margin-bottom:8px;}
    .progress-step{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background 0.3s;}
    .progress-step.done{background:var(--brand);}
    .progress-label{font-size:12px;color:var(--muted);}
    /* Breadcrumb */
    .breadcrumb-nav{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;}
    .breadcrumb-link{color:var(--brand);cursor:pointer;font-weight:500;text-decoration:underline;}
    .breadcrumb-link:hover{text-decoration:underline;}
    /* Category chips grid */
    .cat-chips-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
    .cat-chip{padding:10px 14px;border-radius:20px;border:1.5px solid var(--border);background:white;font-size:13px;color:var(--soft);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;text-align:center;}
    .cat-chip:hover{border-color:var(--brand);color:var(--brand);}
    .cat-chip.selected{background:var(--brand);border-color:var(--brand);color:white;font-weight:600;}
    /* Sub chips */
    .sub-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
    /* sub-chip style defined below */
    .sub-chip:hover{border-color:var(--brand);color:var(--brand);}
    .sub-chip.selected{background:var(--brand);border-color:var(--brand);color:white;font-weight:500;}
    /* Item chips */
    .item-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
    .item-chip{padding:6px 13px;border-radius:18px;border:1.5px solid var(--border);background:white;font-size:12px;color:var(--soft);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
    .item-chip:hover{border-color:var(--brand);color:var(--brand);border-style:solid;background:var(--sel-bg);}
    .item-chip.added{background:var(--brand);border-color:var(--brand);border-style:solid;color:white;font-weight:600;}
    .item-chip.added:hover{background:var(--brand);border-color:var(--brand);color:white;}
    .item-chip.selected{background:var(--brand);border-color:var(--brand);border-style:solid;color:white;font-weight:600;}
    .btn-primary{background:var(--brand);color:white;border:none;border-radius:10px;padding:8px 18px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
    .btn-primary:hover{opacity:0.9;}
    /* Search */
    .search-wrap{position:relative;margin-bottom:14px;}
    .search-wrap input{padding-left:36px;border-radius:8px;}
    .search-wrap input.has-results{border-radius:8px 8px 0 0;border-bottom-color:transparent;}
    .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none;}
    .search-results{background:white;border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;max-height:220px;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,0.08);margin-bottom:14px;}
    .search-result-item{padding:10px 14px;font-size:14px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.1s;}
    .search-result-item:last-child{border-bottom:none;}
    .search-result-item:hover{background:var(--sel-bg);}
    .search-result-breadcrumb{font-size:11px;color:var(--muted);margin-top:2px;}
    .add-custom-row{padding:12px 16px;font-size:14px;color:white;font-weight:600;cursor:pointer;border:none;border-radius:0 0 10px 10px;background:var(--brand);margin-bottom:14px;display:block;text-align:center;transition:background 0.15s;}
    .custom-add-box{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
    .custom-add-box label{margin-bottom:6px;}
    .custom-add-box select{margin-bottom:10px;}
    .custom-add-confirm{background:var(--brand);color:white;border:none;border-radius:8px;padding:10px 20px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
    .custom-add-cancel{background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;margin-left:10px;}
    /* Added items */
    .added-section{margin-top:16px;} .practice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
    .added-label{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
    .practice-item{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:10px;min-width:0;}
    .practice-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
    .practice-item-name{font-size:14px;font-weight:600;color:var(--text);}
    .practice-item-x{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;padding:0;line-height:1;}
    .practice-item-x:hover{color:var(--text);}
    .practice-item-cat{font-size:11px;color:var(--brand);margin-bottom:8px;}
    .practice-required{font-size:12px;color:var(--brand);font-weight:400;margin-bottom:8px;}
    .practice-options{display:flex;flex-wrap:wrap;gap:8px;}
    .practice-btn{padding:6px 14px;border-radius:16px;border:1.5px solid var(--border);background:white;font-size:12px;color:var(--soft);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
    .practice-btn:hover{border-color:var(--brand);color:var(--brand);}
    .practice-btn.selected{background:var(--brand);border-color:var(--brand);color:white;font-weight:500;}
    /* Needs two-section */
    /* Need items */
    .need-item{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
    .need-item-left{flex:1;}
    .need-item-name{font-size:14px;font-weight:600;color:var(--text);}
    .need-item-cat{font-size:11px;color:var(--muted);margin-top:2px;}
    .need-item-right{display:flex;align-items:center;gap:10px;}
    .local-toggle{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--soft);cursor:pointer;}
    .local-toggle input{width:14px;height:14px;accent-color:var(--brand);cursor:pointer;}
    .local-toggle.active{color:var(--brand);font-weight:600;}
    /* Warning */
    .warning-msg{background:#FFF8E1;border:1px solid #FFD54F;border-radius:8px;padding:10px 14px;font-size:13px;color:#7A5F00;margin-bottom:12px;}
    .reminder-msg{font-size:12px;color:var(--brand);display:inline-block;padding:0;}
    /* Nav */
    .nav-row{display:flex;gap:12px;margin-top:28px;}
    .btn-back{flex:1;padding:14px;border-radius:10px;border:1.5px solid var(--border);background:white;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;color:var(--soft);cursor:pointer;transition:all 0.15s;}
    .btn-back:hover{border-color:var(--brand);color:var(--brand);}
    .btn-next{flex:2;padding:14px;border-radius:10px;border:none;background:var(--brand);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;color:white;cursor:pointer;transition:background 0.15s;}
    .btn-next:hover{background:var(--hover);}
    .btn-outlined{flex:2;padding:14px;border-radius:10px;border:2px solid var(--brand);background:white;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;color:var(--brand);cursor:pointer;transition:all 0.15s;}
    .btn-outlined:hover{background:var(--brand);color:white;}
    /* Profile */
    .profile-section{margin-bottom:0;padding-bottom:20px;border-bottom:1px solid var(--border);margin-top:20px;}
    .profile-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .profile-section-label{font-size:16px;font-weight:700;color:var(--text);letter-spacing:0;text-transform:none;}
    .profile-section-actions{display:flex;align-items:center;gap:8px;}
    .edit-btn{font-size:12px;font-weight:600;color:white;background:var(--brand);border:none;border-radius:16px;cursor:pointer;font-family:'DM Sans',sans-serif;padding:5px 12px;}
    .profile-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;}
    /* All profile pills share the lighter background/border of the method pills (Making and designing etc.). */
    .profile-tag{padding:6px 12px;border-radius:20px;background:var(--input-bg);border:1.5px solid var(--border);font-size:13px;color:var(--brand);font-weight:500;}
    .tag-level{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px;}
    .seek-info{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border:1px solid currentColor;border-radius:50%;font-size:9px;font-weight:700;margin-left:5px;vertical-align:middle;}
    .seek-detail-pop{position:absolute;top:100%;left:0;margin-top:6px;z-index:50;background:#fff;border:1.5px solid var(--brand);border-radius:10px;padding:8px 26px 8px 12px;font-size:13px;color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.12);min-width:170px;max-width:260px;white-space:normal;text-align:left;line-height:1.4;}
    .seek-pop-close{position:absolute;top:2px;right:5px;background:none;border:none;font-size:17px;line-height:1;color:var(--soft);cursor:pointer;padding:2px 4px;font-family:inherit;}
    .profile-empty{font-size:13px;color:var(--muted);font-style:italic;}
    .profile-lang-row{margin-top:4px;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
    .profile-lang-text{font-size:13px;color:var(--soft);}
    /* Lang modal */
    .lang-dropdown-wrap{position:relative;margin-bottom:12px;}
    .lang-search-input{padding-left:36px !important;border-radius:8px 8px 0 0 !important;border-bottom:none !important;}
    .lang-search-icon{position:absolute;left:12px;top:13px;font-size:15px;pointer-events:none;}
    .lang-list{background:white;border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;max-height:200px;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,0.08);}
    .lang-list-item{padding:10px 14px;font-size:14px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;transition:background 0.1s;}
    .lang-list-item:last-child{border-bottom:none;}
    .lang-list-item:hover{background:var(--sel-bg);}
    .lang-list-item.selected{background:var(--sel-bg);color:var(--brand);font-weight:500;}
    .lang-check{color:var(--brand);font-size:14px;min-width:16px;}
    .lang-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
    .lang-tag{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;background:var(--sel-bg);border:1.5px solid var(--sel-border);font-size:13px;color:var(--brand);font-weight:500;}
    .lang-tag-remove{cursor:pointer;color:var(--muted);font-size:15px;}
    /* Modals */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:flex-start;justify-content:center;padding:12px 0 0;}
    .modal-overlay.open{display:flex;}
    .modal{background:#fff;border-radius:16px;padding:32px;max-width:480px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
    .modal-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:16px;}
    .modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
    /* Share modal */
    .share-actions{display:flex;gap:10px;margin-bottom:20px;}
    .share-copy-btn{flex:1;padding:12px;border-radius:10px;border:none;background:var(--brand);color:white;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
    .share-native-btn{flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:white;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
    .qr-wrap{background:white;border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;}
    .qr-wrap img{max-width:200px;width:100%;border-radius:8px;}
    .copy-confirm{font-size:12px;color:var(--brand);margin-top:6px;display:none;}
    .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:white;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:500;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
    .toast.show{opacity:1;}
    .empty{font-size:13px;color:var(--muted);font-style:italic;margin-top:8px;}
    .added-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .level-help-btn{background:none;border:1.5px solid var(--border);border-radius:50%;width:20px;height:20px;font-size:11px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;display:inline-flex;align-items:center;justify-content:center;padding:0;}
    .level-help-btn:hover{border-color:var(--brand);color:var(--brand);}
    .ideas-prompt{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:10px;}
    /* needs-top-chips moved below */
    .needs-top-chip{padding:10px 18px;border-radius:20px;border:1.5px solid var(--border);background:white;font-size:14px;color:var(--soft);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:all 0.15s;}
    .needs-top-chip:hover{border-color:var(--brand);color:var(--brand);}
    .needs-top-chips{display:flex;gap:10px;margin-bottom:0;flex-wrap:wrap;padding-bottom:14px;}
    .cat-picker-inline{background:white;border:1.5px solid var(--brand);border-radius:10px;padding:10px 12px;display:none;flex-wrap:wrap;gap:6px;position:absolute;left:0;top:100%;z-index:200;min-width:220px;box-shadow:0 4px 16px rgba(0,0,0,0.12);}
    .cat-picker-inline.open{display:flex;}
    .cat-pick-btn{padding:5px 12px;border-radius:18px;border:1.5px solid var(--border);background:white;font-size:12px;color:var(--soft);cursor:pointer;font-family:'DM Sans',sans-serif;}
    .cat-pick-btn:hover{border-color:var(--brand);color:var(--brand);}
    .needs-summary{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:14px;}
    .needs-summary-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:14px;font-weight:600;color:var(--text);}
    .needs-summary-body{margin-top:10px;display:flex;flex-wrap:wrap;gap:7px;}
    .needs-summary-tag{background:white;border:1.5px solid var(--border);border-radius:18px;padding:5px 12px;font-size:13px;color:var(--text);}
    .needs-top-chip.selected{background:var(--brand);border-color:var(--brand);color:white;font-weight:600;}
    .needs-detail-box{background:var(--input-bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
    .sub-chip{padding:8px 14px;border-radius:18px;border:1.5px solid var(--border);background:white;font-size:13px;color:var(--soft);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:all 0.15s;display:inline-flex;align-items:center;gap:5px;}
    .sub-chip:hover{border-color:var(--brand);color:var(--brand);}
    .sub-chip.selected{background:var(--brand);border-color:var(--brand);color:white;font-weight:600;}
    .sub-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);}
    .level-popup{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;background:white;border:1px solid var(--border);border-radius:14px;padding:18px 20px;font-size:13px;color:var(--soft);line-height:1.7;box-shadow:0 8px 30px rgba(0,0,0,0.18);max-width:320px;width:90%;}
    .level-popup.open{display:block;}
    .level-popup-close{display:block;margin-top:14px;text-align:center;font-weight:600;color:var(--brand);cursor:pointer;font-size:14px;}
    .methods-list{margin:12px 0 20px;}
    .method-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;transition:background 0.1s;border:1.5px solid transparent;margin-bottom:4px;}
    .method-item:hover{background:var(--sel-bg);}
    .method-item.selected{background:var(--sel-bg);border-color:var(--brand);}
    .method-check{width:22px;height:22px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all 0.15s;}
    .method-check.checked{background:var(--brand);border-color:var(--brand);color:white;font-size:13px;}
    .method-text{font-size:14px;color:var(--text);line-height:1.4;}
    .methods-selected-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;}
    .methods-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:9000;align-items:flex-start;padding-top:4vh;}
    .methods-modal-overlay.open{display:flex;}
    .methods-modal{background:white;border-radius:16px;padding:18px 16px;width:88%;max-width:400px;margin:0 auto;max-height:82vh;overflow-y:auto;box-sizing:border-box;}
    .values-tabs{display:flex;flex-direction:row;gap:8px;margin-bottom:14px;}
    .values-tab{flex:1;text-align:center;padding:10px 8px;border-radius:10px;border:1.5px solid var(--border);background:white;font-size:14px;color:var(--soft);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;transition:all 0.15s;}
    .values-tab.active{background:var(--brand);border-color:var(--brand);color:white;}
    .values-section-label{font-size:13px;font-weight:700;color:var(--text);margin:16px 0 8px;}
    .btn-link{background:none;border:none;color:var(--brand);font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;padding:0;}
    .inline-edit-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);flex-wrap:wrap;}
    /* Hover-URL leak protection: anchors that navigate to member-scoped URLs render WITHOUT
       an href (so the browser's URL preview stays empty) and the real URL is read from data-nav
       at click time. The visible tooltip on hover comes from the standard title="" attribute
       (matching group.html's photo strip style — small, unobtrusive, browser-native). */
    [data-nav]{cursor:pointer;}
  </style>
</head>

<body>

<script>
// ─── Identity ────────────────────────────────────────────────────────────────
var _appearId   = null;
var _showId     = null;
var _viewerMode = false;
var _introMode  = false;
var _eventId    = '';
var _viewerPhoto = '';
var _viewerName  = '';
var _fullName    = '';
var _directScreen = '';

(function(){
  var params=new URLSearchParams(window.location.search);
  _showId=params.get('show')||null;
  _eventId=params.get('eventId')||'';
  _introMode=(params.get('intro')==='1');
  _directScreen=params.get('screen')||'';
  if(_showId){
    _viewerMode=true;
    // The owner opening their own public URL is still the owner. Give them the same
    // appearId the edit view uses so every save/edit path works without a second branch.
    if(isOwner()) _appearId=_showId;
    return;
  }
  // CWid is the standard "this is me" param across the ecosystem (mygroups.html, the account page
  // hub, Update-my-answers links). Accept it exactly like id/memberCard.
  var urlId=params.get('id')||params.get('memberCard')||params.get('CWid');
  if(urlId){_appearId=urlId;try{localStorage.setItem('appear-id',_appearId);}catch(e){}}
  else{
    // Who is being looked at comes from the identity module, so View as reaches this page as
    // well. Reading the device straight off meant the amber bar named one person while the
    // page underneath drew another, with that other person's Edit buttons on it.
    try{_appearId=(window.CW&&CW.me)?String(CW.me().id||'').trim():'';}catch(e){_appearId='';}
    if(!_appearId){try{_appearId=localStorage.getItem('appear-id');}catch(e){}}
  }
})();

// The name and tabs need nothing from the backend, so they paint immediately and the card
// carries the wait on its own. render() calls this again rather than blanking the header.
function paintShellHeader(extraPills){
  var el=document.getElementById('app-topnav'); if(!el) return;
  var who=(_showId||_appearId||'');
  // `who` is whose profile this is, and it keys the cached name below. The tabs are about the
  // person looking, so they use the viewer's own id and match what render() paints a moment
  // later. Using `who` here made the row flash one set of links and settle on another.
  var meTab=String(_appearId||who||'').trim();
  var q=meTab?('?CWid='+encodeURIComponent(meTab)):'';
  var base='text-decoration:none;font-size:14px;font-weight:700;padding:9px 16px;border-radius:22px;white-space:nowrap;display:inline-block;';
  var on=base+'background:#fff;color:#1F699E;';
  var off=base+'background:rgba(255,255,255,.16);color:#fff;cursor:pointer;';
  function tab(label,url){
    return url
      ? '<a role="link" tabindex="0" data-nav="'+url+'" onclick="return _safeNavGo(this)" style="'+off+'">'+label+'</a>'
      : '<span style="'+on+'">'+label+'</span>';
  }
  var acct='https://creating.works/account'+q;
  el.innerHTML='<h1 id="pv-name-text" style="font-size:28px;font-weight:400;color:#fff;margin:0 0 16px;letter-spacing:-.01em;min-height:42px;"></h1>'
    +'<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 2px;margin:0 0 14px;">'
    +tab('My profile','')
    +' '+tab('My groups','https://2gather.network/mygroups'+q+(q?'&':'?')+'ref=profile')
    +' '+tab('My events','https://2gather.network/myevents'+(meTab?('?id='+encodeURIComponent(meTab)):''))
    +' '+tab('My account',acct+(q?'&':'?')+'tab=account')
    +(extraPills||'')
    +'</div>';
  var slot0=document.getElementById('pv-name-text');
  if(slot0 && window._shellName) slot0.textContent=window._shellName+' 🌱';
  // A name rarely changes, so the last one seen is shown at once and only refreshed behind the
  // scenes. That keeps the heading steady on every later visit instead of blank then filled.
  var nameKey='cw-name-'+who;
  function paintName(n){
    if(!n) return;
    _fullName=n; window._shellName=n;
    var slot=document.getElementById('pv-name-text');
    if(slot) slot.textContent=n+' 🌱';
  }
  if(who){
    try{ paintName(localStorage.getItem(nameKey)||''); }catch(e){}
    // render() repaints this header, so the read is fired once and never again.
    if(window._shellLookupDone) return;
    window._shellLookupDone = true;
    afterPaint(function(){
    fetch('https://cw-api-gate.jessieupp.workers.dev?action=lookupProfile&appearId='+encodeURIComponent(who))
      .then(function(r){return r.json();})
      .then(function(lu){
        if(!lu) return;
        if(lu.pageLink){ window._pageLink=String(lu.pageLink); }
        if(!lu.name) return;
        var n=String(lu.name).trim();
        paintName(n);
        try{ localStorage.setItem(nameKey,n); }catch(e){}
      }).catch(function(){});
    });
  }
}
paintShellHeader();

// ─── One privilege check for the whole profile ────────────────────────────────
// There is a single profile renderer; what differs is what the viewer is allowed to do.
// "?id=" carries the capability, so that is always the owner. On the public "?show=" URL
// the owner is recognised by "&me=" or by the appear-id this device already stores - the
// same test the nav pills have always used, now applied to the pencils and saves too.
function isOwner(){
  // Looking as somebody else never writes, on any page. The bar says so and this is what
  // makes it true, so every Edit disappears for as long as View as is on.
  try{ if(window.CW&&CW.me&&CW.me().viewing) return false; }catch(e){}
  if(!_viewerMode) return !!_appearId;
  var target=String(_showId||'').replace(/\./g,'').toLowerCase();
  if(!target) return false;
  var viaParam='',viaDevice='',viaSignIn='';
  try{ viaParam=String(new URLSearchParams(window.location.search).get('me')||'').replace(/\./g,'').toLowerCase(); }catch(e){}
  try{ viaDevice=String(localStorage.getItem('appear-id')||'').replace(/\./g,'').toLowerCase(); }catch(e){}
  // Signing in is how somebody says who they are now, and this never asked. Anybody who arrived
  // on a link without `me` on it could edit the whole page while every save quietly did nothing,
  // because autoSave stops here first. That is worse than refusing to edit.
  try{ viaSignIn=(window.CW&&CW.me)?String(CW.me().id||'').replace(/\./g,'').toLowerCase():''; }catch(e){}
  return !!((viaParam&&viaParam===target)||(viaDevice&&viaDevice===target)||(viaSignIn&&viaSignIn===target));
}

var GS_URL='https://cw-api-gate.jessieupp.workers.dev';

// The cache is trusted now, and nothing here skips it.
//
// History, because this line has moved twice in three days. On 2026-08-30 the page began adding
// nocache=1 to every read about you, since a save cleared nothing at the gate and a profile could
// show pre-save answers for six hours. That cost the whole wait on every visit. On 2026-09-01 the
// gate learned to clear a person's cached reads the moment they write, so the bypass was cut down
// to twenty seconds after a save.
//
// Twenty seconds was still wrong, and Jessie found it within minutes: the editor autosaves, so
// every save restamped the clock and kept her in the slow path the entire time she was editing,
// and for twenty seconds after every keystroke that triggered a save. She saved, moved pages, came
// back, and everything took five seconds again.
//
// It is gone. Every read this page makes carries appearId and nothing else, which is exactly the
// key the gate's purge rebuilds, so a save clears them all and the next read is fresh. The thirty
// second life on those entries is the backstop if a purge ever misses.


// Read once, then out of the address bar. Nobody needs to see somebody's id to read their page,
// and a link copied out of the bar should not carry one. It waits for load so every part of the
// page has already taken what it needs from the address; _showId is captured once at start.
window.addEventListener('load', function(){
  try{
    var u=new URL(window.location.href);
    if(!u.searchParams.has('show')) return;
    if(!window.history||!window.history.replaceState) return;
    u.searchParams.delete('show'); u.searchParams.delete('me');
    var q=u.searchParams.toString();
    window.history.replaceState({}, '', u.pathname+(q?'?'+q:'')+u.hash);
  }catch(e){}
});

// PARENT_CATS loads from reference-data sheet via getCategories; this is the fallback if that load fails
var PARENT_CATS=[
  'Arts & Culture','Food & Drink','Physical Wellbeing','Mental Wellbeing',
  'Family Wellbeing','Self-Expression & Beauty','Home & Construction','Transportation',
  'Mechanical & Manufacturing','Business & Finance','Community & Civic','Recreation & Hobbies',
  'Technology & Communications','Nature & Outdoors','Social Events & Gatherings','Pets & Animal Care'
];
var FLAGGED_WORDS=['expert','leader','director','senior','advanced','junior'];
var REC_TYPES=['Movement & Performance','Sports','Outdoor & Nature','Games & Strategy','Making & Collecting'];

// ─── State ───────────────────────────────────────────────────────────────────
var _screen      = 1;
var _editMode    = false;   // true when editing from profile summary
var _completed   = false;   // true after all 4 screens visited on first pass
var _hasProfile  = false;   // true when ikigai data exists in sheet
var _isPrefillFromMain = false;   // true when fields were pre-filled from Main because ikigai was empty
var _refData     = null;
var _photo       = '';
var _name        = '';
var _languages   = [];
var _primaryLanguage='';
var _choosingPrimaryLang=false;
var _langFilter  = '';
var _postal      = '';

var _interests   = [];
var _skills      = [];
var _values      = [];
var _domains     = [];
var _needsSkill  = [];
var _needsRes    = [];
var _methods     = [];
var _bringType   = [];
// Free text the person types under each checked bring-type on the first fast screen.
// Saved inside bringType as key~<encoded text>, the same "~" convention needs already uses,
// so no GAS change is needed and old records (no "~") still parse.
var _bringText   = {skill:'',experience:'',thing:''};
var _fastPath    = false;  // true once this visit came through the two fast screens, so Back returns there
var _wantsSignupList = false;
var _expression  = '';
var _screen2step = 'lang';
var _customCareParent = '';

// Drill state — all keys are strings
var _drill = {
  '1':  {parentCat:'',subCat:'',itemCat:''},
  '2':  {parentCat:'',subCat:'',itemCat:''},
  '3':  {parentCat:'',subCat:'',itemCat:''},
  '4s': {parentCat:'',subCat:'',itemCat:''},
  '4r': {parentCat:'',subCat:'',itemCat:''},
  'pl': {parentCat:'',subCat:'',itemCat:''}
};
function getDrill(s){return _drill[String(s)]||{};}
function resetDrillTo(s,level){
  var d=_drill[String(s)]; if(!d) return;
  if(level<=0){d.parentCat='';d.subCat='';d.itemCat='';}
  else if(level===1){d.subCat='';d.itemCat='';}
  else{d.itemCat='';}
}

var _searchQ={};
var _customItem='';
var _customScreen='';
var _customIsDomain=false;
// The ikigai "retired" cell is a passthrough string, so it carries both work-status flags
// as a short list ("true", "openToWork", or both). No new column and no GAS change.
var _retired=false;
var _openToWork=false;
var _otwKinds=[];   // Full-time / Part-time / Projects - multi-select
var _otwPay=[];     // Paid / Not paid - multi-select
// Hardcoded for now; these belong in the reference-data sheet later, alongside the
// contribution formats, so they can be edited without a deploy.
var OTW_KINDS=['Full-time','Part-time','Projects'];
var OTW_PAY=['Paid','Not paid','Both'];
function parseRetiredStr(str){
  var parts=String(str||'').split('|').map(function(p){return p.trim();}).filter(Boolean);
  var low=parts.map(function(p){return p.toLowerCase();});
  _retired=low.indexOf('true')>-1;
  _openToWork=low.indexOf('opentowork')>-1;
  _otwKinds=parts.filter(function(p){return p.indexOf('kind:')===0;}).map(function(p){return p.slice(5);});
  _otwPay  =parts.filter(function(p){return p.indexOf('pay:')===0;}).map(function(p){return p.slice(4);});
}
function buildRetiredStr(){
  var out=[];
  if(_retired) out.push('true');
  if(_openToWork){
    out.push('openToWork');
    _otwKinds.forEach(function(k){ out.push('kind:'+k); });
    _otwPay.forEach(function(p){ out.push('pay:'+p); });
  }
  return out.join('|');
}
var _personSubType='';

// ─── Helpers ─────────────────────────────────────────────────────────────────
// Levels are stored comma-joined with no space ("Participant,Fan"). Space them for display
// only - the stored string is parsed elsewhere and must not change.
function fmtLevels(v){ return String(v||'').split(',').map(function(x){return x.trim();}).filter(Boolean).join(', '); }
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// Hover-URL leak protection: anchors that would carry memberCard / me / show / id in a static
// href are rendered as href="#" with data-nav="<real URL>". The browser's hover URL preview
// shows "#" instead of the bearer token, and this handler picks up the real URL at click time.
window._safeNavGo=function(el){try{var u=el&&el.getAttribute&&el.getAttribute('data-nav');if(u){window.location.href=u;}}catch(e){}return false;};
// Enter/Space triggers _safeNavGo on hrefless <a> that carry data-nav, so keyboard nav still works.
document.addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var t=e.target;if(t&&t.tagName==='A'&&!t.hasAttribute('href')&&t.hasAttribute('data-nav')){e.preventDefault();_safeNavGo(t);}});
function rawVal(s){return String(s||'').replace(/'/g,"\\'");}
function toast(msg){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}return a;}
function sortAlpha(arr){return arr.slice().sort(function(a,b){return a.localeCompare(b);});}

function matchesQuery(r,ql){
  if((r.item||'').toLowerCase().includes(ql)) return true;
  if((r.category||'').toLowerCase().includes(ql)) return true;
  if((r.recType||'').toLowerCase().includes(ql)) return true;
  var assoc=r.associations||'';
  if(!assoc) return false;
  return assoc.toLowerCase().split(/[\s,]+/).some(function(w){return w===ql||w.startsWith(ql);});
}

function checkFlag(q){var ql=q.toLowerCase();for(var i=0;i<FLAGGED_WORDS.length;i++){if(ql.includes(FLAGGED_WORDS[i]))return FLAGGED_WORDS[i];}return '';}

// ─── Pool helpers ─────────────────────────────────────────────────────────────
function getSkillPool(d){
  if(!_refData) return [];
  var base=_refData.skills||[];
  if(d&&d.parentCat) base=base.filter(function(r){return r.category===d.parentCat;});
  return base;
}
function getRecPool(d){
  if(!_refData) return [];
  var base=_refData.recreation||[];
  if(d&&d.itemCat) return base.filter(function(r){return r.category===d.itemCat;});
  if(d&&d.subCat) return base.filter(function(r){return r.category===d.subCat;});
  if(d&&d.parentCat) return base.filter(function(r){return r.recType===d.parentCat;});
  return base;
}
function getValuePool(d){
  if(!_refData) return [];
  var base=(_refData.values||[]).concat(_refData.domains||[]);
  if(d&&d.parentCat) base=base.filter(function(r){return r.category===d.parentCat;});
  return base;
}
function getResPool(d){
  if(!_refData) return [];
  var base=_refData.resources||[];
  if(d&&d.parentCat) base=base.filter(function(r){return r.category===d.parentCat;});
  return base;
}
function getPool(screen){
  var s=String(screen);
  var d=getDrill(s);
  if(s==='1') return getRecPool(d);
  if(s==='2') return getSkillPool(d);
  if(s==='3') return getValuePool(d);
  if(s==='4s') return getSkillPool(d);
  if(s==='4r') return getResPool(d);
  if(s==='pl') return getSkillPool(d);
  return [];
}

function getItemChips(screen){
  var pool=getPool(screen);
  return shuffle(pool.map(function(r){return r.item||r;}).filter(Boolean)).slice(0,30);
}

// Sub cats for skills — returns empty if none (falls to item chips directly)
function getSkillSubCats(parentCat){
  if(!_refData||!_refData.skills) return [];
  var s={};
  (_refData.skills||[]).filter(function(r){return r.category===parentCat;})
    .forEach(function(r){if(r.subCategory) s[r.subCategory]=1;});
  return sortAlpha(Object.keys(s));
}

// ─── Waiting your turn ────────────────────────────────────────────────────────
// Apps Script runs our calls ONE AT A TIME. Measured 2026-09-01: four fired together took 9.9
// seconds, which is the sum of them, not the longest. So a call described as "non-blocking"
// blocks anyway; it just queues at the server instead of in the browser. Jessie's timing panel
// showed getBookmarks finishing 35 seconds after load and getProfile 34, because five other
// calls were in the queue with them.
//
// Anything the first paint does not need waits here until it has happened. Nothing is dropped,
// it just goes second.
// Built on first use rather than on this line. The shell paints the header name before this
// point in the file is ever reached, so afterPaint was being called while `_painted` was still
// undefined, which threw and took the whole script down with it: the page sat on "Loading
// preferences..." for ever. Jessie caught it within minutes. 2026-09-01.
var _paintedGo = null, _painted = null;
function _paintGate() {
  if (!_painted) { _painted = new Promise(function (r) { _paintedGo = r; }); }
  return _painted;
}
function afterPaint(fn) {
  _paintGate().then(function () { try { fn(); } catch (e) {} });
}
window._paintDone = function () { _paintGate(); try { if (_paintedGo) _paintedGo(); } catch (e) {} };

// ─── Data loading ─────────────────────────────────────────────────────────────
async function loadRefData(){
  // Both of these leave at once now. They used to go one after the other, and each costs three
  // seconds, so the page spent six seconds on two things that never needed to wait for each
  // other. Jessie, 2026-09-01: "profile takes 15 seconds of time to load".
  var _refP = fetch(GS_URL+'?action=getReferenceData').then(function(r){return r.json();}).catch(function(){return null;});
  var _catP = fetch(GS_URL+'?action=getCategories').then(function(r){return r.json();}).catch(function(){return null;});
  try{_refData=await _refP;}catch(e){_refData=null;}
  if(!_refData){_refData={languages:[],skills:[],values:[],domains:[],recreation:[],resources:[]};}
  // Ensure personTypes always exists — falls back to sheet Person column values
  if(!_refData.personTypes||!_refData.personTypes.length){
    _refData.personTypes=['Skills/services','Recreation buddy','Accountability buddy'];
  }
  // Ensure potluckTypes always exists — falls back to Skill / Experience / Thing
  if(!_refData.potluckTypes||!_refData.potluckTypes.length){
    _refData.potluckTypes=['Skill','Experience','Thing'];
  }  // Load parent categories from the reference-data sheet so the list never drifts from the sheet
  try{
    var cdata=await _catP;
    if(cdata&&cdata.categories&&cdata.categories.length){
      PARENT_CATS=cdata.categories.map(function(c){return c.label;}).filter(Boolean);
    }
  }catch(e){}
}
// ONE combined call (getProfile) = getIntake + lookupProfile in a single round-trip.

  var _mainP = fetch(GS_URL+'?action=getMainProfile&appearId='+encodeURIComponent(id))
                 .then(function(r){return r.json();}).catch(function(){return null;});

    var resp=await res.json();
    // "first" is a column on the ikigai row, so it arrives inside resp.data - not at the top

    var _first=(resp.data&&resp.data.first)||resp.first||'';
    if(_viewerMode){_viewerPhoto=resp.photo||'';_viewerName=_first||resp.name||'';}
    // lookupProfile is the only action that returns the full name (first + last).

      _postal=d.postal||'';

  }catch(e){}
  // 2026-08-18 Union merge: always fetch Main and combine with ikigai. Everything from both
  // sources surfaces; duplicates prefer ikigai (has sub-levels like level, role, category, detail).
  // Fields with no direct Main equivalent (postal, methods, bringType, expression) stay ikigai-driven.
  try{
    var mresp=await _mainP;
    if(mresp&&mresp.found&&mresp.data){
      var md=mresp.data;
      var mainInterests=md.interests?parseTagStr(md.interests,'level'):[];
      var mainSkills   =md.skills   ?parseTagStr(md.skills,'level')   :[];
      var mainValues   =md.values   ?parseTagStr(md.values,'level')   :[];
      var mainDomains  =md.domains  ?parseTagStr(md.domains,'level').map(function(dm){dm.category='domain';return dm;}):[];
      var mainNeedsRaw =md.needs    ?parseNeedsStr(md.needs)          :[];
      if(!_hasProfile){
        _isPrefillFromMain=true;
        _hasProfile = (mainInterests.length||mainSkills.length||mainValues.length||mainDomains.length||mainNeedsRaw.length) ? true : _hasProfile;
      }
      _interests=unionMerge(mainInterests, _interests);
      _skills   =unionMerge(mainSkills,    _skills);
      _values   =unionMerge(mainValues,    _values);
      _domains  =unionMerge(mainDomains,   _domains);
      var mergedNeeds=unionMerge(mainNeedsRaw, _needsSkill.concat(_needsRes));
      _needsSkill=mergedNeeds.filter(function(n){return n.ntype==='skill';});
      _needsRes  =mergedNeeds.filter(function(n){return n.ntype!=='skill';});
      if(!_languages.length&&md.languages) _languages=md.languages.split(/[|,]/).map(function(s){return s.trim();}).filter(Boolean);
      if(!_name&&(md.first||md.name))      _name=md.first||md.name;

      } else if(!_photo&&md.photo) _photo=md.photo;
    }
  }catch(e){}
  if(_screen===2){var lb=document.getElementById('lang-edit-btn');if(lb)lb.textContent='✏️ '+(_languages.length?'Languages: '+_languages.join(', '):'Add your languages');}

// bringType save format: key[~<encoded free text>]|key[~...]
// Returns the plain key list and fills _bringText as a side effect.
function parseBringTypeStr(str){
  _bringText={skill:'',experience:'',thing:''};
  return String(str||'').split('|').filter(Boolean).map(function(p){
    var i=p.indexOf('~');
    if(i<0) return p;
    var k=p.slice(0,i);
    try{ _bringText[k]=decodeURIComponent(p.slice(i+1)); }catch(e){ _bringText[k]=p.slice(i+1); }
    return k;
  });
}
// Union merge: everything from both sources shows. Duplicates prefer ikigai (has sub-levels
// like level, role, category, detail). Main-only items appended after ikigai items. Matching
// is case-insensitive on the item name.
function unionMerge(mainList, ikigaiList){
  var out=[]; var seen={};
  (ikigaiList||[]).forEach(function(it){
    if(!it||!it.item) return;
    var k=String(it.item).toLowerCase().trim();
    if(seen[k]) return;
    seen[k]=true; out.push(it);
  });
  (mainList||[]).forEach(function(it){
    if(!it||!it.item) return;
    var k=String(it.item).toLowerCase().trim();
    if(seen[k]) return;
    seen[k]=true; out.push(it);
  });
  return out;
}
function parseTagStr(str,lk){
  if(!str) return [];
  return str.split('|').filter(Boolean).map(function(s){
    var p=s.split(':');var o={item:p[0],category:p.length>=3?p[1]:''};o[lk]=p.length>=3?p[2]||'':p[1]||'';return o;
  });
}
function parseNeedsStr(str){
  if(!str) return [];
  return str.split('|').filter(Boolean).map(function(s){
    // Save format: item[:local]:ntype[:category][~detail]  (~detail is URL-encoded free text)
    var detail='';
    var tio=s.indexOf('~');
    if(tio>-1){ try{ detail=decodeURIComponent(s.slice(tio+1)); }catch(e){ detail=s.slice(tio+1); } s=s.slice(0,tio); }
    var p=s.split(':');
    // p[0]=item. If p[1]==='local', local=true and ntype=p[2], category=p.slice(3).join(':')
    // else local=false, ntype=p[1], category=p.slice(2).join(':')
    var item=p[0];
    var local=false, ntype='skill', category='';
    if(p[1]==='local'){
      local=true;
      ntype=p[2]||'skill';
      category=p.slice(3).join(':');
    } else {
      local=false;
      ntype=p[1]||'skill';
      category=p.slice(2).join(':');
    }
    return {item:item, category:category, local:local, ntype:ntype, detail:detail};
  });
}

// ─── Auto-save ────────────────────────────────────────────────────────────────
function autoSave(){
  if(!_appearId||!isOwner()) return;   // only the owner writes, on either URL
  var iStr=_interests.map(function(s){return s.item+(s.level?':'+s.level:'');}).join('|');
  // item:category:level - the category used to be dropped here, so every skill came back
  // "Category missing" after a reload. parseTagStr reads both the old 2-part and this 3-part form.
  var sStr=_skills.map(function(s){return s.item+':'+(s.category||'')+':'+(s.level||'');}).join('|');
  var vStr=_values.map(function(s){return s.item+':'+(s.category||'')+':'+(s.level||'');}).join('|');
  var dStr=_domains.map(function(s){return s.item+(s.level?':'+s.level:'');}).join('|');
  var nStr=[].concat(
    _needsSkill.map(function(s){return s.item+(s.local?':local':'')+':'+(s.ntype||'skill')+(s.category?':'+s.category:'')+(s.detail?'~'+encodeURIComponent(s.detail):'');}),
    _needsRes.map(function(s){return s.item+(s.local?':local':'')+':'+(s.ntype||'thing')+(s.category?':'+s.category:'')+(s.detail?'~'+encodeURIComponent(s.detail):'');})
  ).join('|');
  var mStr=_methods.join('|');
  var btStr=_bringType.map(function(k){
    var t=(_bringText&&_bringText[k])||'';
    return k+(t?'~'+encodeURIComponent(t):'');
  }).join('|');
  var _p=fetch(GS_URL+'?action=saveIntake'
    +'&appearId='+encodeURIComponent(_appearId)
    +'&languages='+encodeURIComponent(_languages.join('|'))
    +'&postal='+encodeURIComponent(_postal)
    +'&interests='+encodeURIComponent(iStr)
    +'&skills='+encodeURIComponent(sStr)
    +'&values='+encodeURIComponent(vStr)
    +'&domains='+encodeURIComponent(dStr)
    +'&needs='+encodeURIComponent(nStr)
    +'&methods='+encodeURIComponent(mStr)
    +'&expression='+encodeURIComponent(_expression)
    +'&retired='+encodeURIComponent(buildRetiredStr())
    +'&bringType='+encodeURIComponent(btStr)
    +'&wantsSignupList='+encodeURIComponent(_wantsSignupList?'true':'')
    // The verified flag rides along only once a code has been entered. Someone completing their
    // profile for the first time has no email on file yet and never passed through the gate, so
    // their save stays exactly as it was — the gate guards editing an existing profile.
    +(_editToken?('&secure=1&editToken='+encodeURIComponent(_editToken)):'')
  ).then(function(r){ return r.json(); }).then(function(resp){
    // A rejected save means the hour lapsed. Ask again rather than losing the edit silently.
    if(_editToken && resp && resp.status !== 'ok'){
      _editToken=''; _tokenClear();
      showPinCard('That session expired. Verify again to keep your changes.');
    }
  }).catch(function(){});
  _hasProfile=true;
  return _p;
}

// ─── Drill-down render ────────────────────────────────────────────────────────
window.renderDrill = function(screen, containerId){
  var el=document.getElementById(containerId); if(!el) return;
  var s=String(screen);
  var d=getDrill(s);
  var html='';

  // Breadcrumb
  if(d.parentCat){
    html+='<div class="breadcrumb-nav">';
    html+='<span class="breadcrumb-link" onclick="doResetDrill(\''+s+'\',0)">All categories</span>';
    html+='<span> › </span><span class="breadcrumb-link" onclick="doResetDrill(\''+s+'\',1)">'+esc(d.parentCat)+'</span>';
    if(d.subCat) html+='<span> › </span><span class="breadcrumb-link" onclick="doResetDrill(\''+s+'\',2)">'+esc(d.subCat)+'</span>';
    if(d.itemCat) html+='<span> › </span><span>'+esc(d.itemCat)+'</span>';
    html+='</div>';
  }

  if(!d.parentCat){
    // Level 0: show top-level chips
    if(s==='1'){
      // Recreation: show rec types as sub chips
      html+='<div class="sub-chips">';
      REC_TYPES.forEach(function(t){
        html+='<div class="sub-chip" onclick="doSetDrill(\'1\',\'parentCat\',\''+rawVal(t)+'\')">'+esc(t)+'</div>';
      });
      html+='</div>';
    } else {
      html+='<div class="cat-chips-grid">';
      PARENT_CATS.forEach(function(c){
        html+='<div class="cat-chip" onclick="doSetDrill(\''+s+'\',\'parentCat\',\''+rawVal(c)+'\')">'+esc(c)+'</div>';
      });
      html+='</div>';
    }
  } else if(s==='1'){
    // Rec drill: level 1 = sub sport cats, level 2 = items
    var pool=(_refData&&_refData.recreation)||[];
    if(!d.subCat){
      var subCats=(function(){var sc={};pool.filter(function(r){return r.recType===d.parentCat;}).forEach(function(r){if(r.category)sc[r.category]=1;});return sortAlpha(Object.keys(sc));})();
      if(subCats.length){
        html+='<div class="sub-chips">';
        subCats.forEach(function(c){html+='<div class="sub-chip" onclick="doSetDrill(\'1\',\'subCat\',\''+rawVal(c)+'\')">'+esc(c)+'</div>';});
        html+='<div class="sub-chip" style="border-style:dashed;color:var(--brand);font-weight:700;" onclick="showCustomAdd(\'1\',\'\')">+ Other</div>';
        html+='</div>';
      }
    }
    // Show chips: always when rec type has no sub-cats, or when subCat is selected
    var chips=getItemChips(s);
    var hasSubCats=(function(){var sc={};pool.filter(function(r){return r.recType===d.parentCat;}).forEach(function(r){if(r.category)sc[r.category]=1;});return Object.keys(sc).length>0;})();
    if(chips.length && (d.subCat || !hasSubCats)){
      var addedArr=_interests;
      html+='<div class="ideas-prompt">Here are some ideas to get you started.</div>';
      html+='<div class="item-chips">';
      chips.forEach(function(item){
        var isAdded=addedArr.some(function(r){return r.item===item;});
        html+='<div class="item-chip'+(isAdded?' added':'')+'" onclick="addItemFromChip(\''+s+'\',\''+esc(item)+'\',\''+esc(d.parentCat)+'\')">'+esc(item)+'</div>';
      });
      html+='<div class="item-chip" style="border-style:dashed;color:var(--brand);font-weight:700;" onclick="showCustomAdd(\'1\',\'\')" >+ Other</div>';
      html+='</div>';
    }
  } else {
    // Non-rec: check for sub-cats (skills only), then show item chips
    if(s==='2'||s==='4s'){
      var subs=getSkillSubCats(d.parentCat);
      if(subs.length&&!d.subCat){
        html+='<div class="sub-chips">';
        subs.forEach(function(c){html+='<div class="sub-chip" onclick="doSetDrill(\''+s+'\',\'subCat\',\''+rawVal(c)+'\')">'+esc(c)+'</div>';});
        html+='<div class="sub-chip" style="border-style:dashed;color:var(--brand);font-weight:700;" onclick="showCustomAdd(\''+s+'\',\'\')">+ Other</div>';
        html+='</div>';
      }
    }
    // Item chips
    var chips2=getItemChips(s);
    if(chips2.length){
      var arr2=s==='2'?_skills:s==='3'?_values:s==='4s'?_needsSkill:_needsRes;
      html+='<div class="ideas-prompt">Here are some ideas to get you started.</div>';
      html+='<div class="item-chips">';
      chips2.forEach(function(item){
        var isAdded=arr2.some(function(r){return r.item===item;});
        var isPending=s==='4s'&&_pendingNeedsItem.item===item;
        var chipOnclick=s==='4s'?'selectNeedsItem(\''+esc(item)+'\',\''+esc(d.parentCat)+'\')':'addItemFromChip(\''+s+'\',\''+esc(item)+'\',\''+esc(d.parentCat)+'\')';
        html+='<div class="item-chip'+(isAdded?' added':isPending?' selected':'')+'\" onclick="'+chipOnclick+'">'+esc(item)+'</div>';
      });
      html+='<div class="item-chip" style="border-style:dashed;color:var(--brand);font-weight:700;" onclick="showCustomAdd(\''+s+'\',\'\')" >+ Other</div>';
      html+='</div>';
      if(s==='4s'&&_pendingNeedsItem.item){
        html+='<div id="needs-confirm-bar" style="margin-top:12px;padding:12px;background:var(--input-bg);border-radius:10px;display:flex;align-items:center;justify-content:space-between;">'          +'<span style="font-size:14px;color:var(--soft);">'+esc(_pendingNeedsItem.item)+'</span>'          +'<div style="display:flex;gap:8px;">'          +'<button class="btn-outlined" style="padding:6px 14px;font-size:13px;" onclick="_pendingNeedsItem={item:\'\',category:\'\'};renderDrill(\'4s\',\'drill-4s\')">Cancel</button>'          +'<button class="btn-primary" style="padding:6px 14px;font-size:13px;" onclick="confirmNeedsItem()">Add '+esc(_pendingNeedsItem.item)+'</button>'          +'</div></div>';
      }
    }
  }

  el.innerHTML=html;
};

window.doSetDrill = function(screen, key, val){
  var s=String(screen);
  var d=_drill[s]; if(!d) return;
  if(key==='parentCat'){
    if(d.parentCat===val){d.parentCat='';d.subCat='';d.itemCat='';}
    else{d.parentCat=val;d.subCat='';d.itemCat='';}
  } else if(key==='subCat'){d.subCat=val;d.itemCat='';}
  else{d.itemCat=val;}
  window.renderDrill(s,'drill-'+s);
};

window.doResetDrill = function(screen, level){
  resetDrillTo(screen, level);
  window.renderDrill(String(screen),'drill-'+String(screen));
};

window.addItemFromChip = function(screen, item, category){
  var s=String(screen);
  // Determine target array for screen 3 based on whether this is a domain
  var isDomain=(String(category||'').toLowerCase()==='domain');
  var targetArr;
  if(s==='3') targetArr=isDomain?_domains:_values;
  else targetArr=getArr(s);
  // Already added — deselect and remove
  var existingIdx=targetArr.findIndex(function(r){return r.item===item;});
  if(existingIdx>-1){
    targetArr.splice(existingIdx,1);
    document.querySelectorAll('.item-chips .item-chip').forEach(function(el){
      if(el.textContent.trim()===item) el.classList.remove('added');
    });
    if(s==='3'){
      var el0v=document.getElementById('added-3-values');
      var el0d=document.getElementById('added-3-domains');
      if(el0v) el0v.innerHTML=buildValAddedHTML(_values, 'Added values');
      if(el0d) el0d.innerHTML=buildValAddedHTML(_domains, 'Added domains');
    } else { updateAddedSection(s); }
    if(s==='4s'||s==='4r') refreshNeedsSummary();
    autoSave();
    return;
  }
  addItem(screen, item, category);
  document.querySelectorAll('.item-chips .item-chip').forEach(function(el){
    if(el.textContent.trim()===item) el.classList.add('added');
  });
  if(s==='3'){
    // Refresh both added sections
    var elv=document.getElementById('added-3-values');
    var eld=document.getElementById('added-3-domains');
    if(elv) elv.innerHTML=buildValAddedHTML(_values, 'Added values');
    if(eld) eld.innerHTML=buildValAddedHTML(_domains, 'Added domains');
    // Auto-expand the section that got a new item
    if(isDomain) expandValSection('val-body-Added-domains','val-arrow-Added-domains');
    else expandValSection('val-body-Added-values','val-arrow-Added-values');
  }
  if(s==='4s'||s==='4r') refreshNeedsSummary();
};

function addItem(screen, item, category){
  var s=String(screen);
  if(s==='3'){
    // Route by category: domain (any case) goes to _domains, everything else to _values
    var isDomainCat=String(category||'').toLowerCase()==='domain';
    if(isDomainCat){
      if(_domains.some(function(r){return r.item===item;})){toast('Already added');return;}
      _domains.unshift({item:item,category:'domain',level:''});
    } else {
      if(_values.some(function(r){return r.item===item;})){toast('Already added');return;}
      _values.unshift({item:item,category:category||'',level:''});
    }
    toast('Added below ↓');
    clearSearch(s);
    updateAddedSection(s);
    return;
  }
  var arr=getArr(s);
  if(s==='4s'||s==='4r') item=capFirst(item);
  if(arr.some(function(r){return r.item===item;})){toast('Already added');return;}
  if(s==='1') _interests.unshift({item:item,category:category||'',level:''});
  else if(s==='2') _skills.unshift({item:item,category:category||'',level:''});
  else if(s==='4s'){
    var pcat4s;
    if(_needsCat==='skill'&&_personSubType==='Recreation buddy'){
      // Recreation buddy: build Recreation buddy / [recType] from the recreation item's own data
      var recPool=(_refData&&_refData.recreation)||[];
      var recMatch=recPool.find(function(r){return (r.item||r)===item;});
      var rt=recMatch&&recMatch.recType?recMatch.recType:'';
      pcat4s='Recreation buddy'+(rt?' / '+rt:'');
    } else {
      pcat4s=category||(_drill['4s']&&_drill['4s'].parentCat)||'';
      if(_needsCat==='skill'&&_personSubType&&pcat4s.indexOf(_personSubType)!==0){pcat4s=_personSubType+(pcat4s?' / '+pcat4s:'');}
    }
    _needsSkill.unshift({item:item,category:pcat4s,local:!!_postal,ntype:'skill'});
    var tc=document.getElementById('needs-type-chips');if(tc)tc.style.display='';
    setTimeout(function(){if(_needsCat)window.setNeedsCat(_needsCat);},50);
  }
  else if(s==='4r'){_needsRes.unshift({item:item,category:category||(_drill['4r']&&_drill['4r'].parentCat)||'',local:!!_postal,ntype:'resource'});var tc2=document.getElementById('needs-type-chips');if(tc2)tc2.style.display='';setTimeout(function(){if(_needsCat)window.setNeedsCat(_needsCat);},50);}
  toast('Added below ↓');
  clearSearch(s);
  updateAddedSection(s);
}

function getArr(s){
  s=String(s);
  if(s==='1') return _interests;
  if(s==='2') return _skills;
  if(s==='3') return _values.concat(_domains);
  if(s==='4s') return _needsSkill;
  if(s==='4r') return _needsRes;
  return [];
}

function refreshNeedsVisible(){

  if(vis){
    vis.innerHTML=buildNeedsSectionsHTML();
  }
}
window.removeItem = function(screen, idx){
  var s=String(screen);
  if(s==='3'){
    // For screen 3, need to determine if item is from _values or _domains
    // Combined array is _values.concat(_domains)
    if(idx<_values.length){
      _values.splice(idx,1);
    } else {
      _domains.splice(idx-_values.length,1);
    }
  } else {
    getArr(s).splice(idx,1);
  }
  updateAddedSection(s);
  if(s==='4s'||s==='4r') refreshNeedsVisible();
  else window.renderDrill(s,'drill-'+s);
};

window.setLevel = function(screen, idx, level){
  var s=String(screen);
  var arr;
  if(s==='3'){
    // For screen 3, determine which array and adjust index
    if(idx<_values.length){
      arr=_values;
    } else {
      arr=_domains;
      idx=idx-_values.length;
    }
  } else {
    arr=getArr(s);
  }
  if(!arr[idx]) return;
  if(s==='3'){
    arr[idx].level=(arr[idx].level===level?'':level);
    updateAddedSection('3');
    return;
  }
  var current=arr[idx].level||'';
  var parts=current?current.split(','):[];
  var pos=parts.indexOf(level);
  var wasPresent=pos>-1;
  if(pos>-1) parts.splice(pos,1); else parts.push(level);
  arr[idx].level=parts.join(',');
  updateAddedSection(s);
  // A Coach-level recreation item used to be copied into Skills as well. That duplicated the
  // item in two sections and landed there with no category, so it read as broken. It stays in
  // Recreation as Coach now; the potluck flow already offers Coach items as things you can bring.
};

window.toggleLocal = function(screen, idx){
  var arr=getArr(String(screen));
  if(arr[idx]) arr[idx].local=!arr[idx].local;
  updateAddedSection(String(screen));
};

function updateAddedSection(s){
  // The fast screen holds all three groups at once and shows plain chips (no levels),
  // so it paints its own sections and none of the per-screen containers below exist.
  if(_screen==='fast2'){ fastRefresh(); return; }
  if(s==='3'){
    // Update in place instead of full re-render to avoid wiping added sections
    var elV=document.getElementById('added-3-values');
    var elD=document.getElementById('added-3-domains');
    if(elV) elV.innerHTML=buildValAddedHTML(_values,'Added values');
    if(elD) elD.innerHTML=buildValAddedHTML(_domains,'Added domains');
    return;
  }
  var el=document.getElementById('added-'+s);
  if(el){ el.innerHTML=buildAddedHTML(s); expandAddedSection('added-body-'+s,'added-arrow-'+s); }
  if(s==='4s'||s==='4r') refreshNeedsVisible();
}

function buildOneNeedsSection(label, items, s){
  if(!items.length) return '';
  var personTypeList=(_refData&&_refData.personTypes||['Skills/services','Recreation buddy','Accountability buddy']).concat(['Other']);
  var header='<div class="added-header-row" style="background:var(--brand);border-radius:8px;padding:8px 12px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;">'
    +'<div class="added-label" style="color:white;font-size:13px;font-weight:700;">'+label+' ('+items.length+')</div></div>';
  var body=items.map(function(item){
    // Find the true index in the underlying array for remove/toggle
    var arr=s==='4s'?_needsSkill:_needsRes;
    var realIdx=arr.findIndex(function(r){return r.item===item.item&&r.category===item.category&&r.ntype===item.ntype;});
    if(_editingNeed&&_editingNeed.s===s&&_editingNeed.idx===realIdx) return needEditorRow(s,realIdx);
    var catParts=item.category?item.category.split(' / '):[];
    var isPersonItem=catParts.length>=1&&personTypeList.indexOf(catParts[0])>-1;
    var personSubLabel=isPersonItem?catParts[0]:'';
    var catMissing=!item.category;
    var pickerId='need-cat-picker-'+s+'-'+realIdx;
    var catLabel=catMissing
      ?'<div class="need-missing-cat" style="font-size:11px;color:#d32f2f;cursor:pointer;" onclick="window.openNeedCatPicker(\''+s+'\','+realIdx+')">Category missing \u25be</div>'
       +'<div class="cat-picker-inline" id="'+pickerId+'">'+PARENT_CATS.map(function(c){return '<button class="cat-pick-btn" onclick="setNeedCat(\''+s+'\','+realIdx+',\''+c+'\')">'+c+'</button>';}).join('')+'</div>'
      :personSubLabel
        ?'<div style="font-size:11px;color:var(--soft);margin-top:2px;">'+esc(personSubLabel)+'</div>'
        :'<div class="need-item-cat">'+esc(item.category)+'</div>';
    var detailLine=item.detail?'<div class="need-item-detail" style="font-size:11px;color:var(--brand);margin-top:2px;font-style:italic;">Seeking: '+esc(item.detail)+'</div>':'';
    return '<div class="need-item">'
      +'<div class="need-item-left" style="position:relative;"><div class="need-item-name">'+esc(needTypeLabel(item.ntype))+': '+esc(item.item)+'</div>'+catLabel+detailLine+'</div>'
      +'<div class="need-item-right">'
      +'<button class="practice-item-x" onclick="openNeedEditor(\''+s+'\','+realIdx+')" title="Edit" style="font-size:14px;">✏️</button>'
      +'<label class="local-toggle'+(item.local?' active':'')+'" ><input type="checkbox"'+(item.local?' checked':'')+' onchange="toggleLocal(\''+s+'\','+realIdx+')"> 📍 Local</label>'
      +'<button class="practice-item-x" onclick="removeItem(\''+s+'\','+realIdx+')">\u00d7</button>'
      +'</div></div>';
  }).join('');
  return '<div class="added-section" style="margin-bottom:12px;">'+header+body+'</div>';
}
function buildAddedHTML(s){

function getFullPool(s){
  if(!_refData) return [];
  if(s==='1') return _refData.recreation||[];
  if(s==='4s'&&_personSubType==='Recreation buddy') return _refData.recreation||[];
  if(s==='2'||s==='4s') return _refData.skills||[];
  if(s==='pl') return _refData.skills||[];
  if(s==='3') return (_refData.values||[]).concat(_refData.domains||[]);
  if(s==='4r') return _refData.resources||[];
  return [];
}
window.runSearch = function(screen, q){
  var s=String(screen);
  _searchQ[s]=q;
  if(s==='2'){
    var flagged=checkFlag(q);
    var warnEl=document.getElementById('title-warning-2');
    if(warnEl) warnEl.innerHTML=flagged?'<div class="warning-msg">Gentle note: titles like "'+esc(flagged)+'" carry a level of knowledge we ask about separately. Try the role name on its own.</div>':'';
  }
  var pool=q&&q.length>=1?getFullPool(s):getPool(s);
  var res=[];
  if(q&&q.length>=1){var ql=q.toLowerCase();res=pool.filter(function(r){return matchesQuery(r,ql);}).slice(0,25);}
  var container=document.getElementById('search-results-'+s); if(!container) return;
  var inp=document.getElementById('search-input-'+s);
  if(inp){if(q&&res.length)inp.classList.add('has-results');else inp.classList.remove('has-results');}
  if(!q||q.length<1){container.innerHTML='';return;}
  if(res.length){
    container.innerHTML='<div class="search-results">'
      +res.map(function(r){
          var item=esc(r.item||r);
          var crumb=s==='1'?breadcrumbForRec(r):(r.category||'');
          return '<div class="search-result-item" onclick="addItem(\''+s+'\',\''+item+'\',\''+esc(r.category||'')+'\')">'
            +item+(crumb?'<div class="search-result-breadcrumb">'+esc(crumb)+'</div>':'')+'</div>';
        }).join('')+'</div>';
  } else {
    container.innerHTML='<div class="add-custom-row" onclick="showCustomAdd(\''+s+'\',\''+esc(q)+'\')">+ Add "'+esc(q)+'" to my list</div>';
  }
};

function breadcrumbForRec(r){
  var parts=['Recreation & Hobbies'];
  if(r.recType) parts.push(r.recType);
  if(r.category&&r.category!==r.recType) parts.push(r.category);
  return parts.join(' › ');
}

function clearSearch(s){
  _searchQ[s]='';
  var inp=document.getElementById('search-input-'+s);
  if(inp){inp.value='';inp.classList.remove('has-results');}
  var rc=document.getElementById('search-results-'+s); if(rc) rc.innerHTML='';
}

var _methodsDraft = [];

function stripMethodEmoji(s){
  // Remove leading emoji + space (emoji are typically 2 chars via surrogate pairs or single codepoints)
  return s.replace(/^[\uD800-\uDBFF][\uDC00-\uDFFF]\s*/,'').replace(/^\p{Emoji}\s*/u,'').trim();
}
function methodsMatch(a, b){
  return stripMethodEmoji(a)===stripMethodEmoji(b);
}
var _methodOpts=[];
function renderMethodsModalList(){
  var el=document.getElementById('methods-modal-list'); if(!el) return;
  var opts=(_refData&&_refData.methodsDisplay)||[];
  if(!opts.length){el.innerHTML='<div class="empty">Loading...</div>';return;}
  _methodOpts=opts.slice();
  el.innerHTML=opts.map(function(m,i){
    var checked=_methodsDraft.some(function(d){return methodsMatch(d,m);});
    return '<div class="method-item'+(checked?' selected':'')+'" onclick="toggleMethodDraft('+i+')">'
      +'<div class="method-check'+(checked?' checked':'')+'">'+( checked?'✓':'')+'</div>'
      +'<div class="method-text">'+esc(m)+'</div>'
      +'</div>';
  }).join('');
}
window.toggleMethodDraft = function(i){
  var m=_methodOpts[i]; if(m===undefined) return;
  var idx=-1;
  _methodsDraft.forEach(function(d,j){if(methodsMatch(d,m))idx=j;});
  if(idx>-1){ _methodsDraft.splice(idx,1); }
  else { _methodsDraft.push(m); }
  renderMethodsModalList();
};
var _methodInlineOpts=[];
function buildMethodsChecklistHTML(draftArr, opts, maxLabel){
  if(!opts||!opts.length) return '<div class="empty">Loading...</div>';
  _methodInlineOpts=opts.slice();
  var h='<div class="methods-list">';
  opts.forEach(function(m,i){
    var checked=draftArr.some(function(d){return methodsMatch(d,m);});
    h+='<div class="method-item'+(checked?' selected':'')+'" onclick="toggleMethodInline('+i+')">'
      +'<div class="method-check'+(checked?' checked':'')+'">'+( checked?'✓':'')+'</div>'
      +'<div class="method-text">'+esc(m)+'</div>'
      +'</div>';
  });
  h+='</div>';
  return h;
}
window.toggleMethodInline = function(i){
  var m=_methodInlineOpts[i]; if(m===undefined) return;
  var idx=-1;
  _methods.forEach(function(d,j){if(methodsMatch(d,m))idx=j;});
  if(idx>-1){ _methods.splice(idx,1); }
  else { _methods.push(m); }
  var el=document.getElementById('methods-inline-list'); if(!el) return;
  var opts=(_refData&&_refData.methodsDisplay)||[];
  el.innerHTML=buildMethodsChecklistHTML(_methods, opts);
};



function capFirst(str){
  str=String(str||'');
  return str?str.charAt(0).toUpperCase()+str.slice(1):str;
}
function toTitleCase(str){
  return str.replace(/[^\s]+/g,function(w){
    if(w.length<=5&&w===w.toUpperCase()&&/^[A-Z]+$/.test(w)) return w;
    return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
  });
}

// Fallback when the profile is opened without ?eventId=. Without an event the attendees and
// Manage-my-experience pills cannot be built at all, so this is worth ONE non-blocking call -
// it only ever fires when the URL left the event out, and never blocks first paint.
var _regEventsChecked=false;
async function _fillHubFromReg(){
  if(_regEventsChecked) return; _regEventsChecked=true;
  var who=_showId||_appearId; if(!who) return;
  await _paintGate();                   // the profile draws first; this only fills a pill
  try{
    var res=await fetch(GS_URL+'?action=getRegistrations&appearId='+encodeURIComponent(who));
    var d=await res.json();
    var regs=(d.registrations||[]).filter(function(r){return String(r.cancelled||'').trim().toLowerCase()!=='true';});
    // Most recent active registration wins. A real "which event?" picker needs event TITLES,
    // and getRegistrations does not return them - resolving titles would cost one getEventById
    // per event, which is exactly the concurrent-call pattern that 404s. Queued as a GAS item.
    if(regs.length){ _eventId=regs[regs.length-1].eventId||''; if(_eventId) render(); }
  }catch(e){}
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render(){
  var el=document.getElementById('app-content'); if(!el) return;
  renderTopRight();
  var _tn0=document.getElementById('app-topnav');
  if(_tn0){
    // The URL params (&groupId, &hubEventId) still flow through and are used elsewhere; only the
    // top-of-page pill is gone. Re-enable by restoring the _bgParams / _bgUrl / _bgLabel block.
    // In edit mode (owner editing any screen other than the profile view), still show a
    // "My profile" pill so the person can bounce back to their profile view without scrolling to Done.
    var _navPillCss='text-decoration:none;color:#1F699E;background:#fff;font-size:14px;font-weight:600;padding:8px 16px;border-radius:20px;display:inline-block;';
    var _pills='';
    if(_editMode && _appearId){
      if(_pills) _pills += ' ';
      // The second My profile pill was a way back out of editing on this page. Editing is not
      // on this page any more, and two pills with the same name was its own small confusion.
    }
    // Repaint the name and tabs. This used to assign '' when there were no pills, which wiped
    // the header the moment loading finished.
    paintShellHeader(_pills ? (' '+_pills) : '');
  }
  // Wide (hub-style) layout is potluck-only, and only once its data has loaded - a wide empty
  // page during the load reads as broken. One class toggle, no per-screen undo needed.
  document.body.classList.toggle('wide-mode', _screen==='potluck'&&_potluckLoaded);
  // Someone else's profile is read-only, full stop. The owner on their own "?show=" URL
  // falls through to the normal flow so the pencils and edit screens work there too.
  if(_viewerMode&&!isOwner()){
    if(_hasProfile) renderProfile(el,true);
    else el.innerHTML='<div class="empty" style="padding:40px;text-align:center;">No profile found.</div>';
    _wtmDecorate();
    return;
  }
  if(!_appearId){
    el.innerHTML='<div style="text-align:center;padding:40px 20px"><p style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px;">Sign in or up to continue</p><p style="font-size:14px;color:var(--soft)"><a href="https://appear.network" style="color:var(--brand);font-weight:600;">Sign in or up</a> and open this page from your profile.</p></div>';
    return;
  }
  if(_screen==='intro'){ renderScreenIntro(el); return; }
  if(_screen===0){
    // This page led with two buttons and hid the profile behind one of them, from the days when
    // the Appear page was the other choice. The Appear page has gone and editing lives in the
    // five circles now, so the only thing left was a door in front of the room. My profile shows
    // the profile. ?landing=1 still opens the old screen.
    if(_landingWanted() && !_viewerMode){ renderProfileLanding(el); return; }
    renderProfile(el,false); _wtmDecorate(); return;
  }
  if(_screen==='fast2'){ renderScreenFast2(el); return; }
  if(_screen==='confirm'){ renderScreenConfirm(el); return; }
  if(_screen==='1b'){ renderScreen1b(el); return; }
  if(_screen==='potluck'){ renderScreenPotluck(el); return; }
  if(_screen==='share'){ renderScreenShare(el); return; }
  var fn={1:renderScreen1,2:renderScreen2,3:renderScreen3,4:renderScreen4}[_screen];
  if(fn) fn(el);
}

// Profile
// ─── "I want to meet!" bookmarks (backend: (ignore) Bookmarked tab) ───────────
// V6.19: persisted to the (ignore) Bookmarked tab (saveBookmark/getBookmarks) instead of
// localStorage, so a bookmark follows you across devices and is actually recorded. _wtmData is
// filled by ONE non-blocking getBookmarks read on load; toggles write through fire-and-forget.
var _wtmData=null, _wtmLoaded=false, _wtmLoading=false;
function _wtmNorm(id){ return String(id||'').replace(/\./g,'').toLowerCase(); }
function _wtmMyId(){
  // Bookmarking is done BY whoever is signed in, not by whoever the address names. It used to
  // read the address, and the address is stripped on load, so on somebody else's profile it
  // asked a question whose answer had already been taken away and the control disappeared.
  // Looking as somebody else still bookmarks nothing, because View as never writes.
  try{ if(window.CW&&CW.me&&CW.me().viewing) return ''; }catch(e){}
  try{ if(window.CW&&CW.realMe){ var r=String(CW.realMe().id||'').trim(); if(r) return r; } }catch(e){}
  return _viewerIdParam() || (isOwner() ? String(_appearId||'') : '');
}
function _wtmHas(id){ var n=_wtmNorm(id); return (_wtmData||[]).some(function(p){return _wtmNorm(p.id)===n;}); }
function _wtmLoad(){
  var me=_wtmMyId();
  if(_wtmLoaded||_wtmLoading||!me) return;
  _wtmLoading=true;
  afterPaint(function(){
  fetch(GS_URL+'?action=getBookmarks&appearId='+encodeURIComponent(me))
    .then(function(r){return r.json();})
    .then(function(d){ _wtmData=((d&&d.bookmarks)||[]).map(function(b){return {id:b.appearId, name:b.name||'', photo:b.photo||''};}); })
    .catch(function(){ if(!_wtmData) _wtmData=[]; })
    .then(function(){ _wtmLoaded=true; _wtmLoading=false; render(); });
  });
}
window.wtmToggle=function(){
  var me=_viewerIdParam(), them=_showId;
  if(!me||!them) return;
  var wasHas=_wtmHas(them);
  if(!_wtmData) _wtmData=[];
  if(wasHas){ var n=_wtmNorm(them); _wtmData=_wtmData.filter(function(p){return _wtmNorm(p.id)!==n;}); }
  else { _wtmData.push({id:them, name:_viewerName||'', photo:_viewerPhoto||''}); }
  var btn=document.getElementById('wtm-btn'); if(btn){ btn.textContent=_wtmHas(them)?'✓ Bookmarked':'Bookmark to meet'; }
  fetch(GS_URL+'?action=saveBookmark&from='+encodeURIComponent(me)+'&to='+encodeURIComponent(them)+(wasHas?'&remove=true':''));
};
window.wtmRemove=function(id){
  var me=_wtmMyId(), n=_wtmNorm(id);
  if(_wtmData) _wtmData=_wtmData.filter(function(p){return _wtmNorm(p.id)!==n;});
  if(me) fetch(GS_URL+'?action=saveBookmark&from='+encodeURIComponent(me)+'&to='+encodeURIComponent(id)+'&remove=true');
  render();
};
