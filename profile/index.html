// Bookmarking is a "me -> them" action, so it needs BOTH people named in the URL. On a bare
// "?show=" there is no viewer, so there is nobody to bookmark on behalf of - and personal UI
// should never appear off a device's stored id alone.
function _viewerIdParam(){
  try{
    var _vp=new URLSearchParams(window.location.search);
    var fromUrl=String(_vp.get('me')||_vp.get('memberCard')||_vp.get('CWid')||'').trim();
    if(fromUrl) return fromUrl;
    // The device knows who is looking. Requiring it in the address meant a link from a group,
    // which names only the person being looked at, had nobody to bookmark them as.
    return (window.CW&&CW.realMe)?String(CW.realMe().id||'').trim():'';
  }catch(e){ return ''; }
}
function _wtmDecorate(){
  var el=document.getElementById('app-content'); if(!el) return;
  _wtmLoad();   // V6.19: one non-blocking read of your bookmarks; re-renders when it lands

  // Your own list is yours on either URL; someone else's profile gets the bookmark button.
  if(isOwner()){ el.insertAdjacentHTML('beforeend', _wtmListHTML()); return; }
  if(!_showId) return;
  if(!_viewerIdParam()) return;   // only one person in the URL - no bookmark button
  var has=_wtmHas(_showId);
  var _bs='font-size:14px;font-weight:600;padding:9px 18px;border-radius:20px;cursor:pointer;font-family:inherit;border:1.5px solid #185FA5;background:#fff;color:#185FA5;';

  // V6.16: append, do not replace. This used to set app-topnav's innerHTML to the button
  // alone, wiping the "All events / Event attendees" nav that renders there.
  // V6.24: insert INSIDE the nav-buttons flex row so the button sits on the same line as the
  // other pills instead of stacking below. Re-decorating removes any prior button first.
  var host=document.getElementById('app-topnav'); if(!host) return;
  var _old=host.querySelector('[data-wtm-wrap]'); if(_old) _old.remove();
  // 2026-08-30. firstElementChild is the breadcrumb whenever there is one, so the button landed
  // on top of Back. The pill row is the last child, and it is the row this belongs in.
  var target=host.lastElementChild||host;
  target.insertAdjacentHTML('beforeend', btn);
}

// One verification covers the hour across every creating.works page, so the token lives in
// browser storage keyed to the person rather than in a variable that dies on navigation. It is
// dropped a minute early to avoid racing the server's own expiry, and cleared when rejected.
var _EDIT_KEY='cw-edit-'+String(_appearId||_showId||'').split('.').join('').toLowerCase();
function _tokenGet(){
  try{
    var raw=localStorage.getItem(_EDIT_KEY); if(!raw) return '';
    var o=JSON.parse(raw);
    if(!o||!o.t||!o.exp||Date.now()>(o.exp-60000)){ localStorage.removeItem(_EDIT_KEY); return ''; }
    return o.t;
  }catch(e){ return ''; }
}
function _tokenSet(t){
  try{ localStorage.setItem(_EDIT_KEY, JSON.stringify({t:t, exp:Date.now()+60*60*1000})); }catch(e){}
}
function _tokenClear(){ try{ localStorage.removeItem(_EDIT_KEY); }catch(e){} }

function showPinCard(msg){
  var el=document.getElementById('app-content'); if(!el) return;
  var lede=msg||'We will email a one-time 6-digit code to the address on your profile. It expires in 15 minutes and can only be used once.';
  el.innerHTML=''
    +'<div style="max-width:520px;">'
    +'<h1 style="font-size:24px;font-weight:800;margin:0 0 8px;color:var(--text);">Verify it is you</h1>'
    +'<p id="pin-lede" style="font-size:15px;color:var(--muted);line-height:1.55;margin:0 0 18px;">'+esc(lede)+'</p>'
    +'<input type="text" id="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="Example: 428091" '
      +'style="display:none;width:100%;max-width:220px;font-size:18px;letter-spacing:.2em;text-align:center;padding:11px 13px;'
      +'border:1.5px solid var(--border);border-radius:10px;font-family:inherit;">'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;">'
      +'<button id="pin-cancel" style="background:#fff;color:var(--brand);border:1.5px solid var(--brand);border-radius:24px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;">Cancel</button>'
      +'<button id="pin-send" style="background:var(--brand);color:#fff;border:0;border-radius:24px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;">Send code</button>'
      +'<button id="pin-verify" style="display:none;background:var(--brand);color:#fff;border:0;border-radius:24px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;">Verify</button>'
    +'</div>'
    +'<div id="pin-again" style="display:none;font-size:12px;color:var(--muted);margin-top:12px;">Did not get it? <a href="#" id="pin-resend" style="color:var(--brand);font-weight:700;text-decoration:none;">Send again</a></div>'
    +'<div id="pin-status" style="font-size:13px;color:var(--muted);margin-top:12px;min-height:18px;"></div>'
    +'</div>';
  var who=_appearId||_showId||'';
  var st=document.getElementById('pin-status');
  var inp=document.getElementById('pin-input');
  var send=document.getElementById('pin-send');
  var verify=document.getElementById('pin-verify');
  function sendCode(){
    st.textContent='Sending your code…'; send.disabled=true;
    fetch(GS_URL+'?action=sendProfilePin&appearId='+encodeURIComponent(who))
      .then(function(r){return r.json();}).then(function(resp){
        send.disabled=false;
        if(resp&&resp.sent){
          send.textContent='Resend';
          st.textContent='Check your email for the code.';
          inp.style.display=''; verify.style.display='';
          document.getElementById('pin-again').style.display='';
          inp.focus();
        } else { st.textContent='No email on file for this profile.'; }
      }).catch(function(){ send.disabled=false; st.textContent='Could not send. Try again.'; });
  }
  send.onclick=sendCode;
  var again=document.getElementById('pin-resend');
  if(again) again.onclick=function(e){ e.preventDefault(); sendCode(); };
  document.getElementById('pin-cancel').onclick=function(){ _pinPending=null; _editMode=false; _screen=0; render(); };
  verify.onclick=function(){
    var code=(inp.value||'').trim(); if(!code) return;
    st.textContent='Checking…'; verify.disabled=true;
    fetch(GS_URL+'?action=verifyProfilePin&appearId='+encodeURIComponent(who)+'&code='+encodeURIComponent(code))
      .then(function(r){return r.json();}).then(function(resp){
        verify.disabled=false;
        if(resp&&resp.status==='ok'&&resp.editToken){
          _editToken=resp.editToken; _tokenSet(_editToken);
          var go=_pinPending; _pinPending=null;
          _editMode=true; _screen=(go===null||go===undefined)?0:go; render();
        } else { st.textContent=(resp&&resp.message)||'Invalid code.'; }
      }).catch(function(){ verify.disabled=false; st.textContent='Could not verify. Try again.'; });
  };
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') verify.click(); });
}

function loadPotluck(cb){
  if(!_eventId){cb&&cb();return;}
  if(_potluckLoading){return;}
  _potluckLoading=true;
  var _settled=false;
  var _finish=function(){
    if(_settled) return; _settled=true;
    _potluckLoaded=true;
    _potluckLoading=false;
    cb&&cb();
  };
  // Safety net: GAS is occasionally very slow or hangs (documented elsewhere) - never leave the screen stuck on "Loading…" forever.
  setTimeout(function(){ if(!_settled) _finish(); },15000);
  fetch(GS_URL+'?action=getPotluckList&eventId='+encodeURIComponent(_eventId))
    .then(function(r){return r.json();})
    .then(function(d){
      if(_settled) return;
      if(d&&d.signupPotluck){
        try{_signupList=JSON.parse(d.signupPotluck)||[];}catch(e){_signupList=[];}
      }
      _potluckClaims=(d&&d.claims)||[];
      _potluckFetched=true;                                   // the list is genuinely the server's
      try{_plLastSaved=JSON.stringify(_signupList);}catch(e){_plLastSaved=null;}
      _finish();
    })
    .catch(function(){_finish();});
}

// Add every entry to the shared list, save once, then claim them ONE AT A TIME.
// Never fire these concurrently - overlapping calls to this backend 404.
function commitSeedEntries(entries){
  entries.forEach(function(e){
    if(!_signupList.some(function(it){return it.item===e.item;})){
      // contributed:true marks this as "someone is bringing this", not "this needs bringing".
      // Without it the offer turns into an open slot other people are invited to claim.
      _signupList.push({item:e.item,potluckType:e.potluckType,category:'',timeSpec:'',maxClaims:'',contributed:true});
    }
  });
  _seedFlow={item:'',step:'',type:''};
  // Paint the result straight away. We already know what was added, so there's no reason to
  // re-fetch the whole list afterwards - that round-trip was most of the wait.
  entries.forEach(function(e){
    _potluckClaims.push({item:e.item,potluckType:e.potluckType,appearId:_appearId,elaboration:'',name:_name||'',photo:_photo||''});
  });
  if(_screen==='intro') render(); else renderScreenPotluck(null);
  toast('Added! 🎁');
  // The profile is written FIRST, so nothing reaches the hub that is not on the person's
  // own profile. Strictly sequential - this backend 404s when calls overlap.
  var _afterProfile=function(){
    savePotluckList(function(){        // wait for the list write before claiming - no overlap
      var i=0;
      (function next(){
        if(i>=entries.length) return;
        var e=entries[i++];
        claimItem(e.item,'',e.potluckType,'','',0,next);
      })();
    });
  };
  var _sp=autoSave();
  if(_sp&&_sp.then) _sp.then(_afterProfile,_afterProfile); else _afterProfile();
}

// cb is optional: callers that need to chain another GAS call must wait for this one to finish,
// because overlapping requests to this backend 404.
function savePotluckList(cb){
  // Refuse to write a list we never actually received. Both branches used to call cb, so a
  // failed write was indistinguishable from a good one and the caller carried on claiming
  // against items that never saved.
  if(!_potluckFetched){
    toast('The sign up list has not loaded yet. Nothing was saved.');
    return;
  }
  var _attempt=JSON.stringify(_signupList);
  var _restore=_plLastSaved;
  // Queue behind anything already in flight. This backend 404s on overlapping calls and runs
  // 2.5s-52s, so ordering has to be guaranteed rather than hoped for.
  _plSaveChain=_plSaveChain.then(function(){
    return fetch(GS_URL+'?action=savePotluckItem&eventId='+encodeURIComponent(_eventId)
      +'&potluckJson='+encodeURIComponent(_attempt))
      .then(function(r){return r.json();})
      .then(function(d){
        if(!d||d.status!=='ok') throw new Error('rejected');
        _plLastSaved=_attempt;
        cb&&cb();                                             // only chain on a real success
      })
      .catch(function(){
        if(_restore!=null){ try{_signupList=JSON.parse(_restore);}catch(e){} }
        toast('Could not save. Your change was undone, please try again.');
        try{ if(_screen==='intro') render(); else renderScreenPotluck(null); }catch(e){}
      });
  });
}

function claimItem(item,category,potluckType,elaboration,timeSpec,maxClaims,cb){
  fetch(GS_URL+'?action=claimPotluckItem&eventId='+encodeURIComponent(_eventId)
    +'&item='+encodeURIComponent(item)
    +'&category='+encodeURIComponent(category||'')
    +'&potluckType='+encodeURIComponent(potluckType||'')
    +'&appearId='+encodeURIComponent(_appearId)
    +'&elaboration='+encodeURIComponent(elaboration||'')
    +'&timeSpec='+encodeURIComponent(timeSpec||'')
    +'&maxClaims='+encodeURIComponent(maxClaims||0))
    .then(function(r){return r.json();})
    .then(function(d){
      if(d&&d.status==='full'){toast('This one\'s full');}
      else if(d&&d.status==='already'){toast('You already signed up for this');}

// ?timing=1 prints how long each call to the backend actually took, in the order they finished.
// It is a switch on this page rather than a page of its own, and it comes off once it has
// answered. Added 2026-09-01 because the page is measurably four seconds from here and fifteen
// from Jessie's chair, and only her browser can settle which.
if (new URLSearchParams(location.search).get('timing') === '1') {
  (function () {
    var box = document.createElement('div');
    box.setAttribute('style', 'position:fixed;left:10px;bottom:10px;z-index:99999;background:#fff;'
      + 'border:2px solid #1F699E;border-radius:10px;padding:12px 14px;font:13px/1.7 monospace;'
      + 'color:#1A2E42;max-width:92vw;max-height:60vh;overflow:auto;');
    box.appendChild(document.createTextNode('call timings'));
    document.body.appendChild(box);
    var t0 = Date.now(), n = 0;
    var real = window.fetch;
    window.fetch = function (u) {
      var started = Date.now(), name = String(u).split('action=')[1] || String(u);
      name = name.split('&')[0];
      n++;
      var row = document.createElement('div');
      row.textContent = name + ' ... going';
      box.appendChild(row);
      return real.apply(this, arguments).then(function (r) {
        row.textContent = name + '  took ' + ((Date.now() - started) / 1000).toFixed(1)
                        + 's, ended ' + ((Date.now() - t0) / 1000).toFixed(1) + 's after load';
        return r;
      }, function (e) {
        row.textContent = name + '  FAILED after ' + ((Date.now() - started) / 1000).toFixed(1) + 's';
        throw e;
      });
    };
    var done = document.createElement('div');
    done.setAttribute('style', 'margin-top:8px;font-weight:800;');
    box.appendChild(done);
    var tick = setInterval(function () {
      done.textContent = 'page has been up ' + ((Date.now() - t0) / 1000).toFixed(0) + 's';
    }, 500);
    setTimeout(function () { clearInterval(tick); done.textContent += '  (stopped counting)'; }, 60000);
  })();
}

// Nothing may be stranded. If the profile never loads at all, the second wave still goes,

(async function init(){
  if(_viewerMode){
    await loadProfileAndIntake();                // ONE combined call (getIntake + lookupProfile)
  _profileLoaded=true; window._paintDone();
    // The owner opening their own public link lands on the same editable profile the
    // "?id=" door leads to, rather than a read-only copy of themselves.
    if(isOwner()){ _completed=_hasProfile; _screen=_hasProfile?0:(_introMode?'intro':'fast2'); if(!_hasProfile){ _fastPath=true; if(!_languages.length) _languages=['English']; } }
    render();                                    // paint the profile immediately
    loadRefData().then(function(){ render(); }); // lazy: category labels, then repaint
    loadHostInfoForViewer();                     // lazy: only fires when an eventId is attached; repaints if this person is that event's host
    return;
  }
  if(!_appearId){ render(); return; }
  if(_introMode){ _screen='intro'; _fastPath=true; }   // new registrant from the hub CTA
  // The landing shows two boxes that need only the name and the Appear page link, and
  // lookupProfile already supplies both. getProfile takes about four seconds and only fills the
  // Q&A, so it waits until Update answers is pressed rather than holding up every visit.
  if(!_introMode && !_directScreen && !_showAnswers){
    _screen=0;
    render();                                    // name and photo, which are already in hand
    // The answers used to wait for Update answers to be pressed, from the days when this page
    // was a landing screen with two buttons on it. It is the reader now, and the sections it
    // draws were coming up empty for everybody, their own profile included. They load in the
    // background and the page repaints when they arrive, so nothing waits on them.
    loadRefData()
      .then(function(){ return loadProfileAndIntake(); })
      .then(function(){
        _profileLoaded=true; window._paintDone();
        if(_hasProfile) _completed=true;         // never pushes somebody into the editor
        _screen=0;
        render();
      })
      .catch(function(){});
    return;
  }
  var _bootEl=document.getElementById('app-content');
  if(_bootEl) _bootEl.innerHTML='<div style="text-align:center;padding:60px 20px;"><div style="width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;"></div><p style="color:var(--muted);font-size:14px;margin:0;">Loading your profile...</p></div>';
  // Four calls, all in the air at once. The profile used to queue behind the reference data even
  // though it does not need a word of it to be fetched, only to be drawn. Both are still awaited
  // before the first paint, so there is no blank-then-jump flash.
  var _refReady = loadRefData();
  var _meReady  = loadProfileAndIntake();
  await _refReady;                               // needed to render the flow options
  await _meReady;                                // the real profile, before the first paint
  _profileLoaded=true; window._paintDone();
  if(_hasProfile){
    _completed=true;
    if(_directScreen==='potluck'){ _screen='potluck'; render(); return; }   // direct link from the hub's "Sign up list" pill
    // Only redirect if data actually loaded from sheet (at least one section has data)
    // Prevents redirect loop when GAS fetch fails or returns empty
    var _dataLoaded=(_interests.length||_skills.length||_values.length||_methods.length||_languages.length);
    // Anything still open goes to the one fast screen that holds all five, rather than
    // dropping them back into the long wizard a section at a time.
    if(_dataLoaded&&fastMissing().length){ _fastPath=true; _screen='fast2'; render(); return; }
    _screen=0;
  } else {
    // No profile yet: the fast path is the way in. The potluck intro (step 1) is Lake
    // Ballinger specific and only appears with intro=1; every other event skips straight to
    // the profile builder (fast2). V6.18: pre-select English so the language step (now required
    // by the room gate) is one fewer tap; the person can remove or change it.
    _screen=_introMode?'intro':'fast2'; _fastPath=true;
    if(!_languages.length) _languages=['English'];
  }
  render();
})();
