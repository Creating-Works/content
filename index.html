<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<!-- THE HOME PAGE. Jessie, 2026-09-10: "this is to push to creating.works home page - and the
     current home page can be an about". The page that was here is at /vision/ now. -->
<title>Creating.Works</title>
<!-- Who is signed in on this device. It reads creating.works's own storage, which is why signing
     in happens on this page and never by a trip to 2gather.network and back. -->
<script src="https://2gather.network/nav/identity.js?v=14"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<style>
  :root{
    --bg:#1F699E; --brand:#1F699E; --ink:#1A2E42; --soft:#4B5A6D; --muted:#6B7A8D;
    --line:#DDE4EE; --panel:#F7FBFF; --panel-line:#C9DFF3; --card:#fff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5;}

  /* THE PAGE TEMPLATE, the one My groups, My events and the editing page share. 1200 wide, a
     340 rail, an 18px gap, one column below 860. design/component-library/page-template.md. */
  .wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px;}
  .layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start;}

  .head{margin-bottom:16px;}
  h1{font-size:26px;font-weight:800;margin:0;color:#fff;}
  .head .sub{color:#fff;opacity:.92;font-size:15px;margin-top:6px;max-width:62ch;}

  .btn{display:inline-block;background:#fff;color:var(--brand);border:0;padding:11px 20px;border-radius:26px;
    font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;}
  .btn.solid{background:var(--brand);color:#fff;}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--panel-line);}

  /* THE RAIL. Separate white buttons with their own borders so every part looks pressable.
     Chosen is filled blue with white lettering and nothing else marks it. The count under a
     part appears only once there is something to count. */
  .tabs{background:#fff;border-radius:14px;padding:12px;height:fit-content;
    display:flex;flex-direction:column;gap:6px;}
  .tab{display:block;width:100%;text-align:left;background:#fff;color:var(--brand);
    border:1.5px solid #C9D6E2;border-radius:9px;font-family:inherit;font-size:14px;
    font-weight:700;padding:11px 14px;cursor:pointer;line-height:1.25;}
  .tab:hover{background:var(--panel);}
  .tab.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .tab.on:hover{background:var(--brand);}
  .tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  .tab span{display:block;font-size:12px;font-weight:600;opacity:.75;margin-top:2px;}

  /* The panel's first line sits level with the rail's first pill: both start 12px down. */
  .panel{background:var(--card);border-radius:14px;padding:12px 30px 28px;min-height:280px;}
  .panel h2{font-size:22px;font-weight:800;margin:6px 0 3px;}
  .panel .lead{color:var(--soft);font-size:14.5px;margin:0 0 22px;max-width:64ch;}

  /* A form label carries no colon, and its help line sits between the label and the field. */
  .f{margin-bottom:22px;}
  .f label,.f .lab{display:block;font-size:15px;font-weight:800;color:var(--ink);margin-bottom:2px;}
  .f .help{font-size:13.5px;color:var(--soft);margin-bottom:8px;max-width:64ch;}
  .f input[type=text],.f input[type=email],.f textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
    font:inherit;color:var(--ink);background:#fff;}
  .f textarea{min-height:84px;resize:vertical;}
  .f input:focus,.f textarea:focus{outline:2px solid var(--panel-line);outline-offset:1px;border-color:var(--brand);}

  .choice{display:flex;gap:8px;flex-wrap:wrap;}
  .choice button{background:#fff;color:var(--brand);border:1.5px solid #C9D6E2;border-radius:9px;
    font:inherit;font-size:14px;font-weight:700;padding:9px 16px;cursor:pointer;}
  .choice button.on{background:var(--brand);color:#fff;border-color:var(--brand);}

  .addrow{display:flex;gap:10px;flex-wrap:wrap;}
  .addrow input{flex:1 1 240px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--panel-line);
    border-radius:16px;padding:6px 8px 6px 14px;font-size:14px;font-weight:700;color:var(--brand);}
  .chip button{background:none;border:0;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;padding:0 2px;}
  .none{font-size:13.5px;color:var(--muted);}

  .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}

  /* The review. Space does the separating, never a rule. */
  .rv{margin-bottom:22px;}
  .rv .t{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .rv .q{font-size:14px;font-weight:700;color:var(--ink);}
  .rv .a{font-size:14.5px;color:var(--soft);margin:2px 0 12px;white-space:pre-wrap;}
  .rv .a.empty{color:var(--muted);font-style:italic;}
  .infobox{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:18px 20px;margin-bottom:14px;}
  .infobox .t{font-size:15.5px;font-weight:800;margin-bottom:4px;}
  .infobox .d{font-size:14px;color:var(--soft);}
  /* WAITING IS THE BREATHING PILL. Sending and checking a code each take one trip to the backend. */
  .cw-loading{display:inline-flex;align-items:center;gap:8px;background:#1F699E;color:#fff;
    font-size:13px;font-weight:700;padding:8px 16px;border-radius:20px;white-space:nowrap;
    animation:cw-breathe 1.6s ease-in-out infinite;}
  @keyframes cw-breathe{0%,100%{opacity:1}50%{opacity:.62}}
  .tick{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);margin:0 0 12px;cursor:pointer;}
  .tick input{width:18px;height:18px;flex-shrink:0;margin:2px 0 0;accent-color:var(--brand);}
  .tick a{color:var(--brand);font-weight:700;}
  .say{font-size:14px;margin-top:12px;}
  .say.bad{color:#7A2410;}
  .say.ok{color:var(--soft);}
  .quiet{font-size:13.5px;color:var(--muted);margin-top:18px;}
  .savestat{font-size:13.5px;color:var(--muted);font-weight:600;}
  .quiet a{color:var(--brand);font-weight:700;cursor:pointer;}

  @media(max-width:860px){
    .layout{grid-template-columns:1fr;}
    /* Four buttons stacked down a phone is most of a screen, so the rail lies down and wraps. */
    .tabs{flex-direction:row;flex-wrap:wrap;}
    .tab{width:auto;flex:1 1 40%;}
  }
  @media(max-width:760px){
    .panel{padding:12px 18px 22px;}
    h1{font-size:24px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>Start a conversation</h1>
    <div class="sub">Answer what you can and we will take it from there together.</div>
  </div>

  <div class="layout">
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel"></div>
  </div>

</div>

<script>
(function(){
  // THE CONSTITUENCY INQUIRY. From Jessie's conversation with Duck on 2026-09-09: hear the big
  // picture, list every constituency, then name what would support all of them. Taking each
  // constituency on its own (needs, wants, what they give, what circulates back) happens in the
  // conversation afterward, not on this form. Jessie, 2026-09-10: "collect Parts 1, 2 and 4 and
  // save Part 3 for the conversation afterward".
  //
  // FINDING WORK, the second path. Jessie, 2026-09-10: "add another one for an individual for a
  // need for a job too", from a second conversation with Duck. The point of it is to step out of
  // the noun as fast as possible: somebody arrives saying they need a job, and the questions open
  // up what they need it for, what they bring, where it fits and what would suit them. The word
  // job never appears. Answering is the work, because it shapes what comes to meet them.
  //
  // SIGN IN BEFORE THE FORM. Jessie, 2026-09-10: "I shouldn't be able to start the form without
  // logging in first. So after they choose building something or finding work, then ask to sign in
  // or sign up so that you can save answers." It happens here, on the page, with the same two
  // backend steps 2gather.network's sign-in and sign-up use (sendSigninPin, verifySigninPin). A
  // trip to 2gather.network and back cannot work: each site keeps its own storage, so somebody
  // signed in there is a stranger here, and the sign-in page refuses a next= on another site.
  //
  // Nothing is sent to an account yet. Answers are kept on this device under the signed-in person's
  // own key, so two people sharing a computer never see each other's drafts. Saving to the account
  // is the next step, and the page says so rather than promising it.

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function P(k){try{return new URLSearchParams(location.search).get(k)||'';}catch(e){return '';}}

  var GS_URL='https://cw-api-gate.jessieupp.workers.dev';
  // The person who writes is whoever is signed in, never somebody being viewed on their behalf.
  var signedId='';
  function whoId(){
    if(signedId) return signedId;
    try{ if(window.CW&&CW.realMe){ var r=CW.realMe(); return r.known?r.id:''; } }catch(e){}
    return '';
  }
  function signed(){ return !!whoId(); }
  // VIEWING AS SOMEBODY. Jessie, 2026-09-12: "when i viewed as doug it showed my info", then "1 yes".
  // While a super admin views as somebody, the page reads THEIR answers and shows them read-only:
  // nothing can be typed, nothing saves, and Send is hidden. whoId() stays the signed-in person, so
  // no write can ever go anywhere else.
  function viewing(){ try{ return !!(window.CW && CW.me && CW.me().viewing); }catch(e){ return false; } }
  function readId(){ try{ return viewing() ? CW.me().id : whoId(); }catch(e){ return whoId(); } }
  function viewerParam(){ return viewing() ? '&viewer='+encodeURIComponent(whoId()) : ''; }
  function viewedName(){ try{ return String(sessionStorage.getItem('cw-view-as-name')||'').trim(); }catch(e){ return ''; } }
  function norm(id){ return String(id||'').split('.').join('').toLowerCase(); }
  function draftKey(){ return 'cw-inquiry-draft-'+norm(whoId()); }
  // The first version kept one draft for the whole device. It is dropped rather than handed to
  // whoever signs in next.
  try{ localStorage.removeItem('cw-inquiry-draft'); }catch(e){}
  var A={path:'',sent_build:'',sent_work:'',edited_build:'',edited_work:'',
         base_build:'',base_work:'',seen_build:'',seen_work:'',choices:[],
         building:'',forWhom:'',serves:'',asking:'',orgDoes:'',first:'',who:[],person:'',group:'',gather:'',
         needFor:[],needMore:'',offer:'',values:'',how:'',setting:'',scale:'',conditions:'',tools:'',want:'',enjoy:'',contribution:''};
  var BLANK=JSON.stringify(A);
  // Reads this person's draft. The path somebody picked before signing in wins over the stored one,
  // because it is what they just chose.
  function loadDraft(){
    var chosen=A.path;
    A=JSON.parse(BLANK);
    if(signed() && !viewing()){
      try{ var saved=JSON.parse(localStorage.getItem(draftKey())||'null'); if(saved) for(var k in A){ if(saved[k]!=null) A[k]=saved[k]; } }catch(e){}
    }
    if(chosen) A.path=chosen;
    if(!Array.isArray(A.who)) A.who=[];
    if(!Array.isArray(A.needFor)) A.needFor=[];
    A.needFor=A.needFor.map(function(n){ return n==='Passing time' ? 'Enjoying my time' : (n==='Impact' ? 'Values-aligned' : n); });
  }
  loadDraft();
  // Nothing is kept for somebody not signed in: there is no draft to keep before the form opens.
  function keep(){ if(!signed() || viewing()) return; try{ localStorage.setItem(draftKey(),JSON.stringify(A)); }catch(e){} }

  // The rail holds Start and, once somebody has picked, that path's parts. Nothing of a path is
  // drawn before it is chosen.
  var PATHS={
    build:[
      {key:'picture', label:'The big picture'},
      {key:'who',     label:'Who you serve'},
      {key:'help',    label:'What would help'},
      {key:'review',  label:'Your answers'}
    ],
    work:[
      // What you bring comes first: gifts before needs. Jessie approved the order 2026-09-10.
      {key:'bring',   label:'What you bring'},
      {key:'need',    label:'What you need'},
      {key:'fits',    label:'Where it fits'},
      {key:'suits',   label:'What suits you'},
      {key:'review',  label:'Your answers'}
    ]
  };
  // Only Start until somebody is signed in, so no part of the form is drawn before they can use it.
  function parts(){ return [{key:'start',label:'Start'}].concat(signed()?(PATHS[A.path]||[]):[]); }
  function firstPart(){ return A.path&&PATHS[A.path] ? PATHS[A.path][0].key : 'start'; }
  // THE CHOICES LIVE ON THE SHEET. Jessie, 2026-09-11: "3 yes" to moving them off the page. They are
  // reference-data.needFor on Creating Works Data, and they arrive with the saved answers, so
  // changing one is a row rather than a push and costs no extra trip. A choice somebody already
  // picked is still shown if the list drops it, so nobody loses an answer to an edit on the sheet.
  var needChoices=[];
  function needOptions(){
    var l=needChoices.slice();
    A.needFor.forEach(function(n){ if(l.indexOf(n)<0) l.push(n); });
    return l;
  }
  // Two or three choices read as a sentence. Four or more take a slash, because a sentence of that
  // many ands is too much. Jessie, 2026-09-10.
  function joinChoices(l){
    if(l.length<2) return l.join('');
    if(l.length===2) return l[0]+' and '+l[1];
    if(l.length===3) return l[0]+', '+l[1]+', and '+l[2];
    return l.join(' / ');
  }

  // Each question is label, help line, field, in that order.
  function area(key,lab,help,ph){
    return '<div class="f"><label for="q-'+key+'">'+esc(lab)+'</label>'
      +'<div class="help">'+esc(help)+'</div>'
      +'<textarea id="q-'+key+'" data-a="'+key+'" placeholder="'+esc(ph)+'">'+esc(A[key])+'</textarea></div>';
  }
  function acts(back,next,extra){
    return '<div class="acts" style="align-items:center;">'
      +(back?'<button type="button" class="btn ghost" data-go="'+back+'">Back</button>':'')
      +(next?'<button type="button" class="btn solid" data-go="'+next+'">Next</button>':'')
      +(extra||'')
      +'<span class="savestat" id="save-stat">'+esc(saveText)+'</span>'
      +'</div>';
  }

  function renderPanel(key){
    var p=document.getElementById('panel');

    if(key==='start'){
      p.innerHTML='<h2>What brings you here?</h2>'
        +'<p class="lead">Pick the one closest to where you are and change it whenever you like.</p>'
        +'<div class="choice" style="margin-bottom:8px;">'
          +'<button type="button" data-path="build"'+(A.path==='build'?' class="on"':'')+'>Building something</button>'
          +'<button type="button" data-path="work"'+(A.path==='work'?' class="on"':'')+'>Finding work</button>'
        +'</div>'
        +(signed()?'<p class="quiet" id="who-line">'+whoLine()+'</p>':'');
      p.querySelectorAll('[data-path]').forEach(function(b){
        b.onclick=function(){ A.path=b.getAttribute('data-path'); keep(); show(firstPart()); };
      });
      if(signed() && !knownName()) waitForName();
      bindSignOut();
      return;
    }

    else if(key==='signin'){ renderSignin(p); return; }

    else if(key==='need'){
      p.innerHTML='<h2>What you need</h2>'
        +'<p class="lead">Tell us what you need right now and put it your own way.</p>'
        +(needOptions().length
          ? '<div class="f"><div class="lab">What would work give you?</div>'
            +'<div class="help">Pick as many as fit and add your own below.</div>'
            +'<div class="choice">'+needOptions().map(function(n){
              return '<button type="button" data-need="'+esc(n)+'"'+(A.needFor.indexOf(n)>-1?' class="on"':'')+'>'+esc(n)+'</button>';
            }).join('')+'</div></div>'
          : '')
        +area('needMore','Anything else','Say it in your own words, as much or as little as you like.',
              'Example: Steady income while I figure out what comes next')
        +acts('bring','fits');
      p.querySelectorAll('[data-need]').forEach(function(b){
        b.onclick=function(){
          var n=b.getAttribute('data-need'), i=A.needFor.indexOf(n);
          if(i>-1) A.needFor.splice(i,1); else A.needFor.push(n);
          changed();
          b.classList.toggle('on',i<0); keep();
        };
      });
    }

    else if(key==='bring'){
      p.innerHTML='<h2>What you bring</h2>'
        +'<p class="lead">Start with what you have to offer - somebody paying you means you have something to provide.</p>'
        +area('offer','What do you have to offer?','Name your superpowers - the ones people already seek out.',
              'Example: I can calm a room and get people talking')
        +area('values','What do you value?','Tell us what matters to you when you picture a good day.',
              'Example: Kindness, time outdoors, and work that helps somebody')
        +area('how','What ways of working bring out your best?','Think about your pace, your setting, and the company you keep.',
              'Example: One to one, with time to prepare')
        +acts('start','need');
    }

    else if(key==='fits'){
      p.innerHTML='<h2>Where it fits</h2>'
        +'<p class="lead">Picture the place where what you offer lands.</p>'
        +area('setting','In what setting?','Describe the place you picture and the people who share it.',
              'Example: A small team in my own neighborhood')
        +area('scale','At what scale?','Say how big you picture it, whether a handful of people or a whole organization.',
              'Example: A handful of people I see every week')
        +area('conditions','Under what conditions?','Name any limits you have or say there are none.',
              'Example: Mornings only and close to a bus line')
        +area('tools','Using what tools?','List the tools and instruments you like using.',
              'Example: A laptop, a kitchen, or a camera')
        +acts('need','suits');
    }

    else if(key==='suits'){
      p.innerHTML='<h2>What suits you</h2>'
        +'<p class="lead">Set need aside for a moment and imagine what would suit you.</p>'
        +area('want','What would you want?','Describe what you would choose if the choice were fully yours.',
              'Example: Work where I set my own hours and learn something new')
        +area('enjoy','What would you enjoy?','Think about the moments in a day that feel good.',
              'Example: Teaching, cooking for people, and being outside')
        +area('contribution','What would bring out your greatest contribution?','Name what would let you give everything you have.',
              'Example: Bringing strangers together until they feel like neighbors')
        +acts('fits','review');
    }

    else if(key==='picture'){
      p.innerHTML='<h2>The big picture</h2>'
        +'<p class="lead">Start by telling it your way.</p>'
        +area('building','What are you building?','It can be anything you are starting, standing up, or offering.',
              'Example: A leadership program for people working anywhere in our county')
        +area('forWhom','Who do you picture using it?','Include the people it serves as well as the ones using it.',
              'Example: Emerging leaders from business, government, and nonprofits')
        +area('serves','What does it serve?','A purpose names what you are making, who it serves, and the higher contribution it makes.',
              'Example: A county where leaders in every sector know each other well')
        +'<div class="f"><div class="lab">Who is asking?</div>'
          +'<div class="help">One person and an organization answer the same questions.</div>'
          +'<div class="choice" id="asking">'
            +'<button type="button" data-ask="org"'+(A.asking==='org'?' class="on"':'')+'>An organization</button>'
            +'<button type="button" data-ask="me"'+(A.asking==='me'?' class="on"':'')+'>Myself</button>'
          +'</div></div>'
        +'<div id="org-q">'+(A.asking==='org'
          ? area('orgDoes','What does your organization do?','Say who you serve and how you serve them.',
                 'Example: We run a leadership program for the whole county, across industry and government')
          : '')+'</div>'
        +area('first','What do you picture it doing first?','List the first few things you would want it to do.',

    }

    else if(key==='who'){
      p.innerHTML='<h2>Who you serve</h2>'
        +'<p class="lead">A constituency is any group of people or organizations your work touches. List every one you can name.</p>'
        +'<div class="f"><label for="who-in">Add a constituency</label>'
          +'<div class="help">Think about where each person comes from, which organization sent them, and what drives them.</div>'
          +'<div class="addrow"><input type="text" id="who-in" placeholder="Example: Alumni of the program">'
          +'<button type="button" class="btn solid" id="who-add">Add</button></div>'
          +'<div class="chips" id="who-list"></div></div>'
        +'<p class="lead" style="margin-top:-6px;">Each one sets its own context and we take them one at a time when we talk.</p>'
        +acts('picture','help');
      renderWho();
      var inp=document.getElementById('who-in');
      document.getElementById('who-add').onclick=addWho;
      inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addWho(); } });
    }

    else if(key==='help'){
      p.innerHTML='<h2>What would help</h2>'
        +'<p class="lead">What would you like every person in every constituency to have?</p>'
        +area('person','For each person on their own','Start with what one person needs to take part and to give back.',
              'Example: A profile that shows what they offer and what they are looking for')
        +area('group','For their group or peers','Picture a cohort, a team, or a circle of peers and what they need together.',
              'Example: A private alumni group where needs and offers find each other')
        +area('gather','When they gather','Include their meetings, convenings, and conferences.',
              'Example: One place to sign up for the annual conference and see who is coming')
        +acts('who','review');
    }

    else {
      var rows=function(list){
        return list.map(function(r){
          var v=String(r[1]||'').trim();
          return '<div class="q">'+esc(r[0])+'</div><div class="a'+(v?'':' empty')+'">'+(v?esc(v):'Not answered yet')+'</div>';
        }).join('');
      };
      if(A.path==='work'){
        p.innerHTML='<h2>Your answers</h2>'
          +'<p class="lead">Every answer you gave is gathered here and any part on the left opens again to change it.</p>'
          +'<div class="rv"><div class="t">What you bring</div>'+rows([
              ['What do you have to offer?',A.offer],['What do you value?',A.values],['What ways of working bring out your best?',A.how]])+'</div>'
          +'<div class="rv"><div class="t">What you need</div>'+rows([
              ['What would work give you?',joinChoices(A.needFor)],['Anything else',A.needMore]])+'</div>'
          +'<div class="rv"><div class="t">Where it fits</div>'+rows([
              ['In what setting?',A.setting],['At what scale?',A.scale],['Under what conditions?',A.conditions],['Using what tools?',A.tools]])+'</div>'
          +'<div class="rv"><div class="t">What suits you</div>'+rows([
              ['What would you want?',A.want],['What would you enjoy?',A.enjoy],['What would bring out your greatest contribution?',A.contribution]])+'</div>'
          +'<div class="infobox"><div class="t">What happens next</div>'
            +'<div class="d">The person who invited you or someone from Creating.Works will reach out and look at this together.</div></div>'
          +acts('suits','',sendButton());
        bindCommon(p); return;
      }
      var pic=[['What are you building?',A.building],['Who do you picture using it?',A.forWhom],['What does it serve?',A.serves],
               ['Who is asking?',A.asking==='org'?'An organization':(A.asking==='me'?'Myself':'')]];
      if(A.asking==='org') pic.push(['What does your organization do?',A.orgDoes]);
      pic.push(['What do you picture it doing first?',A.first]);
      p.innerHTML='<h2>Your answers</h2>'
        +'<p class="lead">Every answer you gave is gathered here and any part on the left opens again to change it.</p>'
        +'<div class="rv"><div class="t">The big picture</div>'+rows(pic)+'</div>'
        +'<div class="rv"><div class="t">Who you serve</div>'
          +(A.who.length
            ? '<div class="chips" style="margin-top:0;">'+A.who.map(function(w){ return '<span class="chip" style="padding-right:14px;">'+esc(w)+'</span>'; }).join('')+'</div>'
            : '<div class="a empty">None listed yet</div>')
        +'</div>'
        +'<div class="rv"><div class="t">What would help</div>'+rows([
            ['For each person on their own',A.person],['For their group or peers',A.group],['When they gather',A.gather]])+'</div>'
        +'<div class="infobox"><div class="t">What happens next</div>'
          +'<div class="d">The person who invited you or someone from Creating.Works will reach out and look at this together. '
          +'For each constituency we ask what they need and want, what they give, and what circulates back.</div></div>'
        +acts('help','',sendButton());
    }

    bindCommon(p);
  }
  function bindCommon(p){
    p.querySelectorAll('[data-a]').forEach(function(el){
      el.addEventListener('input',function(){ A[el.getAttribute('data-a')]=el.value; changed(); });
    });
    p.querySelectorAll('[data-go]').forEach(function(b){
      b.onclick=function(){ show(b.getAttribute('data-go')); window.scrollTo(0,0); };
    });
    var sb=document.getElementById('send-go'); if(sb && !isSent()) sb.onclick=function(){ sb.disabled=true; save(true); };
  }

  function bindAsking(){
    document.querySelectorAll('[data-ask]').forEach(function(b){
      b.onclick=function(){
        var v=b.getAttribute('data-ask');
        A.asking=(A.asking===v)?'':v; changed();
        document.querySelectorAll('[data-ask]').forEach(function(x){ x.classList.toggle('on',x.getAttribute('data-ask')===A.asking); });
        var box=document.getElementById('org-q');
        box.innerHTML=A.asking==='org'
          ? area('orgDoes','What does your organization do?','Say who you serve and how you serve them.',
                 'Example: We run a leadership program for the whole county, across industry and government')
          : '';
        var t=box.querySelector('[data-a]');
        if(t) t.addEventListener('input',function(){ A.orgDoes=t.value; changed(); });
      };
    });
  }

  function addWho(){
    var inp=document.getElementById('who-in'); if(!inp) return;
    var v=inp.value.trim(); if(!v) return;
    var dup=A.who.some(function(w){ return w.toLowerCase()===v.toLowerCase(); });
    if(!dup){ A.who.push(v); changed(); }
    inp.value=''; inp.focus();
    renderWho(); buildTabs(current);
  }
  function renderWho(){
    var box=document.getElementById('who-list'); if(!box) return;
    box.innerHTML=A.who.length
      ? A.who.map(function(w,i){
          return '<span class="chip">'+esc(w)+'<button type="button" data-drop="'+i+'" aria-label="Remove '+esc(w)+'">&times;</button></span>';
        }).join('')
      : '<span class="none">None listed yet.</span>';
    box.querySelectorAll('[data-drop]').forEach(function(b){
      b.onclick=function(){ A.who.splice(parseInt(b.getAttribute('data-drop'),10),1); changed(); renderWho(); buildTabs(current); };
    });
  }

  // ── SAVING TO THE ACCOUNT ─────────────────────────────────────────────────────────────────
  // Jessie, 2026-09-10: "2 go" and "3a". Answers live on the inquiry tab of Creating Works Data,
  // one row per person per path, through getInquiry and saveInquiry. The page reads the row before
  // any part opens, so a second device starts from what was saved and can never wipe it with blank
  // boxes. It saves when somebody moves between parts, never on every keystroke, because each save
  // is one trip to the backend. Send saves and tells the operators.
  var FIELDS={
    build:{building:'building',forWhom:'forWhom',serves:'serves',asking:'asking',orgDoes:'orgDoes',
           firstSteps:'first',constituencies:'who',personSupport:'person',groupSupport:'group',gatherSupport:'gather'},
    work:{offer:'offer',values:'values',how:'how',needFor:'needFor',needMore:'needMore',setting:'setting',
          scale:'scale',conditions:'conditions',tools:'tools',want:'want',enjoy:'enjoy',contribution:'contribution'}
  };
  var LISTS={who:1,needFor:1};           // kept as a list on the page and with | between on the sheet
  var loaded={}, loading=false, dirty=false, saving=false, again=false, againSend=false, saveText='';
  function isForm(k){ return k!=='start' && k!=='signin'; }
  function changed(){ if(viewing()) return; dirty=true; if(A['sent_'+A.path]) A['edited_'+A.path]='1'; keep(); }
  function setSave(t){ clearTimeout(flashT); saveText=t||''; var el=document.getElementById('save-stat'); if(el) el.textContent=saveText; }
  // SAVED IS A BRIEF NOTE, SHOWN ON THE PRESS. Jessie, 2026-09-11: "Saving takes a very long time -
  // so just say Saved when clicking button and make it disappear - just a brief notification" and
  // "remove Saved after since we know". The save carries on in the background. If it fails, the
  // reason replaces the note and stays until the next step saves.
  var flashT=null;
  function flash(t){ setSave(t); flashT=setTimeout(function(){ if(saveText===t) setSave(''); },2000); }

  // The session the sign-in code minted, from wherever this site keeps it.
  function token(){
    var id=whoId(); if(!id) return '';
    try{
      var o=JSON.parse(localStorage.getItem('cw-edit-'+norm(id))||'null');
      if(o&&o.t&&o.exp&&Date.now()<o.exp-60000) return o.t;
    }catch(e){}
    try{
      var t=localStorage.getItem('cw-token')||'';
      if(t && norm(localStorage.getItem('cw-id'))===norm(id)){
        var exp=parseInt(String(t).split('.')[1],10);
        if(exp && Date.now()<exp-60000) return t;
      }
    }catch(e){}
    return '';
  }
  // A sign-in the backend will not accept goes back to the code, with the reason on the screen and
  // the answers left exactly where they are.
  function needCode(){
    try{ localStorage.removeItem('cw-edit-'+norm(whoId())); localStorage.removeItem('cw-token'); }catch(e){}
    auth={mode:'in',step:1,email:'',first:'',last:'',note:'Your sign-in ran out and a new code lets you keep going.'};
    current='signin'; buildTabs('signin'); renderPanel('signin');
  }
  // SENT IS A STATE, NOT A SECOND SEND. Jessie, 2026-09-11: "Remove: Sent / Your answers are with us
  // and a person reads every one" and "Make button say sent not send again". Once sent the button
  // reads Sent and does nothing. Changing any answer afterwards turns it back into Send, so new
  // answers can still reach a person.
  function isSent(){ return !!A['sent_'+A.path] && !A['edited_'+A.path]; }
  function sendButton(){
    if(viewing()) return '';
    return isSent()
      ? '<button type="button" class="btn solid" id="send-go" disabled style="opacity:.6;cursor:default;">Sent</button>'
      : '<button type="button" class="btn solid" id="send-go">Send</button>';
  }

  // ONE EARLY READ FOR BOTH PATHS. Jessie, 2026-09-12: "2 A and B". Most of the wait is the backend's
  // cost per request, not the reading, so the page asks once, as soon as a signed-in person opens it,
  // for both paths' saved answers (getInquiry path=all). Pressing a path then usually opens at once.
  // A backend without path=all answers with an error, and the page falls back to asking per path.
  var allP=null, allData=null;
  function fetchAll(){
    if(allP) return allP;
    var tk=token(), id=readId();
    if(!tk || !id) return null;
    allP=fetch(GS_URL+'?action=getInquiry&appearId='+encodeURIComponent(id)+'&editToken='+encodeURIComponent(tk)+'&path=all'+viewerParam())
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.code==='signin'){ allP=null; return {signin:true}; }
        if(d && d.status==='ok' && d.paths){ allData=d; return d; }
        return null;
      })
      .catch(function(){ allP=null; return null; });
    return allP;
  }
  // Puts one path's saved answers into the page, the same way for the early read and the single one.
  function applyLoaded(path, d, choices){
    d=d||{};
    if(d.found&&d.data){
      var F=FIELDS[path];
      Object.keys(F).forEach(function(col){
        var v=String(d.data[col]==null?'':d.data[col]);
        A[F[col]] = LISTS[F[col]] ? v.split('|').map(function(x){ return x.trim(); }).filter(Boolean) : v;
      });
      A['sent_'+path]=d.sentAt||'';
      A['edited_'+path]=(d.sentAt && d.savedAt && String(d.savedAt)>String(d.sentAt)) ? '1' : '';
      A.needFor=A.needFor.map(function(n){ return n==='Passing time' ? 'Enjoying my time' : (n==='Impact' ? 'Values-aligned' : n); });
    }
    // ANSWERS FROM BEFORE SAVING EXISTED. Jessie, 2026-09-11: "3 yes". Somebody who typed before
    // 1:33 on 2026-09-11 has answers in this browser and none on the sheet. Nothing saved means
    // they are unsaved, so the next step saves them instead of leaving them on screen looking kept.
    var hasAny=!d.found && Object.keys(FIELDS[path]).some(function(col){
      var v=A[FIELDS[path][col]]; return Array.isArray(v) ? v.length>0 : !!String(v||'').trim();
    });
    if(Array.isArray(choices)){ needChoices=choices; A.choices=choices; }
    A['base_'+path]=d.savedAt||''; A['seen_'+path]='1';
    loaded[path]=true; dirty=hasAny; keep();
  }
  // SHOW THIS DEVICE'S COPY AT ONCE. Jessie, 2026-09-12: "Why is it taking so long to load information?
  // It's not acceptable", then "1 a and b". A device that has opened this path before shows what it
  // has straight away and checks the saved version behind it. If the saved one is newer and nothing has
  // been typed yet, it takes the saved one. If something has been typed, the next save carries the
  // version it started from and the backend refuses it when another device saved since, sending the
  // newer answers back (see save). So a copy on screen can never write over newer answers.
  function sameTime(a,b){
    var x=Date.parse(a||''), y=Date.parse(b||'');
    if(isNaN(x) && isNaN(y)) return true;
    return !isNaN(x) && !isNaN(y) && Math.abs(x-y)<=1500;
  }
  function reconcile(path, d, choices){
    if(!d) return;
    if(Array.isArray(choices)){ needChoices=choices; A.choices=choices; }
    if(!sameTime(d.savedAt, A['base_'+path]) && !(dirty && path===A.path)){
      applyLoaded(path, d, choices);
      if(path===A.path && isForm(current)){ renderPanel(current); }
    }
  }
  function openFromDevice(path){
    loaded[path]=true;
    if(A.choices && A.choices.length) needChoices=A.choices;
    var p=fetchAll();
    if(p) p.then(function(all){
      if(all && all.signin){ return; }
      if(all && all.paths){ reconcile(path, all.paths[path], all.needChoices); }
    });
  }
  function loadThen(key){
    if(loading) return;
    var tk=token(); if(!tk){ needCode(); return; }
    var path=A.path;
    // Already here from the early read: open at once.
    if(allData && allData.paths && allData.paths[path]){ applyLoaded(path, allData.paths[path], allData.needChoices); show(key); return; }
    loading=true;
    document.getElementById('panel').innerHTML='<span class="cw-loading">Loading information</span>';
    var p=fetchAll();
    (p || Promise.resolve(null)).then(function(all){
      if(all && all.signin){ loading=false; needCode(); return; }
      if(all && all.paths && all.paths[path]){ loading=false; applyLoaded(path, all.paths[path], all.needChoices); show(key); return; }
      loadOne(key, path, tk);
    });
  }
  // The single-path read, for a backend that has not learned path=all.
  function loadOne(key, path, tk){
    fetch(GS_URL+'?action=getInquiry&appearId='+encodeURIComponent(readId())+'&editToken='+encodeURIComponent(tk)+'&path='+encodeURIComponent(path)+viewerParam())
      .then(function(r){ return r.json(); })
      .then(function(d){
        loading=false;
        if(d&&d.code==='signin'){ needCode(); return; }
        if(!d||d.status!=='ok'){ loadFailed(key); return; }
        applyLoaded(path, d, d.needChoices);
        show(key);
      })
      .catch(function(){ loading=false; loadFailed(key); });
  }
  function loadFailed(key){
    document.getElementById('panel').innerHTML='<h2>Your saved answers</h2>'
      +'<p class="lead">Your saved answers did not load and nothing opens until they do.</p>'
      +'<div class="acts"><button type="button" class="btn solid" id="load-again">Look again</button></div>';
    document.getElementById('load-again').onclick=function(){ loadThen(key); };
  }

  function save(send){
    if(viewing()) return;   // looking is never changing
    if(!signed()||!A.path||!loaded[A.path]) return;
    if(saving){ again=true; if(send) againSend=true; return; }
    var tk=token(); if(!tk){ needCode(); return; }
    saving=true; dirty=false; flash('Saved');
    var path=A.path, F=FIELDS[path];
    var u=GS_URL+'?action=saveInquiry&appearId='+encodeURIComponent(whoId())+'&editToken='+encodeURIComponent(tk)
      +'&path='+encodeURIComponent(path)+(send?'&send=1':'')
      +'&base='+encodeURIComponent(A['base_'+path]||'');
    Object.keys(F).forEach(function(col){
      var v=A[F[col]]; if(LISTS[F[col]]) v=(v||[]).join('|');
      u+='&'+col+'='+encodeURIComponent(v==null?'':v);
    });
    fetch(u).then(function(r){ return r.json(); }).then(function(d){
      saving=false;
      if(d&&d.code==='signin'){ dirty=true; setSave(''); needCode(); return; }
      if(d&&d.code==='conflict'){
        applyLoaded(path, d, null);
        if(path===A.path && isForm(current)) renderPanel(current);
        setSave('Answers saved on another device were newer and they replaced what was typed here.');
        again=false; againSend=false;
        return;
      }
      if(!d||d.status!=='ok'){ dirty=true; setSave('Your answers did not save this time and they stay here until your next step saves them.'); return; }
      if(d.savedAt){ A['base_'+path]=d.savedAt; keep(); }
      if(send && d.sentAt){ A['sent_'+path]=d.sentAt; A['edited_'+path]=''; keep(); if(current==='review') renderPanel('review'); }
      if(again){ var s=againSend; again=false; againSend=false; save(s); }
    }).catch(function(){
      saving=false; dirty=true;
      setSave('Your answers did not save this time and they stay here until your next step saves them.');
      var sb=document.getElementById('send-go'); if(sb) sb.disabled=false;
    });
  }

  // ── SIGN IN OR SIGN UP ────────────────────────────────────────────────────────────────────
  // NOTHING IS CHOSEN FOR THEM. Jessie, 2026-09-10: "show q's only if they sign up or in". Both
  // buttons start unfilled and no field shows until one is pressed.
  var auth={mode:'',step:1,email:'',first:'',last:''};
  function field1(id,lab,type,val,ac){
    return '<div class="f"><label for="'+id+'">'+esc(lab)+'</label>'
      +'<input type="'+(type||'text')+'" id="'+id+'" value="'+esc(val||'')+'"'+(ac?' autocomplete="'+ac+'"':'')+'></div>';
  }
  function renderSignin(p){
    var h='<h2>Sign in to begin</h2>'
      +'<p class="lead">'+(auth.note?esc(auth.note):'Your answers are saved to your account and wait for you whenever you come back.')+'</p>';
    if(auth.step===1){
      h+='<div class="choice" style="margin-bottom:22px;">'
        +'<button type="button" data-mode="in"'+(auth.mode==='in'?' class="on"':'')+'>Sign in</button>'
        +'<button type="button" data-mode="up"'+(auth.mode==='up'?' class="on"':'')+'>Sign up</button></div>';
      if(auth.mode==='up'){
        h+=field1('au-first','Your first name','text',auth.first,'given-name')
          +field1('au-last','Your last name','text',auth.last,'family-name');
      }
      if(auth.mode) h+=field1('au-email','Your email','email',auth.email,'email');
      if(auth.mode==='up'){
        h+='<label class="tick"><input id="au-agree" type="checkbox"><span>I agree to the '
          +'<a role="link" tabindex="0" data-nav="https://2gather.network/terms-of-service.html" onclick="event.stopPropagation();return _safeNavGo(this)">Terms of Service</a>, '
          +'<a role="link" tabindex="0" data-nav="https://2gather.network/privacy-policy.html" onclick="event.stopPropagation();return _safeNavGo(this)">Privacy Policy</a>, and '
          +'<a role="link" tabindex="0" data-nav="https://2gather.network/code-of-conduct.html" onclick="event.stopPropagation();return _safeNavGo(this)">Code of Conduct</a>.</span></label>'
          +'<label class="tick"><input id="au-18" type="checkbox"><span>I confirm that I am 18 or older.</span></label>';
      }
      h+='<div class="acts"><button type="button" class="btn ghost" data-go="start">Back</button>'
        +(auth.mode?'<button type="button" class="btn solid" id="au-send">Send my code</button>':'')+'</div>'
        +'<div class="say" id="au-say"></div>';
    } else {
      h+='<div id="au-sent" style="margin-bottom:18px;"><span class="cw-loading">Sending your code</span></div>'
        +'<div class="f"><label for="au-code">Your code</label>'
        +'<input type="text" id="au-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="Example: 428091" style="max-width:220px;letter-spacing:.16em;"></div>'
        +'<div class="acts"><button type="button" class="btn ghost" id="au-back">Back</button>'
        +'<button type="button" class="btn ghost" id="au-again">Send another</button>'
        +'<button type="button" class="btn solid" id="au-verify">Sign me in</button></div>'
        +'<div class="say" id="au-say"></div>';
    }
    p.innerHTML=h;
    p.querySelectorAll('[data-mode]').forEach(function(b){
      b.onclick=function(){ harvest(); auth.mode=b.getAttribute('data-mode'); renderSignin(p); };
    });
    p.querySelectorAll('[data-go]').forEach(function(b){ b.onclick=function(){ show(b.getAttribute('data-go')); }; });
    var send=document.getElementById('au-send'); if(send) send.onclick=sendCode;
    var em=document.getElementById('au-email'); if(em) em.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); sendCode(); } });
    var v=document.getElementById('au-verify'); if(v) v.onclick=verifyCode;
    var c=document.getElementById('au-code'); if(c){ c.focus(); c.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); verifyCode(); } }); }
    var ag=document.getElementById('au-again'); if(ag) ag.onclick=function(){ auth.step=2; renderSignin(p); fireSend(); };
    var bk=document.getElementById('au-back'); if(bk) bk.onclick=function(){ auth.step=1; renderSignin(p); };
  }
  function say(msg,good){ var el=document.getElementById('au-say'); if(!el) return; el.className='say '+(good?'ok':'bad'); el.textContent=msg||''; }
  function harvest(){
    var f=document.getElementById('au-first'), l=document.getElementById('au-last'), e=document.getElementById('au-email');
    if(f) auth.first=f.value.trim(); if(l) auth.last=l.value.trim(); if(e) auth.email=e.value.trim();
  }
  function sendCode(){
    harvest();
    if(auth.mode==='up'){
      if(!auth.first){ say('Put in the first name you would like people to see.'); return; }
      if(!auth.last){ say('Put in your last name.'); return; }
    }
    if(!auth.email||auth.email.indexOf('@')<0){ say('Put in the email you use here.'); return; }
    if(auth.mode==='up'){
      if(!document.getElementById('au-agree').checked){ say('Tick the box to agree to the terms.'); return; }
      if(!document.getElementById('au-18').checked){ say('An account here is for people 18 or older.'); return; }
    }
    auth.step=2; renderSignin(document.getElementById('panel')); fireSend();
  }
  // The code box shows at once, the way the sign-in page does, and the pill says the email is on
  // its way until the backend answers.
  function fireSend(){
    // from=creatingworks is how the email knows to say Creating Works in its subject. 2gather.network's
    // sign-in never sends it, so its email is unchanged. Jessie, 2026-09-10.
    var u=GS_URL+'?action=sendSigninPin&from=creatingworks'
      +(auth.mode==='up'?'&signup=1&terms=1&age=1&first='+encodeURIComponent(auth.first)+'&last='+encodeURIComponent(auth.last):'')
      +'&email='+encodeURIComponent(auth.email);
    fetch(u).then(function(r){ return r.json(); }).then(function(){
      var s=document.getElementById('au-sent');
      if(s){ s.className='lead'; s.textContent='We sent a six digit code to '+auth.email+'. It expires in fifteen minutes.'; }
    }).catch(function(){
      auth.step=1; renderSignin(document.getElementById('panel'));
      say('The code did not send and your connection is the first thing to check.');
    });
  }
  function verifyCode(){
    var c=(document.getElementById('au-code').value||'').trim();
    if(c.length<6){ say('The code is six digits.'); return; }
    var b=document.getElementById('au-verify'); b.disabled=true;
    say('');
    var s=document.getElementById('au-sent'); if(s){ s.className=''; s.innerHTML='<span class="cw-loading">Checking your code</span>'; }
    fetch(GS_URL+'?action=verifySigninPin&from=creatingworks&email='+encodeURIComponent(auth.email)+'&code='+encodeURIComponent(c))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d&&d.status==='ok'&&d.appearId){
          // The same things the sign-in page keeps, so the profile and account pages on this site
          // know them too and do not ask for a second code.
          try{
            if(window.CW&&CW.remember) CW.remember(d.appearId);
            localStorage.setItem('cw-id',d.appearId);
            localStorage.setItem('appear-id',d.appearId);
            if(auth.mode==='up'&&auth.first){
              localStorage.setItem('cw-first',auth.first);
              localStorage.setItem('cw-name-'+d.appearId,(auth.first+' '+auth.last).trim());
            }
            // The sign-in answer carries the name now, so "Signed in as" shows at once. Jessie,
            // 2026-09-11: "1 yes". Before that deploy it is absent and the lookup still fills it.
            if(d.name) localStorage.setItem('cw-name-'+d.appearId,String(d.name).trim());
            // FACE AND NAME IN THE BAR AT ONCE. Jessie, 2026-09-12: "should show my face/name in top
            // right pill before loading information", then "2 yes". Written where the top bar looks,
            // then the bar is redrawn, so the pill does not wait on its own slow lookup.
            if(d.name){ localStorage.setItem('cw-name',String(d.name).trim()); localStorage.setItem('cw-name-for',d.appearId); window.CW_NAME=String(d.name).trim(); }
            if(d.photo){
              localStorage.setItem('cw-photo',d.photo); localStorage.setItem('cw-photo-for',d.appearId);
              localStorage.setItem('cw-photo-at',String(Date.now())); window.CW_TOPBAR_PHOTO=d.photo;
            }
            if(d.editToken){
              localStorage.setItem('cw-token',d.editToken);
              var exp=parseInt(String(d.editToken).split('.')[1],10);
              if(!exp||exp<Date.now()) exp=Date.now()+60*60*1000;
              localStorage.setItem('cw-edit-'+norm(d.appearId),JSON.stringify({t:d.editToken,exp:exp}));
            }
          }catch(e){}
          signedId=d.appearId;
          allP=null; allData=null;
          try{ if(window.CW_REDRAW_BAR) window.CW_REDRAW_BAR(); }catch(e){}
          loadDraft(); keep();
          auth={mode:'',step:1,email:'',first:'',last:''};
          show(current&&isForm(current)&&current!=='signin'?current:firstPart());
          return;
        }
        b.disabled=false;
        if(s){ s.className='lead'; s.textContent='We sent a six digit code to '+auth.email+'. It expires in fifteen minutes.'; }
        say((d&&d.message)||'That code did not match and Send another brings a fresh one.');
      })
      .catch(function(){
        b.disabled=false;
        if(s){ s.className='lead'; s.textContent='We sent a six digit code to '+auth.email+'. It expires in fifteen minutes.'; }
        say('The code did not check and your connection is the first thing to look at.');
      });
  }
  // WHO IS SIGNED IN. Jessie, 2026-09-10: "say who it is maybe?", then "5a". The name comes from
  // lookupProfile, the read My account makes, and is kept under the same key My account keeps it
  // (cw-name-<id>), so after the first visit it shows at once. Until it arrives the line names
  // nobody rather than a wrong or empty name.
  function nameKey(){ return 'cw-name-'+whoId(); }
  function knownName(){
    try{
      var own=String(localStorage.getItem(nameKey())||'').trim();
      if(own) return own;
      // The top bar's copy, when it is this person's. The bar fetches it anyway, so the page does not
      // ask a second time and two slow requests stop competing.
      if(norm(localStorage.getItem('cw-name-for'))===norm(whoId())) return String(localStorage.getItem('cw-name')||'').trim();
    }catch(e){}
    return '';
  }
  function whoLine(){
    if(viewing()){ var vn=viewedName(); return 'You are viewing '+(vn?esc(vn)+'\u2019s':'their')+' answers and nothing here can be changed.'; }
    var n=knownName();
    return (n?'Signed in as '+esc(n)+'. ':'')+'Not you? <a role="link" tabindex="0" id="sign-out">Sign out.</a>';
  }
  // With the bar on this page, its lookup brings the name; this only watches for it and redraws the line.
  function waitForName(){
    if(!window.CW_SHOW_BAR){ fetchName(); return; }
    var tries=0, t=setInterval(function(){
      tries++;
      if(knownName()){ clearInterval(t); if(current==='start'){ var el=document.getElementById('who-line'); if(el){ el.innerHTML=whoLine(); bindSignOut(); } } }
      else if(tries>40) clearInterval(t);
    }, 1500);
  }
  var _nameAsked=false;
  function fetchName(){
    if(_nameAsked) return; _nameAsked=true;
    var id=whoId(); if(!id) return;
    fetch(GS_URL+'?action=lookupProfile&appearId='+encodeURIComponent(id))
      .then(function(r){ return r.json(); })
      .then(function(d){
        var n=String((d&&d.found&&d.name)||'').trim();
        if(!n || whoId()!==id) return;
        try{ localStorage.setItem('cw-name-'+id,n); }catch(e){}
        if(current==='start'){ var el=document.getElementById('who-line'); if(el){ el.innerHTML=whoLine(); bindSignOut(); } }
      }).catch(function(){});
  }
  function bindSignOut(){
    var so=document.getElementById('sign-out');
    if(so) so.onclick=function(){
      try{ if(window.CW&&CW.forget) CW.forget(); }catch(e){}
      signedId=''; _nameAsked=false; loaded={}; dirty=false; allP=null; allData=null; setSave(''); A=JSON.parse(BLANK); auth={mode:'',step:1,email:'',first:'',last:''}; show('start');
    };
  }
  window._safeNavGo=window._safeNavGo||function(el){try{var u=el&&el.getAttribute&&el.getAttribute('data-nav');if(u){window.location.href=u;}}catch(e){}return false;};

  var current='start';
  function buildTabs(active){
    var t=document.getElementById('tabs'); t.innerHTML='';
    parts().forEach(function(s){
      var b=document.createElement('button'); b.type='button';
      b.className='tab'+((s.key===active||(active==='signin'&&s.key==='start'))?' on':'');
      b.textContent=s.label;
      if(s.key==='who' && A.who.length){
        var c=document.createElement('span'); c.textContent=A.who.length+' listed'; b.appendChild(c);
      }
      b.onclick=function(){ show(s.key); };
      t.appendChild(b);
    });
  }
  function show(key){
    // Every part of the form waits behind sign-in, including a link straight to one.
    if(key!=='start' && key!=='signin' && !signed()) key = A.path ? 'signin' : 'start';
    // Leaving a part saves it, and nothing of a path opens until its saved answers have been read.
    if(dirty && isForm(current)) save(false);
    // THE ADDRESS FIRST, before any waiting. Jessie, 2026-09-12, looking at creating.works/?part=picture
    // under "Loading information": "shouldnt there be a path and a part?". It was only written after the
    // answers arrived, so an old address sat in the bar for the whole wait.
    setAddress(key);
    if(isForm(key) && !loaded[A.path]){
      if(!viewing() && A['seen_'+A.path] && token()){ openFromDevice(A.path); }
      else { current=key; buildTabs(key); loadThen(key); return; }
    }
    current=key; buildTabs(key); renderPanel(key);
    if(viewing() && isForm(key)) lockForViewing();
    // The address names the part, so a link can open straight onto it. EACH PART IS ITS OWN STEP.
    // Jessie, 2026-09-11: "2 yes". Moving to another part adds a step, so the browser's back arrow
    // goes to the part before instead of leaving the form. The first draw and a return through the
    // back arrow only rewrite the address.
    //
    // CLEAN ADDRESSES. Jessie, 2026-09-11: "https://creating.works/build then build/picture" and
    // "4 go". The address is /build/picture or /work/bring, and the last part of each path is
    // /answers. Somebody arriving at one of these is sent here by 404.html, which only knows the
    // home page, and this puts the clean address back.
  }
  function lockForViewing(){
    var p=document.getElementById('panel');
    p.querySelectorAll('textarea,input').forEach(function(el){ el.readOnly=true; el.disabled=true; });
    p.querySelectorAll('[data-need],[data-ask],[data-drop],#who-add').forEach(function(b){ b.disabled=true; b.style.cursor='default'; });
    var vn=viewedName();
    var note=document.createElement('p');
    note.className='lead'; note.style.cssText='background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:10px 14px;';
    note.textContent='You are viewing '+(vn?vn+'\u2019s':'their')+' answers and nothing here can be changed.';
    p.insertBefore(note, p.firstChild);
  }
  function setAddress(key){
    try{
      var target=urlFor(key);
      var same=location.pathname===target && !location.search;
      if(_navQuiet || same) history.replaceState(null,'',target); else history.pushState(null,'',target);
    }catch(e){}
  }
  function slugOf(k){ return k==='review' ? 'answers' : k; }
  function keyOf(s){ return s==='answers' ? 'review' : s; }
  function urlFor(key){ return (key==='start' || !A.path) ? '/' : '/'+A.path+'/'+slugOf(key); }
  // Where the address says to go: /work/bring, /build, the ?to= that 404.html hands over, or the old
  // ?path= and ?part= links, which keep working.
  function readRoute(){
    var p=P('to') || location.pathname;
    var m=String(p).match(/^\/(build|work)(?:\/([a-z]+))?\/?$/);
    if(m) return { path:m[1], part: m[2] ? keyOf(m[2]) : '' };
    var lp=P('path'), lk=P('part');
    return { path: PATHS[lp] ? lp : '', part: lk ? keyOf(lk) : '' };
  }
  var _navQuiet=true;
  window.addEventListener('popstate',function(){
    var r=readRoute();
    if(PATHS[r.path]) A.path=r.path;
    var k=r.part || (r.path ? firstPart() : 'start');
    if(k==='signin' && signed()) k='start';
    if(k!=='signin' && !parts().some(function(s){ return s.key===k; })) k='start';
    _navQuiet=true; show(k); _navQuiet=false;
  });
  // AN OLD COPY RELOADS ITSELF. The back arrow can bring the page back exactly as it was when it was
  // left, older code and all, which is how a tab showed wording replaced hours before. A page the
  // browser restores that way is reloaded, so it is always the current one.
  window.addEventListener('pageshow',function(e){ if(e.persisted) location.reload(); });

  // /work opens Finding work straight away, and /work/need a part of it.
  var route=readRoute();
  var askPath=route.path; if(PATHS[askPath]){ A.path=askPath; keep(); }
  var start=route.part;
  if(parts().some(function(s){ return s.key===start; })) show(start);
  else show(A.path && askPath ? PATHS[A.path][0].key : 'start');
  _navQuiet=false;
  // The early read, while they are still looking at the first screen.
  if(signed()) fetchAll();
})();
</script>
