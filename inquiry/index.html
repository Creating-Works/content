<!-- Version: V0.1 | Date: 2026-09-10 | LAST CHANGE: First pass, the constituency inquiry from the conversation with Duck -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<!-- Not for search yet. This is the page Jessie and Duck agreed could become the home page, and
     until she says so it is a preview she shares by link. -->
<meta name="robots" content="noindex, nofollow">
<title>Start a conversation · Creating.Works</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<style>
  :root{
    --bg:#1F699E; --brand:#1F699E; --ink:#1A2E42; --soft:#4B5A6D; --muted:#6B7A8D;
    --line:#DDE4EE; --panel:#F7FBFF; --panel-line:#C9DFF3; --card:#fff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5;}

  /* THE PAGE TEMPLATE, the one My groups, My events and the editing page share. 1200 wide, a
     340 rail, an 18px gap, one column below 860. design/component-library/page-template.md. */
  .wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px;}
  .layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start;}

  .head{margin-bottom:16px;}
  h1{font-size:26px;font-weight:800;margin:0;color:#fff;}
  .head .sub{color:#fff;opacity:.92;font-size:15px;margin-top:6px;max-width:62ch;}

  .btn{display:inline-block;background:#fff;color:var(--brand);border:0;padding:11px 20px;border-radius:26px;
    font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;}
  .btn.solid{background:var(--brand);color:#fff;}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--panel-line);}

  /* THE RAIL. Separate white buttons with their own borders so every part looks pressable.
     Chosen is filled blue with white lettering and nothing else marks it. The count under a
     part appears only once there is something to count. */
  .tabs{background:#fff;border-radius:14px;padding:12px;height:fit-content;
    display:flex;flex-direction:column;gap:6px;}
  .tab{display:block;width:100%;text-align:left;background:#fff;color:var(--brand);
    border:1.5px solid #C9D6E2;border-radius:9px;font-family:inherit;font-size:14px;
    font-weight:700;padding:11px 14px;cursor:pointer;line-height:1.25;}
  .tab:hover{background:var(--panel);}
  .tab.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .tab.on:hover{background:var(--brand);}
  .tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  .tab span{display:block;font-size:12px;font-weight:600;opacity:.75;margin-top:2px;}

  /* The panel's first line sits level with the rail's first pill: both start 12px down. */
  .panel{background:var(--card);border-radius:14px;padding:12px 30px 28px;min-height:280px;}
  .panel h2{font-size:22px;font-weight:800;margin:6px 0 3px;}
  .panel .lead{color:var(--soft);font-size:14.5px;margin:0 0 22px;max-width:64ch;}

  /* A form label carries no colon, and its help line sits between the label and the field. */
  .f{margin-bottom:22px;}
  .f label,.f .lab{display:block;font-size:15px;font-weight:800;color:var(--ink);margin-bottom:2px;}
  .f .help{font-size:13.5px;color:var(--soft);margin-bottom:8px;max-width:64ch;}
  .f input[type=text],.f textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
    font:inherit;color:var(--ink);background:#fff;}
  .f textarea{min-height:84px;resize:vertical;}
  .f input:focus,.f textarea:focus{outline:2px solid var(--panel-line);outline-offset:1px;border-color:var(--brand);}

  .choice{display:flex;gap:8px;flex-wrap:wrap;}
  .choice button{background:#fff;color:var(--brand);border:1.5px solid #C9D6E2;border-radius:9px;
    font:inherit;font-size:14px;font-weight:700;padding:9px 16px;cursor:pointer;}
  .choice button.on{background:var(--brand);color:#fff;border-color:var(--brand);}

  .addrow{display:flex;gap:10px;flex-wrap:wrap;}
  .addrow input{flex:1 1 240px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--panel-line);
    border-radius:16px;padding:6px 8px 6px 14px;font-size:14px;font-weight:700;color:var(--brand);}
  .chip button{background:none;border:0;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;padding:0 2px;}
  .none{font-size:13.5px;color:var(--muted);}

  .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}

  /* The review. Space does the separating, never a rule. */
  .rv{margin-bottom:22px;}
  .rv .t{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .rv .q{font-size:14px;font-weight:700;color:var(--ink);}
  .rv .a{font-size:14.5px;color:var(--soft);margin:2px 0 12px;white-space:pre-wrap;}
  .rv .a.empty{color:var(--muted);font-style:italic;}
  .infobox{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:18px 20px;margin-bottom:14px;}
  .infobox .t{font-size:15.5px;font-weight:800;margin-bottom:4px;}
  .infobox .d{font-size:14px;color:var(--soft);}

  @media(max-width:860px){
    .layout{grid-template-columns:1fr;}
    /* Four buttons stacked down a phone is most of a screen, so the rail lies down and wraps. */
    .tabs{flex-direction:row;flex-wrap:wrap;}
    .tab{width:auto;flex:1 1 40%;}
  }
  @media(max-width:760px){
    .panel{padding:12px 18px 22px;}
    h1{font-size:24px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>Start a conversation</h1>
    <div class="sub">It has three short parts. Answer what you can and we will take it from there together.</div>
  </div>

  <div class="layout">
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel"></div>
  </div>

</div>

<script>
(function(){
  // THE CONSTITUENCY INQUIRY. From Jessie's conversation with Duck on 2026-09-09: hear the big
  // picture, list every constituency, then name what would support all of them. Taking each
  // constituency on its own (needs, wants, what they give, what circulates back) happens in the
  // conversation afterward, not on this form. Jessie, 2026-09-10: "collect Parts 1, 2 and 4 and
  // save Part 3 for the conversation afterward".
  //
  // Nothing is sent anywhere yet. The answers are kept in this browser only, so a reload does not
  // lose them, and the review says plainly that sending is not built.

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function P(k){try{return new URLSearchParams(location.search).get(k)||'';}catch(e){return '';}}

  var KEY='cw-inquiry-draft';
  var A={building:'',forWhom:'',serves:'',asking:'',orgDoes:'',first:'',who:[],person:'',group:'',gather:''};
  try{ var saved=JSON.parse(localStorage.getItem(KEY)||'null'); if(saved) for(var k in A){ if(saved[k]!=null) A[k]=saved[k]; } }catch(e){}
  if(!Array.isArray(A.who)) A.who=[];
  function keep(){ try{ localStorage.setItem(KEY,JSON.stringify(A)); }catch(e){} }

  var PARTS=[
    {key:'picture', label:'The big picture'},
    {key:'who',     label:'Who you serve'},
    {key:'help',    label:'What would help'},
    {key:'review',  label:'Your answers'}
  ];

  // Each question is label, help line, field, in that order.
  function area(key,lab,help,ph){
    return '<div class="f"><label for="q-'+key+'">'+esc(lab)+'</label>'
      +'<div class="help">'+esc(help)+'</div>'
      +'<textarea id="q-'+key+'" data-a="'+key+'" placeholder="'+esc(ph)+'">'+esc(A[key])+'</textarea></div>';
  }
  function acts(back,next){
    return '<div class="acts">'
      +(back?'<button type="button" class="btn ghost" data-go="'+back+'">Back</button>':'')
      +(next?'<button type="button" class="btn solid" data-go="'+next+'">Next</button>':'')
      +'</div>';
  }

  function renderPanel(key){
    var p=document.getElementById('panel');

    if(key==='picture'){
      p.innerHTML='<h2>The big picture</h2>'
        +'<p class="lead">Start with the whole of it, in your own words.</p>'
        +area('building','What are you building?','It can be something you are starting, standing up or giving to the world.',
              'Example: A leadership program for people working anywhere in our county')
        +area('forWhom','Who is it for?','Name the people you picture using it or being served by it.',
              'Example: Emerging leaders from business, government and nonprofits')
        +area('serves','What does it serve?','Tell us the higher purpose underneath the work.',
              'Example: A county where leaders in every sector know and trust each other')
        +'<div class="f"><div class="lab">Who is asking?</div>'
          +'<div class="help">It works the same way for one person as for an organization.</div>'
          +'<div class="choice" id="asking">'
            +'<button type="button" data-ask="org"'+(A.asking==='org'?' class="on"':'')+'>An organization</button>'
            +'<button type="button" data-ask="me"'+(A.asking==='me'?' class="on"':'')+'>Myself</button>'
          +'</div></div>'
        +'<div id="org-q">'+(A.asking==='org'
          ? area('orgDoes','What does your organization do?','Say who you serve and how you serve them.',
                 'Example: We run a leadership program for the whole county, across industry and government')
          : '')+'</div>'
        +area('first','What do you picture it doing first?','List the first few things you would want it to do.',
              'Example: Keep each cohort connected after graduation')
        +acts('','who');
      bindAsking();
    }

    else if(key==='who'){
      p.innerHTML='<h2>Who you serve</h2>'
        +'<p class="lead">List every constituency you relate to. A constituency is any group of people or organizations your work touches. Add as many as come to mind.</p>'
        +'<div class="f"><label for="who-in">Add a constituency</label>'
          +'<div class="help">Think about where each person comes from, which organization sent them and what they are devoted to.</div>'
          +'<div class="addrow"><input type="text" id="who-in" placeholder="Example: Alumni of the program">'
          +'<button type="button" class="btn solid" id="who-add">Add</button></div>'
          +'<div class="chips" id="who-list"></div></div>'
        +'<p class="lead" style="margin-top:-6px;">Each one sets its own context and we take them one at a time when we talk.</p>'
        +acts('picture','help');
      renderWho();
      var inp=document.getElementById('who-in');
      document.getElementById('who-add').onclick=addWho;
      inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addWho(); } });
    }

    else if(key==='help'){
      p.innerHTML='<h2>What would help</h2>'
        +'<p class="lead">What would you like this to provide for every person in every constituency?</p>'
        +area('person','For each person on their own','Start with what one person needs to take part and to give back.',
              'Example: A profile that shows what they offer and what they are looking for')
        +area('group','For their group or peers','Picture a cohort, a team or a circle of peers and what they need together.',
              'Example: A private alumni group where needs and offers find each other')
        +area('gather','When they gather','Include their meetings, convenings and conferences.',
              'Example: One place to sign up for the annual conference and see who is coming')
        +acts('who','review');
    }

    else {
      var rows=function(list){
        return list.map(function(r){
          var v=String(r[1]||'').trim();
          return '<div class="q">'+esc(r[0])+'</div><div class="a'+(v?'':' empty')+'">'+(v?esc(v):'Not answered yet')+'</div>';
        }).join('');
      };
      var pic=[['What are you building?',A.building],['Who is it for?',A.forWhom],['What does it serve?',A.serves],
               ['Who is asking?',A.asking==='org'?'An organization':(A.asking==='me'?'Myself':'')]];
      if(A.asking==='org') pic.push(['What does your organization do?',A.orgDoes]);
      pic.push(['What do you picture it doing first?',A.first]);
      p.innerHTML='<h2>Your answers</h2>'
        +'<p class="lead">Every answer you gave is gathered here and any part on the left opens again to change it.</p>'
        +'<div class="rv"><div class="t">The big picture</div>'+rows(pic)+'</div>'
        +'<div class="rv"><div class="t">Who you serve</div>'
          +(A.who.length
            ? '<div class="chips" style="margin-top:0;">'+A.who.map(function(w){ return '<span class="chip" style="padding-right:14px;">'+esc(w)+'</span>'; }).join('')+'</div>'
            : '<div class="a empty">None listed yet</div>')
        +'</div>'
        +'<div class="rv"><div class="t">What would help</div>'+rows([
            ['For each person on their own',A.person],['For their group or peers',A.group],['When they gather',A.gather]])+'</div>'
        +'<div class="infobox"><div class="t">What happens next</div>'
          +'<div class="d">A person reads every answer. Then we meet to take each constituency on its own. '
          +'For each one we ask what they need and want, what they give, and what circulates back to them.</div></div>'
        +'<div class="infobox"><div class="t">Sending is not built yet</div>'
          +'<div class="d">This page is a preview. Your answers stay in this browser until sending is added.</div></div>'
        +acts('help','');
    }

    p.querySelectorAll('[data-a]').forEach(function(el){
      el.addEventListener('input',function(){ A[el.getAttribute('data-a')]=el.value; keep(); });
    });
    p.querySelectorAll('[data-go]').forEach(function(b){
      b.onclick=function(){ show(b.getAttribute('data-go')); window.scrollTo(0,0); };
    });
  }

  function bindAsking(){
    document.querySelectorAll('[data-ask]').forEach(function(b){
      b.onclick=function(){
        var v=b.getAttribute('data-ask');
        A.asking=(A.asking===v)?'':v; keep();
        document.querySelectorAll('[data-ask]').forEach(function(x){ x.classList.toggle('on',x.getAttribute('data-ask')===A.asking); });
        var box=document.getElementById('org-q');
        box.innerHTML=A.asking==='org'
          ? area('orgDoes','What does your organization do?','Say who you serve and how you serve them.',
                 'Example: We run a leadership program for the whole county, across industry and government')
          : '';
        var t=box.querySelector('[data-a]');
        if(t) t.addEventListener('input',function(){ A.orgDoes=t.value; keep(); });
      };
    });
  }

  function addWho(){
    var inp=document.getElementById('who-in'); if(!inp) return;
    var v=inp.value.trim(); if(!v) return;
    var dup=A.who.some(function(w){ return w.toLowerCase()===v.toLowerCase(); });
    if(!dup){ A.who.push(v); keep(); }
    inp.value=''; inp.focus();
    renderWho(); buildTabs(current);
  }
  function renderWho(){
    var box=document.getElementById('who-list'); if(!box) return;
    box.innerHTML=A.who.length
      ? A.who.map(function(w,i){
          return '<span class="chip">'+esc(w)+'<button type="button" data-drop="'+i+'" aria-label="Remove '+esc(w)+'">&times;</button></span>';
        }).join('')
      : '<span class="none">None listed yet.</span>';
    box.querySelectorAll('[data-drop]').forEach(function(b){
      b.onclick=function(){ A.who.splice(parseInt(b.getAttribute('data-drop'),10),1); keep(); renderWho(); buildTabs(current); };
    });
  }

  var current='picture';
  function buildTabs(active){
    var t=document.getElementById('tabs'); t.innerHTML='';
    PARTS.forEach(function(s){
      var b=document.createElement('button'); b.type='button';
      b.className='tab'+(s.key===active?' on':'');
      b.textContent=s.label;
      if(s.key==='who' && A.who.length){
        var c=document.createElement('span'); c.textContent=A.who.length+' listed'; b.appendChild(c);
      }
      b.onclick=function(){ show(s.key); };
      t.appendChild(b);
    });
  }
  function show(key){
    current=key; buildTabs(key); renderPanel(key);
    // The address names the part, so a link can open straight onto it.
    try{ var u=new URL(location.href); u.searchParams.set('part',key); history.replaceState(null,'',u); }catch(e){}
  }

  var start=P('part');
  show(PARTS.some(function(s){ return s.key===start; }) ? start : 'picture');
})();
</script>
</body>
