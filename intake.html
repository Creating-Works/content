<!-- Version: V1.4 | Last change: Screen 2 heading updated, admin event selector removed, Update button removed, language and zip at top of profile summary, language on skills screen, search field border fix, rec breadcrumbs, ideas from all 5 rec types, new rec-map structure | Date: 2026-06-24 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lake Ballinger Gathering — Sign Up</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1F699E; --card: #FFFFFF; --text: #1A2E42; --soft: #4A6080;
      --muted: #6A8FAF; --brand: #1F699E; --border: #DDE4EE; --input-bg: #F7F9FC;
      --hover: #185885; --ph: #B8CCDE; --sel-bg: #EBF3FA; --sel-border: #1F699E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); min-height: 100vh; padding: 40px 20px 60px; color: var(--text); }

    .card { background: var(--card); max-width: 660px; margin: 0 auto; border-radius: 16px; padding: 52px; box-shadow: 0 24px 64px rgba(0,0,0,0.25), 0 4px 16px rgba(0,0,0,0.12); position: relative; }
    @media (max-width: 520px) { .card { padding: 32px 20px; } }

    /* My ikigai button */
    .ikigai-btn { position: absolute; top: 20px; right: 20px; display: flex; align-items: center; gap: 8px; background: var(--sel-bg); border: 1.5px solid var(--sel-border); border-radius: 24px; padding: 6px 14px 6px 6px; font-size: 13px; font-weight: 600; color: var(--brand); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
    .ikigai-btn:hover { background: #d6eaf8; }
    .ikigai-photo { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--sel-border); background: var(--input-bg); display: flex; align-items: center; justify-content: center; font-size: 14px; overflow: hidden; flex-shrink: 0; }
    .ikigai-photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    /* Footer */
    .footer { text-align: center; margin-top: 20px; }
    .footer a { color: white; font-size: 13px; text-decoration: none; opacity: 0.85; font-family: 'DM Sans', sans-serif; }
    .footer a:hover { opacity: 1; }

    /* Typography */
    h2 { font-size: 20px; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 6px; }
    .subtitle { font-size: 15px; color: var(--soft); font-weight: 300; line-height: 1.7; margin-bottom: 20px; }
    hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    input[type="text"] { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text); outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: var(--brand); }
    input[type="text"]::placeholder { color: var(--ph); }
    select { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text); outline: none; }
    select:focus { border-color: var(--brand); }

    /* Progress */
    .progress-wrap { margin-bottom: 28px; }
    .progress-steps { display: flex; gap: 6px; margin-bottom: 8px; }
    .progress-step { flex: 1; height: 4px; border-radius: 2px; background: var(--border); transition: background 0.3s; }
    .progress-step.done { background: var(--brand); }
    .progress-label { font-size: 12px; color: var(--muted); }

    /* Language */
    .lang-dropdown-wrap { position: relative; margin-bottom: 12px; }
    .lang-search-input { padding-left: 36px !important; border-radius: 8px 8px 0 0 !important; border-bottom: none !important; }
    .lang-search-icon { position: absolute; left: 12px; top: 13px; font-size: 15px; pointer-events: none; }
    .lang-list { background: white; border: 1px solid var(--border); border-top: none; border-radius: 0 0 10px 10px; max-height: 200px; overflow-y: auto; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
    .lang-list-item { padding: 10px 14px; font-size: 14px; color: var(--text); cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; transition: background 0.1s; }
    .lang-list-item:last-child { border-bottom: none; }
    .lang-list-item:hover { background: var(--sel-bg); }
    .lang-list-item.selected { background: var(--sel-bg); color: var(--brand); font-weight: 500; }
    .lang-check { color: var(--brand); font-size: 14px; min-width: 16px; }
    .lang-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .lang-tag { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; background: var(--sel-bg); border: 1.5px solid var(--sel-border); font-size: 13px; color: var(--brand); font-weight: 500; }
    .lang-tag-remove { cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1; }

    /* Inline edit row */
    .inline-edit-row { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--soft); flex-wrap: wrap; }
    .btn-link { background: none; border: none; color: var(--brand); font-size: 14px; cursor: pointer; font-family: 'DM Sans', sans-serif; padding: 0; }
    .btn-link:hover { opacity: 0.7; }

    /* Search — fixed border */
    .search-wrap { position: relative; margin-bottom: 0; }
    .search-wrap input { padding-left: 36px; border-radius: 8px; }
    .search-wrap input.has-results { border-radius: 8px 8px 0 0; border-bottom-color: transparent; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; }
    .search-results { background: white; border: 1px solid var(--border); border-top: none; border-radius: 0 0 10px 10px; max-height: 220px; overflow-y: auto; box-shadow: 0 6px 20px rgba(0,0,0,0.08); margin-bottom: 14px; }
    .search-result-item { padding: 10px 14px; font-size: 14px; color: var(--text); cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.1s; }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: var(--sel-bg); }
    .search-result-cat { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .search-result-breadcrumb { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .add-custom-row { padding: 10px 14px; font-size: 14px; color: var(--brand); font-weight: 600; cursor: pointer; border: 1px solid var(--border); border-top: none; border-radius: 0 0 10px 10px; background: var(--sel-bg); margin-bottom: 14px; }
    .add-custom-row:hover { background: var(--border); }
    .custom-add-box { background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
    .custom-add-box label { margin-bottom: 6px; }
    .custom-add-box select { margin-bottom: 10px; }
    .custom-add-confirm { background: var(--brand); color: white; border: none; border-radius: 8px; padding: 10px 20px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
    .custom-add-cancel { background: none; border: none; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; margin-left: 10px; }

    /* Breadcrumb */
    .breadcrumb { font-size: 12px; color: var(--muted); margin-bottom: 10px; margin-top: 6px; }
    .breadcrumb span { color: var(--brand); font-weight: 500; }

    /* Tags */
    .tags-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; }
    .tags-wrap { display: flex; flex-wrap: wrap; gap: 8px; min-height: 32px; }
    .tag { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; background: var(--sel-bg); border: 1.5px solid var(--sel-border); font-size: 13px; color: var(--brand); font-weight: 500; }
    .tag-remove { cursor: pointer; font-size: 15px; color: var(--muted); line-height: 1; }

    /* Practice / role */
    .practice-wrap { margin-top: 16px; }
    .practice-item { background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .practice-item-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .practice-item-cat { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
    .practice-options { display: flex; flex-wrap: wrap; gap: 8px; }
    .practice-btn { padding: 6px 14px; border-radius: 16px; border: 1.5px solid var(--border); background: white; font-size: 12px; color: var(--soft); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
    .practice-btn:hover { border-color: var(--brand); color: var(--brand); }
    .practice-btn.selected { background: var(--brand); border-color: var(--brand); color: white; font-weight: 500; }
    .practice-remove { margin-top: 10px; font-size: 12px; color: var(--muted); cursor: pointer; display: inline-block; }
    .practice-remove:hover { color: var(--text); }

    /* Category filter */
    .cat-filter-wrap { margin-top: 16px; }

    /* Ideas */
    .idea-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
    .idea-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .idea-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .idea-chip { padding: 6px 13px; border-radius: 18px; border: 1.5px dashed var(--border); background: var(--input-bg); font-size: 12px; color: var(--soft); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
    .idea-chip:hover { border-color: var(--brand); color: var(--brand); border-style: solid; background: var(--sel-bg); }

    /* Nav */
    .nav-row { display: flex; gap: 12px; margin-top: 28px; }
    .btn-back { flex: 1; padding: 14px; border-radius: 10px; border: 1.5px solid var(--border); background: white; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; color: var(--soft); cursor: pointer; transition: all 0.15s; }
    .btn-back:hover { border-color: var(--brand); color: var(--brand); }
    .btn-next { flex: 2; padding: 14px; border-radius: 10px; border: none; background: var(--brand); font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; color: white; cursor: pointer; transition: background 0.15s; }
    .btn-next:hover { background: var(--hover); }

    /* Profile summary */
    .profile-meta-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .profile-section { margin-bottom: 20px; }
    .profile-section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .profile-tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .profile-tag { padding: 6px 12px; border-radius: 20px; background: var(--sel-bg); border: 1.5px solid var(--sel-border); font-size: 13px; color: var(--brand); font-weight: 500; }
    .tag-level { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 4px; }
    .profile-empty { font-size: 13px; color: var(--muted); font-style: italic; }

    /* Toast / Loading / Empty */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: white; border-radius: 10px; padding: 12px 20px; font-size: 14px; font-weight: 500; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; }
    .loading { text-align: center; padding: 60px 40px; color: var(--muted); font-size: 15px; }
    .empty { font-size: 13px; color: var(--muted); font-style: italic; margin-top: 8px; }
  </style>
</head>
<body>
<div style="max-width:660px;margin:0 auto;">
  <div class="card" id="main-card">
    <div id="ikigai-btn-wrap"></div>
    <div id="app-content"><div class="loading">Loading...</div></div>
  </div>
  <div class="footer"><a href="https://creating.works">Creating Works</a></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ─── Identity ───────────────────────────────────────────────────────────────
var _appearId = null;
(function() {
  var params = new URLSearchParams(window.location.search);
  var urlId  = params.get('id') || params.get('memberCard');
  if (urlId) { _appearId = urlId; try { localStorage.setItem('appear-id', _appearId); } catch(e) {} }
  else { try { _appearId = localStorage.getItem('appear-id'); } catch(e) {} }
})();

function normalizeId(id) { return id ? id.replace(/\./g,'').toLowerCase() : ''; }

var ADMIN_ID = 'whss';
var _isAdmin = _appearId && normalizeId(_appearId) === ADMIN_ID;
var GS_URL   = 'https://script.google.com/macros/s/AKfycbzEavMnG4tMeWemoT5FLu9f_zjlKVIJsZLueG4nhw9akK0_nZqpbkZiXrAlWu1Fyhq9/exec';

// ─── State ──────────────────────────────────────────────────────────────────
var _screen     = 1;
var _refData    = null;
var _hasProfile = false;
var _photo      = '';

var _languages  = [];
var _langFilter = '';
var _langEdit   = false;
var _postal     = '';
var _postalEdit = false;

var _interests  = [];
var _skills     = [];
var _values     = [];
var _needs      = [];

var _searchQ    = { 2:'', 3:'', 4:'', 5:'' };
var _searchRes  = { 2:[], 3:[], 4:[], 5:[] };
var _ideaChips  = { 2:[], 3:[], 4:[], 5:[] };
var _recType    = '';   // selected Recreation Type filter
var _recSubCat  = '';  // selected Sub Category filter
var _catFilter3 = '';  // skills category filter
var _customItem = '';

// ─── Helpers ────────────────────────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2600);
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i=a.length-1;i>0;i--) { var j=Math.floor(Math.random()*(i+1)); var tmp=a[i]; a[i]=a[j]; a[j]=tmp; }
  return a;
}

function matchesQuery(r, ql) {
  if ((r.item||'').toLowerCase().includes(ql)) return true;
  if ((r.category||'').toLowerCase().includes(ql)) return true;
  if ((r.recType||'').toLowerCase().includes(ql)) return true;
  var assoc = r.associations || '';
  if (!assoc) return false;
  var words = assoc.toLowerCase().split(/[\s,]+/);
  return words.some(function(w){ return w===ql||w.startsWith(ql); });
}

function getPool(screen) {
  if (!_refData) return [];
  if (screen === 2) return _refData.recreation || [];
  if (screen === 3) return _refData.skills || [];
  if (screen === 4) return (_refData.values||[]).concat(_refData.domains||[]);
  if (screen === 5) return (_refData.skills||[]).concat(_refData.values||[]).concat(_refData.domains||[]);
  return [];
}

function buildIdeas(screen) {
  var pool = getPool(screen);
  if (!pool.length) return;
  var filtered = pool;
  if (screen === 2) {
    if (_recSubCat) filtered = pool.filter(function(r){ return r.category === _recSubCat; });
    else if (_recType) filtered = pool.filter(function(r){ return r.recType === _recType; });
  } else if (screen === 3 && _catFilter3) {
    filtered = pool.filter(function(r){ return r.category === _catFilter3; });
  }
  _ideaChips[screen] = shuffle(filtered.map(function(r){return r.item||r;})).slice(0,30);
}

// ─── Data loading ────────────────────────────────────────────────────────────
async function loadRefData() {
  try {
    var res = await fetch(GS_URL + '?action=getReferenceData');
    _refData = await res.json();
  } catch(e) { _refData = { languages:[], skills:[], values:[], domains:[], recreation:[] }; }
}

async function loadProfile() {
  try {
    var res  = await fetch(GS_URL + '?action=lookupProfile&appearId=' + encodeURIComponent(_appearId));
    var data = await res.json();
    if (data.found && data.photo) _photo = data.photo;
  } catch(e) {}
}

async function loadIntake() {
  try {
    var res  = await fetch(GS_URL + '?action=getIntake&appearId=' + encodeURIComponent(_appearId));
    var data = await res.json();
    if (data.found && data.data) {
      _hasProfile = true;
      var d = data.data;
      _postal    = d.postal    || '';
      _languages = d.languages ? d.languages.split('|').filter(Boolean) : [];
      _interests = parseTagStr(d.interests, true);
      _skills    = parseTagStr(d.skills, true);
      _values    = parseTagStr(d.values, false);
      _needs     = parseTagStr(d.needs, false);
    }
  } catch(e) {}
}

function parseTagStr(str, hasLevel) {
  if (!str) return [];
  return str.split('|').filter(Boolean).map(function(s) {
    if (hasLevel) { var p=s.split(':'); return {item:p[0],category:'',level:p[1]||''}; }
    return {item:s,category:''};
  });
}

// ─── Search ──────────────────────────────────────────────────────────────────
function runSearch(screen, q) {
  _searchQ[screen] = q;
  var pool = getPool(screen);
  var res  = [];
  if (q && q.length >= 1) {
    var ql = q.toLowerCase();
    res = pool.filter(function(r){ return matchesQuery(r,ql); }).slice(0,25);
  }
  _searchRes[screen] = res;
  updateSearchResults(screen, q, res);
  // Toggle border radius on input
  var inp = document.getElementById('search-input-' + screen);
  if (inp) {
    if (q && res.length) inp.classList.add('has-results');
    else inp.classList.remove('has-results');
  }
}

function breadcrumbForRec(r) {
  var parts = ['Recreation & Hobbies'];
  if (r.recType) parts.push(r.recType);
  if (r.category && r.category !== r.recType) parts.push(r.category);
  return parts.join(' › ');
}

function updateSearchResults(screen, q, res) {
  var container = document.getElementById('search-results-' + screen);
  if (!container) return;
  if (!q || q.length < 1) { container.innerHTML = ''; return; }
  if (res.length) {
    container.innerHTML = '<div class="search-results">'
      + res.map(function(r) {
          var item = esc(r.item||r);
          var crumb = screen === 2
            ? breadcrumbForRec(r)
            : (r.category ? r.category : '');
          return '<div class="search-result-item" onclick="addItem('+screen+',\''+item+'\',\''+esc(r.category||'')+'\')">'
            + item
            + (crumb ? '<div class="search-result-breadcrumb">'+esc(crumb)+'</div>' : '')
            + '</div>';
        }).join('')
      + '</div>';
  } else {
    container.innerHTML = '<div class="add-custom-row" onclick="showCustomAdd('+screen+',\''+esc(q)+'\')">'
      + '+ Add "'+esc(q)+'" to my list</div>';
  }
}

// ─── Custom add ───────────────────────────────────────────────────────────────
function showCustomAdd(screen, item) {
  _customItem = item;
  var container = document.getElementById('search-results-' + screen);
  if (!container) return;
  var cats = (_refData && _refData.skills)
    ? (function(){ var s={}; _refData.skills.forEach(function(r){ if(r.category) s[r.category]=1; }); return Object.keys(s); })()
    : [];
  var opts = '<option value="">Select a category</option>'
    + cats.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join('');
  container.innerHTML = '<div class="custom-add-box">'
    + '<label>What category does "'+esc(item)+'" belong to?</label>'
    + '<select id="custom-cat-select">'+opts+'</select>'
    + '<button class="custom-add-confirm" onclick="confirmCustomAdd('+screen+')">Add to my list</button>'
    + '<button class="custom-add-cancel" onclick="cancelCustomAdd('+screen+')">Cancel</button>'
    + '</div>';
}

function confirmCustomAdd(screen) {
  var sel = document.getElementById('custom-cat-select');
  var cat = sel ? sel.value : '';
  if (!cat) { toast('Please select a category'); return; }
  fetch(GS_URL + '?action=addCustomSkill&appearId='+encodeURIComponent(_appearId)
    +'&item='+encodeURIComponent(_customItem)+'&category='+encodeURIComponent(cat));
  addItem(screen, _customItem, cat);
  _customItem = '';
  var container = document.getElementById('search-results-' + screen);
  if (container) container.innerHTML = '';
}

function cancelCustomAdd(screen) {
  _customItem = '';
  var container = document.getElementById('search-results-' + screen);
  if (container) container.innerHTML = '';
  var inp = document.getElementById('search-input-' + screen);
  if (inp) { inp.value=''; inp.classList.remove('has-results'); _searchQ[screen]=''; }
}

// ─── Add / remove ─────────────────────────────────────────────────────────────
function addItem(screen, item, category) {
  var arr = screen===2?_interests:screen===3?_skills:screen===4?_values:_needs;
  if (arr.some(function(r){return r.item===item;})) { toast('Already added'); return; }
  if (screen===2) _interests.push({item:item,category:category||'',level:''});
  else if (screen===3) _skills.push({item:item,category:category||'',level:''});
  else arr.push({item:item,category:category||''});
  _searchQ[screen]=''; _searchRes[screen]=[];
  var inp=document.getElementById('search-input-'+screen);
  if (inp) { inp.value=''; inp.classList.remove('has-results'); }
  var rc=document.getElementById('search-results-'+screen); if(rc) rc.innerHTML='';
  updateTagsSection(screen);
}

function removeItem(screen, idx) {
  if(screen===2) _interests.splice(idx,1);
  else if(screen===3) _skills.splice(idx,1);
  else if(screen===4) _values.splice(idx,1);
  else _needs.splice(idx,1);
  updateTagsSection(screen);
}

function setLevel(screen, idx, level) {
  var arr=screen===2?_interests:_skills;
  if(arr[idx]) arr[idx].level=level;
  updateTagsSection(screen);
}

function updateTagsSection(screen) {
  var el=document.getElementById('tags-section-'+screen);
  if (!el) return;
  if (screen===2) el.innerHTML=buildRoleHTML(_interests,2,['Fan','Player','Coach']);
  else if (screen===3) el.innerHTML=buildRoleHTML(_skills,3,['Starting to practice','Practicing','Mentoring']);
  else { var arr=screen===4?_values:_needs; el.innerHTML=buildTagsHTML(screen,arr); }
}

function buildTagsHTML(screen, arr) {
  if (!arr.length) return '<div class="empty">Nothing added yet.</div>';
  return '<div class="tags-label">Added</div><div class="tags-wrap">'
    +arr.map(function(r,i){
        return '<div class="tag">'+esc(r.item)
          +'<span class="tag-remove" onclick="removeItem('+screen+','+i+')">×</span></div>';
      }).join('')+'</div>';
}

function buildRoleHTML(arr, screen, levels) {
  if (!arr.length) return '<div class="empty" style="margin-top:12px">Nothing added yet.</div>';
  return '<div class="practice-wrap">'
    +arr.map(function(s,i){
        var btns=levels.map(function(lv){
          return '<button class="practice-btn'+(s.level===lv?' selected':'')+'" onclick="setLevel('+screen+','+i+',\''+esc(lv)+'\')">'+lv+'</button>';
        }).join('');
        return '<div class="practice-item">'
          +'<div class="practice-item-name">'+esc(s.item)+'</div>'
          +(s.category?'<div class="practice-item-cat">'+esc(s.category)+'</div>':'')
          +'<div style="font-size:12px;color:var(--muted);margin-bottom:8px;">'
          +(screen===2?'How do you show up for this?':'Where are you in this role?')+'</div>'
          +'<div class="practice-options">'+btns+'</div>'
          +'<span class="practice-remove" onclick="removeItem('+screen+','+i+')">Remove</span>'
          +'</div>';
      }).join('')+'</div>';
}

// ─── Language ─────────────────────────────────────────────────────────────────
function filterLangs(q) {
  _langFilter = q;
  var list = document.getElementById('lang-list');
  if (!list) return;
  var langs=(_refData&&_refData.languages)?_refData.languages:[];
  var ql=q.toLowerCase();
  var filtered=ql?langs.filter(function(l){return l.toLowerCase().includes(ql);}):langs;
  list.innerHTML=filtered.map(function(lang){
    var sel=_languages.indexOf(lang)>-1;
    return '<div class="lang-list-item'+(sel?' selected':'')+'" onclick="toggleLang(\''+esc(lang)+'\')">'
      +'<span class="lang-check">'+(sel?'✓':'')+'</span>'+esc(lang)+'</div>';
  }).join('');
}

function toggleLang(lang) {
  var idx=_languages.indexOf(lang);
  if(idx>-1) _languages.splice(idx,1); else _languages.push(lang);
  filterLangs(_langFilter);
  var el=document.getElementById('lang-tags'); if(el) el.innerHTML=buildLangTagsHTML();
  updateLangInlineRow();
}

function removeLang(lang) {
  var idx=_languages.indexOf(lang);
  if(idx>-1) _languages.splice(idx,1);
  filterLangs(_langFilter);
  var el=document.getElementById('lang-tags'); if(el) el.innerHTML=buildLangTagsHTML();
  updateLangInlineRow();
}

function buildLangTagsHTML() {
  return _languages.map(function(l){
    return '<div class="lang-tag">'+esc(l)+'<span class="lang-tag-remove" onclick="removeLang(\''+esc(l)+'\')">×</span></div>';
  }).join('');
}

function updateLangInlineRow() {
  var el = document.getElementById('lang-inline-row');
  if (el) el.innerHTML = buildLangInlineHTML();
}

function buildLangInlineHTML() {
  var text = _languages.length ? esc(_languages.join(', ')) : 'No languages set';
  return text + ' <button class="btn-link" onclick="openLangEdit()">✏️</button>';
}

function openLangEdit() { _langEdit = true; render(); }
function closeLangEdit() { _langEdit = false; render(); }

// ─── Postal ───────────────────────────────────────────────────────────────────
function buildPostalHTML() {
  return '📍 '+(_postal||'No zip code set')+' <button class="btn-link" onclick="editPostal()">✏️</button>';
}

function editPostal() {
  var el=document.getElementById('postal-inline');
  if (!el) return;
  el.innerHTML='<div style="display:flex;gap:8px;align-items:center">'
    +'<input type="text" id="postal-edit-inp" placeholder="Zip code" value="'+esc(_postal)+'" style="flex:1;padding:10px 12px">'
    +'<button class="custom-add-confirm" onclick="savePostalInline()">Save</button>'
    +'</div>';
}

function savePostalInline() {
  var inp=document.getElementById('postal-edit-inp');
  if(inp) _postal=inp.value.trim();
  var el=document.getElementById('postal-inline');
  if(el) el.innerHTML=buildPostalHTML();
}

// ─── Rec type / sub cat filter ────────────────────────────────────────────────
function setRecType(val) {
  _recType   = val;
  _recSubCat = '';
  // Update sub-cat dropdown
  var subSel = document.getElementById('rec-subcat-select');
  if (subSel) {
    var pool = (_refData&&_refData.recreation)||[];
    var subCats = val
      ? (function(){ var s={}; pool.filter(function(r){return r.recType===val;}).forEach(function(r){if(r.category)s[r.category]=1;}); return Object.keys(s); })()
      : [];
    subSel.innerHTML = '<option value="">All '+esc(val||'recreation')+'</option>'
      +subCats.map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>';}).join('');
    subSel.style.display = val ? '' : 'none';
  }
  updateBreadcrumb();
  buildIdeas(2);
  updateIdeasEl(2);
}

function setRecSubCat(val) {
  _recSubCat = val;
  updateBreadcrumb();
  buildIdeas(2);
  updateIdeasEl(2);
}

function updateBreadcrumb() {
  var el = document.getElementById('rec-breadcrumb');
  if (!el) return;
  var parts = ['Recreation & Hobbies'];
  if (_recType) parts.push(_recType);
  if (_recSubCat) parts.push(_recSubCat);
  el.innerHTML = parts.map(function(p,i){
    return i < parts.length-1 ? esc(p)+' › ' : '<span>'+esc(p)+'</span>';
  }).join('');
}

function updateIdeasEl(screen) {
  var el = document.getElementById('idea-chips-'+screen);
  if (el) el.innerHTML = _ideaChips[screen].map(function(item){
    return '<div class="idea-chip" onclick="addItem('+screen+',\''+esc(item)+'\',\''+esc(_recSubCat||_recType||'')+'\')">'+esc(item)+'</div>';
  }).join('');
}

function setCatFilter3(val) {
  _catFilter3 = val;
  buildIdeas(3);
  var el=document.getElementById('idea-chips-3');
  if (el) el.innerHTML=_ideaChips[3].map(function(item){
    return '<div class="idea-chip" onclick="addItem(3,\''+esc(item)+'\',\''+esc(_catFilter3)+'\')">'+esc(item)+'</div>';
  }).join('');
}

// ─── My ikigai button ─────────────────────────────────────────────────────────
function renderIkigaiBtn() {
  var el=document.getElementById('ikigai-btn-wrap');
  if (!el) return;
  var photoHTML=_photo
    ?'<div class="ikigai-photo"><img src="'+esc(_photo)+'" alt=""></div>'
    :'<div class="ikigai-photo">🌱</div>';
  el.innerHTML='<button class="ikigai-btn" onclick="openIkigai()">'+photoHTML+'My ikigai 🎯</button>';
}

function openIkigai() { _screen=1; _hasProfile=false; render(); }

// ─── Submit ───────────────────────────────────────────────────────────────────
async function submitIntake() {
  if (!_appearId) return;
  var interestsStr=_interests.map(function(s){return s.item+(s.level?':'+s.level:'');}).join('|');
  var skillsStr=_skills.map(function(s){return s.item+(s.level?':'+s.level:'');}).join('|');
  var p='?action=saveIntake'
    +'&appearId='+encodeURIComponent(_appearId)
    +'&languages='+encodeURIComponent(_languages.join('|'))
    +'&postal='+encodeURIComponent(_postal)
    +'&interests='+encodeURIComponent(interestsStr)
    +'&skills='+encodeURIComponent(skillsStr)
    +'&values='+encodeURIComponent(_values.map(function(r){return r.item;}).join('|'))
    +'&needs='+encodeURIComponent(_needs.map(function(r){return r.item;}).join('|'));
  try { await fetch(GS_URL+p); } catch(e) {}
  _hasProfile=true; _screen=0; render();
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
  var el=document.getElementById('app-content');
  if (!el) return;
  renderIkigaiBtn();
  if (!_appearId) {
    el.innerHTML='<div style="text-align:center;padding:40px 20px">'
      +'<p style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px;">Sign in to continue</p>'
      +'<p style="font-size:14px;color:var(--soft)"><a href="https://appear.network" style="color:var(--brand);font-weight:600;">Go to Appear Network</a> and open this page from your profile.</p></div>';
    return;
  }
  if (_hasProfile && _screen===0) { renderProfile(el); return; }
  var fn={1:renderScreen1,2:renderScreen2,3:renderScreen3,4:renderScreen4,5:renderScreen5}[_screen];
  if (fn) fn(el);
}

function progressHTML(n) {
  var s='';
  for(var i=1;i<=5;i++) s+='<div class="progress-step'+(i<=n?' done':'')+'"></div>';
  var labs=['','Language + location','Recreation and hobbies','Your skillset','What you care about','What you need'];
  return '<div class="progress-wrap"><div class="progress-steps">'+s+'</div><div class="progress-label">Step '+n+' of 5 — '+labs[n]+'</div></div>';
}

function navHTML(screen) {
  var back=screen>1?'<button class="btn-back" onclick="goBack()">Back</button>':'';
  var next='<button class="btn-next" onclick="goNext()">'+(screen===5?'Submit':'Next')+'</button>';
  return '<div class="nav-row">'+back+next+'</div>';
}

// Profile summary
function renderProfile(el) {
  function tagSection(label, arr, hasLevel) {
    var tags=arr.length
      ?arr.map(function(r){
          return '<div class="profile-tag">'+esc(r.item)
            +(hasLevel&&r.level?'<span class="tag-level">'+esc(r.level)+'</span>':'')+'</div>';
        }).join('')
      :'<div class="profile-empty">Nothing added yet.</div>';
    return '<div class="profile-section"><div class="profile-section-label">'+label+'</div><div class="profile-tags">'+tags+'</div></div>';
  }

  el.innerHTML='<h2 style="margin-bottom:4px">Here is how you show up in our community 🎉</h2>'
    +'<div class="profile-meta-row">'
    +'<div class="inline-edit-row"><span id="postal-inline">'+buildPostalHTML()+'</span></div>'
    +'<div class="inline-edit-row"><span id="lang-inline-row">'+buildLangInlineHTML()+'</span></div>'
    +'</div>'
    +tagSection('What I enjoy', _interests, true)
    +tagSection('My skills', _skills, true)
    +tagSection('What I care about', _values, false)
    +tagSection('What I need', _needs, false);
}

// Screen 1 — Language + postal
function renderScreen1(el) {
  var langs=(_refData&&_refData.languages)?_refData.languages:[];
  var listHTML=langs.map(function(lang){
    var sel=_languages.indexOf(lang)>-1;
    return '<div class="lang-list-item'+(sel?' selected':'')+'" onclick="toggleLang(\''+esc(lang)+'\')">'
      +'<span class="lang-check">'+(sel?'✓':'')+'</span>'+esc(lang)+'</div>';
  }).join('');
  el.innerHTML=progressHTML(1)
    +'<h2>What language(s) do you speak?</h2>'
    +'<p class="subtitle">Select all that apply.</p>'
    +'<div class="lang-dropdown-wrap"><span class="lang-search-icon">🔍</span>'
    +'<input type="text" class="lang-search-input" placeholder="Search languages..." oninput="filterLangs(this.value)">'
    +'<div class="lang-list" id="lang-list">'+listHTML+'</div></div>'
    +'<div class="lang-tags" id="lang-tags">'+buildLangTagsHTML()+'</div>'
    +'<hr>'
    +'<h2>Where are you located?</h2>'
    +'<div style="margin-top:8px"><label>Zip code</label>'
    +'<input type="text" id="postal-inp" placeholder="Your zip code" value="'+esc(_postal)+'" oninput="_postal=this.value"></div>'
    +navHTML(1);
}

// Screen 2 — Recreation
function renderScreen2(el) {
  buildIdeas(2);
  var recTypes=['Sports','Movement & Performance','Outdoor & Nature','Games & Strategy','Making & Collecting'];
  var typeOpts='<option value="">All recreation</option>'
    +recTypes.map(function(t){return '<option value="'+esc(t)+'"'+(_recType===t?' selected':'')+'>'+esc(t)+'</option>';}).join('');

  var ideasHTML=_ideaChips[2].length
    ?'<div class="idea-section"><div class="idea-label">Ideas to get you started</div>'
      +'<div class="idea-chips" id="idea-chips-2">'
      +_ideaChips[2].map(function(item){return '<div class="idea-chip" onclick="addItem(2,\''+esc(item)+'\',\'\')">'+esc(item)+'</div>';}).join('')
      +'</div></div>':'';

  el.innerHTML=progressHTML(2)
    +'<h2>What forms of recreation or hobbies do you like?</h2>'
    +'<p class="subtitle">Add as many as you like. These help us match you with groups, events, and people.</p>'
    +'<div class="search-wrap"><span class="search-icon">🔍</span>'
    +'<input type="text" id="search-input-2" placeholder="Search..." oninput="runSearch(2,this.value)"></div>'
    +'<div id="search-results-2"></div>'
    +'<div id="tags-section-2">'+buildRoleHTML(_interests,2,['Fan','Player','Coach'])+'</div>'
    +'<div class="cat-filter-wrap">'
    +'<label style="margin-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--brand);font-weight:600;">Or browse by category</label>'
    +'<div class="breadcrumb" id="rec-breadcrumb">Recreation & Hobbies</div>'
    +'<select onchange="setRecType(this.value)" style="margin-bottom:8px">'+typeOpts+'</select>'
    +'<select id="rec-subcat-select" onchange="setRecSubCat(this.value)" style="display:none"><option value="">All</option></select>'
    +'</div>'
    +ideasHTML
    +navHTML(2);
}

// Screen 3 — Skills
function renderScreen3(el) {
  buildIdeas(3);
  var cats=_refData&&_refData.skills
    ?(function(){var s={};_refData.skills.forEach(function(r){if(r.category)s[r.category]=1;});return Object.keys(s);})()
    :[];
  var catOpts='<option value="">All categories</option>'
    +cats.map(function(c){return '<option value="'+esc(c)+'"'+(_catFilter3===c?' selected':'')+'>'+esc(c)+'</option>';}).join('');

  var ideasHTML=_ideaChips[3].length
    ?'<div class="idea-section"><div class="idea-label">Ideas to get you started</div>'
      +'<div class="idea-chips" id="idea-chips-3">'
      +_ideaChips[3].map(function(item){return '<div class="idea-chip" onclick="addItem(3,\''+esc(item)+'\',\''+esc(_catFilter3)+'\')">'+esc(item)+'</div>';}).join('')
      +'</div></div>':'';

  el.innerHTML=progressHTML(3)
    +'<div class="inline-edit-row" style="margin-bottom:16px"><span id="lang-inline-row">'+buildLangInlineHTML()+'</span></div>'
    +'<h2>What are your skills?</h2>'
    +'<p class="subtitle">Build a list of your skillset to let people know how you show up for others.</p>'
    +'<div class="search-wrap"><span class="search-icon">🔍</span>'
    +'<input type="text" id="search-input-3" placeholder="Search skills..." oninput="runSearch(3,this.value)"></div>'
    +'<div id="search-results-3"></div>'
    +'<div id="tags-section-3">'+buildRoleHTML(_skills,3,['Starting to practice','Practicing','Mentoring'])+'</div>'
    +'<div class="cat-filter-wrap">'
    +'<label style="margin-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--brand);font-weight:600;">Or browse by category</label>'
    +'<select onchange="setCatFilter3(this.value)">'+catOpts+'</select></div>'
    +ideasHTML+navHTML(3);
}

// Screen 4 — Values
function renderScreen4(el) {
  buildIdeas(4);
  var ideasHTML=_ideaChips[4].length
    ?'<div class="idea-section"><div class="idea-label">Ideas to get you started</div>'
      +'<div class="idea-chips" id="idea-chips-4">'
      +_ideaChips[4].map(function(item){return '<div class="idea-chip" onclick="addItem(4,\''+esc(item)+'\',\'\')">'+esc(item)+'</div>';}).join('')
      +'</div></div>':'';
  el.innerHTML=progressHTML(4)
    +'<h2>What do you care about deeply?</h2>'
    +'<p class="subtitle">Select the domains, causes, and values that matter most to you.</p>'
    +'<div class="search-wrap"><span class="search-icon">🔍</span>'
    +'<input type="text" id="search-input-4" placeholder="Search values and domains..." oninput="runSearch(4,this.value)"></div>'
    +'<div id="search-results-4"></div>'
    +'<div id="tags-section-4">'+buildTagsHTML(4,_values)+'</div>'
    +ideasHTML+navHTML(4);
}

// Screen 5 — Needs
function renderScreen5(el) {
  buildIdeas(5);
  var ideasHTML=_ideaChips[5].length
    ?'<div class="idea-section"><div class="idea-label">Ideas to get you started</div>'
      +'<div class="idea-chips" id="idea-chips-5">'
      +_ideaChips[5].map(function(item){return '<div class="idea-chip" onclick="addItem(5,\''+esc(item)+'\',\'\')">'+esc(item)+'</div>';}).join('')
      +'</div></div>':'';
  el.innerHTML=progressHTML(5)
    +'<h2>What do you need right now?</h2>'
    +'<p class="subtitle">What are you looking to receive or connect with? This drives matching you with the right people and their offerings at this event.</p>'
    +'<div class="search-wrap"><span class="search-icon">🔍</span>'
    +'<input type="text" id="search-input-5" placeholder="Search..." oninput="runSearch(5,this.value)"></div>'
    +'<div id="search-results-5"></div>'
    +'<div id="tags-section-5">'+buildTagsHTML(5,_needs)+'</div>'
    +ideasHTML+navHTML(5);
}

// ─── Navigation ───────────────────────────────────────────────────────────────
window.goNext = function() {
  if (_screen===1) {
    var inp=document.getElementById('postal-inp'); if(inp) _postal=inp.value.trim();
  }
  if (_screen===5) { submitIntake(); return; }
  _screen++; render();
};
window.goBack           = function() { _screen--; render(); };
window.runSearch        = runSearch;
window.addItem          = addItem;
window.removeItem       = removeItem;
window.setLevel         = setLevel;
window.toggleLang       = toggleLang;
window.removeLang       = removeLang;
window.filterLangs      = filterLangs;
window.setCatFilter3    = setCatFilter3;
window.setRecType       = setRecType;
window.setRecSubCat     = setRecSubCat;
window.showCustomAdd    = showCustomAdd;
window.confirmCustomAdd = confirmCustomAdd;
window.cancelCustomAdd  = cancelCustomAdd;
window.openIkigai       = openIkigai;
window.editPostal       = editPostal;
window.savePostalInline = savePostalInline;
window.openLangEdit     = openLangEdit;
window.closeLangEdit    = closeLangEdit;

// ─── Boot ─────────────────────────────────────────────────────────────────────
(async function init() {
  if (!_appearId) { render(); return; }
  await Promise.all([loadRefData(), loadProfile(), loadIntake()]);
  if (_hasProfile) _screen=0;
  render();
})();
</script>
</body>
</html>
